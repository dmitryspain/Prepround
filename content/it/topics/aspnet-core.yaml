id: aspnet-core
title: ASP.NET Core
title_en: ASP.NET Core
description: Middleware, DI і lifetimes, маршрутизація, Minimal API, автентифікація, конфігурація.
description_en: Middleware, DI and lifetimes, routing, Minimal APIs, authentication, configuration.
icon: dotnet
questions:
  - id: aspnet-core-001
    level: junior
    type: single
    text: "Які літери й у якому порядку цей застосунок виведе в консоль на запит `GET /`?"
    text_en: "Which letters, and in what order, will this app write to the console for a `GET /` request?"
    code:
      lang: csharp
      source: |
        var builder = WebApplication.CreateBuilder(args);
        var app = builder.Build();

        app.Use(async (context, next) =>
        {
            Console.Write("A");
            await next(context);
            Console.Write("B");
        });

        app.Use(async (context, next) =>
        {
            Console.Write("C");
            await next(context);
            Console.Write("D");
        });

        app.MapGet("/", () =>
        {
            Console.Write("E");
            return "ok";
        });

        app.Run();
    options:
      - text: "`ACEDB`"
        text_en: "`ACEDB`"
        correct: true
      - text: "`ABCDE`"
        text_en: "`ABCDE`"
      - text: "`ACDBE`"
        text_en: "`ACDBE`"
      - text: "`ACEBD`"
        text_en: "`ACEBD`"
    explanation: >
      Middleware виконуються в порядку реєстрації, і кожен може працювати до і після виклику `next`. Запит
      проходить `A` і `C`, доходить до ендпоінта (`E`), а відповідь повертається у зворотному порядку: спершу
      `D`, потім `B`. `WebApplication` сам обгортає конвеєр у `UseRouting` і `UseEndpoints`, тому ендпоінт
      виконується в кінці, а не на місці виклику `MapGet`.
    explanation_en: >
      Middleware runs in registration order, and each one can do work both before and after calling `next`. The
      request passes through `A` and `C`, reaches the endpoint (`E`), and the response travels back in reverse
      order: first `D`, then `B`. `WebApplication` wraps the pipeline in `UseRouting` and `UseEndpoints` itself,
      so the endpoint runs at the end, not where `MapGet` is called.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/middleware/#create-a-middleware-pipeline-with-webapplication
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/routing#routing-basics

  - id: aspnet-core-002
    level: junior
    type: single
    text: >
      Сервіс зареєстровано як `builder.Services.AddTransient<IClock, Clock>();`. В одному HTTP-запиті
      `IClock` отримують і ендпоінт, і scoped-сервіс, від якого цей ендпоінт залежить. Скільки екземплярів
      `Clock` створить контейнер?
    text_en: >
      A service is registered as `builder.Services.AddTransient<IClock, Clock>();`. Within one HTTP request, both
      an endpoint and a scoped service that the endpoint depends on receive `IClock`. How many `Clock` instances
      will the container create?
    options:
      - text: "Два: transient створюється на кожне звернення до контейнера"
        text_en: "Two: a transient is created each time it is requested from the container"
        correct: true
      - text: "Один: transient-сервіс створюється один раз на HTTP-запит і спільний у його межах"
        text_en: "One: a transient service is created once per HTTP request and shared within it"
      - text: "Один на весь застосунок, бо в `Clock` немає стану"
        text_en: "One for the whole application, because `Clock` has no state"
      - text: "Жодного, доки код явно не викличе `GetService<IClock>()`"
        text_en: "None, until the code explicitly calls `GetService<IClock>()`"
    explanation: >
      Transient означає новий екземпляр на кожне звернення до контейнера, тож ендпоінт і сервіс отримають
      різні об'єкти. Один екземпляр на запит дає scoped, а один на весь застосунок — singleton.
    explanation_en: >
      Transient means a new instance each time it is requested from the container, so the endpoint and the service get
      different objects. One instance per HTTP request is scoped, and one for the whole application is singleton.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection/service-lifetimes#transient

  - id: aspnet-core-003
    level: junior
    type: multiple
    text: >
      Застосунок створено через `WebApplication.CreateBuilder(args)` без додаткових налаштувань конфігурації.
      Які твердження правильні?
    text_en: >
      An app is created with `WebApplication.CreateBuilder(args)` and no extra configuration setup. Which
      statements are true?
    options:
      - text: "Значення зі змінної середовища перекриває той самий ключ з `appsettings.json`"
        text_en: "An environment variable value overrides the same key from `appsettings.json`"
        correct: true
      - text: "У середовищі `Production` значення з `appsettings.Production.json` перекривають `appsettings.json`"
        text_en: "In `Production`, `appsettings.Production.json` values override `appsettings.json`"
        correct: true
      - text: "Вкладений ключ `ConnectionStrings:Default` у змінній середовища записують як `ConnectionStrings__Default`"
        text_en: "A nested key `ConnectionStrings:Default` is written as `ConnectionStrings__Default` in environment variables"
        correct: true
      - text: "`appsettings.json` має найвищий пріоритет і перекриває навіть аргументи командного рядка"
        text_en: "`appsettings.json` has the highest priority and overrides even command-line arguments"
      - text: "User secrets завантажуються в будь-якому середовищі, зокрема в `Production`"
        text_en: "User secrets are loaded in any environment, including `Production`, in any configuration"
    explanation: >
      Джерела читаються по черзі, і пізніше перекриває раніше: `appsettings.json`, потім
      `appsettings.{Environment}.json`, user secrets (лише в `Development`), змінні середовища й, з найвищим
      пріоритетом, аргументи командного рядка. Двокрапка в іменах змінних середовища працює не на всіх
      платформах, тому ієрархію позначають `__`, а конфігурація сама перетворює його на `:`.
    explanation_en: >
      Sources are read in order, and a later one overrides an earlier one: `appsettings.json`, then
      `appsettings.{Environment}.json`, user secrets (only in `Development`), environment variables, and, with the
      highest priority, command-line arguments. The colon in environment variable names does not work on all
      platforms, so the hierarchy is written with `__`, and configuration converts it to `:` itself.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/configuration/#default-app-configuration-sources
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/configuration/#environment-variables-configuration-provider

  - id: aspnet-core-004
    level: junior
    type: single
    text: "Яку відповідь отримає запит `GET /users/abc`?"
    text_en: "What response will a `GET /users/abc` request get?"
    code:
      lang: csharp
      source: |
        var builder = WebApplication.CreateBuilder(args);
        var app = builder.Build();

        app.MapGet("/users/{id:int}", (int id) => $"user {id}");

        app.Run();
    options:
      - text: "`404 Not Found`: обмеження `int` не виконалось, і маршрут не збігся"
        text_en: "`404 Not Found`: the `int` constraint failed, so the route did not match"
        correct: true
      - text: "`400 Bad Request`: значення `abc` не вдалося перетворити на `int`"
        text_en: "`400 Bad Request`: the value `abc` could not be converted to `int`"
      - text: "`200 OK` з текстом `user 0`"
        text_en: "`200 OK` with the text `user 0`"
      - text: "`500 Internal Server Error` через `FormatException`"
        text_en: "`500 Internal Server Error` because of a `FormatException`"
    explanation: >
      Обмеження маршруту беруть участь у виборі ендпоінта: `abc` не є цілим числом, тож шаблон не збігається,
      а інших ендпоінтів немає, і відповідь — 404. Без обмеження (`{id}`) маршрут збігся б, і помилка
      прив'язки `int id` дала б 400. Тому документація радить не валідувати ввід обмеженнями маршруту.
    explanation_en: >
      Route constraints take part in endpoint selection: `abc` is not an integer, so the template does not match,
      and there are no other endpoints, so the response is 404. Without the constraint (`{id}`) the route would
      match, and a binding failure for `int id` would give 400. That is why the documentation advises against using
      route constraints for input validation.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/routing#route-constraints

  - id: aspnet-core-005
    level: middle
    type: single
    text: >
      Singleton-сервіс читає налаштування `RateLimits` з `appsettings.json` і має бачити зміни файлу без
      перезапуску застосунку. Що інжектити в його конструктор?
    text_en: >
      A singleton service reads the `RateLimits` setting from `appsettings.json` and must see file changes without
      restarting the app. What should be injected into its constructor?
    options:
      - text: "`IOptionsMonitor<RateLimits>`, читаючи `CurrentValue` щоразу"
        text_en: "`IOptionsMonitor<RateLimits>`, reading `CurrentValue` each time"
        correct: true
      - text: "`IOptions<RateLimits>` і читати `Value` під час кожного використання"
        text_en: "`IOptions<RateLimits>`, reading `Value` on every use"
      - text: "`IOptionsSnapshot<RateLimits>`, бо він перераховує значення на кожен запит"
        text_en: "`IOptionsSnapshot<RateLimits>`, because it recomputes the values on every request"
      - text: "Сам `RateLimits`, зареєстрований через `AddSingleton` під час старту"
        text_en: "`RateLimits` itself, registered with `AddSingleton` at startup"
    explanation: >
      `IOptionsMonitor<T>` — singleton, який повертає актуальні значення й повідомляє про зміни, тож він
      годиться для singleton-сервісів. `IOptions<T>` не перечитує конфігурацію після старту, а
      `IOptionsSnapshot<T>` зареєстровано як scoped, тому в singleton його інжектити не можна.
      `appsettings.json` за замовчуванням підключено з `reloadOnChange: true`, тож зміни файлу доходять до монітора.
    explanation_en: >
      `IOptionsMonitor<T>` is a singleton that returns current values and notifies about changes, so it suits
      singleton services. `IOptions<T>` does not re-read configuration after startup, and `IOptionsSnapshot<T>` is
      registered as scoped, so it cannot be injected into a singleton. `appsettings.json` is added with
      `reloadOnChange: true` by default, so file changes reach the monitor.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/configuration/options#options-interfaces
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/configuration/#app-settings-file-configuration-appsettingsjson-appsettingsenvironmentjson

  - id: aspnet-core-006
    level: middle
    type: single
    text: >
      Клієнт отримує `hello`, але без заголовка `X-Served-By`, а в лозі з'являється помилка. Чому?
    text_en: >
      The client receives `hello` but without the `X-Served-By` header, and an error appears in the log. Why?
    code:
      lang: csharp
      source: |
        var builder = WebApplication.CreateBuilder(args);
        var app = builder.Build();

        app.Use(async (context, next) =>
        {
            await next(context);
            context.Response.Headers["X-Served-By"] = "api-1";
        });

        app.MapGet("/", () => "hello");

        app.Run();
    options:
      - text: "Тіло вже почало писатися, заголовки відправлено, і їх зміна кидає `InvalidOperationException`"
        text_en: "Writing the body has already started, the headers have been sent, and changing them throws `InvalidOperationException`"
        correct: true
      - text: "Заголовки з префіксом `X-` Kestrel відкидає, якщо їх явно не дозволено в політиці CORS застосунку"
        text_en: "Kestrel drops headers with the `X-` prefix unless they are explicitly allowed in the app CORS policy"
      - text: "Код після `await next(context)` не виконується, бо ендпоінт завершує обробку запиту"
        text_en: "The code after `await next(context)` does not run, because the endpoint ends request processing"
      - text: "Заголовок треба додавати в `context.Request.Headers`, а не в `Response`"
        text_en: "The header has to be added to `context.Request.Headers`, not to `Response`"
    explanation: >
      Щойно ендпоінт почав писати тіло, відповідь стартувала, і заголовки вже відправлено разом із першою
      порцією; зміна після `next` кидає `InvalidOperationException: Headers are read-only, response has already
      started`. Код після `next` виконується, тому заголовок ставлять до виклику `next` або через
      `context.Response.OnStarting`, а стан відповіді перевіряють через `Response.HasStarted`.
    explanation_en: >
      Once the endpoint starts writing the body, the response has started and the headers have already been sent
      with the first chunk; changing them after `next` throws `InvalidOperationException: Headers are read-only,
      response has already started`. The code after `next` does run, so the header is set before calling `next` or
      via `context.Response.OnStarting`, and the response state is checked with `Response.HasStarted`.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/best-practices#do-not-modify-the-status-code-or-headers-after-the-response-body-has-started
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/middleware/#create-a-middleware-pipeline-with-webapplication

  - id: aspnet-core-007
    level: middle
    type: single
    text: "Звідки Minimal API візьме значення параметрів для запиту `POST /customers/42/orders?page=3` з JSON-тілом?"
    text_en: "Where will Minimal APIs get the parameter values for a `POST /customers/42/orders?page=3` request with a JSON body?"
    code:
      lang: csharp
      source: |
        var builder = WebApplication.CreateBuilder(args);
        builder.Services.AddSingleton<IOrderService, OrderService>();
        var app = builder.Build();

        app.MapPost("/customers/{customerId}/orders",
            (int customerId, int page, OrderRequest order, IOrderService orders) =>
                orders.Describe(customerId, page, order));

        app.Run();

        public record OrderRequest(string Product, int Quantity);

        public interface IOrderService
        {
            string Describe(int customerId, int page, OrderRequest order);
        }

        public class OrderService : IOrderService
        {
            public string Describe(int customerId, int page, OrderRequest order) =>
                $"customer={customerId} page={page} product={order.Product}";
        }
    options:
      - text: "`customerId` — з маршруту, `page` — з рядка запиту, `order` — з JSON-тіла, `orders` — з DI-контейнера"
        text_en: "`customerId` from the route, `page` from the query string, `order` from the JSON body, `orders` from the DI container"
        correct: true
      - text: "`customerId` і `page` — з рядка запиту, `order` — з JSON-тіла, `orders` — з DI-контейнера"
        text_en: "`customerId` and `page` from the query string, `order` from the JSON body, `orders` from the DI container"
      - text: "`customerId` — з маршруту, `page` і `order` — з JSON-тіла, `orders` — з DI-контейнера"
        text_en: "`customerId` from the route, `page` and `order` from the JSON body, `orders` from the DI container"
      - text: "Застосунок не стартує: складні параметри й сервіси треба явно позначати `[FromBody]` і `[FromServices]`"
        text_en: "The app does not start: complex parameters and services must be explicitly marked with `[FromBody]` and `[FromServices]`"
    explanation: >
      Без атрибутів Minimal API визначає джерело сам: параметр з іменем із шаблону маршруту береться з маршруту,
      простий тип поза маршрутом — з рядка запиту, зареєстрований у DI тип — із контейнера, а решта — з тіла
      запиту. Атрибути `[FromBody]` чи `[FromServices]` потрібні лише тоді, коли це правило треба перевизначити.
      Без `?page=3` обов'язковий `page` дав би відповідь 400.
    explanation_en: >
      Without attributes, Minimal APIs determine the source itself: a parameter whose name is in the route template
      is taken from the route, a simple type outside the route comes from the query string, a type registered in DI
      comes from the container, and the rest comes from the request body. The `[FromBody]` or `[FromServices]`
      attributes are needed only when this rule has to be overridden. Without `?page=3`, the required `page` would
      give a 400 response.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/minimal-apis/parameter-binding#binding-precedence

  - id: aspnet-core-008
    level: middle
    type: multiple
    text: >
      API використовує JWT bearer (`AddJwtBearer`), а ендпоінт `/admin` вимагає роль `Admin` через
      `RequireAuthorization`. Які твердження правильні?
    text_en: >
      An API uses JWT bearer (`AddJwtBearer`), and the `/admin` endpoint requires the `Admin` role via
      `RequireAuthorization`. Which statements are true?
    options:
      - text: "Запит без токена отримає `401` із заголовком `WWW-Authenticate: Bearer`"
        text_en: 'A request without a token gets `401` with the `WWW-Authenticate: Bearer` header'
        correct: true
      - text: "Запит із валідним токеном користувача без ролі `Admin` отримає `403`"
        text_en: "A request with a valid token of a user without the `Admin` role gets `403`"
        correct: true
      - text: "Ендпоінт без вимог авторизації лишається доступним анонімно, хоча автентифікацію налаштовано"
        text_en: "An endpoint with no authorization requirements stays anonymously accessible even though authentication is configured"
        correct: true
      - text: "Запит із валідним токеном без ролі `Admin` отримає `401`, бо авторизація не пройшла"
        text_en: "A request with a valid token but without the `Admin` role gets `401`, because authorization failed"
      - text: "Невалідний токен змушує middleware автентифікації одразу відповісти `401` на будь-який ендпоінт"
        text_en: "An invalid token makes the authentication middleware respond with `401` immediately on any endpoint"
    explanation: >
      Автентифікація з'ясовує, хто користувач, а авторизація — що йому дозволено. Анонімному користувачу
      авторизація робить challenge (для JWT bearer це `401` з `WWW-Authenticate: Bearer`), а автентифікованому
      без потрібної ролі — forbid, тобто `403`. Саме налаштування автентифікації нічого не закриває і не обриває
      конвеєр: ендпоінт без вимог відповідає навіть на запит із поганим токеном.
    explanation_en: >
      Authentication determines who the user is, and authorization determines what they are allowed to do. For an
      anonymous user, authorization issues a challenge (for JWT bearer, that is `401` with
      `WWW-Authenticate: Bearer`), and for an authenticated user without the required role, a forbid, that is
      `403`. Configuring authentication by itself does not protect anything and does not cut off the pipeline: an
      endpoint with no requirements responds even to a request with a bad token.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/security/authentication/#forbid
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/middleware/#middleware-order

  - id: aspnet-core-009
    level: senior
    type: single
    text: >
      `PriceCache` зареєстровано як singleton, і він приймає в конструкторі scoped `IUnitOfWork`. У `Development`
      застосунок падає на старті, а в `Production` запускається. Що відбувається в `Production`?
    text_en: >
      `PriceCache` is registered as a singleton and takes a scoped `IUnitOfWork` in its constructor. In
      `Development` the app fails at startup, but in `Production` it starts. What happens in `Production`?
    options:
      - text: "Один `IUnitOfWork` з кореневого контейнера живе до зупинки застосунку, і його ділять усі запити"
        text_en: "A single `IUnitOfWork` from the root container lives until the app stops, and all requests share it"
        correct: true
      - text: "Для кожного запиту контейнер підставляє в `PriceCache` новий `IUnitOfWork`, тож проблеми немає"
        text_en: "For each request, the container supplies `PriceCache` with a new `IUnitOfWork`, so there is no problem"
      - text: "`PriceCache` теж стає scoped і створюється заново в кожному запиті"
        text_en: "`PriceCache` also becomes scoped and is created anew in every request"
      - text: "Контейнер кидає виняток на першому запиті до `PriceCache`, а не під час старту"
        text_en: "The container throws an exception on the first request to `PriceCache`, not at startup"
    explanation: >
      Singleton створюється один раз, тому scoped-залежність з його конструктора фактично стає singleton: її
      створено в кореневому контейнері, і звільнить її лише зупинка застосунку. Перевірку областей (scope
      validation) за замовчуванням вмикають лише в `Development`, тому там це помилка на старті, а в `Production`
      «захоплений» сервіс тихо ділить стан між запитами. Виправлення — створювати область через
      `IServiceScopeFactory` або зробити `PriceCache` scoped.
    explanation_en: >
      A singleton is created once, so a scoped dependency in its constructor effectively becomes a singleton: it is
      created in the root container and is released only when the app stops. Scope validation is enabled by
      default only in `Development`, so there it is a startup error, while in `Production` the captured service
      silently shares state between requests. The fix is to create a scope via `IServiceScopeFactory` or to make
      `PriceCache` scoped.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection/overview#scope-validation
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection/service-lifetimes#scoped

  - id: aspnet-core-010
    level: senior
    type: single
    text: >
      Застосунок із cookie-автентифікацією масштабували з одного до трьох екземплярів за балансувальником без
      sticky sessions. Користувачів почало час від часу «викидати» з облікового запису, а POST-форми іноді
      падають на перевірці antiforgery. Яка причина найімовірніша?
    text_en: >
      An app with cookie authentication was scaled from one to three instances behind a load balancer without
      sticky sessions. Users are occasionally being logged out, and POST forms sometimes fail antiforgery
      validation. What is the most likely cause?
    options:
      - text: "Кожен екземпляр має власні ключі Data Protection і не розшифровує cookie, видані іншими"
        text_en: "Each instance has its own Data Protection keys and cannot decrypt cookies issued by the others"
        correct: true
      - text: "Cookie-автентифікація зберігає сесії в пам'яті процесу, і інші екземпляри про них не знають"
        text_en: "Cookie authentication stores sessions in process memory, and the other instances do not know about them"
      - text: "Балансувальник відкидає cookie з відповідей, бо разом вони більші за 4 КБ"
        text_en: "The load balancer drops cookies from responses because together they are larger than 4 KB"
      - text: "Antiforgery-токени дійсні лише кілька секунд, а балансувальник додає затримку"
        text_en: "Antiforgery tokens are valid for only a few seconds, and the load balancer adds latency"
    explanation: >
      Cookie автентифікації та antiforgery-токени захищає Data Protection, а за замовчуванням кожен вузол тримає
      власне кільце ключів. Запит, що потрапив на інший екземпляр, не розшифровується, тому симптоми з'являються
      випадково. Виправлення — спільне сховище ключів для всіх екземплярів або завжди спрямовувати користувача
      на той самий вузол.
    explanation_en: >
      Authentication cookies and antiforgery tokens are protected by Data Protection, and by default each node
      keeps its own key ring. A request that lands on a different instance cannot be decrypted, so the symptoms
      appear randomly. The fix is a shared key store for all instances, or always routing a user to the same
      node.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/web-farm#data-protection
      - https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/web-farm#data-protection-and-caching

  - id: aspnet-core-011
    level: senior
    type: multiple
    text: Сервіс часто звертається до зовнішнього HTTP API. Які твердження про керування `HttpClient` правильні?
    text_en: A service frequently calls an external HTTP API. Which statements about managing `HttpClient` are true?
    options:
      - text: "Створювати й звільняти новий `HttpClient` на кожен запит погано: під навантаженням вичерпуються порти"
        text_en: "Creating and disposing a new `HttpClient` for every request is bad: under load, ports are exhausted"
        correct: true
      - text: "Довгоживучий `HttpClient` без `PooledConnectionLifetime` не побачить змін DNS, бо DNS розв'язується лише для нових з'єднань"
        text_en: "A long-lived `HttpClient` without `PooledConnectionLifetime` will not see DNS changes, because DNS is resolved only for new connections"
        correct: true
      - text: "`IHttpClientFactory` повторно використовує обробники `HttpMessageHandler`, тож клієнта з неї можна брати на кожну операцію"
        text_en: "`IHttpClientFactory` reuses `HttpMessageHandler` instances, so a client can be obtained from it for each operation"
        correct: true
      - text: "`HttpClient` реалізує `IDisposable`, тож правильно загортати його в `using` на кожен запит"
        text_en: "`HttpClient` implements `IDisposable`, so it is correct to wrap it in `using` for every request"
      - text: "Клієнт з `IHttpClientFactory` можна назавжди зберегти в singleton-сервісі: фабрика сама періодично оновлюватиме його з'єднання"
        text_en: "A client from `IHttpClientFactory` can be stored permanently in a singleton service: the factory will refresh its connections periodically on its own"
    explanation: >
      Кожен клієнт зі своїм обробником має власний пул з'єднань, а закрите TCP-з'єднання звільняє порт не одразу,
      тож клієнт «на запит» під навантаженням вичерпує порти. Один довгоживучий клієнт розв'язує це, але DNS
      перечитує лише для нових з'єднань, тому йому потрібен `PooledConnectionLifetime`. Клієнти з
      `IHttpClientFactory` задумані короткоживучими: створений клієнт фабрика вже не контролює, тож у singleton
      він втрачає ротацію обробників.
    explanation_en: >
      Each client with its own handler has its own connection pool, and a closed TCP connection does not release
      its port immediately, so a client per request exhausts ports under load. A single long-lived client solves
      that, but it re-reads DNS only for new connections, so it needs `PooledConnectionLifetime`. Clients from
      `IHttpClientFactory` are meant to be short-lived: the factory no longer controls a client once it is
      created, so in a singleton it loses handler rotation.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/fundamentals/networking/http/httpclient-guidelines#recommended-use
      - https://learn.microsoft.com/en-us/dotnet/fundamentals/networking/http/httpclient-guidelines#dns-behavior

  - id: aspnet-core-012
    level: senior
    type: single
    text: >
      Команда хоче публікувати API як Native AOT, щоб контейнер стартував швидше й споживав менше пам'яті.
      Зараз API побудовано на MVC-контролерах, а JSON серіалізує `System.Text.Json` через рефлексію.
      Що доведеться змінити?
    text_en: >
      A team wants to publish an API as Native AOT so the container starts faster and uses less memory. The API is
      currently built on MVC controllers, and `System.Text.Json` serializes JSON through reflection. What will have
      to change?
    options:
      - text: "Перейти на Minimal API й описати типи запитів і відповідей у згенерованому `JsonSerializerContext`"
        text_en: "Move to Minimal APIs and describe the request and response types in a generated `JsonSerializerContext`"
        correct: true
      - text: "Нічого: Native AOT компілює ті самі MVC-контролери в машинний код, просто вже без JIT під час старту"
        text_en: "Nothing: Native AOT compiles the same MVC controllers to machine code, just without JIT at startup"
      - text: "Залишити контролери, але вимкнути trimming, щоб рефлексія знову працювала"
        text_en: "Keep the controllers but turn off trimming so that reflection works again"
      - text: "Залишити контролери, але створювати застосунок через `WebApplication.CreateSlimBuilder`"
        text_en: "Keep the controllers but create the app with `WebApplication.CreateSlimBuilder`"
    explanation: >
      MVC з Native AOT не сумісний (ні з trimming, ні зі `CreateSlimBuilder`), а Minimal API підтримуються
      частково, тому шаблон `webapiaot` побудовано лише на них. Рефлексія під час виконання недоступна, отже
      типи з тіла запитів і відповідей мають бути описані в `JsonSerializerContext`, який створює source
      generator, інакше серіалізація впаде.
    explanation_en: >
      MVC is not compatible with Native AOT (neither with trimming nor with `CreateSlimBuilder`), while Minimal
      APIs are partially supported, so the `webapiaot` template is built only on them. Runtime reflection is
      unavailable, so the types in request and response bodies must be described in a `JsonSerializerContext`
      created by the source generator, otherwise serialization will fail.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/native-aot#review-aspnet-core-and-native-aot-compatibility
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/native-aot#work-with-minimal-apis-and-json-payloads

  - id: aspnet-core-013
    level: junior
    type: single
    text: >
      ASP.NET Core застосунок запустили в контейнері, де не задано ні `ASPNETCORE_ENVIRONMENT`, ні
      `DOTNET_ENVIRONMENT`. Яке середовище отримає застосунок?
    text_en: >
      An ASP.NET Core app is started in a container where neither `ASPNETCORE_ENVIRONMENT` nor
      `DOTNET_ENVIRONMENT` is set. Which environment will the app get?
    options:
      - text: "`Production`: це середовище за замовчуванням, у ньому вимкнено більшість налагоджувальних можливостей"
        text_en: "`Production`: it is the default environment, and most debugging features are disabled in it"
        correct: true
      - text: "`Development`: без явного значення застосунок вважає, що його запустили локально на машині розробника"
        text_en: "`Development`: without an explicit value the app assumes it was started locally on a developer machine"
      - text: "`Staging`: це проміжне середовище, яке фреймворк вибирає, коли запуск відбувається в контейнері"
        text_en: "`Staging`: it is an intermediate environment that the framework picks when the app runs in a container"
      - text: "Жодного: `app.Environment.EnvironmentName` буде порожнім рядком, доки не викликати `UseEnvironment`"
        text_en: "None: `app.Environment.EnvironmentName` stays an empty string until `UseEnvironment` is called"
    explanation: >
      Якщо змінні середовища не задано, ASP.NET Core вважає, що працює `Production`, тому сторінка виняткових
      ситуацій розробника й подібні можливості вимкнені. `Development` потрібно вказати явно, зазвичай це робить
      профіль запуску на машині розробника.
    explanation_en: >
      When the environment variables are not set, ASP.NET Core assumes `Production`, so the developer exception
      page and similar features are off. `Development` has to be set explicitly, which a launch profile usually
      does on a developer machine.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/environments

  - id: aspnet-core-014
    level: junior
    type: single
    text: "За яким шляхом буде доступний ендпоінт, зареєстрований так?"
    text_en: "At which path will the endpoint registered like this be available?"
    code:
      lang: csharp
      source: |
        var app = WebApplication.CreateBuilder(args).Build();

        var api = app.MapGroup("/api/v1");
        api.MapGet("/items/{id:int}", (int id) => $"item {id}");

        app.Run();
    options:
      - text: "`GET /api/v1/items/7`: префікс групи додається до маршруту кожного ендпоінта в ній"
        text_en: "`GET /api/v1/items/7`: the group prefix is prepended to the route of every endpoint in it"
        correct: true
      - text: "`GET /items/7`: `MapGroup` лише групує ендпоінти для метаданих і не змінює їхніх маршрутів"
        text_en: "`GET /items/7`: `MapGroup` only groups endpoints for metadata and does not change their routes"
      - text: "`GET /api/v1`: усі ендпоінти групи обробляються одним маршрутом, а `id` береться з рядка запиту"
        text_en: "`GET /api/v1`: all endpoints of the group are served by one route, and `id` is taken from the query string"
      - text: "`GET /items/7/api/v1`: префікс групи додається в кінець маршруту ендпоінта, а не на початок"
        text_en: "`GET /items/7/api/v1`: the group prefix is appended to the end of the endpoint route, not the start"
    explanation: >
      `MapGroup` задає спільний префікс для всіх ендпоінтів групи й дає задати метадані для всіх разом, наприклад
      викликом `RequireAuthorization`. Тому маршрут стає `/api/v1/items/{id:int}`, а не `/items/{id:int}`.
    explanation_en: >
      `MapGroup` sets a common prefix for all endpoints in the group and lets you apply metadata to all of them
      at once, for example with `RequireAuthorization`. So the route becomes `/api/v1/items/{id:int}`, not
      `/items/{id:int}`.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/minimal-apis/route-handlers#route-groups

  - id: aspnet-core-015
    level: junior
    type: multiple
    text: Які твердження про атрибут `[ApiController]` на контролері правильні?
    text_en: Which statements about the `[ApiController]` attribute on a controller are true?
    options:
      - text: "Помилки валідації моделі автоматично дають відповідь HTTP 400 без перевірки `ModelState` у діях"
        text_en: "Model validation errors automatically produce an HTTP 400 response without checking `ModelState` in actions"
        correct: true
      - text: "Для параметра-класу, якого немає в DI, джерело прив'язки виводиться як тіло запиту"
        text_en: "For a class-typed parameter that is not registered in DI, the binding source is inferred as the request body"
        correct: true
      - text: "Дії контролера доступні лише через атрибутну маршрутизацію, а не через конвенційні маршрути"
        text_en: "Controller actions are reachable only through attribute routing, not through conventional routes"
        correct: true
      - text: "Усі дії контролера автоматично вимагають автентифікованого користувача, як із `[Authorize]`"
        text_en: "All actions of the controller automatically require an authenticated user, as with `[Authorize]`"
      - text: "Контролер перетворюється на набір Minimal API ендпоінтів і обходить конвеєр фільтрів MVC"
        text_en: "The controller is turned into a set of Minimal API endpoints and bypasses the MVC filter pipeline"
    explanation: >
      `[ApiController]` вмикає автоматичний 400 на помилки моделі, виведення джерел прив'язки (складні типи, яких
      немає в DI, беруться з тіла) і вимогу атрибутної маршрутизації. Він не додає автентифікацію й не змінює
      модель виконання: це все ще MVC із фільтрами.
    explanation_en: >
      `[ApiController]` enables an automatic 400 on model errors, binding source inference (complex types that
      are not in DI come from the body) and the attribute routing requirement. It adds no authentication and does
      not change the execution model: it is still MVC with filters.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/web-api/#apicontroller-attribute
      - https://learn.microsoft.com/en-us/aspnet/core/web-api/#binding-source-parameter-inference

  - id: aspnet-core-016
    level: junior
    type: single
    text: "Чому в логуванні перевагу віддають рядку B, а не A?"
    text_en: "Why is line B preferred over line A for logging?"
    code:
      lang: csharp
      source: |
        // A
        logger.LogInformation($"Order {orderId} shipped to {city}");

        // B
        logger.LogInformation("Order {OrderId} shipped to {City}", orderId, city);
    options:
      - text: "У B аргументи передаються провайдеру окремо, тож його можна зберігати як поля, а текст — не будувати завчасно"
        text_en: "In B the arguments reach the provider separately, so it can store them as fields without building the text early"
        correct: true
      - text: "A не скомпілюється: інтерполяція рядків не дозволена в аргументах методів `ILogger`"
        text_en: "A will not compile: string interpolation is not allowed in `ILogger` method arguments"
      - text: "B записує повідомлення в усі провайдери, а A — лише в консольний провайдер"
        text_en: "B writes the message to all providers, while A writes only to the console provider"
      - text: "B автоматично піднімає рівень повідомлення до `Warning`, щоб воно не загубилося серед інших"
        text_en: "B automatically raises the message level to `Warning` so that it does not get lost among others"
    explanation: >
      У шаблоні `{OrderId}` аргументи лишаються окремими значеннями, тож провайдери можуть зберігати їх як поля
      для пошуку й фільтрації. Інтерполяція (A) формує готовий рядок одразу, навіть якщо рівень логування вимкнено,
      і втрачає структуру. Компілюються обидва рядки, рівень повідомлення в обох `Information`.
    explanation_en: >
      In the `{OrderId}` template the arguments stay separate values, so providers can store them as fields for
      searching and filtering. Interpolation (A) builds the final string immediately, even if the log level is
      disabled, and loses the structure. Both lines compile, and the level is `Information` in both.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/logging#log-message-template

  - id: aspnet-core-017
    level: middle
    type: single
    text: >
      Зареєстровано два обробники: `builder.Services.AddExceptionHandler<ValidationExceptionHandler>();` і
      потім `builder.Services.AddExceptionHandler<GlobalExceptionHandler>();`, а також викликано
      `app.UseExceptionHandler()`. Ендпоінт кидає `TimeoutException`: `TryHandleAsync` першого обробника
      повертає `false`, другого — `true`. Що станеться?
    text_en: >
      Two handlers are registered: `builder.Services.AddExceptionHandler<ValidationExceptionHandler>();` and then
      `builder.Services.AddExceptionHandler<GlobalExceptionHandler>();`, and `app.UseExceptionHandler()` is called.
      An endpoint throws `TimeoutException`: `TryHandleAsync` of the first handler returns `false`, and of the
      second returns `true`. What happens?
    options:
      - text: "Обробники викликаються в порядку реєстрації, ланцюг зупиняється на другому, який повернув `true`"
        text_en: "Handlers are called in registration order, and the chain stops at the second one, which returned `true`"
        correct: true
      - text: "Перше `false` одразу завершує перебір, і middleware виконує свою поведінку за замовчуванням"
        text_en: "The first `false` ends the iteration at once, and the middleware runs its default behavior"
      - text: "Викликається лише обробник, зареєстрований останнім, бо він перекриває попередні реєстрації"
        text_en: "Only the handler registered last is called, because it overrides the earlier registrations"
      - text: "Обидва обробники пишуть у відповідь, а middleware зливає їхні результати в один `ProblemDetails`"
        text_en: "Both handlers write to the response, and the middleware merges their results into one `ProblemDetails`"
    explanation: >
      Middleware перебирає зареєстровані `IExceptionHandler` у порядку реєстрації, доки один не поверне `true`
      (виняток оброблено). `false` означає лише «це не мій виняток», тому перебір іде далі. Якщо жоден не
      обробив виняток, спрацьовує поведінка middleware за замовчуванням.
    explanation_en: >
      The middleware iterates registered `IExceptionHandler`s in registration order until one returns `true`
      (the exception is handled). `false` only means "not my exception", so the iteration continues. If none
      handled the exception, the middleware's default behavior applies.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/error-handling#iexceptionhandler

  - id: aspnet-core-018
    level: middle
    type: single
    text: >
      У `appsettings.json` для `Mail:Host` записано порожній рядок. Що станеться (ASP.NET Core 10)?
    text_en: >
      `Mail:Host` is an empty string in `appsettings.json`. What happens (ASP.NET Core 10)?
    code:
      lang: csharp
      source: |
        builder.Services.AddOptions<MailOptions>()
            .BindConfiguration("Mail")
            .ValidateDataAnnotations();

        builder.Services.AddSingleton<MailSender>();

        public class MailOptions
        {
            [Required] public string Host { get; set; } = "";
        }

        public class MailSender(IOptions<MailOptions> options)
        {
            private readonly string _host = options.Value.Host;
        }
    options:
      - text: "Застосунок стартує, а `OptionsValidationException` падає під час першого читання `options.Value`"
        text_en: "The app starts, and `OptionsValidationException` is thrown on the first read of `options.Value`"
        correct: true
      - text: "Застосунок не стартує: `ValidateDataAnnotations` перевіряє всі налаштування під час запуску хоста"
        text_en: "The app does not start: `ValidateDataAnnotations` checks all options while the host starts"
      - text: "Валідація не виконується для `IOptions<T>`: вона працює лише з `IOptionsMonitor<T>` і `IOptionsSnapshot<T>`"
        text_en: "Validation is not run for `IOptions<T>`: it works only with `IOptionsMonitor<T>` and `IOptionsSnapshot<T>`"
      - text: "У лог іде попередження, а `options.Value` повертає об'єкт із порожнім `Host`"
        text_en: "A warning is written to the log, and `options.Value` returns an object with an empty `Host`"
    explanation: >
      Валідація опцій виконується ліниво, під час першого створення значення (`options.Value`), тож без
      `ValidateOnStart()` хост успішно стартує, а помилка вилізе пізніше, в роботі. Додавши `ValidateOnStart()`, ви
      змусите перевірку виконатися під час запуску, і застосунок швидко впаде з тим самим винятком.
    explanation_en: >
      Options validation is lazy: it runs when the value is first created (`options.Value`), so without
      `ValidateOnStart()` the host starts successfully and the error appears later, at run time. Adding
      `ValidateOnStart()` forces the check to run at startup, and the app fails fast with the same exception.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/options#options-validation
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/options#validateonstart

  - id: aspnet-core-019
    level: middle
    type: single
    text: "Що поверне останній виклик у цьому коді?"
    text_en: "What will the last call in this code return?"
    code:
      lang: csharp
      source: |
        var services = new ServiceCollection();
        services.AddKeyedSingleton<ICache, RedisCache>("redis");

        using var provider = services.BuildServiceProvider();

        ICache? cache = provider.GetService<ICache>();
    options:
      - text: "`null`: ключовану реєстрацію не видно під час звичайного розв'язання без ключа"
        text_en: "`null`: a keyed registration is not visible to a regular resolve without a key"
        correct: true
      - text: "Екземпляр `RedisCache`, бо це єдина реєстрація `ICache` у контейнері"
        text_en: "A `RedisCache` instance, because it is the only `ICache` registration in the container"
      - text: "Екземпляр `RedisCache`, якщо ключ є рядком, адже рядкові ключі контейнер вважає ключем за замовчуванням"
        text_en: "A `RedisCache` instance if the key is a string, because the container treats string keys as the default key"
      - text: "Кидає `InvalidOperationException`, бо `GetService` відмовляється розв'язувати ключовані сервіси"
        text_en: "Throws `InvalidOperationException`, because `GetService` refuses to resolve keyed services"
    explanation: >
      Ключова реєстрація належить до окремого простору: розв'язувати її треба з ключем
      (`GetRequiredKeyedService<ICache>("redis")` або `[FromKeyedServices("redis")]`). `GetService` без ключа
      повертає `null`, а `GetRequiredService` у цьому разі кинув би `InvalidOperationException`.
    explanation_en: >
      A keyed registration lives in its own space and must be resolved with the key
      (`GetRequiredKeyedService<ICache>("redis")` or `[FromKeyedServices("redis")]`). `GetService` without a key
      returns `null`, while `GetRequiredService` would throw `InvalidOperationException` here.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/dependency-injection#keyed-services
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection#keyed-services

  - id: aspnet-core-020
    level: middle
    type: multiple
    text: Які твердження про CORS в ASP.NET Core правильні?
    text_en: Which statements about CORS in ASP.NET Core are true?
    options:
      - text: "Поєднання `AllowAnyOrigin` і `AllowCredentials` небезпечне, і CORS-сервіс повертає недійсну CORS-відповідь"
        text_en: "Combining `AllowAnyOrigin` and `AllowCredentials` is insecure, and the CORS service returns an invalid CORS response"
        correct: true
      - text: "`UseCors` викликають після `UseRouting`, але до `UseAuthorization`, щоб політика діяла для ендпоінтів"
        text_en: "`UseCors` is called after `UseRouting` but before `UseAuthorization`, so that the policy applies to endpoints"
        correct: true
      - text: "Origin із піддоменом-шаблоном `https://*.example.com` працює лише разом із `SetIsOriginAllowedToAllowWildcardSubdomains`"
        text_en: "An origin with a wildcard subdomain `https://*.example.com` works only together with `SetIsOriginAllowedToAllowWildcardSubdomains`"
        correct: true
      - text: "CORS-політика захищає API від будь-яких клієнтів, зокрема від `curl` і Postman, бо сервер відхиляє чужі origin"
        text_en: "A CORS policy protects the API from any client, including `curl` and Postman, because the server rejects foreign origins"
      - text: "Preflight-запити `OPTIONS` треба вручну обробляти в кожній дії контролера, middleware їх не відповідає"
        text_en: "Preflight `OPTIONS` requests must be handled manually in every controller action, the middleware does not answer them"
    explanation: >
      Порядок `UseRouting`, `UseCors`, `UseAuthorization` обов'язковий, а wildcard-піддомени потребують окремого
      методу. Дозвіл будь-якого origin разом із credentials CORS-сервіс відхиляє. CORS ні в якому разі не є
      механізмом безпеки сервера: це послаблення політики одного походження в браузері, і preflight middleware
      відповідає сам.
    explanation_en: >
      The order `UseRouting`, `UseCors`, `UseAuthorization` is required, and wildcard subdomains need a separate
      method. The CORS service rejects any origin combined with credentials. CORS is not a server security
      mechanism: it relaxes the same-origin policy in the browser, and the middleware answers preflight itself.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/security/cors

  - id: aspnet-core-021
    level: senior
    type: single
    text: >
      API у Kubernetes має liveness-проби на `/health`, де зареєстровано перевірку з'єднання з PostgreSQL. Коли
      база на хвилину стала недоступною, оркестратор перезапустив усі поди, і відновлення затягнулося. Як це
      виправити?
    text_en: >
      An API in Kubernetes has liveness probes on `/health`, which has a PostgreSQL connectivity check registered.
      When the database became unavailable for a minute, the orchestrator restarted all the pods, and recovery
      dragged on. How should this be fixed?
    options:
      - text: "Розділити проби: liveness без залежних перевірок (`Predicate = _ => false`), а перевірку БД лишити з тегом `ready`"
        text_en: "Split the probes: liveness without dependency checks (`Predicate = _ => false`), and keep the DB check under a `ready` tag"
        correct: true
      - text: "Подовжити `timeoutSeconds` liveness-проби, щоб вона переживала короткі збої бази без перезапуску"
        text_en: "Increase the liveness probe's `timeoutSeconds` so that it survives short database outages without a restart"
      - text: "Прибрати перевірку БД із застосунку й залишити лише `AddHealthChecks()` без жодних зареєстрованих перевірок"
        text_en: "Remove the DB check from the app and keep only `AddHealthChecks()` with no registered checks"
      - text: "Замінити liveness-пробу на readiness-пробу з тим самим ендпоінтом `/health`, бо readiness не перезапускає поди"
        text_en: "Replace the liveness probe with a readiness probe on the same `/health` endpoint, because readiness does not restart pods"
    explanation: >
      Liveness має казати лише «процес живий», бо збій залежності не лікується перезапуском і лише множить
      навантаження на відновлення. Залежності перевіряє readiness, яка тимчасово виводить под із балансування.
      У ASP.NET Core це робиться тегами й `Predicate`: liveness-ендпоінт не виконує жодної перевірки, а
      readiness-ендпоінт виконує лише перевірки з тегом `ready`.
    explanation_en: >
      Liveness should only say "the process is alive", because a failed dependency is not cured by a restart and
      only adds load to the recovery. Dependencies are checked by readiness, which temporarily takes a pod out of
      load balancing. In ASP.NET Core this is done with tags and `Predicate`: the liveness endpoint runs no
      checks, and the readiness endpoint runs only checks tagged `ready`.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/health-checks#separate-readiness-and-liveness-probes
      - https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/health-checks#filter-health-checks

  - id: aspnet-core-022
    level: senior
    type: single
    text: >
      Застосунок викликає `UseHttpsRedirection` і працює в контейнері за Ingress, який завершує TLS і пересилає
      трафік у Kestrel по HTTP. Браузер зациклюється на редиректах на HTTPS. Яке виправлення усуває причину, не відкриваючи можливості підробити заголовки від клієнта?
    text_en: >
      An app calls `UseHttpsRedirection` and runs in a container behind an Ingress that terminates TLS and
      forwards traffic to Kestrel over HTTP. The browser loops on redirects to HTTPS. Which fix removes the cause without letting clients forge the forwarded headers?
    options:
      - text: "Увімкнути forwarded headers middleware до редиректу, щоб бачити схему з `X-Forwarded-Proto`, і довіряти лише відомим проксі"
        text_en: "Enable forwarded headers middleware before the redirect to see the scheme from `X-Forwarded-Proto`, and trust only known proxies"
        correct: true
      - text: "Додати `UseHsts` перед редиректом, щоб браузер запам'ятав, що сайт працює лише по HTTPS, і більше не надсилав HTTP-запитів"
        text_en: "Add `UseHsts` before the redirect so the browser remembers that the site works only over HTTPS and stops sending HTTP requests"
      - text: "Задати `ForwardLimit = null` і очистити `KnownProxies` та `KnownNetworks`, щоб приймати заголовки від будь-якої адреси"
        text_en: "Set `ForwardLimit = null` and clear `KnownProxies` and `KnownNetworks` so that headers are accepted from any address"
      - text: "Увімкнути в Kestrel HTTP/2, щоб Ingress міг передавати початкову схему запиту у протоколі з'єднання"
        text_en: "Enable HTTP/2 in Kestrel so that Ingress can pass the original request scheme in the connection protocol"
    explanation: >
      Kestrel бачить лише HTTP-з'єднання від проксі, тож `UseHttpsRedirection` постійно переспрямовує на HTTPS,
      а проксі знову знімає TLS. Forwarded headers middleware підставляє початкову схему з `X-Forwarded-Proto`.
      Він має стояти раніше за редирект і HSTS. Довіряти заголовкам слід лише відомим проксі: `ForwardLimit = null`
      із порожніми списками дозволяє підробляти їх.
    explanation_en: >
      Kestrel sees only an HTTP connection from the proxy, so `UseHttpsRedirection` keeps redirecting to HTTPS
      while the proxy strips TLS again. The forwarded headers middleware restores the original scheme from
      `X-Forwarded-Proto`. It must run before the redirect and HSTS. Headers should be trusted only from known
      proxies: `ForwardLimit = null` with empty lists lets anyone forge them.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/proxy-load-balancer#forwarded-headers-middleware-order
      - https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/proxy-load-balancer#forwarded-headers-middleware-options

  - id: aspnet-core-023
    level: senior
    type: multiple
    text: Які твердження про фонові сервіси (`BackgroundService`) у ASP.NET Core 10 правильні?
    text_en: Which statements about background services (`BackgroundService`) in ASP.NET Core 10 are true?
    options:
      - text: "Необроблений виняток в `ExecuteAsync` логується, і за замовчуванням хост зупиняється"
        text_en: "An unhandled exception in `ExecuteAsync` is logged, and by default the host is stopped"
        correct: true
      - text: "Scoped-сервіс у фоновому сервісі отримують через `IServiceScopeFactory.CreateScope()`, а не конструктором"
        text_en: "A scoped service in a background service is obtained through `IServiceScopeFactory.CreateScope()`, not the constructor"
        correct: true
      - text: "`StartAsync` фонових сервісів виконуються послідовно, тому довге виконання одного затримує старт наступних"
        text_en: "The `StartAsync` methods of hosted services run sequentially, so a long-running one delays the start of the next ones"
        correct: true
      - text: "Після винятку в `ExecuteAsync` хост лише логує помилку й автоматично перезапускає цей сервіс із паузою"
        text_en: "After an exception in `ExecuteAsync` the host only logs the error and automatically restarts this service after a pause"
      - text: "Кожна ітерація циклу в `ExecuteAsync` отримує власний scope, тож scoped-залежності можна просто інжектити в конструктор"
        text_en: "Each loop iteration in `ExecuteAsync` gets its own scope, so scoped dependencies can simply be injected into the constructor"
    explanation: >
      Із .NET 6 виняток із `ExecuteAsync` логується й за замовчуванням зупиняє хост, тому автоматичного
      перезапуску немає. Фоновий сервіс є singleton, тож scoped-залежності треба брати в явно створеному scope.
      Hosted services стартують послідовно в порядку реєстрації, отже довгий `StartAsync` блокує решту.
    explanation_en: >
      Since .NET 6 an exception from `ExecuteAsync` is logged and by default stops the host, so there is no
      automatic restart. A background service is a singleton, so scoped dependencies must be taken in an
      explicitly created scope. Hosted services start sequentially in registration order, so a long `StartAsync`
      blocks the rest.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/compatibility/core-libraries/6.0/hosting-exception-handling
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/scoped-service
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/host/hosted-services#ihostedservice-interface

  - id: aspnet-core-024
    level: senior
    type: single
    text: >
      Singleton `ReportGenerator` на кожен виклик бере `IServiceProvider` (кореневий) і робить
      `provider.GetRequiredService<TempFile>()`. `TempFile` — `IDisposable`, зареєстрований як transient. Через
      добу сервіс працює, але пам'ять і кількість відкритих файлів ростуть. Чому?
    text_en: >
      A singleton `ReportGenerator` takes the (root) `IServiceProvider` and calls
      `provider.GetRequiredService<TempFile>()` on every call. `TempFile` is `IDisposable`, registered as
      transient. After a day the service is still running, but memory and the number of open files keep growing.
      Why?
    code:
      lang: csharp
      source: |
        builder.Services.AddTransient<TempFile>();
        builder.Services.AddSingleton<ReportGenerator>();

        public class ReportGenerator(IServiceProvider provider)
        {
            public void Generate()
            {
                var file = provider.GetRequiredService<TempFile>();
                // ... write the report using file; Dispose is never called
            }
        }
    options:
      - text: "Контейнер тримає посилання на кожен transient `IDisposable`, розв'язаний із кореня, до зупинки застосунку"
        text_en: "The container keeps a reference to every transient `IDisposable` resolved from the root until the app stops"
        correct: true
      - text: "Transient-сервіси завжди кешуються контейнером як singleton і повторно використовуються, тож файли не закриваються"
        text_en: "Transient services are always cached by the container as singletons and reused, so the files are never closed"
      - text: "Збирач сміття не збирає `IDisposable` без фіналізатора, тож такі об'єкти живуть, доки не викличуть `Dispose`"
        text_en: "The garbage collector does not collect an `IDisposable` without a finalizer, so such objects live until `Dispose` is called"
      - text: "Кореневий провайдер створює для кожного виклику окремий scope і звільняє його лише через дві години простою"
        text_en: "The root provider creates a separate scope for each call and releases it only after two hours of idleness"
    explanation: >
      Контейнер відстежує одноразові сервіси, які створив, і звільняє їх, коли закінчується scope, де їх
      розв'язано. Для кореневого провайдера це зупинка застосунку, тож кожен transient `TempFile` лишається
      досяжним. Рішення: створювати scope (`CreateScope`) на виклик або віддати створення фабриці й самому
      викликати `Dispose`.
    explanation_en: >
      The container tracks the disposable services it created and disposes them when the scope they were
      resolved in ends. For the root provider that is application shutdown, so every transient `TempFile`
      stays reachable. The fix is to create a scope (`CreateScope`) per call, or to use a factory and call
      `Dispose` yourself.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection-guidelines#disposal-of-services
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection-guidelines#disposable-transient-services-captured-by-container
