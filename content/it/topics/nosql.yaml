id: nosql
title: NoSQL і кеш
title_en: NoSQL and caching
description: Redis, MongoDB, моделі даних, кешування, TTL, консистентність.
description_en: Redis, MongoDB, data models, caching, TTL, consistency.
questions:
  - id: nosql-001
    level: junior
    type: single
    text: Що повернуть дві останні команди Redis?
    code:
      lang: text
      source: |
        SET a 1
        TTL a
        TTL missing
    options:
      - text: "`-1` для ключа без терміну життя й `-2` для неіснуючого ключа"
        correct: true
      - text: "`0` для ключа без терміну життя й `-1` для неіснуючого ключа"
      - text: "`-1` для обох: у кожного з них термін життя не встановлено"
      - text: "`-2` для ключа без терміну життя й `-1` для неіснуючого ключа"
    explanation: >
      `TTL` повертає `-1`, якщо ключ існує, але без терміну життя, і `-2`, якщо ключа немає. Невід'ємне число означає, скільки секунд лишилося.
    sources:
      - https://redis.io/docs/latest/commands/ttl/
  - id: nosql-002
    level: junior
    type: single
    text: Яка структура даних Redis найкраще підходить для таблиці лідерів, де потрібно швидко отримати топ-10 гравців за очками?
    options:
      - text: "Sorted set: `ZADD` додає очки, а діапазонні команди повертають гравців за рейтингом"
        correct: true
      - text: "Список (list): `LPUSH` додає гравця, а `LRANGE` повертає перших десять елементів"
      - text: "Хеш (hash): поля містять очки гравців, а `HGETALL` повертає їх відсортованими"
      - text: "Множина (set): `SADD` зберігає гравців, а `SMEMBERS` віддає їх за очками"
    explanation: >
      У sorted set кожен елемент має числову оцінку, і Redis тримає елементи впорядкованими за нею, тому топ вибирається без сортування на клієнті.
      Hash і set порядку не гарантують, а list упорядкований за часом додавання.
    sources:
      - https://redis.io/docs/latest/develop/data-types/sorted-sets/
  - id: nosql-003
    level: junior
    type: single
    text: Що станеться, якщо в MongoDB вставити документ без поля `_id`?
    code:
      lang: javascript
      source: |
        db.users.insertOne({ name: "Anna" })
    options:
      - text: "MongoDB додасть унікальний `_id` типу `ObjectId` і поверне його"
        correct: true
      - text: "Вставка завершиться помилкою: `_id` обов'язково задає клієнт"
      - text: "Документ збережеться без `_id`, але його не можна буде оновити"
      - text: "`_id` стане послідовним цілим числом `1, 2, 3…`, як автоінкремент"
    explanation: >
      Кожен документ має унікальний первинний ключ `_id`. Якщо його не передано, його генерує драйвер або сервер, зазвичай як `ObjectId`.
      Автоінкременту в MongoDB немає, і на колекції автоматично є унікальний індекс по `_id`.
    sources:
      - https://www.mongodb.com/docs/manual/core/document/#the-_id-field
  - id: nosql-004
    level: junior
    type: multiple
    text: Які твердження про шаблон cache-aside правильні?
    options:
      - text: "Застосунок сам перевіряє кеш і за промаху читає дані з бази"
        correct: true
      - text: "Після читання з бази застосунок кладе значення в кеш для наступних запитів"
        correct: true
      - text: "Значення в кеші може бути застарілим щодо бази, тому потрібні термін життя або інвалідація"
        correct: true
      - text: "Кеш сам завантажує дані з бази за промаху, а застосунок знає лише про кеш"
      - text: "Кожен запис у кеш автоматично й синхронно потрапляє в базу"
    explanation: >
      У cache-aside логіку кешування веде застосунок. Варіанти, коли сам кеш підтягує дані з сховища (read-through) або транслює записи в базу
      (write-through), — це інші шаблони.
    sources:
      - https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
  - id: nosql-005
    level: middle
    type: single
    text: >
      У блозі до кожної статті ще є до 20 коментарів, які майже завжди читають разом зі статтею й не потрібні окремо. Як це краще змоделювати в MongoDB?
    options:
      - text: "Вкласти коментарі масивом у документ статті: один запит повертає все"
        correct: true
      - text: "Зберігати коментарі в окремій колекції й завжди з'єднувати через `$lookup`"
      - text: "Зробити окрему колекцію для кожної статті, щоб коментарі не змішувалися"
      - text: "Зберігати в статті лише лічильник, а тексти коментарів тримати в Redis"
    explanation: >
      Коли пов'язані дані невеликі, обмежені за розміром і завжди читаються разом, вкладення спрощує читання й дає атомарне оновлення одного документа.
      Окрема колекція виправдана, якщо вкладений масив необмежено росте або дані потрібні самостійно.
    sources:
      - https://www.mongodb.com/docs/manual/data-modeling/embedding/
  - id: nosql-006
    level: middle
    type: single
    text: >
      Сервер Redis (політику `maxmemory-policy` не змінювали) досяг ліміту `maxmemory`. Що відбувається з новими записами?
    options:
      - text: "Команди, що потребують нової пам'яті, відхиляються з помилкою OOM; читання працюють"
        correct: true
      - text: "Redis видаляє найдавніше використані ключі, щоб звільнити місце"
      - text: "Redis видаляє найстаріші ключі з терміном життя, а решту лишає"
      - text: "Redis вмикає своп на диск і продовжує приймати записи без помилок, але повільніше"
    explanation: >
      Типова політика `noeviction` нічого не видаляє й повертає помилку на команди, які збільшують пам'ять. Для кешу зазвичай обирають політику
      на кшталт `allkeys-lru`, а `noeviction` лишають для сховища, де втрата ключів неприпустима.
    sources:
      - https://redis.io/docs/latest/develop/reference/eviction/
  - id: nosql-007
    level: middle
    type: multiple
    text: Які дії у Redis скидають термін життя ключа `session`, зробивши його постійним?
    code:
      lang: text
      source: |
        SET session abc EX 100
        # ... then one of the actions runs
    options:
      - text: "`SET session new` без `KEEPTTL`"
        correct: true
      - text: "`PERSIST session`"
        correct: true
      - text: "`APPEND session xyz`"
      - text: "`SETRANGE session 0 Z`"
      - text: "`SET session new KEEPTTL`"
    explanation: >
      Перезапис ключа командою `SET` стирає термін життя, якщо не вказати `KEEPTTL`, а `PERSIST` робить це явно. Команди, що лише змінюють значення
      (`APPEND`, `SETRANGE`), термін життя зберігають. Це перевірено запуском на Redis 8.
    sources:
      - https://redis.io/docs/latest/commands/expire/
      - https://redis.io/docs/latest/commands/persist/
  - id: nosql-008
    level: middle
    type: single
    text: Що буде з ключами `a` і `b` після виконання транзакції?
    code:
      lang: text
      source: |
        SET k "text"
        MULTI
        SET a 1
        LPUSH k x
        SET b 2
        EXEC
    options:
      - text: "`LPUSH` поверне помилку `WRONGTYPE`, але `a` і `b` будуть встановлені: відкату немає"
        correct: true
      - text: "Транзакцію буде відкочено повністю, тож `a` і `b` не існуватимуть"
      - text: "Виконається лише `SET a 1`, а все після помилки відкинеться"
      - text: "`EXEC` не виконається взагалі, бо `LPUSH` не пройшов перевірку під час постановки в чергу"
    explanation: >
      Помилка типу виникає лише під час виконання, коли команди вже в черзі. Redis не відкочує транзакцію: усі решта команд виконуються,
      і `a` та `b` отримують значення. Перевірено запуском: `GET a` повернуло `1`, `GET b` — `2`.
    sources:
      - https://redis.io/docs/latest/develop/using-commands/transactions/
  - id: nosql-009
    level: senior
    type: single
    text: >
      У MongoDB replica set клієнт записав документ із `w: 1` і отримав підтвердження. Primary одразу впав, поки запис не дійшов до жодної secondary, і обрали нового primary. Що найімовірніше станеться із записом?
    options:
      - text: "Запис буде відкочено на колишньому primary, коли той повернеться до набору"
        correct: true
      - text: "Запис збережеться, бо підтвердження від primary гарантує, що його побачать усі члени набору"
      - text: "Новий primary дочекається синхронізації й відновить запис із журналу старого"
      - text: "Клієнт отримає виняток при наступному читанні й повторить запис автоматично"
    explanation: >
      `w: 1` підтверджує лише запис на primary. Якщо він не встиг реплікуватися на іншого члена, при поверненні старого primary такі операції відкочуються.
      Щоб підтверджені записи не відкочувалися, використовують `w: "majority"`.
    sources:
      - https://www.mongodb.com/docs/manual/core/replica-set-rollbacks/
  - id: nosql-010
    level: senior
    type: single
    text: >
      У схемі cache-aside два сервіси майже одночасно оновлюють один запис. Чому при запису краще видаляти ключ кешу (інвалідувати), а не записувати в кеш нове значення?
    options:
      - text: "Паралельні записи в кеш можуть лягти в іншому порядку, ніж у базі, а після видалення читання бере актуальні дані з бази"
        correct: true
      - text: "Видалення ключа атомарно записує нове значення і в базу, і в кеш, тож вони завжди синхронні"
      - text: "Redis не дозволяє перезаписати ключ, який уже має значення, без попереднього видалення"
      - text: "Запис нового значення в кеш завжди повільніший за видалення ключа, а в усьому іншому, зокрема в консистентності, підходи рівноцінні"
    explanation: >
      Описаний підхід: спершу змінити базу, потім інвалідувати запис у кеші. Це не усуває застарілість повністю (читач може покласти старе значення
      між операціями), але зменшує вікно неузгодженості, а термін життя ключа обмежує його довжину.
    sources:
      - https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
  - id: nosql-011
    level: senior
    type: single
    text: >
      У Redis Cluster команда `MGET user:1 user:2` завершується помилкою, хоча кожен ключ окремо читається нормально. Що це означає і як виправити?
    options:
      - text: "Ключі в різних слотах кластера; їх зводять в один слот hash tag, наприклад `{user}:1` і `{user}:2`"
        correct: true
      - text: "Ключі належать різним базам даних, тож перед командою потрібно викликати `SELECT`"
      - text: "`MGET` у кластері не підтримується, його слід замінити циклом окремих команд `GET`"
      - text: "Один із ключів прострочений, тож `MGET` відхиляє весь запит"
    explanation: >
      У кластері команда з кількома ключами працює лише тоді, коли всі вони в одному слоті з 16384. Hash tag у фігурних дужках визначає частину ключа,
      яка хешується, тому ключі з однаковим тегом потрапляють в один слот.
    sources:
      - https://redis.io/docs/latest/operate/oss_and_stack/management/scaling/
  - id: nosql-012
    level: senior
    type: multiple
    text: Які твердження про вибір ключа шардування (shard key) у MongoDB правильні?
    options:
      - text: "Монотонно зростаючий ключ спрямовує всі нові вставки в один чанк"
        correct: true
      - text: "Низька кардинальність обмежує кількість чанків, на які можна розбити дані"
        correct: true
      - text: "Запити без ключа шардування розсилаються на всі шарди (scatter-gather)"
        correct: true
      - text: "`ObjectId` як ключ ідеально розподіляє вставки, бо його значення завжди унікальні"
      - text: "Хешований ключ зберігає діапазонні запити по ньому на одному шарді"
    explanation: >
      Унікальність не гарантує рівного розподілу: `ObjectId` зростає з часом, тож вставки йдуть в останній чанк. Хешування рівномірно розподіляє записи,
      але діапазонні запити по ключу розсіюються по шардах.
    sources:
      - https://www.mongodb.com/docs/manual/core/sharding-choose-a-shard-key/
