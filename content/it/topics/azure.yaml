id: azure
title: Azure
title_en: Azure
description: App Service, Functions, Azure SQL, Service Bus, Key Vault, Entra ID.
description_en: App Service, Functions, Azure SQL, Service Bus, Key Vault, Entra ID.
icon: cloud
questions:
  - id: azure-001
    level: junior
    type: single
    text: Що визначає App Service plan в Azure App Service?
    text_en: What does an App Service plan define in Azure App Service?
    options:
    - text: 'Обчислювальні ресурси: розмір і кількість екземплярів, регіон, тариф для всіх застосунків плану'
      text_en: 'Compute resources: size and number of instances, region, and pricing tier for all apps in the plan'
      correct: true
    - text: Лише доменне ім'я, сертифікат і правила маршрутизації одного окремого вебзастосунку в підписці
      text_en: Only the domain name, certificate, and routing rules of a single web app in the subscription
    - text: Схему бази даних і рядки підключення, спільні для всіх застосунків, що працюють у цьому плані
      text_en: The database schema and connection strings shared by all apps running in this plan
    - text: Мову програмування та версію середовища виконання, які дозволені для застосунків у цьому плані
      text_en: The programming language and runtime version allowed for apps in this plan
    explanation: |
      План — це «ферма» віртуальних машин із певним тарифом, на якій запускаються один або кілька застосунків. Домени й сертифікати налаштовуються на рівні самого застосунку, а мова обирається стеком застосунку, не планом.
    explanation_en: |
      A plan is a "farm" of virtual machines with a given pricing tier that runs one or more apps. Domains and certificates are configured at the level of the app itself, and the language is chosen by the app's stack, not by the plan.
    sources:
    - https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
  - id: azure-002
    level: junior
    type: single
    text: Для чого призначений Azure Key Vault?
    text_en: What is Azure Key Vault for?
    options:
    - text: Безпечне зберігання секретів, ключів шифрування й сертифікатів із керуванням доступом
      text_en: Secure storage of secrets, encryption keys, and certificates with access control
      correct: true
    - text: Зберігання бінарних файлів і медіа з публічним доступом за URL для вебзастосунків та мобільних клієнтів
      text_en: Storing binary files and media with public URL access for web apps and mobile clients
    - text: Запуск контейнерів без керування серверами, з автоматичним масштабуванням за кількістю запитів
      text_en: Running containers without managing servers, with autoscaling based on request count
    - text: Маршрутизація HTTP-трафіку між регіонами з перевіркою стану бекендів і глобальним балансуванням
      text_en: Routing HTTP traffic between regions with backend health checks and global load balancing
    explanation: |
      Key Vault централізує секрети, ключі та сертифікати, щоб їх не зберігати в коді чи конфігурації застосунку. Файли й медіа належать Blob Storage, а маршрутизація трафіку — Front Door або Traffic Manager.
    explanation_en: |
      Key Vault centralizes secrets, keys, and certificates so they are not stored in code or app configuration. Files and media belong to Blob Storage, and traffic routing belongs to Front Door or Traffic Manager.
    sources:
    - https://learn.microsoft.com/en-us/azure/key-vault/general/overview
  - id: azure-003
    level: junior
    type: single
    text: Яку проблему розв'язує managed identity для застосунку в Azure?
    text_en: What problem does a managed identity solve for an Azure app?
    options:
    - text: Застосунок автентифікується в ресурсах, захищених Entra ID, без пароля чи ключа в коді або конфігурації
      text_en: The app authenticates to resources protected by Entra ID without a password or key in code or configuration
      correct: true
    - text: Автоматично шифрує всі дані, які застосунок записує в базу, ключами з Key Vault
      text_en: Automatically encrypts all data the app writes to a database using keys from Key Vault
    - text: Дає застосунку доступ до всіх ресурсів підписки за замовчуванням без окремих призначень ролей
      text_en: Gives the app access to all subscription resources by default without separate role assignments
    - text: Замінює мережеві правила брандмауера для ресурсу та обмежує вхідні підключення за IP-адресою
      text_en: Replaces the firewall network rules of a resource and restricts inbound connections by IP address
    explanation: |
      Платформа сама видає й оновлює облікові дані ідентичності, тож секрету для зберігання немає. Права доступу все одно треба видати окремо через призначення ролей, за замовчуванням ідентичність нічого не може.
    explanation_en: |
      The platform itself issues and renews the identity's credentials, so there is no secret to store. Access rights still have to be granted separately through role assignments; by default the identity can do nothing.
    sources:
    - https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
  - id: azure-004
    level: junior
    type: single
    text: Чим тема (topic) із підписками в Azure Service Bus відрізняється від черги (queue)?
    text_en: How does a topic with subscriptions in Azure Service Bus differ from a queue?
    options:
    - text: Кожна підписка отримує власну копію повідомлення, тож споживачі обробляють його незалежно
      text_en: Each subscription receives its own copy of the message, so consumers process it independently
      correct: true
    - text: Тема гарантує порядок доставки повідомлень, а звичайна черга такої гарантії не дає зовсім
      text_en: A topic guarantees message delivery order, while a regular queue gives no such guarantee at all
    - text: Тема зберігає повідомлення вічно, а черга автоматично видаляє їх через одну годину після надходження
      text_en: A topic stores messages forever, while a queue automatically deletes them one hour after arrival
    - text: Тема працює лише по HTTP, а черга доступна тільки через протокол AMQP 1.0
      text_en: A topic works only over HTTP, while a queue is available only through the AMQP 1.0 protocol
    explanation: |
      Тема реалізує публікацію-підписку, і кожна підписка поводиться як окрема черга. У звичайній черзі повідомлення бере один зі співспоживачів.
    explanation_en: |
      A topic implements publish-subscribe, and each subscription behaves like a separate queue. In a regular queue, the message is taken by one of the competing consumers.
    sources:
    - https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-queues-topics-subscriptions
  - id: azure-005
    level: middle
    type: multiple
    text: Які твердження про тригери й прив'язки (bindings) в Azure Functions правильні?
    text_en: Which statements about triggers and bindings in Azure Functions are true?
    options:
    - text: Функція має рівно один тригер
      text_en: A function has exactly one trigger
      correct: true
    - text: Прив'язки необов'язкові, а функція може мати кілька вхідних і вихідних
      text_en: Bindings are optional, and a function can have several input and output ones
      correct: true
    - text: Функція може мати кілька тригерів, якщо вони різних типів
      text_en: A function can have several triggers if they are of different types
    - text: Вихідна прив'язка працює лише разом із HTTP-тригером
      text_en: An output binding works only together with an HTTP trigger
    explanation: |
      Тригер визначає, що запускає функцію, і він завжди один. Вхідні й вихідні прив'язки лише спрощують доступ до сервісів, їх може не бути або бути кілька. Типи тригера й вихідної прив'язки між собою не пов'язані.
    explanation_en: |
      The trigger defines what starts the function, and there is always exactly one. Input and output bindings merely simplify access to services; there may be none or several. The trigger type and the output binding type are unrelated.
    sources:
    - https://learn.microsoft.com/en-us/azure/azure-functions/functions-triggers-bindings
  - id: azure-006
    level: middle
    type: multiple
    text: Що правильно про слоти розгортання (deployment slots) в Azure App Service?
    text_en: Which statements about deployment slots in Azure App Service are true?
    options:
    - text: Слот є живим застосунком зі своїм іменем хоста
      text_en: A slot is a live app with its own host name
      correct: true
    - text: Перед підміною слот прогрівається, тож трафік переходить без простою
      text_en: Before a swap the slot is warmed up, so traffic switches without downtime
      correct: true
    - text: Слоти використовують ресурси того самого App Service plan
      text_en: Slots use resources of the same App Service plan
      correct: true
    - text: Слоти доступні вже на безкоштовному тарифі Free і на тарифі Shared
      text_en: Slots are available even on the Free tier and the Shared tier
    explanation: |
      Слоти підтримують тарифи Standard, Premium та Isolated і працюють на інстансах того самого плану, тож навантаження на staging забирає ресурси в production. Free не підтримує слотів.
    explanation_en: |
      Slots are supported on the Standard, Premium, and Isolated tiers and run on instances of the same plan, so load on staging takes resources away from production. Free does not support slots.
    sources:
    - https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
    - https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
  - id: azure-007
    level: middle
    type: single
    text: Споживач Service Bus у режимі PeekLock узяв повідомлення, але не викликав ні `Complete`, ні `Abandon`, і блокування сплило. Що станеться з повідомленням?
    text_en: A Service Bus consumer in PeekLock mode took a message but called neither `Complete` nor `Abandon`, and the lock expired. What happens to the message?
    options:
    - text: Воно знову стане доступним, а після досягнення Max Delivery Count піде в dead-letter чергу
      text_en: It becomes available again, and after reaching Max Delivery Count it goes to the dead-letter queue
      correct: true
    - text: Воно буде безповоротно видалене з черги, бо споживач уже отримав його й почав обробку
      text_en: It is permanently deleted from the queue, because the consumer already received it and began processing
    - text: Воно лишиться заблокованим, доки адміністратор не зніме блокування вручну через портал Azure
      text_en: It stays locked until an administrator releases the lock manually through the Azure portal
    - text: Воно одразу потрапить у dead-letter чергу після першого ж збою обробки без повторних спроб
      text_en: It goes to the dead-letter queue immediately after the first processing failure with no retries
    explanation: |
      Блокування лише тимчасово ховає повідомлення від інших споживачів. Після спливання воно повертається в чергу, а кожна невдала спроба збільшує лічильник доставок. Видаляє повідомлення саме режим ReceiveAndDelete, а не PeekLock.
    explanation_en: |
      The lock only temporarily hides the message from other consumers. After it expires the message returns to the queue, and each failed attempt increases the delivery count. It is ReceiveAndDelete mode, not PeekLock, that deletes the message.
    sources:
    - https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-transfers-locks-settlement#peeklock
  - id: azure-008
    level: middle
    type: single
    text: Чим user-assigned managed identity відрізняється від system-assigned?
    text_en: How does a user-assigned managed identity differ from a system-assigned one?
    options:
    - text: Вона є окремим ресурсом зі своїм життєвим циклом і її можна призначити кільком ресурсам
      text_en: It is a standalone resource with its own lifecycle and can be assigned to multiple resources
      correct: true
    - text: Вона не потребує призначення ролей, бо отримує повний доступ до ресурсів своєї групи ресурсів
      text_en: It needs no role assignments, because it gets full access to the resources of its resource group
    - text: Вона працює лише в межах одного регіону й одного застосунку, до якого її прив'язано
      text_en: It works only within a single region and a single app to which it is attached
    - text: Вона створюється й видаляється разом із ресурсом, до якого привʼязана, і не існує окремо
      text_en: It is created and deleted together with the resource it is attached to and does not exist separately
    explanation: |
      System-assigned ідентичність належить одному ресурсу й зникає разом із ним. User-assigned створюють окремо, тож її зручно ділити між кількома застосунками. Ролі потрібні в обох випадках.
    explanation_en: |
      A system-assigned identity belongs to one resource and disappears with it. A user-assigned one is created separately, so it is convenient to share between several apps. Roles are needed in both cases.
    sources:
    - https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview#managed-identity-types
  - id: azure-009
    level: senior
    type: multiple
    text: Які твердження про захист видалення в Azure Key Vault правильні?
    text_en: Which statements about deletion protection in Azure Key Vault are true?
    options:
    - text: Для нового сховища soft-delete увімкнено за замовчуванням, і вимкнути його не можна
      text_en: For a new vault soft-delete is enabled by default, and it cannot be turned off
      correct: true
    - text: Термін зберігання видаленого можна задати від 7 до 90 днів лише під час створення сховища
      text_en: The retention period for deleted items can be set from 7 to 90 days only when the vault is created
      correct: true
    - text: За ввімкненого purge protection видалене сховище чи обʼєкт не можна остаточно видалити до кінця терміну зберігання
      text_en: With purge protection enabled, a deleted vault or object cannot be permanently deleted until the retention period ends
      correct: true
    - text: Власник підписки може будь-коли вимкнути purge protection, якщо потрібно швидко звільнити імʼя
      text_en: A subscription owner can turn off purge protection at any time if the name must be freed quickly
    explanation: |
      Soft-delete лишає видалене відновним, а purge protection забороняє навіть привілейованим користувачам очистити його раніше. Імʼя видаленого сховища не можна використати повторно, доки не мине термін, тому «звільнити імʼя» вимкненням захисту не вийде.
    explanation_en: |
      Soft-delete keeps deleted items recoverable, and purge protection prevents even privileged users from purging them early. The name of a deleted vault cannot be reused until the period ends, so turning protection off will not "free the name".
    sources:
    - https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
  - id: azure-010
    level: senior
    type: single
    text: Відправник надіслав повідомлення в Service Bus, отримав тайм-аут і не знає, чи воно прийняте. Що найнадійніше уникне дубліката в черзі при повторній відправці?
    text_en: A sender sent a message to Service Bus, got a timeout, and does not know whether it was accepted. What most reliably avoids a duplicate in the queue on resend?
    options:
    - text: Увімкнути duplicate detection на черзі й повторно надіслати з тим самим `MessageId`
      text_en: Enable duplicate detection on the queue and resend with the same `MessageId`
      correct: true
    - text: Перейти з PeekLock на ReceiveAndDelete у споживача, щоб повідомлення не оброблялося двічі
      text_en: Switch the consumer from PeekLock to ReceiveAndDelete so the message is not processed twice
    - text: Збільшити Max Delivery Count черги, щоб брокер не відкидав повторні спроби доставки
      text_en: Increase the queue's Max Delivery Count so the broker does not reject repeated delivery attempts
    - text: Надсилати кожну спробу з новим `MessageId`, щоб кожне повідомлення було унікальним у черзі
      text_en: Send each attempt with a new `MessageId` so every message is unique in the queue
    explanation: |
      Duplicate detection відкидає повідомлення з уже баченим `MessageId` у межах заданого вікна. Режим споживача й Max Delivery Count стосуються отримання, а новий `MessageId` якраз робить повтор несхожим на дублікат.
    explanation_en: |
      Duplicate detection drops a message with an already seen `MessageId` within the configured window. The consumer mode and Max Delivery Count concern receiving, and a new `MessageId` makes a retry look unlike a duplicate.
    sources:
    - https://learn.microsoft.com/en-us/azure/service-bus-messaging/duplicate-detection
  - id: azure-011
    level: senior
    type: single
    text: Для обробки подій одного замовлення треба зберегти порядок (FIFO), але паралельно обробляти різні замовлення. Що застосувати в Service Bus?
    text_en: Events of one order must be processed in FIFO order, while different orders must be processed in parallel. What should you use in Service Bus?
    options:
    - text: 'Сесії: `SessionId` = номер замовлення, і одну сесію в кожний момент обробляє один споживач'
      text_en: 'Sessions: `SessionId` = order number, and one session is processed by a single consumer at any moment'
      correct: true
    - text: Кілька конкурентних споживачів на звичайній черзі без сесій, які забирають повідомлення по черзі
      text_en: Several competing consumers on a regular queue without sessions, taking messages in turn
    - text: Окрема тема Service Bus для кожного замовлення з однією підпискою на кожну таку тему
      text_en: A separate Service Bus topic for each order with one subscription per such topic
    - text: Режим ReceiveAndDelete зі збільшеним prefetch, щоб споживач отримував повідомлення пачками
      text_en: ReceiveAndDelete mode with increased prefetch so the consumer receives messages in batches
    explanation: |
      Повідомлення однієї сесії доставляються по порядку й під ексклюзивним блокуванням, а різні сесії обробляються паралельно. Конкурентні споживачі на звичайній черзі порядок не гарантують.
    explanation_en: |
      Messages of one session are delivered in order and under an exclusive lock, while different sessions are processed in parallel. Competing consumers on a regular queue do not guarantee order.
    sources:
    - https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-sessions
  - id: azure-012
    level: senior
    type: single
    text: Команда розгортає нову версію у слот staging, який має рядок підключення до тестової БД, і виконує swap із production. Рядок підключення не позначено як «Deployment slot setting». Що буде після підміни?
    text_en: A team deploys a new version to the staging slot, which has a connection string to a test database, and swaps it with production. The connection string is not marked as "Deployment slot setting". What happens after the swap?
    options:
    - text: Рядок підключення до тестової БД перейде в production разом із вмістом слота
      text_en: The test database connection string moves to production together with the slot content
      correct: true
    - text: Production збереже свій рядок підключення, бо це налаштування середовища
      text_en: Production keeps its own connection string, because it is an environment setting
    - text: Підміна завершиться помилкою через розбіжність налаштувань
      text_en: The swap fails because of a settings mismatch
    - text: Обидва слоти отримають порожній рядок підключення
      text_en: Both slots get an empty connection string
    explanation: |
      Параметри застосунку й рядки підключення за замовчуванням переходять разом із вмістом. Щоб значення лишилося у своєму слоті, його треба позначити як slot setting. Через це перевіряють налаштування перед підміною.
    explanation_en: |
      App settings and connection strings are swapped along with the content by default. For a value to stay in its slot, it must be marked as a slot setting. This is why settings are checked before a swap.
    sources:
    - https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots#which-settings-are-swapped
    - https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots#make-an-app-setting-unswappable
  - id: azure-013
    level: junior
    type: single
    text: Для чого в Azure використовують групу ресурсів (resource group)?
    text_en: What is a resource group used for in Azure?
    options:
    - text: Контейнер пов'язаних ресурсів з одним життєвим циклом, що розгортаються й видаляються разом
      text_en: A container of related resources with one lifecycle, deployed and deleted together
      correct: true
    - text: Фізично ізольована мережа в одному дата-центрі, у якій ресурси застосунку спілкуються лише між собою
      text_en: A physically isolated network inside one datacenter in which the application's resources talk only to each other
    - text: Окремий регіон дата-центрів Azure, який ділять усі підписки одного клієнта організації
      text_en: A separate Azure datacenter region shared by all subscriptions of one customer organization
    - text: Набір віртуальних машин, на якому Azure запускає всі сервіси підписки
      text_en: A set of virtual machines on which Azure runs all services of a subscription
    explanation: |
      Група ресурсів — логічний контейнер для керування: розгортання, права й видалення застосовують до всієї групи. Вона не створює мережевої ізоляції й не є регіоном чи набором машин.
    explanation_en: |
      A resource group is a logical container for management: deployment, access and deletion apply to the whole group. It provides no network isolation and is neither a region nor a set of machines.
    sources:
    - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview#resource-groups
  - id: azure-014
    level: junior
    type: single
    text: Blob в Azure Blob Storage перебуває на рівні доступу Archive. Що потрібно зробити, щоб його прочитати?
    text_en: A blob in Azure Blob Storage is in the Archive access tier. What must be done to read it?
    options:
    - text: Спершу виконати rehydrate у онлайн-рівень (Hot, Cool або Cold), що може тривати години
      text_en: First rehydrate it to an online tier (Hot, Cool or Cold), which can take hours
      correct: true
    - text: Нічого, Archive читається так само, як Hot, лише з вищою вартістю читання
      text_en: Nothing, Archive reads like Hot, just with a higher read cost
    - text: Звернутися до служби підтримки Azure, щоб вона вручну повернула дані з архіву
      text_en: Contact Azure support so they restore the data from the archive manually
    - text: Перенести обліковий запис сховища в іншу підписку, тоді blob стане доступним
      text_en: Move the storage account to another subscription, after which the blob becomes available
    explanation: |
      Blob у рівні Archive офлайн: його не можна читати чи змінювати, доки його не повернуть (rehydrate) у Hot, Cool або Cold. Доступними лишаються лише метадані.
    explanation_en: |
      A blob in the Archive tier is offline: it cannot be read or modified until it is rehydrated to Hot, Cool or Cold. Only its metadata stays readable.
    sources:
    - https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview#archive-access-tier
  - id: azure-015
    level: junior
    type: single
    text: Повідомлення черги Service Bus (PeekLock) споживач раз у раз відхиляє через Abandon, і лічильник доставок перевищує максимум. Що станеться з повідомленням?
    text_en: A consumer keeps rejecting a Service Bus queue message (PeekLock) with Abandon, and the delivery count exceeds the maximum. What happens to the message?
    options:
    - text: Воно йде в dead-letter queue цієї черги з причиною `MaxDeliveryCountExceeded`
      text_en: It goes to the dead-letter queue of this queue with reason `MaxDeliveryCountExceeded`
      correct: true
    - text: Його мовчки видаляють із черги, щоб воно більше не блокувало інші повідомлення
      text_en: It is silently deleted from the queue so that it no longer blocks other messages
    - text: Воно лишається в черзі, і доставка повторюється без обмеження, поки його не оброблять
      text_en: It stays in the queue and delivery is retried without limit until it is processed
    - text: Воно переходить до спільної черги недоставлених повідомлень усього простору імен
      text_en: It goes to a shared dead-letter queue of the whole namespace
    explanation: |
      Ліміт спроб доставки діє для кожної черги чи підписки. Після його перевищення брокер не видаляє повідомлення, а кладе в підчергу DLQ цієї сутності, щоб його можна було розібрати окремо.
    explanation_en: |
      The delivery attempt limit applies per queue or subscription. When it is exceeded, the broker does not delete the message but puts it into the DLQ sub-queue of that entity so it can be examined separately.
    sources:
    - https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-dead-letter-queues#maximum-delivery-count
  - id: azure-016
    level: junior
    type: multiple
    text: Які твердження про Azure RBAC правильні?
    text_en: Which statements about Azure RBAC are correct?
    options:
    - text: Призначення ролі складається з суб'єкта безпеки, визначення ролі та області дії (scope)
      text_en: A role assignment consists of a security principal, a role definition and a scope
      correct: true
    - text: Роль, призначена на рівні групи ресурсів, діє й на ресурси всередині цієї групи
      text_en: A role assigned at resource group level also applies to the resources inside that group
      correct: true
    - text: Доступ відкликають, видаливши відповідне призначення ролі
      text_en: Access is revoked by removing the corresponding role assignment
      correct: true
    - text: Ролі можна призначати лише на рівні підписки, а не на окремій групі ресурсів
      text_en: Roles can be assigned only at subscription level, not on an individual resource group
    - text: Призначення на вищому рівні потрібно окремо повторити для кожного вкладеного ресурсу
      text_en: An assignment at a higher level must be repeated separately for every nested resource
    explanation: |
      Ролі призначають на рівнях management group, підписки, групи ресурсів і ресурсу, а нижчі рівні успадковують права вищих. Тому повторювати призначення для вкладених ресурсів не потрібно.
    explanation_en: |
      Roles can be assigned at management group, subscription, resource group and resource level, and lower levels inherit permissions from higher ones. So there is no need to repeat the assignment for nested resources.
    sources:
    - https://learn.microsoft.com/en-us/azure/role-based-access-control/overview#how-azure-rbac-works
    - https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview#scope-levels
  - id: azure-017
    level: middle
    type: single
    text: App Service читає секрет через app setting із посиланням Key Vault reference (`@Microsoft.KeyVault(...)`). Значення не підставляється. Що обов'язково має бути налаштовано?
    text_en: App Service reads a secret through an app setting with a Key Vault reference (`@Microsoft.KeyVault(...)`). The value is not resolved. What must be configured?
    options:
    - text: Керована ідентичність застосунку з правом читати секрети цього сховища (наприклад, роль Key Vault Secrets User)
      text_en: The app's managed identity with permission to read that vault's secrets (e.g. Key Vault Secrets User)
      correct: true
    - text: Рядок підключення до Key Vault у коді застосунку, який читає значення під час старту
      text_en: A Key Vault connection string in the application code that reads the value at startup
    - text: Роль Owner для групи ресурсів, у якій лежить сховище, призначена користувачу, що розгортав застосунок
      text_en: The Owner role on the resource group containing the vault, assigned to the user who deployed the app
    - text: Окремий слот розгортання, у якому секрети відокремлені від production
      text_en: A separate deployment slot in which the secrets are isolated from production
    explanation: |
      Платформа сама розв'язує посилання, звертаючись до сховища від імені ідентичності застосунку (за замовчуванням system-assigned). Без дозволу читання секретів ця ідентичність отримає відмову. Код і права користувача, який розгортав застосунок, тут не беруть участі.
    explanation_en: |
      The platform resolves the reference itself by calling the vault as the app's identity (system-assigned by default). Without permission to read secrets that identity is denied. Application code and the permissions of the deploying user are not involved.
    sources:
    - https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
  - id: azure-018
    level: middle
    type: single
    text: До підписки на тему Service Bus додали SQL-правило `Region = 'EU'`, але правило за замовчуванням (true-фільтр), створене разом із підпискою, не видалили. Які повідомлення отримує підписка?
    text_en: A SQL rule `Region = 'EU'` was added to a Service Bus topic subscription, but the default rule (a true filter) created with the subscription was not removed. Which messages does the subscription receive?
    options:
    - text: Усі повідомлення теми, бо true-фільтр і далі пропускає все
      text_en: All messages of the topic, because the true filter still lets everything through
      correct: true
    - text: Лише повідомлення з `Region = 'EU'`, бо нове правило замінює правило за замовчуванням
      text_en: Only messages with `Region = 'EU'`, because the new rule replaces the default rule
    - text: Жодного, бо два правила з різними умовами суперечать одне одному
      text_en: None, because two rules with different conditions contradict each other
    - text: Лише повідомлення без властивості `Region`, бо їх пропускає тільки true-фільтр
      text_en: Only messages without a `Region` property, because only the true filter lets them through
    explanation: |
      Підписка отримує повідомлення, що підійшло хоча б під одне правило, а правило за замовчуванням вибирає все. Щоб фільтрувати лише за `Region`, його треба видалити або замінити.
    explanation_en: |
      A subscription gets a message that matches at least one rule, and the default rule selects everything. To filter only by `Region`, it must be removed or replaced.
    sources:
    - https://learn.microsoft.com/en-us/azure/service-bus-messaging/topic-filters
  - id: azure-019
    level: middle
    type: multiple
    text: Які твердження про `DefaultAzureCredential` із Azure SDK для .NET правильні?
    text_en: Which statements about `DefaultAzureCredential` in the Azure SDK for .NET are correct?
    options:
    - text: Пробує джерела облікових даних по черзі, доки одне не поверне токен
      text_en: Tries credential sources in order until one returns a token
      correct: true
    - text: Локально він може використати вхід, виконаний командою `az login` в Azure CLI
      text_en: Locally it can use the sign-in made with the `az login` command of the Azure CLI
      correct: true
    - text: Ланцюжок можна звузити, виключивши зайві облікові дані, або замінити власним `ChainedTokenCredential`
      text_en: The chain can be narrowed by excluding unneeded credentials, or replaced by your own `ChainedTokenCredential`
      correct: true
    - text: Викликає всі джерела одночасно, а потім об'єднує отримані від них токени в один токен доступу
      text_en: Calls all sources at the same time and then merges the tokens received from them into one access token
    - text: Працює лише разом із рядком підключення чи ключем доступу, записаним у коді застосунку
      text_en: Works only together with a connection string or access key stored in the application code
    explanation: |
      Це наперед налаштований ланцюжок (змінні середовища, керована ідентичність, засоби розробника тощо): перший успішний варіант дає токен, решту не викликають. Тому той самий код працює і локально, і в Azure без секретів у коді.
    explanation_en: |
      It is a preconfigured chain (environment variables, managed identity, developer tools and so on): the first successful option provides the token and the rest are not called. That is why the same code works both locally and in Azure without secrets in code.
    sources:
    - https://learn.microsoft.com/en-us/dotnet/azure/sdk/authentication/credential-chains#defaultazurecredential-overview
  - id: azure-020
    level: middle
    type: single
    text: HTTP-функція на плані Consumption майже не викликається, і перший запит після простою помітно повільніший. Що на рівні плану прибирає цю затримку?
    text_en: An HTTP function on the Consumption plan is rarely called, and the first request after idle is noticeably slower. What at the plan level removes this delay?
    options:
    - text: План Premium з always ready інстансами, які тримають застосунок завантаженим
      text_en: The Premium plan with always ready instances that keep the app loaded
      correct: true
    - text: Збільшити тайм-аут функції в `host.json`, щоб перший виклик встиг прогрітися
      text_en: Increase the function timeout in `host.json` so the first call has time to warm up
    - text: Додати вихідну прив'язку до кожної функції, щоб платформа кешувала середовище виконання
      text_en: Add an output binding to every function so the platform caches the runtime
    - text: Перейти з HTTP-тригера на тригер таймера з інтервалом у хвилину
      text_en: Switch from the HTTP trigger to a timer trigger with a one-minute interval
    explanation: |
      Холодний старт виникає, коли план масштабується до нуля й для виклику створюють новий інстанс. Premium тримає always ready та прогріті (prewarmed) інстанси. Тайм-аут і прив'язки час створення інстанса не змінюють.
    explanation_en: |
      A cold start happens when the plan scales to zero and a new instance has to be created for the call. Premium keeps always ready and prewarmed instances. The timeout and bindings do not change instance creation time.
    sources:
    - https://learn.microsoft.com/en-us/azure/azure-functions/functions-premium-plan#eliminate-cold-starts
  - id: azure-021
    level: senior
    type: single
    text: Сховище Key Vault працює з моделлю access policies, і застосунки читають із нього секрети. Адміністратор перемикає модель дозволів на Azure RBAC, не призначивши ролей. Що станеться?
    text_en: A Key Vault uses the access policy model and applications read secrets from it. An administrator switches the permission model to Azure RBAC without assigning any roles. What happens?
    options:
    - text: Access policies перестають діяти, і застосунки втрачають доступ до секретів, доки не отримають ролі
      text_en: Access policies stop applying, and applications lose access to secrets until they get roles
      correct: true
    - text: Access policies автоматично перетворюються на еквівалентні призначення ролей для тих самих ідентичностей
      text_en: Access policies are automatically converted into equivalent role assignments for the same identities
    - text: 'Обидві моделі діють разом: доступ надається, якщо його дозволяє хоча б одна з двох'
      text_en: 'Both models apply together: access is granted if at least one of them allows it'
    - text: Перемикання блокується, доки в сховищі лишається хоча б одна access policy
      text_en: The switch is blocked while at least one access policy remains in the vault
    explanation: |
      Модель дозволів одна на сховище: після ввімкнення RBAC access policies ігноруються, автоматичної міграції немає. Це типова причина аварій під час переходу, тому спершу призначають ролі.
    explanation_en: |
      A vault has a single permission model: once RBAC is enabled, access policies are ignored and there is no automatic migration. This is a typical cause of outages during migration, so roles are assigned first.
    sources:
    - https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
    - https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-migration
  - id: azure-022
    level: senior
    type: multiple
    text: Які підходи правильні в коді orchestrator-функції Durable Functions, який відтворюється (replay) після кожного очікування?
    text_en: Which approaches are correct in Durable Functions orchestrator code, which is replayed after every await?
    options:
    - text: Брати поточний час із властивості контексту оркестрації (`CurrentUtcDateTime`), а не з `DateTime.UtcNow`
      text_en: Take the current time from the orchestration context property (`CurrentUtcDateTime`) instead of `DateTime.UtcNow`
      correct: true
    - text: Генерувати ідентифікатори через `context.NewGuid()`, а не `Guid.NewGuid()`
      text_en: Generate identifiers with `context.NewGuid()` instead of `Guid.NewGuid()`
      correct: true
    - text: Виконувати звернення до зовнішніх систем в activity-функціях, а не в самому orchestrator
      text_en: Perform calls to external systems in activity functions, not in the orchestrator itself
      correct: true
    - text: Чекати через `Task.Delay`, бо після replay тривалість очікування збережеться
      text_en: Wait using `Task.Delay`, since the wait duration is preserved after a replay
    - text: Викликати `HttpClient` прямо в orchestrator, бо результат запиту записується в історію автоматично
      text_en: Call `HttpClient` directly in the orchestrator, since the result of the request is recorded in the history automatically
    explanation: |
      Orchestrator відтворюють із початку за історією подій, тому його код має бути детермінованим: час, GUID і введення-виведення беруть із контексту чи activity. Для очікування є `context.CreateTimer`, а прямі HTTP-виклики виконувалися б повторно.
    explanation_en: |
      The orchestrator is replayed from the start using the event history, so its code must be deterministic: time, GUIDs and I/O come from the context or from activities. For waiting there is `context.CreateTimer`, while direct HTTP calls would be executed again.
    sources:
    - https://learn.microsoft.com/en-us/azure/azure-functions/durable/durable-functions-code-constraints
  - id: azure-023
    level: senior
    type: multiple
    text: Які твердження про Azure Event Hubs правильні?
    text_en: Which statements about Azure Event Hubs are correct?
    options:
    - text: Різні consumer groups читають той самий потік подій незалежно одна від одної
      text_en: Different consumer groups read the same event stream independently of each other
      correct: true
    - text: Подію видаляє політика зберігання (retention) за часом, а не факт її прочитання споживачем
      text_en: An event is removed by the time-based retention policy, not by a consumer having read it
      correct: true
    - text: 'Події не можна видалити явно: вони зникають лише після спливу періоду зберігання'
      text_en: 'Events cannot be deleted explicitly: they disappear only after the retention period expires'
      correct: true
    - text: Порядок подій гарантується в усьому event hub, незалежно від кількості partitions
      text_en: Event order is guaranteed across the whole event hub, regardless of the number of partitions
    - text: Після підтвердження обробки події споживачем (checkpoint) вона видаляється з partition
      text_en: After a consumer confirms processing of an event (checkpoint), it is deleted from the partition
    explanation: |
      Event Hubs — журнал подій із зберіганням за часом: споживач лише запам'ятовує позицію (offset/checkpoint), а дані лишаються. Порядок визначений лише всередині partition, тому тут працює ключ розподілу, а не глобальна черга.
    explanation_en: |
      Event Hubs is an event log with time-based retention: a consumer only remembers its position (offset/checkpoint) and the data stays. Order is defined only within a partition, so a partition key is used rather than a global queue.
    sources:
    - https://learn.microsoft.com/en-us/azure/event-hubs/event-hubs-features
  - id: azure-024
    level: senior
    type: single
    text: Для глобального вебзастосунку пропонують Azure Traffic Manager, щоб на краю мережі термінувати TLS, застосувати WAF і кешувати відповіді. Чому цей сервіс не підходить для такої задачі?
    text_en: Azure Traffic Manager is proposed for a global web app to terminate TLS at the network edge, apply a WAF and cache responses. Why is this service unsuitable for the task?
    options:
    - text: 'Це DNS-балансувальник: клієнти йдуть до кінцевих точок напряму, трафік через нього не проходить'
      text_en: 'It is a DNS balancer: clients go to endpoints directly and traffic does not pass through it'
      correct: true
    - text: Він працює лише в межах одного регіону Azure й не вміє балансувати трафік між регіонами
      text_en: It works only within a single Azure region and cannot balance traffic across regions
    - text: Він підтримує лише протокол TCP і не розуміє HTTPS-кінцевих точок вебзастосунків
      text_en: It supports only the TCP protocol and does not understand HTTPS endpoints of web apps
    - text: Він вимагає, щоб усі кінцеві точки були віртуальними машинами з публічними адресами в одній підписці
      text_en: It requires all endpoints to be virtual machines with public addresses in the same subscription
    explanation: |
      Traffic Manager лише відповідає на DNS-запити, обираючи кінцеву точку за методом маршрутизації, і HTTP-обмін не бачить. TLS-термінація, WAF і кеш потребують L7-проксі на шляху трафіку, наприклад Azure Front Door.
    explanation_en: |
      Traffic Manager only answers DNS queries, choosing an endpoint by the routing method, and does not see the HTTP exchange. TLS termination, WAF and caching need an L7 proxy in the traffic path, for example Azure Front Door.
    sources:
    - https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-overview
    - https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-faqs
