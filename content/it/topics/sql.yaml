id: sql
title: SQL і реляційні БД
title_en: SQL and relational databases
description: Запити, JOIN, індекси, транзакції, рівні ізоляції, нормалізація, плани виконання.
description_en: Queries, JOIN, indexes, transactions, isolation levels, normalization, execution plans.
draft_en: true
questions:
  - id: sql-001
    level: junior
    type: single
    text: Чим `WHERE` відрізняється від `HAVING`?
    text_en: What is the difference between `WHERE` and `HAVING`?
    options:
      - text: "`WHERE` фільтрує рядки до групування, а `HAVING` — групи після `GROUP BY`"
        text_en: '`WHERE` filters rows before `GROUP BY`, `HAVING` filters the groups'
        correct: true
      - text: Нічим, це синоніми
        text_en: None, they are synonyms
      - text: "`HAVING` працює лише з індексованими колонками"
        text_en: '`HAVING` works only with indexed columns'
      - text: "`WHERE` можна використовувати лише разом з агрегатними функціями"
        text_en: '`WHERE` can be used only together with aggregate functions'
    explanation: >
      `WHERE` відкидає рядки ще до `GROUP BY`, тому агрегатних функцій у ньому бути не може.
      `HAVING` застосовується до вже сформованих груп і зазвичай містить умову з агрегатом, наприклад `HAVING COUNT(*) > 5`.
    explanation_en: >
      `WHERE` discards rows before `GROUP BY`, so it cannot contain aggregate functions. `HAVING` is
      applied to groups that have already been formed and usually contains a condition on an aggregate,
      for example `HAVING COUNT(*) > 5`.

  - id: sql-002
    level: junior
    type: single
    text: Скільки рядків поверне цей запит?
    text_en: How many rows does this query return?
    code:
      lang: sql
      source: |
        -- customers (id, name): (1, 'Ann'), (2, 'Bob'), (3, 'Eve')
        -- orders (id, customer_id): (10, 1), (11, 1), (12, 2)
        SELECT c.name, o.id
        FROM customers c
        LEFT JOIN orders o ON o.customer_id = c.id;
    options:
      - text: "`4`"
        text_en: '`4`'
        correct: true
      - text: "`3`"
        text_en: '`3`'
      - text: "`5`"
        text_en: '`5`'
      - text: "`9`"
        text_en: '`9`'
    explanation: >
      `LEFT JOIN` повертає кожен рядок лівої таблиці з усіма відповідними рядками правої: Ann двічі, Bob один раз.
      Eve замовлень не має, тож потрапляє в результат один раз, з `NULL` замість `o.id`.
    explanation_en: >
      `LEFT JOIN` returns every row of the left table together with all matching rows of the right table:
      Ann twice, Bob once. Eve has no orders, so she appears in the result once, with `NULL` in place of
      `o.id`.

  - id: sql-003
    level: junior
    type: multiple
    text: Які твердження про `NULL` у SQL правильні?
    text_en: Which statements about `NULL` in SQL are true?
    options:
      - text: "`NULL = NULL` дає не `TRUE`, а `NULL` (невідомо)"
        text_en: '`NULL = NULL` yields `NULL` (unknown), not `TRUE`'
        correct: true
      - text: Перевіряти значення на `NULL` треба через `IS NULL` або `IS NOT NULL`
        text_en: Test a value for `NULL` with `IS NULL` or `IS NOT NULL`
        correct: true
      - text: "`COUNT(email)` не рахує рядки, де `email` дорівнює `NULL`"
        text_en: '`COUNT(email)` does not count rows where `email` is `NULL`'
        correct: true
      - text: "`COUNT(*)` пропускає рядки, у яких є хоч один `NULL`"
        text_en: '`COUNT(*)` skips rows that have at least one `NULL`'
      - text: "`WHERE email <> 'a@b.c'` поверне й рядки, де `email` дорівнює `NULL`"
        text_en: '`WHERE email <> ''a@b.c''` also returns rows where `email` is `NULL`'
    explanation: >
      Звичайне порівняння з `NULL` дає `NULL`, а `WHERE` пропускає лише рядки з `TRUE`, тому для `NULL` є `IS NULL`.
      `COUNT(column)` рахує лише значення, відмінні від `NULL`, а `COUNT(*)` — усі рядки.
    explanation_en: >
      An ordinary comparison with `NULL` yields `NULL`, and `WHERE` keeps only rows where the condition is
      `TRUE`, which is why `IS NULL` exists. `COUNT(column)` counts only non-`NULL` values, while
      `COUNT(*)` counts all rows.

  - id: sql-004
    level: junior
    type: single
    text: Що гарантує обмеження `PRIMARY KEY`?
    text_en: What does the `PRIMARY KEY` constraint guarantee?
    options:
      - text: Значення ключа унікальні й не `NULL`; PostgreSQL створює для нього індекс
        text_en: Key values are unique and not `NULL`; PostgreSQL creates an index for it
        correct: true
      - text: Лише унікальність значень, а один або кілька `NULL` у ключі дозволено стандартом
        text_en: Only uniqueness of values, and one or more `NULL`s in the key are allowed by the standard
      - text: Рядки фізично зберігаються на диску відсортованими за значенням ключа завжди
        text_en: Rows are always physically stored on disk sorted by the key value
      - text: Значення ключа база автоматично генерує, навіть якщо його не вказано
        text_en: The database automatically generates the key value even if none is given
    explanation: >
      Первинний ключ — це `UNIQUE` разом із `NOT NULL`, і в таблиці він може бути лише один.
      PostgreSQL створює для нього унікальний індекс, але порядок рядків у таблиці від цього не залежить,
      а автогенерацію значень задають окремо, наприклад `GENERATED ALWAYS AS IDENTITY`.
    explanation_en: >
      A primary key is `UNIQUE` together with `NOT NULL`, and a table can have only one. PostgreSQL
      creates a unique index for it, but the order of rows in the table does not depend on that, and value
      generation is specified separately, for example `GENERATED ALWAYS AS IDENTITY`.

  - id: sql-005
    level: middle
    type: single
    text: >
      На колонці `email` таблиці `users` є звичайний B-tree індекс. Як зробити, щоб запит
      `SELECT * FROM users WHERE lower(email) = 'ann@example.com'` міг використати індекс?
    text_en: The `users` table has a regular B-tree index on the `email` column. What makes the query `SELECT * FROM users WHERE lower(email) = 'ann@example.com'` able to use an index?
    options:
      - text: "Створити індекс за виразом: `CREATE INDEX ON users (lower(email));`"
        text_en: 'Create an expression index: `CREATE INDEX ON users (lower(email));`'
        correct: true
      - text: "Нічого не робити: PostgreSQL сам застосує індекс на `email` до `lower(email)`"
        text_en: 'Do nothing: PostgreSQL itself applies the index on `email` before `lower(email)`'
      - text: "Замінити `=` на `LIKE`"
        text_en: Replace `=` with `LIKE`
      - text: "Виконати `VACUUM users`"
        text_en: Run `VACUUM users`
    explanation: >
      Індекс на `email` зберігає самі значення колонки, а умова порівнює результат функції, тож цей індекс їй не підходить.
      Індекс за виразом `lower(email)` зберігає саме результат функції, і запит з тим самим виразом може ним скористатися.
    explanation_en: >
      The index on `email` stores the column values themselves, while the condition compares the result of
      a function, so this index does not fit it. An expression index on `lower(email)` stores the function
      result, and a query with the same expression can use it.

  - id: sql-006
    level: middle
    type: multiple
    text: Які аномалії можливі в PostgreSQL на рівні ізоляції `READ COMMITTED`?
    text_en: Which anomalies are possible in PostgreSQL at the `READ COMMITTED` isolation level?
    options:
      - text: Неповторюване читання (non-repeatable read)
        text_en: Non-repeatable read of a row
        correct: true
      - text: Фантомне читання (phantom read)
        text_en: Phantom read of new rows
        correct: true
      - text: Аномалія серіалізації (serialization anomaly)
        text_en: Serialization anomaly of transactions
        correct: true
      - text: Брудне читання (dirty read) чужих змін
        text_en: Dirty read of others' changes
    explanation: >
      У `READ COMMITTED` кожна команда бачить дані, зафіксовані до її початку, тож два однакові `SELECT`
      в одній транзакції можуть повернути різне. Незафіксованих змін інших транзакцій PostgreSQL не показує
      на жодному рівні ізоляції, тому брудного читання в ньому не буває.
    explanation_en: >
      In `READ COMMITTED` each command sees data committed before it began, so two identical `SELECT`s in
      one transaction can return different results. PostgreSQL does not show uncommitted changes of other
      transactions at any isolation level, so dirty reads cannot happen there.

  - id: sql-007
    level: middle
    type: single
    text: >
      У відділі три співробітники: двоє мають однакову найвищу зарплату, третій — меншу.
      Які значення `r` вони отримають?
    text_en: 'A department has three employees: two have the same highest salary and the third has a lower one. What values of `r` will they get?'
    code:
      lang: sql
      source: |
        SELECT name,
               RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS r
        FROM employees;
    options:
      - text: "`1, 1, 3`"
        text_en: '`1, 1, 3`'
        correct: true
      - text: "`1, 2, 3`"
        text_en: '`1, 2, 3`'
      - text: "`1, 1, 2`"
        text_en: '`1, 1, 2`'
      - text: "`1, 1, 1`"
        text_en: '`1, 1, 1`'
    explanation: >
      `RANK()` дає однаковим значенням однаковий ранг і пропускає наступні номери, тому після двох перших іде 3.
      Без пропусків (`1, 1, 2`) нумерує `DENSE_RANK()`, а `ROW_NUMBER()` нумерує всі рядки підряд (`1, 2, 3`).
    explanation_en: >
      `RANK()` gives equal values the same rank and skips the following numbers, so after the first two
      comes 3. `DENSE_RANK()` numbers without gaps (`1, 1, 2`), and `ROW_NUMBER()` numbers all rows
      consecutively (`1, 2, 3`).

  - id: sql-008
    level: middle
    type: single
    text: Чим `EXPLAIN ANALYZE` відрізняється від `EXPLAIN` у PostgreSQL?
    text_en: How does `EXPLAIN ANALYZE` differ from `EXPLAIN` in PostgreSQL?
    options:
      - text: "`EXPLAIN ANALYZE` виконує запит і показує фактичний час і кількість рядків"
        text_en: '`EXPLAIN ANALYZE` executes the query and shows actual time and row counts'
        correct: true
      - text: Нічим, це синоніми, а `ANALYZE` лише додає до виводу колір і нумерацію
        text_en: Nothing, they are synonyms, and `ANALYZE` only adds color and numbering to the output
      - text: "Перед побудовою плану оновлює статистику таблиці, як команда `ANALYZE`"
        text_en: Updates the table statistics before building the plan, like the `ANALYZE` command
      - text: Показує план без виконання запиту, але точніший, бо враховує кеш
        text_en: Shows the plan without executing the query, but more accurate because it accounts for the cache
    explanation: >
      `EXPLAIN` лише показує план з оцінками планувальника, а з `ANALYZE` запит виконується, і видно фактичні значення.
      Тому `INSERT`, `UPDATE` чи `DELETE` під `EXPLAIN ANALYZE` справді змінять дані, якщо не обгорнути їх
      у транзакцію з `ROLLBACK`.
    explanation_en: >
      `EXPLAIN` only shows the plan with the planner's estimates, while with `ANALYZE` the query is
      executed and actual values are shown. So `INSERT`, `UPDATE` or `DELETE` under `EXPLAIN ANALYZE`
      really change data unless wrapped in a transaction with `ROLLBACK`.

  - id: sql-009
    level: senior
    type: single
    text: Яка аномалія ще можлива в PostgreSQL на рівні ізоляції `REPEATABLE READ`?
    text_en: Which anomaly is still possible in PostgreSQL at the `REPEATABLE READ` isolation level?
    options:
      - text: Аномалія серіалізації, як-от write skew
        text_en: Serialization anomaly, such as write skew
        correct: true
      - text: Фантомне читання нових рядків із тією самою умовою
        text_en: Phantom read of new rows matching the same condition
      - text: Неповторюване читання вже прочитаних рядків
        text_en: Non-repeatable read of rows already read
      - text: Брудне читання незафіксованих змін
        text_en: Dirty read of uncommitted changes
    explanation: >
      У PostgreSQL `REPEATABLE READ` працює з одним знімком даних на всю транзакцію, тому неповторюваних
      і фантомних читань там немає, хоча стандарт SQL фантоми на цьому рівні дозволяє.
      Аномалії серіалізації, як-от write skew, виключає лише `SERIALIZABLE`.
    explanation_en: >
      In PostgreSQL `REPEATABLE READ` works with a single data snapshot for the whole transaction, so
      there are no non-repeatable or phantom reads, although the SQL standard allows phantoms at this
      level. Serialization anomalies such as write skew are excluded only by `SERIALIZABLE`.

  - id: sql-010
    level: senior
    type: multiple
    text: Які причини можуть пояснити, чому PostgreSQL не використовує B-tree індекс на колонці з умови `WHERE`?
    text_en: Which reasons can explain why PostgreSQL does not use a B-tree index on a column from the `WHERE` condition?
    options:
      - text: Умова відбирає велику частку рядків таблиці, і послідовне сканування дешевше
        text_en: The condition selects a large share of the table's rows, and a sequential scan is cheaper
        correct: true
      - text: "Умова має вигляд `LIKE '%term'`, тобто шаблон починається з `%`"
        text_en: The condition has the form `LIKE '%term'`, i.e. the pattern starts with `%`
        correct: true
      - text: Статистика застаріла, і планувальник помиляється в оцінці кількості рядків
        text_en: Statistics are stale, and the planner misestimates the number of rows
        correct: true
      - text: Умова — точна рівність за унікальною колонкою у великій таблиці
        text_en: The condition is an exact equality on a unique column in a large table
      - text: Сама наявність у таблиці інших індексів забороняє планувальнику брати цей B-tree
        text_en: The mere presence of other indexes on the table forbids the planner from choosing this B-tree
    explanation: >
      Планувальник обирає план за оцінкою вартості: якщо рядків вибирається багато або статистика (`ANALYZE`) неточна,
      послідовне сканування виявляється чи здається дешевшим. B-tree допомагає `LIKE` лише тоді, коли шаблон
      закріплено на початку рядка, як `'term%'`.
    explanation_en: >
      The planner picks a plan by estimated cost: if many rows are selected or statistics (`ANALYZE`) are
      inaccurate, a sequential scan is, or seems, cheaper. A B-tree helps `LIKE` only when the pattern is
      anchored at the start of the string, as in `'term%'`.

  - id: sql-011
    level: senior
    type: single
    text: Запит віддає стрічку постів сторінками. Чому на далеких сторінках він повільний і що краще зробити?
    text_en: A query returns a feed of posts page by page. Why is it slow on far pages, and what is better to do?
    code:
      lang: sql
      source: |
        SELECT id, created_at, title
        FROM posts
        ORDER BY created_at DESC, id DESC
        LIMIT 20 OFFSET 100000;
    options:
      - text: >
          `OFFSET` змушує відкинути 100 000 рядків; краще keyset: `WHERE (created_at, id) < ($1, $2)` з індексом
        text_en: '`OFFSET` discards 100,000 rows; keyset is better: `WHERE (created_at, id) < ($1, $2)` with an index'
        correct: true
      - text: "Повільний через `LIMIT`, його варто замінити на `FETCH FIRST 20 ROWS ONLY`, який працює швидше"
        text_en: It is slow because of `LIMIT`; replace it with `FETCH FIRST 20 ROWS ONLY`, which is faster
      - text: "Допоможе `SELECT DISTINCT`, бо зменшить кількість рядків, які база мусить відкинути"
        text_en: '`SELECT DISTINCT` will help, because it reduces the number of rows the database has to discard'
      - text: "Треба збільшити `work_mem`, і тоді `OFFSET` стане безкоштовним навіть на далеких сторінках"
        text_en: '`work_mem` needs to be increased, and then `OFFSET` becomes free even on far pages'
    explanation: >
      Рядки, пропущені через `OFFSET`, усе одно обчислюються на сервері, тож вартість росте з номером сторінки.
      Keyset-пагінація продовжує з останнього показаного ключа `(created_at, id)` і з відповідним індексом
      читає лише потрібні 20 рядків.
    explanation_en: >
      Rows skipped by `OFFSET` are still computed on the server, so the cost grows with the page number.
      Keyset pagination continues from the last shown key `(created_at, id)` and, with a matching index,
      reads only the 20 needed rows.

  - id: sql-012
    level: senior
    type: multiple
    text: Які твердження про `SELECT … FOR UPDATE` у PostgreSQL правильні?
    text_en: Which statements about `SELECT … FOR UPDATE` in PostgreSQL are true?
    options:
      - text: >
          Блокує вибрані рядки до кінця транзакції: інші не можуть їх змінити, видалити чи так само заблокувати
        text_en: 'Locks the selected rows until the end of the transaction: others cannot modify, delete or lock them in the same way'
        correct: true
      - text: "З `SKIP LOCKED` запит пропускає заблоковані рядки, тож кілька воркерів беруть задачі з однієї таблиці"
        text_en: With `SKIP LOCKED` the query skips locked rows, so several workers can take tasks from one table
        correct: true
      - text: "З `NOWAIT` запит не чекає, а одразу завершується помилкою, якщо рядок уже заблоковано"
        text_en: With `NOWAIT` the query does not wait and fails with an error right away if the row is already locked
        correct: true
      - text: "Блокує рядки й для звичайних `SELECT` інших транзакцій, які чекають на `COMMIT`"
        text_en: Also blocks the rows for plain `SELECT`s of other transactions, which wait for `COMMIT`
      - text: "Блокування знімається одразу після завершення `SELECT`, ще до кінця транзакції, тож тримати його не треба"
        text_en: The lock is released right after the `SELECT` finishes, before the transaction ends, so there is no need to hold it
    explanation: >
      Блокування рядків у PostgreSQL заважають лише тим, хто змінює або блокує ті самі рядки, а звичайне читання їх не помічає.
      `FOR UPDATE` тримає блокування до `COMMIT` чи `ROLLBACK`, а `NOWAIT` і `SKIP LOCKED` визначають лише,
      що робити з уже заблокованими рядками.
    explanation_en: >
      Row locks in PostgreSQL interfere only with those who modify or lock the same rows, while ordinary
      reads do not notice them. `FOR UPDATE` holds the lock until `COMMIT` or `ROLLBACK`, and `NOWAIT` and
      `SKIP LOCKED` only determine what to do with rows that are already locked.
