id: sql
title: SQL і реляційні БД
title_en: SQL and relational databases
description: Запити, JOIN, індекси, транзакції, рівні ізоляції, нормалізація, плани виконання.
description_en: Queries, JOIN, indexes, transactions, isolation levels, normalization, execution plans.
icon: postgresql
questions:
  - id: sql-001
    level: junior
    type: single
    text: Чим `WHERE` відрізняється від `HAVING`?
    text_en: What is the difference between `WHERE` and `HAVING`?
    options:
      - text: "`WHERE` фільтрує рядки до групування, а `HAVING` — групи після `GROUP BY`"
        text_en: '`WHERE` filters rows before `GROUP BY`, `HAVING` filters the groups'
        correct: true
      - text: Нічим, це синоніми
        text_en: Nothing, they are synonyms
      - text: "`HAVING` працює лише з індексованими колонками"
        text_en: '`HAVING` works only with indexed columns'
      - text: "`WHERE` можна використовувати лише разом з агрегатними функціями"
        text_en: '`WHERE` can be used only together with aggregate functions'
    explanation: >
      `WHERE` відкидає рядки ще до `GROUP BY`, тому агрегатних функцій у ньому бути не може.
      `HAVING` застосовується до вже сформованих груп і зазвичай містить умову з агрегатом, наприклад `HAVING COUNT(*) > 5`.
    explanation_en: >
      `WHERE` discards rows before `GROUP BY`, so it cannot contain aggregate functions. `HAVING` is
      applied to groups that have already been formed and usually contains a condition on an aggregate,
      for example `HAVING COUNT(*) > 5`.

  - id: sql-002
    level: junior
    type: single
    text: Скільки рядків поверне цей запит?
    text_en: How many rows does this query return?
    code:
      lang: sql
      source: |
        -- customers (id, name): (1, 'Ann'), (2, 'Bob'), (3, 'Eve')
        -- orders (id, customer_id): (10, 1), (11, 1), (12, 2)
        SELECT c.name, o.id
        FROM customers c
        LEFT JOIN orders o ON o.customer_id = c.id;
    options:
      - text: "`4`"
        text_en: '`4`'
        correct: true
      - text: "`3`"
        text_en: '`3`'
      - text: "`5`"
        text_en: '`5`'
      - text: "`9`"
        text_en: '`9`'
    explanation: >
      `LEFT JOIN` повертає кожен рядок лівої таблиці з усіма відповідними рядками правої: Ann двічі, Bob один раз.
      Eve замовлень не має, тож потрапляє в результат один раз, з `NULL` замість `o.id`.
    explanation_en: >
      `LEFT JOIN` returns every row of the left table together with all matching rows of the right table:
      Ann twice, Bob once. Eve has no orders, so she appears in the result once, with `NULL` in place of
      `o.id`.

  - id: sql-003
    level: junior
    type: multiple
    text: Які твердження про `NULL` у SQL правильні?
    text_en: Which statements about `NULL` in SQL are true?
    options:
      - text: "`NULL = NULL` дає не `TRUE`, а `NULL` (невідомо)"
        text_en: '`NULL = NULL` yields `NULL` (unknown), not `TRUE`'
        correct: true
      - text: Перевіряти значення на `NULL` треба через `IS NULL` або `IS NOT NULL`
        text_en: A value is tested for `NULL` with `IS NULL` or `IS NOT NULL`
        correct: true
      - text: "`COUNT(email)` не рахує рядки, де `email` дорівнює `NULL`"
        text_en: '`COUNT(email)` does not count rows where `email` is `NULL`'
        correct: true
      - text: "`COUNT(*)` пропускає рядки, у яких є хоч один `NULL`"
        text_en: '`COUNT(*)` skips rows that have at least one `NULL`'
      - text: "`WHERE email <> 'a@b.c'` поверне й рядки, де `email` дорівнює `NULL`"
        text_en: '`WHERE email <> ''a@b.c''` also returns rows where `email` is `NULL`'
    explanation: >
      Звичайне порівняння з `NULL` дає `NULL`, а `WHERE` пропускає лише рядки з `TRUE`, тому для `NULL` є `IS NULL`.
      `COUNT(column)` рахує лише значення, відмінні від `NULL`, а `COUNT(*)` — усі рядки.
    explanation_en: >
      An ordinary comparison with `NULL` yields `NULL`, and `WHERE` keeps only rows where the condition is
      `TRUE`, which is why `IS NULL` exists. `COUNT(column)` counts only non-`NULL` values, while
      `COUNT(*)` counts all rows.

  - id: sql-004
    level: junior
    type: single
    text: Що гарантує обмеження `PRIMARY KEY`?
    text_en: What does the `PRIMARY KEY` constraint guarantee?
    options:
      - text: Значення ключа унікальні й не `NULL`; PostgreSQL створює для нього індекс
        text_en: Key values are unique and not `NULL`; PostgreSQL creates an index for it
        correct: true
      - text: Лише унікальність значень, а один або кілька `NULL` у ключі дозволено стандартом
        text_en: Only uniqueness of values, and one or more `NULL`s in the key are allowed by the standard
      - text: Рядки фізично зберігаються на диску відсортованими за значенням ключа завжди
        text_en: Rows are always physically stored on disk sorted by the key value
      - text: Значення ключа база автоматично генерує, навіть якщо його не вказано
        text_en: The database automatically generates the key value even if none is given
    explanation: >
      Первинний ключ — це `UNIQUE` разом із `NOT NULL`, і в таблиці він може бути лише один.
      PostgreSQL створює для нього унікальний індекс, але порядок рядків у таблиці від цього не залежить,
      а автогенерацію значень задають окремо, наприклад `GENERATED ALWAYS AS IDENTITY`.
    explanation_en: >
      A primary key is `UNIQUE` together with `NOT NULL`, and a table can have only one. PostgreSQL
      creates a unique index for it, but the order of rows in the table does not depend on that, and value
      generation is specified separately, for example `GENERATED ALWAYS AS IDENTITY`.

  - id: sql-005
    level: middle
    type: single
    text: >
      На колонці `email` таблиці `users` є звичайний B-tree індекс. Як зробити, щоб запит
      `SELECT * FROM users WHERE lower(email) = 'ann@example.com'` міг використати індекс?
    text_en: The `users` table has a regular B-tree index on the `email` column. What makes the query `SELECT * FROM users WHERE lower(email) = 'ann@example.com'` able to use an index?
    options:
      - text: "Створити індекс за виразом: `CREATE INDEX ON users (lower(email));`"
        text_en: 'Create an expression index: `CREATE INDEX ON users (lower(email));`'
        correct: true
      - text: "Нічого не робити: PostgreSQL сам застосує індекс на `email` до `lower(email)`"
        text_en: 'Do nothing: PostgreSQL itself applies the index on `email` to `lower(email)`'
      - text: "Замінити `=` на `LIKE`"
        text_en: Replace `=` with `LIKE`
      - text: "Виконати `VACUUM users`"
        text_en: Run `VACUUM users`
    explanation: >
      Індекс на `email` зберігає самі значення колонки, а умова порівнює результат функції, тож цей індекс їй не підходить.
      Індекс за виразом `lower(email)` зберігає саме результат функції, і запит з тим самим виразом може ним скористатися.
    explanation_en: >
      The index on `email` stores the column values themselves, while the condition compares the result of
      a function, so this index does not fit it. An expression index on `lower(email)` stores the function
      result, and a query with the same expression can use it.

  - id: sql-006
    level: middle
    type: multiple
    text: Які аномалії можливі в PostgreSQL на рівні ізоляції `READ COMMITTED`?
    text_en: Which anomalies are possible in PostgreSQL at the `READ COMMITTED` isolation level?
    options:
      - text: Неповторюване читання (non-repeatable read)
        text_en: Non-repeatable read of a row
        correct: true
      - text: Фантомне читання (phantom read)
        text_en: Phantom read of new rows
        correct: true
      - text: Аномалія серіалізації (serialization anomaly)
        text_en: Serialization anomaly of transactions
        correct: true
      - text: Брудне читання (dirty read) чужих змін
        text_en: Dirty read of others' changes
    explanation: >
      У `READ COMMITTED` кожна команда бачить дані, зафіксовані до її початку, тож два однакові `SELECT`
      в одній транзакції можуть повернути різне. Незафіксованих змін інших транзакцій PostgreSQL не показує
      на жодному рівні ізоляції, тому брудного читання в ньому не буває.
    explanation_en: >
      In `READ COMMITTED` each command sees data committed before it began, so two identical `SELECT`s in
      one transaction can return different results. PostgreSQL does not show uncommitted changes of other
      transactions at any isolation level, so dirty reads cannot happen there.

  - id: sql-007
    level: middle
    type: single
    text: >
      У відділі три співробітники: двоє мають однакову найвищу зарплату, третій — меншу.
      Які значення `r` вони отримають?
    text_en: 'A department has three employees: two have the same highest salary and the third has a lower one. What values of `r` will they get?'
    code:
      lang: sql
      source: |
        SELECT name,
               RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS r
        FROM employees;
    options:
      - text: "`1, 1, 3`"
        text_en: '`1, 1, 3`'
        correct: true
      - text: "`1, 2, 3`"
        text_en: '`1, 2, 3`'
      - text: "`1, 1, 2`"
        text_en: '`1, 1, 2`'
      - text: "`1, 1, 1`"
        text_en: '`1, 1, 1`'
    explanation: >
      `RANK()` дає однаковим значенням однаковий ранг і пропускає наступні номери, тому після двох перших іде 3.
      Без пропусків (`1, 1, 2`) нумерує `DENSE_RANK()`, а `ROW_NUMBER()` нумерує всі рядки підряд (`1, 2, 3`).
    explanation_en: >
      `RANK()` gives equal values the same rank and skips the following numbers, so after the first two
      comes 3. `DENSE_RANK()` numbers without gaps (`1, 1, 2`), and `ROW_NUMBER()` numbers all rows
      consecutively (`1, 2, 3`).

  - id: sql-008
    level: middle
    type: single
    text: Чим `EXPLAIN ANALYZE` відрізняється від `EXPLAIN` у PostgreSQL?
    text_en: How does `EXPLAIN ANALYZE` differ from `EXPLAIN` in PostgreSQL?
    options:
      - text: "`EXPLAIN ANALYZE` виконує запит і показує фактичний час і кількість рядків"
        text_en: '`EXPLAIN ANALYZE` executes the query and shows actual time and row counts'
        correct: true
      - text: Нічим, це синоніми, а `ANALYZE` лише додає до виводу колір і нумерацію
        text_en: Nothing, they are synonyms, and `ANALYZE` only adds color and numbering to the output
      - text: "Перед побудовою плану оновлює статистику таблиці, як команда `ANALYZE`"
        text_en: Updates the table statistics before building the plan, like the `ANALYZE` command
      - text: Показує план без виконання запиту, але точніший, бо враховує кеш
        text_en: Shows the plan without executing the query, but more accurate because it accounts for the cache
    explanation: >
      `EXPLAIN` лише показує план з оцінками планувальника, а з `ANALYZE` запит виконується, і видно фактичні значення.
      Тому `INSERT`, `UPDATE` чи `DELETE` під `EXPLAIN ANALYZE` справді змінять дані, якщо не обгорнути їх
      у транзакцію з `ROLLBACK`.
    explanation_en: >
      `EXPLAIN` only shows the plan with the planner's estimates, while with `ANALYZE` the query is
      executed and actual values are shown. So `INSERT`, `UPDATE` or `DELETE` under `EXPLAIN ANALYZE`
      really change data unless wrapped in a transaction with `ROLLBACK`.

  - id: sql-009
    level: senior
    type: single
    text: Яка аномалія ще можлива в PostgreSQL на рівні ізоляції `REPEATABLE READ`?
    text_en: Which anomaly is still possible in PostgreSQL at the `REPEATABLE READ` isolation level?
    options:
      - text: Аномалія серіалізації, як-от write skew
        text_en: Serialization anomaly, such as write skew
        correct: true
      - text: Фантомне читання нових рядків із тією самою умовою
        text_en: Phantom read of new rows matching the same condition
      - text: Неповторюване читання вже прочитаних рядків
        text_en: Non-repeatable read of rows already read
      - text: Брудне читання незафіксованих змін
        text_en: Dirty read of uncommitted changes
    explanation: >
      У PostgreSQL `REPEATABLE READ` працює з одним знімком даних на всю транзакцію, тому неповторюваних
      і фантомних читань там немає, хоча стандарт SQL фантоми на цьому рівні дозволяє.
      Аномалії серіалізації, як-от write skew, виключає лише `SERIALIZABLE`.
    explanation_en: >
      In PostgreSQL `REPEATABLE READ` works with a single data snapshot for the whole transaction, so
      there are no non-repeatable or phantom reads, although the SQL standard allows phantoms at this
      level. Serialization anomalies such as write skew are excluded only by `SERIALIZABLE`.

  - id: sql-010
    level: senior
    type: multiple
    text: Які причини можуть пояснити, чому PostgreSQL не використовує B-tree індекс на колонці з умови `WHERE`?
    text_en: Which reasons can explain why PostgreSQL does not use a B-tree index on a column from the `WHERE` condition?
    options:
      - text: Умова відбирає велику частку рядків таблиці, і послідовне сканування дешевше
        text_en: The condition selects a large share of the table's rows, and a sequential scan is cheaper
        correct: true
      - text: "Умова має вигляд `LIKE '%term'`, тобто шаблон починається з `%`"
        text_en: The condition has the form `LIKE '%term'`, i.e. the pattern starts with `%`
        correct: true
      - text: Статистика застаріла, і планувальник помиляється в оцінці кількості рядків
        text_en: Statistics are stale, and the planner misestimates the number of rows
        correct: true
      - text: Умова — точна рівність за унікальною колонкою у великій таблиці
        text_en: The condition is an exact equality on a unique column in a large table
      - text: Сама наявність у таблиці інших індексів забороняє планувальнику брати цей B-tree
        text_en: The mere presence of other indexes on the table forbids the planner from choosing this B-tree
    explanation: >
      Планувальник обирає план за оцінкою вартості: якщо рядків вибирається багато або статистика (`ANALYZE`) неточна,
      послідовне сканування виявляється чи здається дешевшим. B-tree допомагає `LIKE` лише тоді, коли шаблон
      закріплено на початку рядка, як `'term%'`.
    explanation_en: >
      The planner picks a plan by estimated cost: if many rows are selected or statistics (`ANALYZE`) are
      inaccurate, a sequential scan is, or seems, cheaper. A B-tree helps `LIKE` only when the pattern is
      anchored at the start of the string, as in `'term%'`.

  - id: sql-011
    level: senior
    type: single
    text: Запит віддає стрічку постів сторінками. Чому на далеких сторінках він повільний і що краще зробити?
    text_en: A query returns a feed of posts page by page. Why is it slow on later pages, and what is better to do?
    code:
      lang: sql
      source: |
        SELECT id, created_at, title
        FROM posts
        ORDER BY created_at DESC, id DESC
        LIMIT 20 OFFSET 100000;
    options:
      - text: >
          `OFFSET` змушує відкинути 100 000 рядків; краще keyset: `WHERE (created_at, id) < ($1, $2)` з індексом
        text_en: '`OFFSET` discards 100,000 rows; keyset is better: `WHERE (created_at, id) < ($1, $2)` with an index'
        correct: true
      - text: "Повільний через `LIMIT`, його варто замінити на `FETCH FIRST 20 ROWS ONLY`, який працює швидше"
        text_en: It is slow because of `LIMIT`; replace it with `FETCH FIRST 20 ROWS ONLY`, which is faster
      - text: "Допоможе `SELECT DISTINCT`, бо зменшить кількість рядків, які база мусить відкинути"
        text_en: '`SELECT DISTINCT` will help, because it reduces the number of rows the database has to discard'
      - text: "Треба збільшити `work_mem`, і тоді `OFFSET` стане безкоштовним навіть на далеких сторінках"
        text_en: '`work_mem` needs to be increased, and then `OFFSET` becomes free even on later pages'
    explanation: >
      Рядки, пропущені через `OFFSET`, усе одно обчислюються на сервері, тож вартість росте з номером сторінки.
      Keyset-пагінація продовжує з останнього показаного ключа `(created_at, id)` і з відповідним індексом
      читає лише потрібні 20 рядків.
    explanation_en: >
      Rows skipped by `OFFSET` are still computed on the server, so the cost grows with the page number.
      Keyset pagination continues from the last shown key `(created_at, id)` and, with a matching index,
      reads only the 20 needed rows.

  - id: sql-012
    level: senior
    type: multiple
    text: Які твердження про `SELECT … FOR UPDATE` у PostgreSQL правильні?
    text_en: Which statements about `SELECT … FOR UPDATE` in PostgreSQL are true?
    options:
      - text: >
          Блокує вибрані рядки до кінця транзакції: інші не можуть їх змінити, видалити чи так само заблокувати
        text_en: 'Locks the selected rows until the end of the transaction: others cannot modify, delete or lock them in the same way'
        correct: true
      - text: "З `SKIP LOCKED` запит пропускає заблоковані рядки, тож кілька воркерів беруть задачі з однієї таблиці"
        text_en: With `SKIP LOCKED` the query skips locked rows, so several workers can take tasks from one table
        correct: true
      - text: "З `NOWAIT` запит не чекає, а одразу завершується помилкою, якщо рядок уже заблоковано"
        text_en: With `NOWAIT` the query does not wait and fails with an error right away if the row is already locked
        correct: true
      - text: "Блокує рядки й для звичайних `SELECT` інших транзакцій, які чекають на `COMMIT`"
        text_en: Also blocks the rows for plain `SELECT`s of other transactions, which wait for `COMMIT`
      - text: "Блокування знімається одразу після завершення `SELECT`, ще до кінця транзакції, тож тримати його не треба"
        text_en: The lock is released right after the `SELECT` finishes, before the transaction ends, so there is no need to hold it
    explanation: >
      Блокування рядків у PostgreSQL заважають лише тим, хто змінює або блокує ті самі рядки, а звичайне читання їх не помічає.
      `FOR UPDATE` тримає блокування до `COMMIT` чи `ROLLBACK`, а `NOWAIT` і `SKIP LOCKED` визначають лише,
      що робити з уже заблокованими рядками.
    explanation_en: >
      Row locks in PostgreSQL interfere only with those who modify or lock the same rows, while ordinary
      reads do not notice them. `FOR UPDATE` holds the lock until `COMMIT` or `ROLLBACK`, and `NOWAIT` and
      `SKIP LOCKED` only determine what to do with rows that are already locked.

  - id: sql-013
    level: junior
    type: single
    text: Чим `UNION` відрізняється від `UNION ALL`?
    text_en: What is the difference between `UNION` and `UNION ALL`?
    options:
      - text: "`UNION` прибирає дублікати рядків у результаті, `UNION ALL` залишає їх усі"
        text_en: '`UNION` removes duplicate rows from the result, `UNION ALL` keeps all of them'
        correct: true
      - text: "`UNION ALL` прибирає дублікати, а `UNION` повертає всі рядки обох запитів"
        text_en: '`UNION ALL` removes duplicates, while `UNION` returns all rows of both queries'
      - text: "`UNION` об'єднує колонки двох запитів поруч, а `UNION ALL` складає їхні рядки один під одним"
        text_en: '`UNION` joins the columns of two queries side by side, while `UNION ALL` stacks their rows one under another'
      - text: "`UNION ALL` дозволяє запитам мати різну кількість колонок, а `UNION` — ні"
        text_en: '`UNION ALL` allows the queries to have different numbers of columns, `UNION` does not'
    explanation: >
      Обидва оператори складають рядки двох запитів і вимагають однакової кількості та сумісних типів колонок.
      `UNION` ще й видаляє повторювані рядки, тому потребує додаткової роботи; якщо дублікати неможливі або не заважають, `UNION ALL` дешевший.
    explanation_en: >
      Both operators stack the rows of two queries and require the same number of columns with compatible types.
      `UNION` also removes repeated rows, so it needs extra work; if duplicates are impossible or harmless,
      `UNION ALL` is cheaper.
    sources:
      - https://www.postgresql.org/docs/18/queries-union.html

  - id: sql-014
    level: junior
    type: multiple
    text: Які твердження про зовнішній ключ (`FOREIGN KEY`) у PostgreSQL правильні?
    text_en: Which statements about a foreign key (`FOREIGN KEY`) in PostgreSQL are true?
    options:
      - text: "Вставка рядка із значенням, якого немає в зв'язаній таблиці, завершується помилкою"
        text_en: Inserting a row with a value that does not exist in the referenced table fails with an error
        correct: true
      - text: "З `ON DELETE CASCADE` видалення батьківського рядка видаляє й підлеглі рядки"
        text_en: With `ON DELETE CASCADE`, deleting a parent row also deletes the child rows
        correct: true
      - text: "Колонка зовнішнього ключа без `NOT NULL` може містити `NULL`, і такий рядок перевірку проходить"
        text_en: A foreign key column without `NOT NULL` may contain `NULL`, and such a row passes the check
        correct: true
      - text: "PostgreSQL сам створює індекс на колонці зовнішнього ключа в підлеглій таблиці"
        text_en: PostgreSQL itself creates an index on the foreign key column in the child table
      - text: "Зовнішній ключ може посилатися на будь-яку колонку батьківської таблиці, навіть без унікальності"
        text_en: A foreign key can reference any column of the parent table, even without uniqueness
    explanation: >
      Зовнішній ключ тримає посилальну цілісність, а `NULL` у ньому означає «зв'язку немає», тому перевірку не запускає.
      Індекс на підлеглій колонці автоматично не створюється, його додають самі, бо без нього видалення батька скануватиме всю підлеглу таблицю.
      Цільові колонки мусять мати `PRIMARY KEY` або `UNIQUE`.
    explanation_en: >
      A foreign key keeps referential integrity, and a `NULL` in it means "no link", so it does not trigger the check.
      An index on the child column is not created automatically; you add it yourself, because without it deleting
      a parent scans the whole child table. The target columns must have `PRIMARY KEY` or `UNIQUE`.
    sources:
      - https://www.postgresql.org/docs/18/ddl-constraints.html#DDL-CONSTRAINTS-FK

  - id: sql-015
    level: junior
    type: single
    text: Що гарантує цей запит у PostgreSQL?
    text_en: What does this query guarantee in PostgreSQL?
    code:
      lang: sql
      source: |
        SELECT id, name
        FROM users
        LIMIT 3;
    options:
      - text: Повертає не більше трьох рядків, але які саме й у якому порядку — не визначено
        text_en: Returns at most three rows, but which ones and in what order is not defined
        correct: true
      - text: Повертає три рядки з найменшими значеннями `id`, бо `id` — первинний ключ
        text_en: Returns the three rows with the smallest `id`, because `id` is the primary key
      - text: Повертає три рядки, які вставили в таблицю першими, бо база зберігає порядок вставки
        text_en: Returns the three rows inserted first, because the database preserves insertion order
      - text: Повертає три рядки в порядку, у якому вони лежать в індексі первинного ключа
        text_en: Returns three rows in the order in which they sit in the primary key index
    explanation: >
      Без `ORDER BY` сервер віддає рядки в довільному порядку, який залежить від плану та фізичного розташування даних і може змінитися.
      Щоб `LIMIT` повертав передбачувану вибірку, потрібне `ORDER BY` за однозначним ключем.
    explanation_en: >
      Without `ORDER BY` the server returns rows in an arbitrary order that depends on the plan and the physical
      layout of the data and may change. For `LIMIT` to return a predictable selection, you need `ORDER BY` on an
      unambiguous key.
    sources:
      - https://www.postgresql.org/docs/18/queries-limit.html
      - https://www.postgresql.org/docs/18/sql-select.html#SQL-ORDERBY

  - id: sql-016
    level: junior
    type: single
    text: Що станеться під час виконання цього запиту в PostgreSQL?
    text_en: What happens when this query is executed in PostgreSQL?
    code:
      lang: sql
      source: |
        -- employees (id, department, name, salary); id is the primary key
        SELECT department, name, COUNT(*)
        FROM employees
        GROUP BY department;
    options:
      - text: "Помилка: колонка `name` не входить у `GROUP BY` і не обгорнута агрегатною функцією"
        text_en: 'Error: column `name` is not in `GROUP BY` and is not wrapped in an aggregate function'
        correct: true
      - text: "Для кожного відділу повернеться ім'я першого знайденого працівника і кількість"
        text_en: For each department the name of the first employee found and the count are returned
      - text: "Запит поверне по рядку на кожного працівника, а `COUNT(*)` дасть `1`"
        text_en: The query returns one row per employee, and `COUNT(*)` gives `1`
      - text: "Колонка `name` дорівнюватиме `NULL`, бо в групі кілька різних значень"
        text_en: Column `name` will be `NULL`, because the group has several different values
    explanation: >
      Після `GROUP BY` у `SELECT` можна брати лише згруповані колонки й агрегати: для групи з кількох працівників незрозуміло, яке ім'я показати.
      Виняток — колонки, що функціонально залежать від згрупованого первинного ключа, але тут групується `department`.
    explanation_en: >
      After `GROUP BY`, `SELECT` may use only grouped columns and aggregates: for a group of several employees it
      is unclear which name to show. The exception is columns functionally dependent on a grouped primary key,
      but here `department` is grouped.
    sources:
      - https://www.postgresql.org/docs/18/queries-table-expressions.html#QUERIES-GROUP

  - id: sql-017
    level: middle
    type: single
    text: Скільки рядків поверне цей запит?
    text_en: How many rows does this query return?
    code:
      lang: sql
      source: |
        -- departments (id, title): (1, 'IT'), (2, 'HR'), (3, 'Ops')
        -- employees (id, department_id, grade): (10, 1, 'senior'), (11, 1, 'junior'), (12, 2, 'junior')
        SELECT d.title, e.id
        FROM departments d
        LEFT JOIN employees e ON e.department_id = d.id
        WHERE e.grade = 'senior';
    options:
      - text: "`1`"
        text_en: '`1`'
        correct: true
      - text: "`3`"
        text_en: '`3`'
      - text: "`4`"
        text_en: '`4`'
      - text: "`2`"
        text_en: '`2`'
    explanation: >
      `LEFT JOIN` спершу зберігає відділи без працівників (Ops) і рядки з `junior`, але `WHERE e.grade = 'senior'` для `NULL` не істинне й відкидає Ops.
      Лишається лише IT з працівником 10, тобто фактично вийшов `INNER JOIN`. Щоб зберегти всі відділи, умову перенесли б у `ON`.
    explanation_en: >
      `LEFT JOIN` first keeps departments without employees (Ops) and the `junior` rows, but `WHERE e.grade = 'senior'`
      is not true for `NULL` and discards Ops. Only IT with employee 10 remains, and the `junior` rows fail the
      condition, so it effectively became an `INNER JOIN`. To keep all departments, the condition would move into `ON`.
    sources:
      - https://www.postgresql.org/docs/18/queries-table-expressions.html#QUERIES-JOIN

  - id: sql-018
    level: middle
    type: single
    text: Скільки рядків поверне цей запит, якщо в `blocked` є рядок із `user_id`, що дорівнює `NULL`?
    text_en: How many rows does this query return if `blocked` has a row whose `user_id` is `NULL`?
    code:
      lang: sql
      source: |
        -- users (id): 1, 2, 3
        -- blocked (user_id): 1, NULL
        SELECT id
        FROM users
        WHERE id NOT IN (SELECT user_id FROM blocked);
    options:
      - text: "Жодного: для `2` і `3` порівняння з `NULL` дає невідомо, тож умова не істинна"
        text_en: 'None: for `2` and `3` the comparison with `NULL` is unknown, so the condition is not true'
        correct: true
      - text: "Два рядки, `2` і `3`: `NULL` у підзапиті просто ігнорується"
        text_en: 'Two rows, `2` and `3`: the `NULL` in the subquery is simply ignored'
      - text: "Три рядки: `NULL` у підзапиті скасовує фільтрацію, і виходять усі користувачі"
        text_en: 'Three rows: the `NULL` in the subquery cancels the filter and all users come out'
      - text: "Помилка виконання: підзапит не може повертати `NULL`"
        text_en: 'Runtime error: a subquery cannot return `NULL`'
    explanation: >
      `id NOT IN (1, NULL)` розкривається в `id <> 1 AND id <> NULL`; для `2` друга частина дає `NULL`, тож весь вираз не `TRUE`.
      Безпечніше написати `NOT EXISTS` з корельованим підзапитом або відфільтрувати `NULL` у підзапиті.
    explanation_en: >
      `id NOT IN (1, NULL)` expands to `id <> 1 AND id <> NULL`; for `2` the second part gives `NULL`, so the whole
      expression is not `TRUE`. It is safer to write `NOT EXISTS` with a correlated subquery or to filter `NULL`
      out of the subquery.
    sources:
      - https://www.postgresql.org/docs/18/functions-subquery.html#FUNCTIONS-SUBQUERY-NOTIN

  - id: sql-019
    level: middle
    type: multiple
    text: Які твердження про `UPDATE` і MVCC у PostgreSQL правильні?
    text_en: Which statements about `UPDATE` and MVCC in PostgreSQL are true?
    options:
      - text: "`UPDATE` створює нову версію рядка, а стара лишається, доки її не приберуть через `VACUUM`"
        text_en: '`UPDATE` creates a new row version, and the old one stays until `VACUUM` removes it'
        correct: true
      - text: Звичайний `SELECT` не чекає на транзакцію, що оновлює ті самі рядки, і бачить їхню попередню версію
        text_en: A plain `SELECT` does not wait for a transaction updating the same rows and sees their previous version
        correct: true
      - text: "Довга відкрита транзакція не дає `VACUUM` прибрати старі версії рядків, і таблиця розпухає"
        text_en: A long-open transaction stops `VACUUM` from removing old row versions, and the table bloats
        correct: true
      - text: "`UPDATE` перезаписує рядок на місці, тому старих версій у таблиці не лишається"
        text_en: '`UPDATE` overwrites the row in place, so no old versions remain in the table'
      - text: "`SELECT` на рівні `READ COMMITTED` чекає, поки транзакція, що оновлює ці рядки, зробить `COMMIT`"
        text_en: A `SELECT` at `READ COMMITTED` waits until the transaction updating these rows does `COMMIT`
    explanation: >
      У MVCC кожен запит бачить знімок даних, тому читання й запис не блокують одне одного, а старі версії потрібні для таких знімків.
      `VACUUM` не може прибрати версії, які ще може бачити якась відкрита транзакція, через що довгі транзакції й призводять до розпухання.
    explanation_en: >
      In MVCC each query sees a snapshot of the data, so reads and writes do not block each other, and old versions
      are needed for such snapshots. `VACUUM` cannot remove versions that some open transaction may still see,
      which is why long transactions lead to bloat.
    sources:
      - https://www.postgresql.org/docs/18/mvcc-intro.html
      - https://www.postgresql.org/docs/18/routine-vacuuming.html

  - id: sql-020
    level: middle
    type: single
    text: >
      Транзакція A оновлює рядок 1, потім рядок 2 таблиці `accounts`, а транзакція B одночасно оновлює рядок 2, потім рядок 1.
      Що станеться в PostgreSQL і як цього уникнути?
    text_en: >
      Transaction A updates row 1 and then row 2 of the `accounts` table, while transaction B at the same time
      updates row 2 and then row 1. What happens in PostgreSQL and how to avoid it?
    options:
      - text: "Виявиться взаємне блокування: одну скасують помилкою, а уникнути допоможе однаковий порядок оновлення"
        text_en: 'A deadlock is detected: one is aborted with an error, and updating rows in the same order avoids it'
        correct: true
      - text: "Обидві транзакції чекатимуть одна одну безкінечно, доки адміністратор не завершить одну з них"
        text_en: Both transactions will wait for each other indefinitely until an administrator terminates one of them
      - text: "Обидві транзакції успішно завершаться, бо MVCC дає кожній власну версію рядків"
        text_en: Both transactions will succeed, because MVCC gives each its own version of the rows
      - text: "Друга транзакція почекає першу й виконається після неї, тож помилок не буде, а порядок не важливий"
        text_en: The second transaction waits for the first and runs after it, so there are no errors and the order does not matter
    explanation: >
      Кожна транзакція тримає блокування рядка, потрібного іншій, тому виникає цикл очікування. PostgreSQL сам його виявляє й перериває одну з транзакцій з помилкою.
      Якщо всі транзакції беруть блокування в однаковому порядку, цикл утворитися не може.
    explanation_en: >
      Each transaction holds a row lock the other needs, so a wait cycle forms. PostgreSQL detects it on its own
      and aborts one of the transactions with an error. If all transactions take locks in the same order,
      a cycle cannot form.
    sources:
      - https://www.postgresql.org/docs/18/explicit-locking.html#LOCKING-DEADLOCKS

  - id: sql-021
    level: senior
    type: single
    text: >
      У PostgreSQL 18 запит використовує `Index Only Scan`, але `EXPLAIN (ANALYZE)` показує `Heap Fetches`, близьке до загальної кількості рядків.
      Таблицю багато оновлювали, а автоочищення на ній вимкнено. Що робити?
    text_en: >
      In PostgreSQL 18 a query uses an `Index Only Scan`, but `EXPLAIN (ANALYZE)` shows `Heap Fetches` close to the total number of rows.
      The table was updated heavily, and autovacuum is disabled on it. What should you do?
    options:
      - text: "Виконати `VACUUM` і ввімкнути автоочищення: сторінки потраплять у карту видимості"
        text_en: 'Run `VACUUM` and enable autovacuum: pages will get into the visibility map'
        correct: true
      - text: "Виконати `ANALYZE`, бо `Heap Fetches` лишається великим через застарілу статистику планувальника"
        text_en: Run `ANALYZE`, because `Heap Fetches` stays high due to stale planner statistics
      - text: "Перебудувати індекс через `REINDEX`, бо він пошкоджений і не може обійтися без читання таблиці"
        text_en: Rebuild the index with `REINDEX`, because it is corrupted and cannot avoid reading the table
      - text: "Додати в індекс усі колонки таблиці, тоді PostgreSQL перестане читати купу зовсім"
        text_en: Add all table columns to the index, then PostgreSQL will stop reading the heap entirely
    explanation: >
      Index-only scan пропускає читання купи лише для сторінок, позначених у карті видимості як повністю видимі, а позначки ставить і скидає `VACUUM` та зміни даних.
      Після інтенсивних оновлень без очищення позначок майже немає, тож для кожного рядка треба перевіряти видимість у купі.
    explanation_en: >
      An index-only scan skips reading the heap only for pages marked all-visible in the visibility map, and those
      marks are set by `VACUUM` and cleared by data changes. After heavy updates without vacuuming there are
      almost no marks, so visibility must be checked in the heap for every row.
    sources:
      - https://www.postgresql.org/docs/18/indexes-index-only-scans.html
      - https://www.postgresql.org/docs/18/routine-vacuuming.html#VACUUM-FOR-VISIBILITY-MAP

  - id: sql-022
    level: senior
    type: multiple
    text: Які твердження про `CREATE INDEX CONCURRENTLY` у PostgreSQL правильні?
    text_en: Which statements about `CREATE INDEX CONCURRENTLY` in PostgreSQL are true?
    options:
      - text: Не блокує вставки, оновлення й видалення в таблиці, поки будується індекс
        text_en: Does not block inserts, updates and deletes on the table while the index is built
        correct: true
      - text: Не може виконуватися всередині блоку транзакції (`BEGIN … COMMIT`)
        text_en: Cannot run inside a transaction block (`BEGIN … COMMIT`)
        correct: true
      - text: Якщо побудова завершилась помилкою, у каталозі лишається недійсний (`INVALID`) індекс, який треба видалити
        text_en: If the build fails, an `INVALID` index remains in the catalog and has to be dropped
        correct: true
      - text: Будується швидше за звичайний `CREATE INDEX`, бо не бере жодних блокувань
        text_en: Builds faster than a plain `CREATE INDEX`, because it takes no locks at all
      - text: Усуває ризик помилки для унікального індексу, навіть якщо в таблиці вже є дублікати
        text_en: Removes the risk of failure for a unique index, even if the table already contains duplicates
    explanation: >
      Режим `CONCURRENTLY` робить два проходи по таблиці й чекає на старі транзакції, тому працює довше й витрачає більше ресурсів, але не блокує запису.
      Невдала побудова (наприклад, через дублікат для `UNIQUE`) лишає недійсний індекс, і його слід видалити та створити знову.
    explanation_en: >
      `CONCURRENTLY` makes two passes over the table and waits for old transactions, so it takes longer and uses
      more resources, but does not block writes. A failed build (for example, because of a duplicate for `UNIQUE`)
      leaves an invalid index, which should be dropped and created again.
    sources:
      - https://www.postgresql.org/docs/18/sql-createindex.html#SQL-CREATEINDEX-CONCURRENTLY

  - id: sql-023
    level: senior
    type: single
    text: >
      У PostgreSQL на рівні `READ COMMITTED` сто сесій одночасно виконують такий запит для того самого `page`, а таблиця `counters` порожня.
      Яким буде значення `hits` після завершення всіх сесій?
    text_en: >
      In PostgreSQL at `READ COMMITTED`, a hundred sessions run this query at the same time for the same `page`, and the `counters` table is empty.
      What will `hits` be after all sessions finish?
    code:
      lang: sql
      source: |
        -- counters (page text PRIMARY KEY, hits int NOT NULL)
        INSERT INTO counters (page, hits)
        VALUES ('home', 1)
        ON CONFLICT (page) DO UPDATE
        SET hits = counters.hits + 1;
    options:
      - text: "`100`: кожна сесія або вставляє рядок, або збільшує наявний, і приріст не губиться"
        text_en: '`100`: each session either inserts the row or increments the existing one, and no increment is lost'
        correct: true
      - text: "Менше за `100`: одночасні сесії читають те саме `hits` і перезаписують чужий приріст"
        text_en: 'Less than `100`: concurrent sessions read the same `hits` and overwrite each other''s increment'
      - text: "`100`, але лише на рівні `SERIALIZABLE`, а на `READ COMMITTED` частину приростів буде втрачено"
        text_en: '`100`, but only at `SERIALIZABLE`; at `READ COMMITTED` some increments will be lost'
      - text: "Частина сесій завершиться помилкою порушення унікальності, тож `hits` буде меншим за `100`"
        text_en: Some sessions will fail with a uniqueness violation, so `hits` will be less than `100`
    explanation: >
      `ON CONFLICT DO UPDATE` гарантує атомарний результат: вставка або оновлення, навіть за високої конкуренції.
      Сесія, що натрапила на конфлікт, чекає на блокування рядка й додає до свіжого значення, тому приріст не губиться й помилки унікальності не буде.
    explanation_en: >
      `ON CONFLICT DO UPDATE` guarantees an atomic outcome: insert or update, even under high concurrency. A session
      that hits a conflict waits for the row lock and adds to the fresh value, so no increment is lost and there is no
      uniqueness error.
    sources:
      - https://www.postgresql.org/docs/18/sql-insert.html#SQL-ON-CONFLICT

  - id: sql-024
    level: senior
    type: single
    text: >
      Щоб прибрати write skew, сервіс перевели на рівень `SERIALIZABLE` у PostgreSQL. Після цього під навантаженням з'явилися помилки
      `could not serialize access` (SQLSTATE `40001`) навіть без явних блокувань. Що правильно?
    text_en: >
      To remove write skew, a service was moved to `SERIALIZABLE` in PostgreSQL. After that, errors
      `could not serialize access` (SQLSTATE `40001`) appeared under load even without explicit locks. What is correct?
    options:
      - text: "Це очікувано: застосунок має повторити всю транзакцію з початку, а самі транзакції варто тримати короткими"
        text_en: 'This is expected: the application must retry the whole transaction from the start, and the transactions should be kept short'
        correct: true
      - text: "Це помилка конфігурації: на `SERIALIZABLE` PostgreSQL блокує й чекає, тож помилок бути не мало б"
        text_en: 'This is a configuration error: at `SERIALIZABLE` PostgreSQL blocks and waits, so there should be no errors'
      - text: "Досить повторити лише оператор, що впав, а попередні оператори транзакції лишаються чинними"
        text_en: It is enough to retry only the statement that failed, while the earlier statements of the transaction remain valid
      - text: "Помилки зникнуть, якщо збільшити `deadlock_timeout`, бо це різновид взаємного блокування"
        text_en: The errors will go away if you increase `deadlock_timeout`, because this is a kind of deadlock
    explanation: >
      `SERIALIZABLE` у PostgreSQL не блокує наперед, а відстежує залежності між транзакціями й скасовує ту, що зробила б результат несеріалізовним.
      Тому застосунок мусить бути готовим повторити транзакцію цілком. Короткі транзакції зменшують імовірність конфліктів.
    explanation_en: >
      `SERIALIZABLE` in PostgreSQL does not block up front; it tracks dependencies between transactions and aborts
      the one that would make the outcome non-serializable. So the application must be ready to retry the
      transaction as a whole. Short transactions reduce the chance of conflicts.
    sources:
      - https://www.postgresql.org/docs/18/mvcc-serialization-failure-handling.html
      - https://www.postgresql.org/docs/18/transaction-iso.html#XACT-SERIALIZABLE
