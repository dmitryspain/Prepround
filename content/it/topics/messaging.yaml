id: messaging
title: Брокери повідомлень
title_en: Message brokers
description: Kafka, RabbitMQ, гарантії доставки, outbox, ідемпотентні консюмери.
description_en: Kafka, RabbitMQ, delivery guarantees, outbox, idempotent consumers.
icon: rabbitmq
questions:
  - id: messaging-001
    level: junior
    type: single
    text: Що таке офсет (offset) у Kafka?
    text_en: What is an offset in Kafka?
    options:
    - text: Порядковий номер запису в межах партиції, за яким споживач відстежує свою позицію
      text_en: A sequence number of a record within a partition, which the consumer uses to track its position
      correct: true
    - text: Унікальний ідентифікатор повідомлення на весь кластер, який призначає брокер-контролер
      text_en: A unique message identifier across the whole cluster, assigned by the controller broker
    - text: Час у мілісекундах, протягом якого запис зберігається в топіку до видалення з диска
      text_en: Time in milliseconds a record is kept in the topic before being deleted from disk
    - text: Номер брокера, який зберігає лідерську репліку партиції в кластері під час запису
      text_en: The number of the broker that holds the leader replica of the partition in the cluster during a write
    explanation: |
      Кожен запис у партиції має послідовний номер, і споживач запам'ятовує (комітить) наступну позицію, з якої читатиме. Офсети рахуються окремо в кожній партиції, тож на весь топік вони не унікальні.
    explanation_en: |
      Every record in a partition has a sequential number, and the consumer remembers (commits) the next position to read from. Offsets are counted separately in each partition, so they are not unique across the whole topic.
    sources:
    - https://kafka.apache.org/44/design/design/#consumerposition
  - id: messaging-002
    level: junior
    type: single
    text: Топік Kafka має 6 партицій, а група споживачів — 3 споживачі. Як розподіляється читання?
    text_en: A Kafka topic has 6 partitions and a consumer group has 3 consumers. How is reading distributed?
    options:
    - text: Кожну партицію в групі читає один споживач, тобто приблизно по 2 партиції на споживача
      text_en: Each partition in the group is read by one consumer, so about 2 partitions per consumer
      correct: true
    - text: Кожен споживач групи читає всі 6 партицій і отримує кожне повідомлення топіку окремо
      text_en: Each consumer in the group reads all 6 partitions and receives every message of the topic separately
    - text: Три партиції лишаються без читача, бо споживачів менше, ніж партицій у топіку
      text_en: Three partitions are left without a reader, because there are fewer consumers than partitions in the topic
    - text: Партиції ділять порівну лише при ввімкненому режимі exactly-once для транзакційних продюсерів
      text_en: Partitions are split evenly only when exactly-once mode is enabled for transactional producers
    explanation: |
      У межах групи партиція призначається одному споживачу, і саме так навантаження масштабується. Кожна інша група споживачів окремо отримає всі повідомлення.
    explanation_en: |
      Within a group, a partition is assigned to a single consumer, and this is how load scales. Every other consumer group separately receives all the messages.
    sources:
    - https://kafka.apache.org/intro/
    - https://kafka.apache.org/44/design/design/#theconsumer
  - id: messaging-003
    level: junior
    type: single
    text: Яку роль відіграє exchange у RabbitMQ?
    text_en: What role does an exchange play in RabbitMQ?
    options:
    - text: Приймає повідомлення від видавця й маршрутизує їх у черги за типом і привʼязками
      text_en: Receives messages from the publisher and routes them to queues according to its type and bindings
      correct: true
    - text: Зберігає повідомлення на диску, доки їх не прочитає споживач або не мине їхній TTL
      text_en: Stores messages on disk until a consumer reads them or their TTL expires
    - text: Розподіляє навантаження між вузлами кластера й реплікує черги на інші вузли автоматично
      text_en: Distributes load between cluster nodes and replicates queues to other nodes automatically
    - text: Перевіряє схему повідомлення перед тим, як воно потрапить у чергу чи буде відкинуте
      text_en: Validates the message schema before it reaches a queue or is rejected
    explanation: |
      Видавець зазвичай публікує в exchange, а не напряму в чергу, і правила маршрутизації залежать від типу exchange (direct, fanout, topic, headers). Зберігають повідомлення самі черги.
    explanation_en: |
      A publisher usually publishes to an exchange rather than directly to a queue, and the routing rules depend on the exchange type (direct, fanout, topic, headers). Messages themselves are stored by queues.
    sources:
    - https://www.rabbitmq.com/docs/exchanges
  - id: messaging-004
    level: junior
    type: single
    text: Що означає гарантія доставки at-least-once?
    text_en: What does the at-least-once delivery guarantee mean?
    options:
    - text: Повідомлення не губиться, але через повторну доставку може бути оброблене повторно
      text_en: A message is not lost, but because of redelivery it may be processed more than once
      correct: true
    - text: Повідомлення може загубитися, але ніколи не буде оброблене двічі навіть при збоях
      text_en: A message may be lost, but it will never be processed twice even during failures
    - text: Повідомлення доставляється й обробляється рівно один раз без винятків за будь-яких збоїв
      text_en: A message is delivered and processed exactly once, without exceptions, under any failure
    - text: Повідомлення гарантовано обробляється в тому порядку, у якому його надіслав видавець
      text_en: A message is guaranteed to be processed in the order in which the publisher sent it
    explanation: |
      Якщо підтвердження обробки не дійшло до брокера, той надсилає повідомлення знову, тому дублікати можливі. Тому споживачі при at-least-once мають бути ідемпотентними. Варіант «може загубитися» описує at-most-once.
    explanation_en: |
      If the processing acknowledgement does not reach the broker, it sends the message again, so duplicates are possible. That is why consumers under at-least-once must be idempotent. The option "may be lost" describes at-most-once.
    sources:
    - https://kafka.apache.org/44/design/design/#semantics
  - id: messaging-005
    level: middle
    type: single
    text: Події одного замовлення треба читати в тому порядку, у якому їх створили. Що забезпечує такий виклик продюсера в Kafka?
    text_en: Events of one order must be read in the order they were created. What does this producer call in Kafka ensure?
    code:
      lang: text
      source: |
        producer.send(
            topic = "orders",
            key   = order.id,
            value = event
        )
    options:
    - text: Події з однаковим ключем потрапляють в одну партицію й читаються в порядку запису
      text_en: Events with the same key land in one partition and are read in the order they were written
      correct: true
    - text: Усі події топіку впорядковуються за ключем між усіма партиціями топіку глобально
      text_en: All events of the topic are globally ordered by key across all partitions of the topic
    - text: Ключ вмикає режим, у якому брокер перевіряє порядок і відхиляє події, що запізнилися
      text_en: The key enables a mode in which the broker checks the order and rejects late events
    - text: Ключ лише допомагає в логуванні й на розподіл подій по партиціях не впливає
      text_en: The key only helps with logging and has no effect on how events are spread across partitions
    explanation: |
      Kafka гарантує порядок лише в межах партиції, а ключ визначає, у яку партицію піде запис. Якщо збільшити кількість партицій, ключі можуть переїхати в інші партиції, і порядок для старих і нових подій не збережеться.
    explanation_en: |
      Kafka guarantees order only within a partition, and the key determines which partition a record goes to. If you increase the number of partitions, keys may move to other partitions, and the order of old and new events will not be preserved.
    sources:
    - https://kafka.apache.org/intro/
  - id: messaging-006
    level: middle
    type: multiple
    text: Які твердження про підтвердження (acknowledgements) у RabbitMQ правильні?
    text_en: Which statements about acknowledgements in RabbitMQ are true?
    options:
    - text: Після закриття каналу повідомлення без підтвердження повертаються в чергу
      text_en: After a channel closes, unacknowledged messages are returned to the queue
      correct: true
    - text: В автоматичному режимі повідомлення при збої споживача можна втратити
      text_en: In automatic mode, messages can be lost if the consumer fails
      correct: true
    - text: Ack споживача й publisher confirms є різними механізмами з різним напрямом
      text_en: Consumer acks and publisher confirms are different mechanisms with different directions
      correct: true
    - text: Виклик `basic.nack` з `requeue=false` повертає повідомлення в чергу
      text_en: Calling `basic.nack` with `requeue=false` returns the message to the queue
    explanation: |
      Ack від споживача підтверджує обробку брокеру, а publisher confirm підтверджує брокером прийняття повідомлення видавцю. Повернення в чергу робить `requeue=true`, а при `false` повідомлення відкидається або йде в dead-letter exchange.
    explanation_en: |
      A consumer ack confirms processing to the broker, while a publisher confirm is the broker confirming to the publisher that it accepted the message. Requeuing is done by `requeue=true`; with `false` the message is discarded or goes to a dead-letter exchange.
    sources:
    - https://www.rabbitmq.com/docs/confirms
  - id: messaging-007
    level: middle
    type: single
    text: Яку гарантію отримує споживач із цим циклом, якщо застосунок аварійно завершиться в `process`?
    text_en: What guarantee does the consumer get with this loop if the application crashes in `process`?
    code:
      lang: text
      source: |
        while true:
            records = consumer.poll()
            consumer.commitSync()        # commit offsets
            for r in records:
                process(r)
    options:
    - text: At-most-once, бо офсети закомічено раніше, тож необроблені записи буде пропущено
      text_en: At-most-once, because offsets were committed earlier, so unprocessed records will be skipped
      correct: true
    - text: At-least-once, бо після перезапуску споживач прочитає ці записи знову з початку
      text_en: At-least-once, because after a restart the consumer will read these records again from the beginning
    - text: Exactly-once, бо `commitSync` виконується синхронно й блокує потік до відповіді брокера
      text_en: Exactly-once, because `commitSync` runs synchronously and blocks the thread until the broker responds
    - text: Жодної зміни, бо Kafka сама повторить доставку записів при збої всередині `process`
      text_en: No change, because Kafka itself will redeliver the records if a failure occurs inside `process`
    explanation: |
      Коміт офсету перед обробкою означає «записи прочитано», тож після збою споживач продовжить із закоміченої позиції. Щоб отримати at-least-once, коміт виконують після успішної обробки (ціною можливих дублікатів).
    explanation_en: |
      Committing the offset before processing means "the records have been read", so after a crash the consumer continues from the committed position. To get at-least-once, commit after successful processing (at the cost of possible duplicates).
    sources:
    - https://kafka.apache.org/44/design/design/#semantics
  - id: messaging-008
    level: middle
    type: multiple
    text: За яких подій RabbitMQ перенаправляє повідомлення в dead letter exchange (за умови, що він налаштований)?
    text_en: On which events does RabbitMQ route a message to a dead letter exchange (assuming one is configured)?
    options:
    - text: Споживач відхилив повідомлення через `basic.nack` або `basic.reject` з `requeue=false`
      text_en: The consumer rejected the message via `basic.nack` or `basic.reject` with `requeue=false`
      correct: true
    - text: Закінчився TTL самого повідомлення в черзі
      text_en: The TTL of the message itself expired in the queue
      correct: true
    - text: Повідомлення відкинуто, бо черга досягла налаштованого ліміту довжини
      text_en: The message was dropped because the queue reached its configured length limit
      correct: true
    - text: Закінчився TTL цілої черги, і всі її повідомлення переїхали в DLX
      text_en: The TTL of the whole queue expired, and all its messages moved to the DLX
    explanation: |
      Dead-lettering запускають відхилення без повернення в чергу, спливання TTL повідомлення та переповнення черги (а для quorum-черг ще перевищення delivery-limit). Коли видаляється сама черга за її TTL, повідомлення в DLX не потрапляють.
    explanation_en: |
      Dead-lettering is triggered by rejection without requeue, message TTL expiry, and queue overflow (and, for quorum queues, exceeding the delivery limit). When a queue itself is deleted by its TTL, its messages do not go to the DLX.
    sources:
    - https://www.rabbitmq.com/docs/dlx
  - id: messaging-009
    level: senior
    type: single
    text: Сервіс зберігає замовлення в БД і публікує подію в брокер двома окремими викликами. Після збою між ними замовлення є, а події немає. Як це розв'язує патерн transactional outbox?
    text_en: A service saves an order to the DB and publishes an event to the broker in two separate calls. After a failure between them the order exists but the event does not. How does the transactional outbox pattern solve this?
    options:
    - text: Подію пишуть в outbox тією ж транзакцією БД, а окремий процес надсилає її в брокер
      text_en: The event is written to an outbox in the same DB transaction, and a separate process sends it to the broker
      correct: true
    - text: Спочатку публікують подію в брокер, а замовлення зберігають лише після підтвердження
      text_en: The event is published to the broker first, and the order is saved only after confirmation
    - text: Обидва виклики загортають у блок `try/catch` і повторюють публікацію в тому ж потоці
      text_en: Both calls are wrapped in a `try/catch` block and the publish is retried in the same thread
    - text: Брокер сам відкочує подію, якщо транзакція БД не завершилась успішно з його боку
      text_en: The broker itself rolls the event back if the DB transaction did not complete successfully on its side
    explanation: |
      Запис у БД і в outbox атомарний, тому подія не загубиться навіть при збої. Ціна — доставка at-least-once, бо ретранслятор може надіслати подію двічі, тож споживачі мають бути ідемпотентними. Зміна порядку викликів лише переносить проблему на зворотний збій.
    explanation_en: |
      The write to the DB and to the outbox is atomic, so the event is not lost even on failure. The price is at-least-once delivery, since the relay may send an event twice, so consumers must be idempotent. Swapping the order of the calls only moves the problem to the reverse failure.
    sources:
    - https://microservices.io/patterns/data/transactional-outbox.html
    - https://learn.microsoft.com/en-us/azure/architecture/best-practices/transactional-outbox-cosmos
  - id: messaging-010
    level: senior
    type: single
    text: Брокер доставляє повідомлення at-least-once, а обробник збільшує баланс рахунку. Як зробити споживача безпечним до дублікатів?
    text_en: The broker delivers messages at-least-once, and the handler increases an account balance. How do you make the consumer safe against duplicates?
    options:
    - text: Писати id повідомлення в таблицю оброблених тією ж транзакцією БД, що й баланс, і пропускати повтори
      text_en: Write the message id to a processed table in the same DB transaction as the balance, and skip repeats
      correct: true
    - text: Зберігати ідентифікатори оброблених повідомлень у памʼяті процесу, у звичайному словнику
      text_en: Keep identifiers of processed messages in process memory, in an ordinary dictionary
    - text: Підтверджувати повідомлення брокеру ще до початку обробки, щоб він не надсилав його вдруге
      text_en: Acknowledge the message to the broker before processing starts, so it does not send it again
    - text: Збільшити таймаут підтвердження, щоб повторна доставка ніколи не траплялась навіть при збоях
      text_en: Increase the acknowledgement timeout so redelivery never happens even during failures
    explanation: |
      Перевірка й побічний ефект мають бути атомарними, інакше збій між ними знову дасть дублікат або втрату. Памʼять процесу зникає при перезапуску, а підтвердження до обробки перетворює гарантію на at-most-once.
    explanation_en: |
      The check and the side effect must be atomic, otherwise a failure between them again yields a duplicate or a loss. Process memory disappears on restart, and acknowledging before processing turns the guarantee into at-most-once.
    sources:
    - https://microservices.io/patterns/communication-style/idempotent-consumer.html
  - id: messaging-011
    level: senior
    type: multiple
    text: Які твердження про семантику exactly-once у Kafka правильні?
    text_en: Which statements about exactly-once semantics in Kafka are true?
    options:
    - text: Ідемпотентний продюсер не дає повторним спробам створити дублікати в партиції
      text_en: An idempotent producer prevents retries from creating duplicates in a partition
      correct: true
    - text: Транзакції атомарно записують результат у кілька партицій разом з офсетами
      text_en: Transactions atomically write the result to several partitions together with offsets
      correct: true
    - text: Споживач із `isolation.level=read_committed` не бачить перервані транзакції
      text_en: A consumer with `isolation.level=read_committed` does not see aborted transactions
      correct: true
    - text: Гарантія exactly-once автоматично охоплює й запис у зовнішню БД
      text_en: The exactly-once guarantee automatically extends to writes to an external DB
    explanation: |
      Exactly-once у Kafka діє для схеми «прочитати з Kafka, записати в Kafka». Зовнішню систему треба узгоджувати окремо (наприклад, зберігати офсет разом із результатом у самій БД або робити запис ідемпотентним).
    explanation_en: |
      Exactly-once in Kafka applies to the "read from Kafka, write to Kafka" scheme. An external system must be coordinated separately (for example, by storing the offset together with the result in the DB itself or by making the write idempotent).
    sources:
    - https://kafka.apache.org/44/design/design/#semantics
  - id: messaging-012
    level: senior
    type: single
    text: Споживач Kafka інколи обробляє пачку довше за `max.poll.interval.ms`. Що станеться?
    text_en: A Kafka consumer sometimes processes a batch for longer than `max.poll.interval.ms`. What happens?
    options:
    - text: Споживача вважатимуть збійним, група виконає ребаланс, а незакомічені записи оброблять заново
      text_en: The consumer is considered failed, the group rebalances, and uncommitted records are processed again
      correct: true
    - text: Kafka автоматично продовжить інтервал для цього споживача, поки він не завершить обробку
      text_en: Kafka automatically extends the interval for this consumer until it finishes processing
    - text: Споживач лишається в групі, а брокер ставить його партиції на паузу до наступного poll
      text_en: The consumer stays in the group, and the broker pauses its partitions until the next poll
    - text: Записи пачки буде втрачено, бо Kafka видаляє незакомічені дані після закінчення інтервалу
      text_en: The batch records are lost, because Kafka deletes uncommitted data after the interval expires
    explanation: |
      Якщо `poll()` не викликали вчасно, споживача виключають із групи, а його партиції передають іншим. Нова позиція береться із закоміченого офсету, тож частина записів може оброблятися двічі. Лікують це меншими пачками, більшим інтервалом чи ідемпотентною обробкою.
    explanation_en: |
      If `poll()` is not called in time, the consumer is removed from the group and its partitions go to others. The new position is taken from the committed offset, so some records may be processed twice. This is mitigated by smaller batches, a longer interval, or idempotent processing.
    sources:
    - https://kafka.apache.org/44/configuration/consumer-configs/#consumerconfigs_max.poll.interval.ms
  - id: messaging-013
    level: junior
    type: single
    text: Що відбувається із записом у топіку Kafka після того, як споживач його прочитав?
    text_en: What happens to a record in a Kafka topic after a consumer has read it?
    options:
    - text: Запис лишається в журналі й видаляється лише за політикою зберігання топіка
      text_en: The record stays in the log and is removed only by the topic's retention policy
      correct: true
    - text: Запис видаляється одразу, щойно його підтвердила остання група споживачів
      text_en: The record is deleted as soon as the last consumer group has acknowledged it
    - text: Запис переходить в окремий топік оброблених, звідки його читають повторно
      text_en: The record moves to a separate topic of processed records, from which it is read again
    - text: Запис зникає, коли споживач закомітить офсет за ним у групі
      text_en: The record disappears when the consumer commits an offset past it in the group
    explanation: |
      Kafka зберігає події незалежно від споживання: їх можна читати скільки завгодно разів, а старі події відкидаються за налаштованим для топіка часом чи розміром. Коміт офсету лише запам'ятовує позицію групи й нічого не видаляє.
    explanation_en: |
      Kafka stores events independently of consumption: they can be read any number of times, and old events are discarded by the retention time or size configured for the topic. An offset commit only remembers the group's position and deletes nothing.
    sources:
    - https://kafka.apache.org/44/getting-started/introduction/
  - id: messaging-014
    level: junior
    type: single
    text: До exchange типу fanout прив'язано три черги RabbitMQ. Куди потрапить повідомлення, опубліковане в нього з довільним routing key?
    text_en: Three RabbitMQ queues are bound to a fanout exchange. Where does a message published to it with an arbitrary routing key go?
    options:
    - text: У кожну з трьох черг, бо fanout ігнорує routing key
      text_en: Into each of the three queues, because fanout ignores the routing key
      correct: true
    - text: Лише в першу прив'язану чергу, а решта слугують резервом на випадок збою
      text_en: Only into the first bound queue, while the others serve as a standby in case of failure
    - text: У ту чергу, назва якої збігається з routing key повідомлення
      text_en: Into the queue whose name matches the message's routing key
    - text: У чергу, яка за таким ключем має найменше повідомлень у даний момент
      text_en: Into the queue that currently holds the fewest messages for that key
    explanation: |
      Fanout копіює повідомлення в усі прив'язані черги й не дивиться на routing key. Збіг ключа з назвою черги потрібен лише в exchange за замовчуванням.
    explanation_en: |
      A fanout exchange copies the message into all bound queues and ignores the routing key. A routing key matching the queue name matters only for the default exchange.
    sources:
    - https://www.rabbitmq.com/tutorials/amqp-concepts#exchange-fanout
  - id: messaging-015
    level: junior
    type: single
    text: Два екземпляри воркера читають одну чергу RabbitMQ з ручними підтвердженнями. Як розподіляються повідомлення?
    text_en: Two worker instances consume from one RabbitMQ queue with manual acknowledgements. How are messages distributed?
    options:
    - text: Кожне повідомлення отримує лише один воркер, а навантаження чергується між ними
      text_en: Each message goes to only one worker, and the load alternates between them
      correct: true
    - text: Кожен воркер отримує копію кожного повідомлення, тож вони обробляють усе вдвічі
      text_en: Each worker gets a copy of every message, so they process everything twice
    - text: Увесь потік іде першому воркеру, а другий вмикається лише після його збою
      text_en: The whole stream goes to the first worker, and the second takes over only after its failure
    - text: Воркери ділять чергу за ключем повідомлення так само, як партиції в Kafka
      text_en: The workers split the queue by message key in the same way as partitions in Kafka
    explanation: |
      Це патерн competing consumers: брокер віддає кожне повідомлення одному споживачеві, за замовчуванням по колу. Копію кожному споживачеві дає не черга, а кілька черг, прив'язаних до fanout-exchange.
    explanation_en: |
      This is the competing consumers pattern: the broker hands each message to one consumer, round-robin by default. A copy for every consumer comes not from one queue but from several queues bound to a fanout exchange.
    sources:
    - https://www.rabbitmq.com/tutorials/tutorial-two-python#round-robin-dispatching
  - id: messaging-016
    level: junior
    type: single
    text: Продюсер RabbitMQ публікує повідомлення в exchange за замовчуванням (порожня назва) з routing key `invoices`. Куди воно потрапить?
    text_en: A RabbitMQ producer publishes a message to the default exchange (empty name) with the routing key `invoices`. Where does it go?
    options:
    - text: У чергу з назвою `invoices`, якщо вона існує
      text_en: Into the queue named `invoices`, if it exists
      correct: true
    - text: У всі черги брокера, бо порожня назва exchange означає розсилку
      text_en: Into all queues of the broker, because an empty exchange name means a broadcast
    - text: В жодну чергу, бо публікація без явного exchange відхиляється
      text_en: Into no queue, because publishing without an explicit exchange is rejected
    - text: У чергу з таким routing key лише після ручного створення прив'язки
      text_en: Into the queue with that routing key, but only after a binding is created by hand
    explanation: |
      Exchange за замовчуванням є в кожному брокері, і кожну створену чергу автоматично прив'язано до нього з routing key, що дорівнює назві черги. Якщо черги з такою назвою немає, повідомлення відкидається.
    explanation_en: |
      The default exchange exists in every broker, and every created queue is automatically bound to it with a routing key equal to the queue name. If no queue with that name exists, the message is dropped.
    sources:
    - https://www.rabbitmq.com/tutorials/amqp-concepts#exchange-default
  - id: messaging-017
    level: middle
    type: multiple
    text: Чергу прив'язано до topic exchange RabbitMQ з binding key `orders.#`. Які routing key потраплять у цю чергу?
    text_en: A queue is bound to a RabbitMQ topic exchange with the binding key `orders.#`. Which routing keys will reach this queue?
    options:
    - text: '`orders`'
      text_en: '`orders`'
      correct: true
    - text: '`orders.eu`'
      text_en: '`orders.eu`'
      correct: true
    - text: '`orders.eu.created`'
      text_en: '`orders.eu.created`'
      correct: true
    - text: '`order.eu`'
      text_en: '`order.eu`'
    - text: '`archived.orders`'
      text_en: '`archived.orders`'
    explanation: |
      У binding key `#` замінює нуль або більше слів, тому збігаються `orders`, `orders.eu` і глибші ключі. `order.eu` має інше перше слово, а `archived.orders` починається не з `orders`. Зірочка `*` замінила б рівно одне слово.
    explanation_en: |
      In a binding key, `#` stands for zero or more words, so `orders`, `orders.eu` and deeper keys match. `order.eu` has a different first word, and `archived.orders` does not start with `orders`. A star `*` would stand for exactly one word.
    sources:
    - https://www.rabbitmq.com/tutorials/tutorial-five-python
  - id: messaging-018
    level: middle
    type: single
    text: У Kafka 4.4 нова група споживачів із `auto.offset.reset` за замовчуванням уперше підписується на топік, у якому вже є мільйон записів. Що вона прочитає?
    text_en: In Kafka 4.4, a new consumer group with the default `auto.offset.reset` subscribes to a topic for the first time, and the topic already holds a million records. What will it read?
    options:
    - text: Лише записи, що надійдуть після призначення партицій, бо стартова позиція — кінець журналу
      text_en: Only records arriving after partitions are assigned, because the starting position is the end of the log
      correct: true
    - text: Усі записи з початку журналу, бо нова група завжди починає з офсету 0
      text_en: All records from the start of the log, because a new group always begins at offset 0
    - text: Останні записи за період `retention.ms`, бо Kafka добирає стартову позицію з часу
      text_en: The latest records within `retention.ms`, because Kafka derives the start position from time
    - text: Нічого, доки адміністратор вручну не призначить групі стартові офсети
      text_en: Nothing, until an administrator manually assigns starting offsets to the group
    explanation: |
      Коли для групи немає закоміченого офсету, діє `auto.offset.reset`, а за замовчуванням це `latest`. Щоб прочитати історію, ставлять `earliest` (або перемотують офсети). Помилку замість старту дає лише значення `none`.
    explanation_en: |
      When the group has no committed offset, `auto.offset.reset` applies, and its default is `latest`. To read the history, set `earliest` (or seek the offsets). Only the value `none` raises an error instead of starting.
    sources:
    - https://kafka.apache.org/44/configuration/consumer-configs/#consumerconfigs_auto.offset.reset
  - id: messaging-019
    level: middle
    type: single
    text: Два воркери читають одну чергу RabbitMQ з ручними підтвердженнями, а завдання сильно різняться за тривалістю. Один воркер перевантажений, інший простоює. Що це виправить?
    text_en: Two workers consume from one RabbitMQ queue with manual acknowledgements, and tasks differ greatly in duration. One worker is overloaded while the other sits idle. What fixes this?
    options:
    - text: Ліміт prefetch, що дорівнює 1, щоб нове повідомлення йшло лише воркеру, який підтвердив попереднє
      text_en: A prefetch limit of 1, so a new message goes only to a worker that has acknowledged the previous one
      correct: true
    - text: Перейти на автоматичні підтвердження, щоб черга швидше вважала повідомлення оброблені
      text_en: Switch to automatic acknowledgements so the queue treats messages as processed sooner
    - text: Вимкнути round-robin і прив'язати кожен воркер до половини routing key
      text_en: Disable round-robin and bind each worker to half of the routing keys
    - text: Збільшити prefetch до кількох тисяч, щоб воркери самі вирівняли чергу
      text_en: Raise prefetch to several thousand so that the workers even out the queue themselves
    explanation: |
      Без ліміту брокер роздає повідомлення по колу, не зважаючи на кількість непідтверджених у кожного воркера. Ліміт 1 через `basic.qos` не віддає воркеру нове повідомлення, доки він не підтвердив попереднє. Великий prefetch лише збільшує перекіс.
    explanation_en: |
      Without a limit, the broker deals messages out round-robin regardless of how many unacknowledged ones each worker holds. A limit of 1 via `basic.qos` hands a worker a new message only after it has acknowledged the previous one. A large prefetch only worsens the skew.
    sources:
    - https://www.rabbitmq.com/tutorials/tutorial-two-python#fair-dispatch
  - id: messaging-020
    level: senior
    type: multiple
    text: Топік Kafka має `replication.factor=3`, а продюсер пише з `acks=all`. Які твердження правильні?
    text_en: A Kafka topic has `replication.factor=3`, and the producer writes with `acks=all`. Which statements are true?
    options:
    - text: Лідер підтверджує запис після того, як його отримали всі репліки з ISR, а не лише лідер
      text_en: The leader acknowledges a write after all replicas in the ISR have received it, not just the leader
      correct: true
    - text: Якщо в ISR менше реплік, ніж `min.insync.replicas`, запис відхиляється з помилкою
      text_en: If the ISR has fewer replicas than `min.insync.replicas`, the write is rejected with an error
      correct: true
    - text: Запис, підтверджений із `acks=1`, може зникнути, якщо лідер впаде до реплікації на фолловерів
      text_en: A write acknowledged with `acks=1` can be lost if the leader fails before replicating to followers
      correct: true
    - text: Із `min.insync.replicas=1` запис безпечний навіть тоді, коли ISR скоротилася до одного лідера
      text_en: With `min.insync.replicas=1` the write is safe even when the ISR has shrunk to the leader alone
    explanation: |
      `acks=all` чекає на всю поточну ISR, а `min.insync.replicas` задає нижню межу її розміру для успішного запису. З межею 1 і ISR з одного лідера підтвердження дає сам лідер, тож втрата його диска стирає запис.
    explanation_en: |
      `acks=all` waits for the whole current ISR, and `min.insync.replicas` sets the lower bound of its size for a successful write. With a limit of 1 and an ISR of the leader alone, the leader itself gives the acknowledgement, so losing its disk erases the write.
    sources:
    - https://kafka.apache.org/44/configuration/producer-configs/#producerconfigs_acks
    - https://kafka.apache.org/44/configuration/topic-configs/#topicconfigs_min.insync.replicas
  - id: messaging-021
    level: middle
    type: single
    text: Обробник RabbitMQ при кожному винятку викликає `basic.nack` з `requeue=true`. Одне повідомлення завжди викликає виняток. Що станеться?
    text_en: A RabbitMQ handler calls `basic.nack` with `requeue=true` on every exception. One message always raises an exception. What happens?
    options:
    - text: Повідомлення знову й знову повертається в чергу та доставляється споживачам, тож утворюється цикл
      text_en: The message is returned to the queue and delivered to consumers again and again, forming a loop
      correct: true
    - text: Після третьої невдалої спроби брокер сам відправляє його в dead letter exchange
      text_en: After the third failed attempt the broker itself sends it to the dead letter exchange
    - text: Повідомлення зникає, бо `nack` завжди видаляє його з черги незалежно від `requeue`
      text_en: The message disappears, because `nack` always removes it from the queue regardless of `requeue`
    - text: Брокер дає повідомленню затримку, яка зростає з кожною спробою
      text_en: The broker gives the message a delay that grows with each attempt
    explanation: |
      `requeue=true` повертає повідомлення в чергу, тож «отруйне» повідомлення знов і знов доходить до споживача й марно витрачає ЦП та мережу. Вихід: рахувати повторні доставки й відхиляти повідомлення без повернення (з dead-lettering) або повертати його із затримкою.
    explanation_en: |
      `requeue=true` returns the message to the queue, so a poison message reaches a consumer again and again, wasting CPU and network. The way out is to count redeliveries and reject the message without requeueing (with dead-lettering) or to requeue it after a delay.
    sources:
    - https://www.rabbitmq.com/docs/confirms#consumer-nacks-requeue
  - id: messaging-022
    level: senior
    type: multiple
    text: Топік Kafka налаштовано з `cleanup.policy=compact`. Які твердження про нього правильні?
    text_en: A Kafka topic is configured with `cleanup.policy=compact`. Which statements about it are true?
    options:
    - text: Для кожного ключа в партиції лишається щонайменше останнє відоме значення
      text_en: For each key in a partition, at least the last known value is retained
      correct: true
    - text: Запис із ключем і порожнім значенням (tombstone) позначає видалення цього ключа
      text_en: A record with a key and a null value (a tombstone) marks that key for deletion
      correct: true
    - text: Збережені записи не змінюють порядку, а їхні офсети лишаються тими самими
      text_en: The retained records keep their order, and their offsets stay the same
      correct: true
    - text: Після компактації офсети перенумеровуються підряд, щоб у журналі не було прогалин
      text_en: After compaction the offsets are renumbered consecutively so the log has no gaps
    explanation: |
      Компактація прибирає застарілі значення тих самих ключів, але не переставляє записів і не змінює офсетів, тому в журналі з'являються прогалини. Tombstone теж зрештою вилучається з журналу через налаштований час.
    explanation_en: |
      Compaction removes obsolete values of the same keys but neither reorders records nor changes offsets, so gaps appear in the log. The tombstone itself is eventually removed from the log after a configured time.
    sources:
    - https://kafka.apache.org/44/design/design/#compaction
  - id: messaging-023
    level: senior
    type: single
    text: Продюсер Kafka 4.4 має `retries>0`, `enable.idempotence=false` і `max.in.flight.requests.per.connection=5`. Порядок записів у партиції іноді порушується. Що саме його ламає і що змінити?
    text_en: A Kafka 4.4 producer has `retries>0`, `enable.idempotence=false` and `max.in.flight.requests.per.connection=5`. The order of records in a partition is sometimes violated. What causes it and what should change?
    options:
    - text: Невдалу пачку повторюють уже після успішної наступної; вмикають ідемпотентність, яка зберігає порядок
      text_en: A failed batch is retried after a later one has succeeded; enable idempotence, which preserves order
      correct: true
    - text: Брокер сортує пачки за розміром; вмикають компресію, щоб розміри збігалися
      text_en: The broker sorts batches by size; enable compression so that the sizes match
    - text: Партиція змінюється між повторами; фіксують `partition` у кожному записі й вимикають ключі
      text_en: The partition changes between retries; pin `partition` in each record and disable keys
    - text: Повтори завжди порушують порядок, тож `retries` потрібно ставити в 0 за будь-яких налаштувань
      text_en: Retries always break ordering, so `retries` must be 0 under any settings
    explanation: |
      Зі значенням більше 1 і без ідемпотентності кілька запитів летять одночасно, тож повтор першого може лягти в журнал після другого. Ідемпотентний продюсер (з не більше ніж 5 запитами) зберігає порядок навіть із повторами; альтернатива — один запит у польоті.
    explanation_en: |
      With a value above 1 and no idempotence, several requests are in flight at once, so the retry of the first may land in the log after the second. An idempotent producer (with at most 5 requests) preserves order even with retries; the alternative is one request in flight.
    sources:
    - https://kafka.apache.org/44/configuration/producer-configs/#producerconfigs_max.in.flight.requests.per.connection
  - id: messaging-024
    level: senior
    type: single
    text: Топік Kafka має 12 партицій, у групі 12 споживачів. Lag постійно росте лише на одній партиції, на решті він близький до нуля. Що з цим робити?
    text_en: A Kafka topic has 12 partitions and the group has 12 consumers. Lag keeps growing on only one partition and is near zero on the rest. What should be done?
    options:
    - text: 'Перевірити розподіл ключів: гарячий ключ перевантажує одну партицію, а нові споживачі не допоможуть'
      text_en: 'Check the key distribution: a hot key overloads one partition, and new consumers will not help'
      correct: true
    - text: Додати ще 12 споживачів у групу, щоб вони розділили між собою відстаючу партицію й наздогнали її
      text_en: Add 12 more consumers to the group so that they split the lagging partition among themselves and catch up
    - text: Перезапустити брокер-лідер цієї партиції, бо відставання лише на одній партиції завжди означає збій брокера
      text_en: Restart the leader broker of this partition, since lag on a single partition always means a broker failure
    - text: Збільшити `max.poll.interval.ms` для всієї групи, щоб споживач цієї партиції читав швидше й устигав
      text_en: Raise `max.poll.interval.ms` for the whole group so that the consumer manages to read faster
    explanation: |
      У межах групи партицію читає лише один споживач, тому понад 12 споживачів не прискорять її. Перекіс лише на одній партиції вказує на нерівномірний розподіл ключів: міняють ключування або пришвидшують обробку саме цієї партиції.
    explanation_en: |
      Within a group, only one consumer reads a partition, so more than 12 consumers will not speed it up. Lag on a single partition points to uneven key distribution: change the keying or speed up processing of that partition specifically.
    sources:
    - https://kafka.apache.org/44/design/design/#semantics
