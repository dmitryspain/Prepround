id: docker-k8s
title: Docker і Kubernetes
title_en: Docker and Kubernetes
description: Образи, шари, compose, поди, деплойменти, сервіси, probes, ресурси.
description_en: Images, layers, Compose, pods, deployments, services, probes, resources.
icon: kubernetes
questions:
  - id: docker-k8s-001
    level: junior
    type: single
    text: Чим образ (image) Docker відрізняється від контейнера?
    text_en: What is the difference between a Docker image and a container?
    options:
    - text: Образ є незмінним шаблоном, а контейнер є запущеним екземпляром цього образу
      text_en: An image is an immutable template, and a container is a running instance of that image
      correct: true
    - text: Образ є запущеним процесом у памʼяті, а контейнер є його архівом, що зберігається на диску
      text_en: An image is a running process in memory, and a container is its archive stored on disk
    - text: Образ і контейнер є двома назвами одного й того самого обʼєкта в залежності від стану
      text_en: An image and a container are two names for the same object, depending on its state
    - text: Образ зберігає дані користувача між запусками, а контейнер містить лише код застосунку
      text_en: An image stores user data between runs, and a container contains only the application code
    explanation: |
      З одного образу можна запустити багато контейнерів, і кожен отримує власний тонкий шар для запису. Дані, записані в контейнері, не змінюють образ.
    explanation_en: |
      Many containers can be started from one image, and each gets its own thin writable layer. Data written in a container does not change the image.
    sources:
    - https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-an-image/
    - https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/
  - id: docker-k8s-002
    level: junior
    type: single
    text: Що робить інструкція `EXPOSE 8080` у Dockerfile?
    text_en: What does the `EXPOSE 8080` instruction do in a Dockerfile?
    code:
      lang: dockerfile
      source: |
        FROM nginx:stable
        COPY site/ /usr/share/nginx/html
        EXPOSE 8080
    options:
    - text: Документує, що застосунок слухає порт 8080, але сам порт на хості не публікує
      text_en: Documents that the application listens on port 8080, but does not publish the port on the host
      correct: true
    - text: Робить порт 8080 контейнера доступним на тому самому порту хоста без додаткових прапорців
      text_en: Makes container port 8080 available on the same host port without any extra flags
    - text: Змушує nginx слухати порт 8080 замість стандартного порту 80 у конфігурації за замовчуванням
      text_en: Forces nginx to listen on port 8080 instead of the default port 80 in its default configuration
    - text: Відкриває порт 8080 у брандмауері хоста для всього вхідного трафіку з мережі
      text_en: Opens port 8080 in the host firewall for all incoming network traffic
    explanation: |
      `EXPOSE` лише повідомляє, який порт задумано використовувати. Опублікувати його на хості можна ключем `-p 8080:8080` або `-P` під час `docker run`.
    explanation_en: |
      `EXPOSE` only states which port is intended to be used. You can publish it on the host with `-p 8080:8080` or `-P` during `docker run`.
    sources:
    - https://docs.docker.com/reference/dockerfile/#expose
  - id: docker-k8s-003
    level: junior
    type: single
    text: Що таке Pod у Kubernetes?
    text_en: What is a Pod in Kubernetes?
    options:
    - text: Найменша одиниця розгортання з одного чи кількох контейнерів, які ділять мережу й сховище
      text_en: The smallest deployable unit, made of one or more containers that share network and storage
      correct: true
    - text: Окремий фізичний або віртуальний сервер кластера, на якому працюють контейнери застосунків
      text_en: A physical or virtual server in the cluster on which application containers run
    - text: Набір правил, що відкриває застосунок назовні через стабільну адресу та балансує трафік
      text_en: A set of rules that exposes an application externally through a stable address and balances traffic
    - text: Файл конфігурації, у якому описано образ, змінні середовища й порти для запуску контейнера
      text_en: A configuration file describing the image, environment variables, and ports for running a container
    explanation: |
      Контейнери одного Pod працюють на одному вузлі, мають спільну IP-адресу й можуть ділитися томами. Сервер у Kubernetes називається вузлом (node), а стабільну адресу дає Service.
    explanation_en: |
      Containers in one Pod run on the same node, share one IP address, and can share volumes. A server in Kubernetes is called a node, and a stable address is provided by a Service.
    sources:
    - https://kubernetes.io/docs/concepts/workloads/pods/
  - id: docker-k8s-004
    level: junior
    type: single
    text: Яку задачу розв'язує обʼєкт Service типу ClusterIP?
    text_en: What problem does a Service object of type ClusterIP solve?
    options:
    - text: Дає стабільні віртуальну IP-адресу й DNS-імʼя для набору Pod-ів, обраних за мітками
      text_en: Provides a stable virtual IP address and DNS name for a set of Pods selected by labels
      correct: true
    - text: Автоматично збільшує кількість реплік, коли росте навантаження на процесор вузлів кластера
      text_en: Automatically increases the number of replicas when CPU load on the cluster nodes grows
    - text: Зберігає секрети й передає їх у контейнери як змінні середовища чи змонтовані файли
      text_en: Stores secrets and passes them to containers as environment variables or mounted files
    - text: Запускає завдання за розкладом і зберігає результат кожного запуску для подальшого аналізу
      text_en: Runs jobs on a schedule and stores the result of each run for later analysis
    explanation: |
      Pod-и створюються й зникають, а їхні IP змінюються, тому клієнти звертаються до Service, який балансує запити між готовими Pod-ами. Масштабування — задача HPA, секрети — Secret, розклад — CronJob.
    explanation_en: |
      Pods come and go and their IPs change, so clients talk to a Service, which balances requests across ready Pods. Scaling is the job of HPA, secrets belong to Secret, and scheduling to CronJob.
    sources:
    - https://kubernetes.io/docs/concepts/services-networking/service/
  - id: docker-k8s-005
    level: middle
    type: single
    text: Після кожної правки коду збірка цього образу заново виконує `npm ci`. Що виправить це?
    text_en: After every code change, building this image runs `npm ci` again. What fixes this?
    code:
      lang: dockerfile
      source: |
        FROM node:24-slim
        WORKDIR /app
        COPY . .
        RUN npm ci
        CMD ["node", "server.js"]
    options:
    - text: Спершу копіювати лише `package*.json` і виконати `npm ci`, а потім робити `COPY . .`
      text_en: First copy only `package*.json` and run `npm ci`, then do `COPY . .`
      correct: true
    - text: Замінити `RUN npm ci` на `CMD npm ci`, щоб залежності ставилися під час запуску контейнера
      text_en: Replace `RUN npm ci` with `CMD npm ci` so dependencies are installed when the container starts
    - text: Перенести `WORKDIR /app` після `RUN npm ci`, щоб шар залежностей не залежав від теки
      text_en: Move `WORKDIR /app` after `RUN npm ci` so the dependency layer does not depend on the directory
    - text: Додати до `COPY` прапорець, що вимикає кешування для вихідних файлів у цій інструкції
      text_en: Add a flag to `COPY` that disables caching for source files in this instruction
    explanation: |
      Зміна будь-якого файлу, скопійованого інструкцією `COPY . .`, скидає кеш цього шару і всіх наступних, зокрема `npm ci`. Якщо залежності встановлювати до копіювання коду, шар перевикористовується, поки `package*.json` не змінився.
    explanation_en: |
      Changing any file copied by `COPY . .` invalidates the cache of that layer and all following ones, including `npm ci`. If dependencies are installed before the code is copied, the layer is reused as long as `package*.json` is unchanged.
    sources:
    - https://docs.docker.com/build/cache/optimize/#order-your-layers
  - id: docker-k8s-006
    level: middle
    type: multiple
    text: Які твердження про probes у Kubernetes правильні?
    text_en: Which statements about probes in Kubernetes are true?
    options:
    - text: Після невдалої liveness probe kubelet перезапускає контейнер
      text_en: After a failed liveness probe, the kubelet restarts the container
      correct: true
    - text: Контейнер із невдалою readiness probe прибирають із балансування Service, але не перезапускають
      text_en: A container with a failed readiness probe is removed from Service load balancing but not restarted
      correct: true
    - text: Поки startup probe не пройде, liveness і readiness probes не виконуються
      text_en: Until the startup probe succeeds, liveness and readiness probes are not run
      correct: true
    - text: Невдала readiness probe призводить до перезапуску контейнера так само, як liveness
      text_en: A failed readiness probe restarts the container just like liveness does
    explanation: |
      Liveness відповідає на питання «чи треба перезапустити», readiness — «чи можна слати трафік». Startup probe потрібна повільним застосункам, щоб liveness не вбила їх, поки вони ще стартують.
    explanation_en: |
      Liveness answers "does it need a restart", readiness answers "can it receive traffic". A startup probe is for slow applications so that liveness does not kill them while they are still starting.
    sources:
    - https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
    - https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  - id: docker-k8s-007
    level: middle
    type: single
    text: Deployment оновлюється за такою стратегією. Скільки Pod-ів можуть існувати одночасно і скільки щонайменше мають бути доступні під час оновлення?
    text_en: A Deployment is updated with the strategy below. How many Pods can exist at the same time, and how many must be available at minimum during the update?
    code:
      lang: yaml
      source: |
        spec:
          replicas: 4
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
    options:
    - text: Не більше 5 Pod-ів, і не менше 4 доступних
      text_en: At most 5 Pods, and at least 4 available
      correct: true
    - text: Не більше 4 Pod-ів, і не менше 3 доступних
      text_en: At most 4 Pods, and at least 3 available
    - text: Не більше 5 Pod-ів, і не менше 3 доступних
      text_en: At most 5 Pods, and at least 3 available
    - text: Не більше 8 Pod-ів, і не менше 4 доступних
      text_en: At most 8 Pods, and at least 4 available
    explanation: |
      `maxSurge: 1` дозволяє на один Pod більше за `replicas`, а `maxUnavailable: 0` забороняє мати менше за 4 доступні. Тому спершу піднімається новий Pod, і лише коли він готовий, зупиняється старий.
    explanation_en: |
      `maxSurge: 1` allows one Pod more than `replicas`, and `maxUnavailable: 0` forbids having fewer than 4 available. So a new Pod is created first, and only when it is ready is an old one stopped.
    sources:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-update-deployment
  - id: docker-k8s-008
    level: middle
    type: single
    text: Що станеться з контейнером, який перевищив свій `limits.memory`, і з контейнером, який впирається в `limits.cpu`?
    text_en: What happens to a container that exceeds its `limits.memory`, and to a container that hits `limits.cpu`?
    options:
    - text: Перший буде зупинений через OOM (OOMKilled), а другий лише сповільнений (CPU throttling)
      text_en: The first is killed due to OOM (OOMKilled), and the second is only slowed down (CPU throttling)
      correct: true
    - text: Обидва будуть негайно зупинені й перезапущені kubelet за політикою перезапуску Pod-а
      text_en: Both are immediately stopped and restarted by the kubelet according to the Pod restart policy
    - text: Перший буде сповільнений, а другий зупинений через OOM-killer ядра на вузлі
      text_en: The first is slowed down, and the second is killed by the kernel OOM killer on the node
    - text: Обидва лише сповільняться, доки на вузлі не звільниться відповідний ресурс для контейнера
      text_en: Both are only slowed down until the node frees up the corresponding resource for the container
    explanation: |
      Пам'ять не можна «стиснути», тому ядро вбиває процес при перевищенні ліміту. Процесорний час ділиться, тож контейнер просто отримує менше квантів. Планувальник же орієнтується на `requests`, а не на `limits`.
    explanation_en: |
      Memory cannot be "compressed", so the kernel kills the process when the limit is exceeded. CPU time is shared, so the container simply gets fewer time slices. The scheduler, however, relies on `requests`, not on `limits`.
    sources:
    - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#how-pods-with-resource-limits-are-run
  - id: docker-k8s-009
    level: senior
    type: single
    text: Контейнер запущено з цим Dockerfile. Після `docker stop` застосунок завершується лише через таймаут, а обробник SIGTERM не спрацьовує. Чому?
    text_en: The container is started from this Dockerfile. After `docker stop`, the application exits only after a timeout, and the SIGTERM handler does not fire. Why?
    code:
      lang: dockerfile
      source: |
        FROM node:24-slim
        COPY server.js .
        ENTRYPOINT node server.js
    options:
    - text: Shell-форма запускає `node` дочірнім процесом `sh -c`, який не передає сигнали далі
      text_en: The shell form runs `node` as a child of `sh -c`, which does not forward signals
      correct: true
    - text: '`docker stop` надсилає SIGINT, який `node` у контейнері за замовчуванням ігнорує повністю'
      text_en: '`docker stop` sends SIGINT, which `node` in a container ignores completely by default'
    - text: Образ `node:24-slim` не підтримує коректну зупинку процесів по сигналах операційної системи
      text_en: The `node:24-slim` image does not support proper process shutdown on operating system signals
    - text: SIGTERM надсилається лише контейнерам із `CMD`, а контейнери з `ENTRYPOINT` його не отримують
      text_en: SIGTERM is sent only to containers with `CMD`, and containers with `ENTRYPOINT` do not receive it
    explanation: |
      У контейнері PID 1 стає `sh`, а `node` отримує інший PID, тож SIGTERM лишається в оболонці. Після таймауту (10 с) Docker шле SIGKILL. Перевірено запуском: з `ENTRYPOINT ["node", "server.js"]` процес стає PID 1 і обробник спрацьовує.
    explanation_en: |
      In the container, PID 1 is `sh`, while `node` gets a different PID, so SIGTERM stays in the shell. After the timeout (10 s), Docker sends SIGKILL. Verified by running: with `ENTRYPOINT ["node", "server.js"]` the process becomes PID 1 and the handler fires.
    sources:
    - https://docs.docker.com/reference/dockerfile/#entrypoint
  - id: docker-k8s-010
    level: senior
    type: multiple
    text: Які твердження про зупинку Pod-а в Kubernetes правильні?
    text_en: Which statements about stopping a Pod in Kubernetes are true?
    options:
    - text: Хук `preStop` має завершитися до того, як контейнеру надішлють SIGTERM
      text_en: The `preStop` hook must finish before SIGTERM is sent to the container
      correct: true
    - text: Відлік `terminationGracePeriodSeconds` (типово 30 с) починається до `preStop` і охоплює також час після SIGTERM
      text_en: The `terminationGracePeriodSeconds` countdown (30 s by default) starts before `preStop` and also covers the time after SIGTERM
      correct: true
    - text: Прибирання Pod-а з endpoints Service іде паралельно зі зупинкою, тож короткий час він ще може отримувати запити
      text_en: Removing the Pod from Service endpoints happens in parallel with shutdown, so for a short time it can still receive requests
      correct: true
    - text: Якщо застосунок обробляє SIGTERM, kubelet чекає його завершення без обмеження в часі
      text_en: If the application handles SIGTERM, the kubelet waits for it to finish with no time limit
    explanation: |
      Після спливання grace period kubelet надсилає SIGKILL, тож довге завершення вимагає збільшити `terminationGracePeriodSeconds`. Через паралельність із endpoints у `preStop` часто додають невелику паузу, щоб балансувальник встиг прибрати Pod.
    explanation_en: |
      After the grace period expires, the kubelet sends SIGKILL, so a long shutdown requires increasing `terminationGracePeriodSeconds`. Because of the parallelism with endpoints, a short pause is often added in `preStop` so the load balancer has time to remove the Pod.
    sources:
    - https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#pod-termination
    - https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
  - id: docker-k8s-011
    level: senior
    type: single
    text: HorizontalPodAutoscaler налаштовано на 70% завантаження CPU, але Deployment не задає для CPU ні `requests`, ні `limits`, а LimitRange у namespace немає. Що станеться?
    text_en: A HorizontalPodAutoscaler is set to 70% CPU utilization, but the Deployment sets neither `requests` nor `limits` for CPU, and there is no LimitRange in the namespace. What happens?
    code:
      lang: yaml
      source: |
        apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        spec:
          scaleTargetRef:
            apiVersion: apps/v1
            kind: Deployment
            name: web
          minReplicas: 2
          maxReplicas: 10
          metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 70
    options:
    - text: HPA не обчислить відсоток завантаження, бо він рахується від `requests`, тож не масштабуватиме
      text_en: The HPA cannot compute the utilization percentage because it is based on `requests`, so it will not scale
      correct: true
    - text: HPA візьме за 100% усі ядра вузла й масштабуватиме від цього значення завантаження
      text_en: The HPA takes all node cores as 100% and scales based on that utilization value
    - text: HPA прийме нульовий запит і масштабуватиме Deployment до значення `maxReplicas` одразу
      text_en: The HPA treats the request as zero and immediately scales the Deployment to `maxReplicas`
    - text: Kubernetes сам підставить типовий запит із ліміту вузла, і HPA працюватиме як звичайно
      text_en: Kubernetes itself substitutes a default request from the node limit, and the HPA works as usual
    explanation: |
      `Utilization` — це частка від запиту CPU контейнера, тож без `requests` знаменника немає, і HPA повідомляє про помилку метрики. Тип `AverageValue` не залежить від запитів, але тоді поріг задають в абсолютних одиницях.
    explanation_en: |
      `Utilization` is a share of the container's CPU request, so without `requests` there is no denominator, and the HPA reports a metric error. The `AverageValue` type does not depend on requests, but then the threshold is set in absolute units.
    sources:
    - https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#support-for-resource-metrics
  - id: docker-k8s-012
    level: senior
    type: multiple
    text: Які твердження про секрети й шари під час збірки образу Docker правильні?
    text_en: Which statements about secrets and layers when building a Docker image are true?
    options:
    - text: Значення з `ARG` і `ENV` лишаються в готовому образі
      text_en: Values from `ARG` and `ENV` remain in the final image
      correct: true
    - text: Секрет із `RUN --mount=type=secret` не потрапляє в шари образу
      text_en: A secret from `RUN --mount=type=secret` does not end up in the image layers
      correct: true
    - text: Файл, доданий в одному шарі й видалений наступним `RUN rm`, лишається в образі
      text_en: A file added in one layer and deleted by a later `RUN rm` remains in the image
      correct: true
    - text: Видалення файлу наступним `RUN rm` зменшує розмір образу
      text_en: Deleting a file with a later `RUN rm` reduces the image size
    explanation: |
      Шари незмінні й складаються один на одного, тому видалення лише приховує файл у підсумковій файловій системі, але дані лежать у попередньому шарі. Секрет, змонтований на час `RUN`, не записується в шар.
    explanation_en: |
      Layers are immutable and stack on one another, so deletion only hides the file in the final filesystem, while the data stays in the earlier layer. A secret mounted for the duration of `RUN` is not written to a layer.
    sources:
    - https://docs.docker.com/build/building/secrets/
    - https://docs.docker.com/build/building/best-practices/
  - id: docker-k8s-013
    level: junior
    type: single
    text: Що станеться з файлами, які застосунок записав у файлову систему контейнера, після `docker rm` цього контейнера (том не підключали, `VOLUME` в образі немає)?
    text_en: What happens to files an application wrote to the container filesystem after that container is removed with `docker rm` (no volume attached, no `VOLUME` in the image)?
    options:
    - text: Вони зникнуть разом із записуваним шаром контейнера
      text_en: They disappear together with the container's writable layer
      correct: true
    - text: Вони збережуться в образі й зʼявляться в кожному наступному контейнері з нього
      text_en: They are saved into the image and appear in every later container created from it
    - text: Вони залишаться на хості за тим самим шляхом, який застосунок використав усередині
      text_en: They stay on the host at the same path the application used inside the container
    - text: Вони перейдуть в автоматично створений іменований том із назвою контейнера
      text_en: They move into an automatically created named volume that carries the container's name
    explanation: |
      Запис іде в тонкий записуваний шар поверх незмінних шарів образу, і цей шар видаляється разом із контейнером. Дані, які мають пережити контейнер, кладуть у том (volume) або bind mount.
    explanation_en: |
      Writes go to a thin writable layer on top of the immutable image layers, and that layer is deleted together with the container. Data that must outlive the container goes into a volume or a bind mount.
    sources:
    - https://docs.docker.com/engine/storage/
    - https://docs.docker.com/engine/storage/volumes/
  - id: docker-k8s-014
    level: junior
    type: single
    text: 'Deployment вимагає `replicas: 3`, і один із його Pod-ів зникає разом із несправним вузлом. Що робить Kubernetes?'
    text_en: 'A Deployment requests `replicas: 3`, and one of its Pods is lost together with a failed node. What does Kubernetes do?'
    options:
    - text: ReplicaSet цього Deployment створює новий Pod, щоб знову було три
      text_en: The ReplicaSet of this Deployment creates a new Pod so that there are three again
      correct: true
    - text: Лишає два Pod-и, доки адміністратор не виконає `kubectl rollout restart` для Deployment
      text_en: Keeps two Pods until an administrator runs `kubectl rollout restart` for the Deployment
    - text: Переносить той самий Pod на інший вузол разом з його IP-адресою та вмістом памʼяті
      text_en: Moves the same Pod to another node together with its IP address and memory contents
    - text: Доручає Service створити відсутній Pod, бо Service стежить за кількістю своїх endpoints
      text_en: Asks the Service to create the missing Pod, because a Service watches its number of endpoints
    explanation: |
      Deployment керує ReplicaSet, а той постійно зводить фактичну кількість Pod-ів до бажаної. Pod не мігрує: створюється новий з новим іменем та IP. Service лише маршрутизує трафік і Pod-ів не створює.
    explanation_en: |
      A Deployment manages a ReplicaSet, which keeps reconciling the actual number of Pods to the desired one. A Pod does not migrate: a new one is created with a new name and IP. A Service only routes traffic and never creates Pods.
    sources:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
    - https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  - id: docker-k8s-015
    level: junior
    type: multiple
    text: Які твердження про ConfigMap і Secret у Kubernetes правильні?
    text_en: Which statements about ConfigMap and Secret in Kubernetes are true?
    options:
    - text: ConfigMap призначений для неконфіденційної конфігурації у вигляді пар ключ-значення
      text_en: A ConfigMap is meant for non-confidential configuration stored as key-value pairs
      correct: true
    - text: Pod може отримати ConfigMap як змінні середовища або як файли в змонтованому томі
      text_en: A Pod can consume a ConfigMap as environment variables or as files in a mounted volume
      correct: true
    - text: Значення в Secret закодовані base64, а це кодування, а не шифрування
      text_en: Values in a Secret are base64-encoded, which is an encoding and not encryption
      correct: true
    - text: Secret за замовчуванням зберігається в etcd зашифрованим без налаштування
      text_en: A Secret is stored in etcd encrypted by default without any additional configuration
    explanation: |
      ConfigMap і Secret передають конфігурацію в Pod однаковими способами, але Secret створений для конфіденційних даних. За замовчуванням його значення лежать в etcd незашифрованими, тож шифрування at rest вмикають окремо.
    explanation_en: |
      ConfigMap and Secret deliver configuration to a Pod in the same ways, but a Secret is meant for confidential data. By default its values sit in etcd unencrypted, so encryption at rest has to be enabled separately.
    sources:
    - https://kubernetes.io/docs/concepts/configuration/configmap/
    - https://kubernetes.io/docs/concepts/configuration/secret/
  - id: docker-k8s-016
    level: junior
    type: single
    text: 'Як сервіс `api` має звернутися до `db` у цьому `compose.yaml` із мережею за замовчуванням?'
    text_en: 'How should the `api` service reach `db` in this `compose.yaml` with the default network?'
    code:
      lang: yaml
      source: |
        services:
          api:
            image: my-api:1.0
          db:
            image: postgres:18
    options:
    - text: За іменем сервісу, тобто хост `db` і порт 5432, який слухає Postgres усередині мережі
      text_en: By the service name, that is host `db` and port 5432 that Postgres listens on inside the network
      correct: true
    - text: Через `localhost:5432`, бо контейнери одного Compose-проєкту ділять мережевий простір імен
      text_en: Through `localhost:5432`, because containers of one Compose project share a network namespace
    - text: Лише за IP-адресою контейнера `db`, яку треба взяти з `docker inspect` після запуску
      text_en: Only by the IP address of the `db` container, which has to be taken from `docker inspect` after startup
    - text: Через `host.docker.internal:5432`, бо контейнери Compose бачать одне одного лише через хост
      text_en: Through `host.docker.internal:5432`, because Compose containers see each other only through the host
    explanation: |
      Compose створює одну мережу проєкту й реєструє імʼя кожного сервісу у внутрішньому DNS, тому `db` розвʼязується в IP контейнера. `localhost` усередині `api` вказує на сам контейнер `api`, а не на `db`.
    explanation_en: |
      Compose creates one project network and registers each service name in its internal DNS, so `db` resolves to the container IP. Inside `api`, `localhost` points to the `api` container itself, not to `db`.
    sources:
    - https://docs.docker.com/compose/how-tos/networking/
  - id: docker-k8s-017
    level: middle
    type: single
    text: Образ зібрано з цього Dockerfile й запущено командою `docker run probe example.com`. Яка команда виконається в контейнері?
    text_en: The image was built from this Dockerfile and started with `docker run probe example.com`. Which command runs in the container?
    code:
      lang: dockerfile
      source: |
        FROM alpine:3.22
        ENTRYPOINT ["ping"]
        CMD ["-c", "1", "localhost"]
    options:
    - text: '`ping example.com`'
      text_en: '`ping example.com`'
      correct: true
    - text: '`ping -c 1 localhost example.com`'
      text_en: '`ping -c 1 localhost example.com`'
    - text: '`example.com`, яка замінить `ENTRYPOINT` разом із `CMD`'
      text_en: '`example.com`, which replaces both `ENTRYPOINT` and `CMD`'
    - text: '`ping -c 1 localhost`, а аргумент із командного рядка буде проігноровано'
      text_en: '`ping -c 1 localhost`, and the command line argument will be ignored'
    explanation: |
      Аргументи після імені образу в `docker run` повністю замінюють `CMD`, а `ENTRYPOINT` в exec-формі лишається й отримує їх як параметри. Тому `-c 1 localhost` зникає, а `example.com` додається до `ping`.
    explanation_en: |
      Arguments after the image name in `docker run` fully replace `CMD`, while an exec-form `ENTRYPOINT` stays and receives them as parameters. So `-c 1 localhost` disappears and `example.com` is appended to `ping`.
    sources:
    - https://docs.docker.com/reference/dockerfile/#understand-how-cmd-and-entrypoint-interact
  - id: docker-k8s-018
    level: middle
    type: multiple
    text: Які твердження про багатоетапну збірку (multi-stage build) Docker правильні?
    text_en: Which statements about a Docker multi-stage build are true?
    options:
    - text: Підсумковий образ містить лише шари останнього етапу та все, що в нього явно скопійовано
      text_en: The final image contains only the layers of the last stage and whatever was explicitly copied into it
      correct: true
    - text: Інструкція `COPY --from=build` бере файли з файлової системи раніше визначеного етапу `build`
      text_en: The `COPY --from=build` instruction takes files from the filesystem of the earlier stage named `build`
      correct: true
    - text: Команда `docker build --target build` збирає образ лише до етапу з іменем `build` включно
      text_en: The command `docker build --target build` builds the image only up to and including the stage named `build`
      correct: true
    - text: Усі етапи потрапляють у підсумковий образ, тож його розмір дорівнює сумі розмірів етапів
      text_en: All stages end up in the final image, so its size equals the sum of the sizes of all stages in the Dockerfile
    explanation: |
      Кожен `FROM` починає новий етап із чистою файловою системою, і лише останній стає образом, якщо не вказано `--target`. SDK й проміжні файли залишаються за його межами, тому образ менший, ніж сума етапів.
    explanation_en: |
      Each `FROM` starts a new stage with a clean filesystem, and only the last one becomes the image unless `--target` is given. The SDK and intermediate files stay outside it, so the image is smaller than the sum of the stages.
    sources:
    - https://docs.docker.com/build/building/multi-stage/
  - id: docker-k8s-019
    level: middle
    type: single
    text: Pod-и з цього Deployment мають статус `Running` і `Ready`, але запити до Service завершуються відмовою зʼєднання. Чому?
    text_en: The Pods of this Deployment are `Running` and `Ready`, yet requests to the Service fail with connection refused. Why?
    code:
      lang: yaml
      source: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: web
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: web-api
          template:
            metadata:
              labels:
                app: web-api
            spec:
              containers:
                - name: web
                  image: web:1.0
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: web
        spec:
          selector:
            app: web
          ports:
            - port: 80
              targetPort: 8080
    options:
    - text: 'Селектор Service `app: web` не збігається з мітками Pod-ів, тож у Service немає endpoints'
      text_en: 'The Service selector `app: web` does not match the Pod labels, so the Service has no endpoints'
      correct: true
    - text: Service типу ClusterIP не може вести трафік на Pod-и, які працюють на іншому вузлі
      text_en: A ClusterIP Service cannot send traffic to Pods that run on a different node
    - text: Поле `port` мусить дорівнювати `targetPort`, інакше Service відхиляє всі зʼєднання
      text_en: The `port` field must equal `targetPort`, otherwise the Service rejects every connection
    - text: Service вимагає, щоб Deployment мав таке саме імʼя `web-api`, як і значення мітки
      text_en: The Service requires the Deployment to have the same name `web-api` as the label value
    explanation: |
      Service обирає Pod-и лише за мітками селектора, а не за імʼям Deployment. Мітки `app: web-api` не збігаються з `app: web`, тому список endpoints порожній. `port` і `targetPort` можуть відрізнятися.
    explanation_en: |
      A Service selects Pods only by its label selector, not by the Deployment name. The labels `app: web-api` do not match `app: web`, so the endpoint list is empty. `port` and `targetPort` may differ.
    sources:
    - https://kubernetes.io/docs/concepts/services-networking/service/#services-in-kubernetes
    - https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
  - id: docker-k8s-020
    level: middle
    type: single
    text: У кластері кожен вузол має 4 доступні CPU, а Pod-и на ньому разом мають `requests.cpu` 3 при фактичному навантаженні близько 0,2 CPU. Новий Pod просить `requests.cpu` 2. Що станеться?
    text_en: Every node in a cluster has 4 allocatable CPUs, and the Pods on it together have `requests.cpu` of 3 while actually using about 0.2 CPU. A new Pod asks for `requests.cpu` 2. What happens?
    options:
    - text: Pod лишиться в стані `Pending`, бо планувальник рахує суму requests, а не фактичне використання
      text_en: The Pod stays `Pending`, because the scheduler counts the sum of requests, not actual usage
      correct: true
    - text: Pod запуститься на одному з вузлів, бо фактично вільно майже 4 CPU, а requests лише орієнтир
      text_en: The Pod starts on one of the nodes, because almost 4 CPUs are actually free and requests are only a hint
    - text: Pod запуститься, а kubelet обмежить його CPU до вільної частини вузла через CPU throttling
      text_en: The Pod starts, and the kubelet limits its CPU to the free part of the node through CPU throttling
    - text: Pod піде в `CrashLoopBackOff`, бо контейнер не отримає потрібних 2 CPU під час старту
      text_en: The Pod goes into `CrashLoopBackOff`, because the container will not get the needed 2 CPUs at startup
    explanation: |
      Планувальник розміщує Pod лише на вузол, де сума requests усіх Pod-ів плюс новий не перевищує allocatable. Фактичне споживання не враховується, тому вузол із requests 3 з 4 не приймає Pod із requests 2.
    explanation_en: |
      The scheduler places a Pod only on a node where the sum of all Pod requests plus the new one does not exceed allocatable. Actual consumption is not counted, so a node with requests of 3 out of 4 does not accept a Pod requesting 2.
    sources:
    - https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#how-pods-with-resource-requests-are-scheduled
  - id: docker-k8s-021
    level: senior
    type: multiple
    text: Для застосунку налаштовано PodDisruptionBudget. Які твердження про нього правильні?
    text_en: A PodDisruptionBudget is configured for an application. Which statements about it are true?
    options:
    - text: Він обмежує добровільні відселення через Eviction API, зокрема під час `kubectl drain`
      text_en: It limits voluntary evictions made through the Eviction API, including during `kubectl drain`
      correct: true
    - text: Пряме видалення Pod-а командою `kubectl delete pod` обходить бюджет і не блокується
      text_en: Deleting a Pod directly with `kubectl delete pod` bypasses the budget and is not blocked
      correct: true
    - text: Він не може запобігти апаратній несправності вузла, хоча такі Pod-и враховуються в бюджеті
      text_en: It cannot prevent a node hardware failure, although such Pods are counted against the budget
      correct: true
    - text: Якщо доступних Pod-ів стає менше за `minAvailable`, kubelet сам запускає додаткові контейнери
      text_en: If the number of available Pods drops below `minAvailable`, the kubelet starts extra containers itself
    explanation: |
      PDB діє лише на добровільні відселення через Eviction API: `kubectl drain` чекає, поки відселення не порушить бюджет. Він не захищає від аварій, і пряме видалення Pod-а чи Deployment його обходить. Нових Pod-ів PDB не створює.
    explanation_en: |
      A PDB only affects voluntary evictions made through the Eviction API: `kubectl drain` waits until an eviction would not violate the budget. It does not protect against failures, and deleting a Pod or a Deployment directly bypasses it. A PDB never creates new Pods.
    sources:
    - https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
  - id: docker-k8s-022
    level: senior
    type: single
    text: Для цього Deployment вийшла нова версія образу, у якої readiness probe ніколи не проходить. Що станеться з rollout?
    text_en: A new image version of this Deployment has a readiness probe that never passes. What happens to the rollout?
    code:
      lang: yaml
      source: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: shop
        spec:
          replicas: 3
          progressDeadlineSeconds: 120
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
    options:
    - text: Rollout застряне, три старі Pod-и лишаться готовими, а за 120 с стан стане `Progressing=False` без відкоту
      text_en: The rollout stalls, the old Pods stay ready, and after 120 s `Progressing=False` is set with no rollback
      correct: true
    - text: Через 120 с Deployment сам відкотиться до попередньої ревізії й видалить новий Pod
      text_en: After 120 s the Deployment rolls back to the previous revision on its own and deletes the new Pod
    - text: Старі Pod-и поступово видаляться, бо новий ReplicaSet має пріоритет над попереднім
      text_en: The old Pods are deleted gradually, because the new ReplicaSet has priority over the previous one
    - text: Кількість готових Pod-ів впаде до двох, бо одному старому Pod-у доведеться звільнити місце
      text_en: The number of ready Pods drops to two, because one old Pod has to make room for the new one
    explanation: |
      За `maxUnavailable: 0` старий Pod видаляють лише після того, як новий став готовим, тож трафік далі йде на стару версію. Після `progressDeadlineSeconds` контролер лише ставить умову `ProgressDeadlineExceeded` і сам не відкочує зміни.
    explanation_en: |
      With `maxUnavailable: 0` an old Pod is removed only after a new one becomes ready, so traffic keeps going to the old version. After `progressDeadlineSeconds` the controller only sets the `ProgressDeadlineExceeded` condition and does not roll back by itself.
    sources:
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#failed-deployment
    - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#max-unavailable
  - id: docker-k8s-023
    level: senior
    type: single
    text: StatefulSet `db` із трьома репліками має `volumeClaimTemplates` з іменем `data` і не задає `persistentVolumeClaimRetentionPolicy`. Його масштабують до 1, а потім назад до 3. Що відбувається?
    text_en: A StatefulSet `db` with three replicas has `volumeClaimTemplates` named `data` and does not set `persistentVolumeClaimRetentionPolicy`. It is scaled to 1 and then back to 3. What happens?
    options:
    - text: PVC `data-db-1` і `data-db-2` лишаються, а Pod-и `db-1` й `db-2` підключають їх з наявними даними
      text_en: PVCs `data-db-1` and `data-db-2` remain, and Pods `db-1` and `db-2` attach them with the existing data
      correct: true
    - text: PVC видаляються під час зменшення, тож нові `db-1` і `db-2` отримують порожні томи
      text_en: The PVCs are deleted on scale-down, so the new `db-1` and `db-2` get empty volumes
    - text: Нові Pod-и отримують випадкові імена та нові PVC, а старі PVC лишаються без власника
      text_en: The new Pods get random names and new PVCs, while the old PVCs are left without an owner
    - text: Pod-и `db-1` і `db-2` не стартують, доки адміністратор вручну не привʼяже старі PVC
      text_en: Pods `db-1` and `db-2` do not start until an administrator binds the old PVCs by hand
    explanation: |
      Pod-и StatefulSet мають стабільні порядкові імена, а PVC створюються за шаблоном і називаються на кшталт `data-db-1`. За замовчуванням політика зберігання — `Retain`, тож зменшення не видаляє томи, і Pod із тим самим номером повертається до своїх даних.
    explanation_en: |
      StatefulSet Pods have stable ordinal names, and PVCs are created from the template and named like `data-db-1`. The default retention policy is `Retain`, so scaling down does not delete the volumes, and a Pod with the same ordinal returns to its data.
    sources:
    - https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#persistentvolumeclaim-retention
    - https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#stable-storage
  - id: docker-k8s-024
    level: senior
    type: multiple
    text: Pod має два init-контейнери й один застосунковий контейнер. Які твердження про його запуск правильні?
    text_en: A Pod has two init containers and one application container. Which statements about its startup are true?
    options:
    - text: Init-контейнери виконуються по черзі, і кожен має завершитися успішно до старту наступного
      text_en: The init containers run one after another, and each must succeed before the next one starts
      correct: true
    - text: Застосунковий контейнер не стартує, доки всі init-контейнери не завершаться успішно
      text_en: The application container does not start until all init containers have completed successfully
      correct: true
    - text: Якщо `restartPolicy` Pod-а дорівнює `Never`, невдача init-контейнера робить увесь Pod невдалим
      text_en: If the Pod `restartPolicy` is `Never`, a failure of an init container makes the whole Pod fail
      correct: true
    - text: Init-контейнери стартують паралельно, щоб Pod швидше дійшов до запуску застосункового контейнера
      text_en: The init containers start in parallel, so that the Pod reaches the application container sooner
    explanation: |
      Звичайні init-контейнери виконуються послідовно до завершення, і лише потім стартують основні. Невдалий init-контейнер повторюють згідно з `restartPolicy`, а за `Never` Pod вважається невдалим. Паралельності між ними немає.
    explanation_en: |
      Regular init containers run sequentially to completion, and only then do the main containers start. A failed init container is retried according to `restartPolicy`, and with `Never` the Pod is considered failed. There is no parallelism between them.
    sources:
    - https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
