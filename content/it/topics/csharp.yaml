id: csharp
title: C#
title_en: C#
description: Типи, generics, LINQ, records, pattern matching, nullable reference types, делегати й події.
description_en: Types, generics, LINQ, records, pattern matching, nullable reference types, delegates and events.
icon: hash
questions:
  - id: csharp-001
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        var a = new Point(1, 2);
        var b = new Point(1, 2);
        Console.WriteLine(a == b);

        public record Point(int X, int Y);
    options:
      - text: "`True`"
        text_en: '`True`'
        correct: true
      - text: "`False`"
        text_en: '`False`'
      - text: "Помилка компіляції: для `record` оператор `==` не визначено"
        text_en: 'Compile error: `==` is not defined for `record`'
      - text: Виняток під час виконання
        text_en: Runtime exception
    explanation: >
      Для `record` компілятор генерує рівність за значеннями: екземпляри одного типу рівні,
      якщо рівні всі їхні властивості. Тому `a == b` дає `True`, хоча це два різні об'єкти.
    explanation_en: >
      For a `record`, the compiler generates value-based equality: instances of the same type are equal if all their properties are equal. So `a == b` gives `True`, even though they are two different objects.

  - id: csharp-002
    level: junior
    type: multiple
    text: Які з цих типів є типами-значеннями (value types)?
    text_en: Which of these types are value types?
    options:
      - text: "`int`"
        text_en: '`int`'
        correct: true
      - text: "`DateTime`"
        text_en: '`DateTime`'
        correct: true
      - text: "`string`"
        text_en: '`string`'
      - text: "`int[]`"
        text_en: '`int[]`'
      - text: "`object`"
        text_en: '`object`'
    explanation: >
      `int` (`System.Int32`) і `DateTime` — структури, тобто типи-значення.
      `string`, масиви й `object` — посилальні типи, хоча `string` незмінний і порівнюється за вмістом.
    explanation_en: >
      `int` (`System.Int32`) and `DateTime` are structs, i.e. value types. `string`, arrays, and `object` are reference types, even though `string` is immutable and compared by content.

  - id: csharp-003
    level: junior
    type: single
    text: Що означає `var` в оголошенні `var count = 10;`?
    text_en: What does `var` mean in the declaration `var count = 10;`?
    options:
      - text: Тип виводить компілятор з ініціалізатора, і далі він не змінюється
        text_en: The compiler infers the type from the initializer, and it does not change afterward
        correct: true
      - text: "Змінна стає `dynamic`, і її тип перевіряється лише під час виконання програми"
        text_en: The variable becomes `dynamic`, and its type is checked only at run time
      - text: "Змінна отримує тип `object`"
        text_en: The variable gets the type `object`
      - text: Тип змінної можна змінити наступним присвоєнням значення іншого типу
        text_en: The variable's type can be changed by a later assignment of a different type
    explanation: >
      `var` — неявна типізація: компілятор визначає тип з ініціалізатора, тут це `int`.
      Змінна так само строго типізована, ніби тип написали явно.
    explanation_en: >
      `var` is implicit typing: the compiler determines the type from the initializer, here `int`. The variable is just as strongly typed as if the type had been written explicitly.

  - id: csharp-004
    level: junior
    type: single
    text: Що означає тип `int?`?
    text_en: What does the type `int?` mean?
    options:
      - text: "Це `Nullable<int>`: змінна містить значення `int` або `null`"
        text_en: 'It is `Nullable<int>`: the variable holds an `int` value or `null`'
        correct: true
      - text: "Посилання на `int`, як параметр `ref int`"
        text_en: 'A reference to an `int`, like a `ref int` parameter'
      - text: "`int`, який компілятор не дозволяє лишати неініціалізованим"
        text_en: 'An `int` that the compiler does not allow to stay uninitialized'
      - text: "`int` без перевірки на переповнення"
        text_en: 'An `int` without overflow checking'
    explanation: >
      Для типу-значення `T?` — це скорочення для структури `Nullable<T>`. Вона зберігає значення
      і прапорець `HasValue`, тож може позначати відсутність значення.
    explanation_en: >
      For a value type, `T?` is shorthand for the `Nullable<T>` struct. It stores the value and a `HasValue` flag, so it can represent the absence of a value.

  - id: csharp-005
    level: middle
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        var numbers = new List<int> { 1, 2, 3 };
        var query = numbers.Where(n => n > 1);
        numbers.Add(4);
        Console.WriteLine(query.Count());
    options:
      - text: "`3`"
        text_en: '`3`'
        correct: true
      - text: "`2`"
        text_en: '`2`'
      - text: "`4`"
        text_en: '`4`'
      - text: "Виняток `InvalidOperationException`: колекцію змінено"
        text_en: '`InvalidOperationException`: the collection was modified'
    explanation: >
      `Where` виконується відкладено: запит лише описує фільтр, а колекцію проходить тоді, коли його перелічують.
      `Count()` перелічує список уже з елементом `4`, тож умову справджують 2, 3 і 4.
    explanation_en: >
      `Where` is deferred: the query only describes a filter and walks the collection when it is enumerated. `Count()` enumerates the list that already contains `4`, so 2, 3, and 4 satisfy the condition.

  - id: csharp-006
    level: middle
    type: multiple
    text: Які з цих LINQ-методів виконують запит одразу, а не відкладено?
    text_en: Which of these LINQ methods execute the query immediately rather than deferred?
    options:
      - text: "`ToList()`"
        text_en: '`ToList()`'
        correct: true
      - text: "`Count()`"
        text_en: '`Count()`'
        correct: true
      - text: "`First()`"
        text_en: '`First()`'
        correct: true
      - text: "`Where()`"
        text_en: '`Where()`'
      - text: "`Select()`"
        text_en: '`Select()`'
    explanation: >
      Методи, що повертають одне значення (`Count`, `First`) або матеріалізують колекцію (`ToList`),
      перелічують джерело одразу. `Where` і `Select` повертають новий запит, який виконається лише під час перелічення.
    explanation_en: >
      Methods that return a single value (`Count`, `First`) or materialize a collection (`ToList`) enumerate the source immediately. `Where` and `Select` return a new query that runs only when it is enumerated.

  - id: csharp-007
    level: middle
    type: single
    text: >
      У проєкті ввімкнено `<Nullable>enable</Nullable>`, а `TreatWarningsAsErrors` вимкнено.
      Що станеться з рядком `string name = null;`?
    text_en: The project has `<Nullable>enable</Nullable>` and `TreatWarningsAsErrors` is disabled. What happens with the line `string name = null;`?
    options:
      - text: Компілятор видасть попередження, а поведінка під час виконання не зміниться
        text_en: The compiler issues a warning, and run-time behavior does not change
        correct: true
      - text: Помилка компіляції, і проєкт не збереться, доки рядок не виправлять
        text_en: Compile error, and the project does not build until the line is fixed
      - text: "`NullReferenceException` одразу під час присвоєння значення `null`"
        text_en: '`NullReferenceException` immediately when `null` is assigned'
      - text: "Під час виконання замість `null` автоматично буде підставлено `string.Empty`"
        text_en: 'At run time `string.Empty` is substituted for `null` automatically'
    explanation: >
      Nullable reference types — це статичний аналіз: компілятор лише попереджає про можливий `null`.
      Поведінка програми під час виконання від цього не змінюється.
    explanation_en: >
      Nullable reference types are static analysis: the compiler only warns about a possible `null`. The program's run-time behavior does not change.

  - id: csharp-008
    level: middle
    type: single
    text: Чим подія (`event`) відрізняється від публічного поля-делегата?
    text_en: How does an event (`event`) differ from a public delegate field?
    options:
      - text: Ззовні можна лише підписатися (`+=`) чи відписатися (`-=`), а викликає подію лише сам клас
        text_en: Outside code can only subscribe (`+=`) or unsubscribe (`-=`), and only the class itself raises the event
        correct: true
      - text: Подія завжди викликає обробники асинхронно, кожен у окремому потоці з пулу
        text_en: An event always invokes handlers asynchronously, each on its own thread-pool thread
      - text: На подію може підписатися лише один обробник, а наступна підписка замінює попередню
        text_en: Only one handler can subscribe to an event, and a new subscription replaces the previous one
      - text: Подія не може передавати аргументи обробникам, окрім порожнього `EventArgs`
        text_en: An event cannot pass arguments to handlers other than an empty `EventArgs`
    explanation: >
      `event` обмежує доступ до делегата: зовнішній код не може викликати подію чи присвоїти їй значення через `=`
      і так стерти чужі підписки. Обробники викликаються синхронно, по черзі, у потоці, який викликав подію.
    explanation_en: >
      `event` restricts access to the delegate: external code cannot raise the event or assign to it with `=` and thereby wipe out other subscribers. Handlers are invoked synchronously, one after another, on the thread that raised the event.

  - id: csharp-009
    level: senior
    type: multiple
    text: Які з присвоєнь у варіантах скомпілюються з такими змінними?
    text_en: Which of the assignments in the options will compile with these variables?
    code:
      lang: csharp
      source: |
        List<string> list = new List<string> { "a", "b" };
        IEnumerable<string> strings = list;
        Action<object> printObject = o => Console.WriteLine(o);
        Func<object> makeObject = () => new object();
    options:
      - text: "`IEnumerable<object> objects = strings;`"
        text_en: '`IEnumerable<object> objects = strings;`'
        correct: true
      - text: "`Action<string> printString = printObject;`"
        text_en: '`Action<string> printString = printObject;`'
        correct: true
      - text: "`List<object> objectList = list;`"
        text_en: '`List<object> objectList = list;`'
      - text: "`Func<string> makeString = makeObject;`"
        text_en: '`Func<string> makeString = makeObject;`'
      - text: "`IList<object> objectIList = list;`"
        text_en: '`IList<object> objectIList = list;`'
    explanation: >
      `IEnumerable<out T>` коваріантний, а `Action<in T>` контраваріантний: послідовність рядків можна читати
      як послідовність `object`, а дія над `object` годиться для рядка. `List<T>` та `IList<T>` інваріантні,
      а `Func<out TResult>` дозволяє лише перехід від `Func<string>` до `Func<object>`, не навпаки.
    explanation_en: >
      `IEnumerable<out T>` is covariant and `Action<in T>` is contravariant: a sequence of strings can be read as a sequence of `object`, and an action on `object` fits a string. `List<T>` and `IList<T>` are invariant, and `Func<out TResult>` only allows going from `Func<string>` to `Func<object>`, not the other way.

  - id: csharp-010
    level: senior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        Console.WriteLine(new Holder().Next());

        struct Counter
        {
            public int Value;
            public void Increment() => Value++;
        }

        class Holder
        {
            private readonly Counter _counter = new();

            public int Next()
            {
                _counter.Increment();
                return _counter.Value;
            }
        }
    options:
      - text: "`0`"
        text_en: '`0`'
        correct: true
      - text: "`1`"
        text_en: '`1`'
      - text: "Помилка компіляції: `readonly`-поле не можна змінювати"
        text_en: 'Compile error: a `readonly` field cannot be modified'
      - text: Виняток під час виконання
        text_en: Runtime exception
    explanation: >
      Поле `readonly` не можна змінити поза конструктором, тому перед викликом звичайного (не `readonly`) методу
      структури компілятор робить захисну копію поля. `Increment` збільшує копію, а саме поле лишається `0`.
    explanation_en: >
      A `readonly` field cannot be changed outside a constructor, so before calling an ordinary (non-`readonly`) struct method the compiler makes a defensive copy of the field. `Increment` increments the copy, and the field itself stays `0`.

  - id: csharp-011
    level: senior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        var actions = new List<Action>();
        for (var i = 0; i < 3; i++)
        {
            actions.Add(() => Console.Write(i));
        }

        foreach (var action in actions)
        {
            action();
        }
    options:
      - text: "`333`"
        text_en: '`333`'
        correct: true
      - text: "`012`"
        text_en: '`012`'
      - text: "`222`"
        text_en: '`222`'
      - text: "Помилка компіляції: лямбда не може захоплювати змінну циклу"
        text_en: 'Compile error: a lambda cannot capture a loop variable'
    explanation: >
      Лямбда захоплює саму змінну, а не її значення. У циклі `for` змінна `i` одна на всі ітерації, і після циклу
      вона дорівнює 3. У `foreach` з C# 5 кожна ітерація має власну змінну, тому там лямбди побачили б різні значення.
    explanation_en: >
      A lambda captures the variable itself, not its value. In a `for` loop, `i` is a single variable shared by all iterations, and after the loop it equals 3. In `foreach` since C# 5, each iteration has its own variable, so there the lambdas would see different values.

  - id: csharp-012
    level: senior
    type: single
    text: Що дають `static abstract` члени інтерфейсів, які з'явилися в C# 11?
    text_en: What do the `static abstract` interface members introduced in C# 11 provide?
    options:
      - text: Тип мусить реалізувати статичні члени й оператори, а generic-код викликає їх як `T.Parse(...)`
        text_en: A type must implement the static members and operators, and generic code calls them as `T.Parse(...)`
        correct: true
      - text: Статичні члени можна викликати через змінну типу інтерфейсу, як віртуальні методи екземпляра
        text_en: Static members can be called through an interface-typed variable, like virtual instance methods
      - text: Інтерфейс задає статичну реалізацію за замовчуванням, яку типи не можуть перевизначити
        text_en: The interface supplies a default static implementation that types cannot override
      - text: Усі методи інтерфейсу автоматично стають статичними, тож екземпляр для їх виклику не потрібен
        text_en: All interface methods automatically become static, so no instance is needed to call them
    explanation: >
      На цьому побудовано generic math: `INumber<T>` вимагає від типу операторів і членів на кшталт `T.Zero`,
      і узагальнений метод викликає їх без екземпляра. Через екземпляр чи змінну інтерфейсу такі члени не викликаються.
    explanation_en: >
      Generic math is built on this: `INumber<T>` requires the type to provide operators and members such as `T.Zero`, and a generic method calls them without an instance. Such members cannot be called through an instance or an interface-typed variable.

  - id: csharp-013
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        string s = "abc";
        s.ToUpper();
        Console.WriteLine(s);
    options:
      - text: "`abc`"
        text_en: '`abc`'
        correct: true
      - text: "`ABC`"
        text_en: '`ABC`'
      - text: "`Abc`"
        text_en: '`Abc`'
      - text: 'Помилка компіляції: результат виклику `ToUpper()` не використано'
        text_en: 'Compile error: the result of the `ToUpper()` call is unused'
    explanation: >
      Рядки в .NET незмінні: `ToUpper()` не змінює `s`, а повертає новий рядок. Оскільки результат ніде не збережено,
      змінна `s` лишається `abc`. Викинутий результат компілятор помилкою не вважає.
    explanation_en: >
      Strings in .NET are immutable: `ToUpper()` does not modify `s` but returns a new string. Since the result is not stored anywhere, `s` stays `abc`. The compiler does not treat a discarded result as an error.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/strings/#immutability-of-strings

  - id: csharp-014
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        string? name = null;
        Console.WriteLine(name?.Length ?? -1);
    options:
      - text: "`-1`"
        text_en: '`-1`'
        correct: true
      - text: "`0`"
        text_en: '`0`'
      - text: "Порожній рядок, бо `null` перетворюється на текст"
        text_en: 'An empty line, because `null` is converted to text'
      - text: "`NullReferenceException` на зверненні до `Length`"
        text_en: '`NullReferenceException` when accessing `Length`'
    explanation: >
      Оператор `?.` для `null` не звертається до `Length`, а дає `null`. Далі `??` підставляє `-1`, бо ліва частина порожня.
      Тому винятку немає, а результат виразу — `int` зі значенням `-1`.
    explanation_en: >
      For a `null` operand, the `?.` operator does not access `Length` and yields `null`. Then `??` substitutes `-1` because its left side is null. So there is no exception, and the expression is an `int` with the value `-1`.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/member-access-operators#null-conditional-operators--and-
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/null-coalescing-operator

  - id: csharp-015
    level: junior
    type: multiple
    text: Які твердження про інтерфейси й абстрактні класи в C# правильні?
    text_en: Which statements about interfaces and abstract classes in C# are correct?
    options:
      - text: Клас може реалізувати кілька інтерфейсів, але успадковувати лише один клас
        text_en: A class can implement several interfaces but can inherit from only one class
        correct: true
      - text: Абстрактний клас може мати поля екземпляра й конструктор, а інтерфейс поля екземпляра мати не може
        text_en: An abstract class can have instance fields and a constructor, while an interface cannot have instance fields
        correct: true
      - text: Екземпляр абстрактного класу можна створити через `new`, якщо всі його методи мають тіло
        text_en: An instance of an abstract class can be created with `new` if all its methods have bodies
      - text: Інтерфейс може успадковувати лише один інший інтерфейс, як клас успадковує один клас
        text_en: An interface can inherit from only one other interface, just as a class inherits from one class
    explanation: >
      C# має одиночне успадкування класів, але множинну реалізацію інтерфейсів, і інтерфейс може розширювати кілька інтерфейсів.
      Абстрактний клас лишається класом: має стан і конструктор. Проте `abstract` забороняє `new` навіть тоді, коли абстрактних членів немає.
    explanation_en: >
      C# has single class inheritance but multiple interface implementation, and an interface can extend several interfaces. An abstract class remains a class: it has state and a constructor. However, `abstract` forbids `new` even when there are no abstract members.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/fundamentals/object-oriented/inheritance
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/interface

  - id: csharp-016
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        int a = 7, b = 2;
        Console.WriteLine(a / b);
        Console.WriteLine(a % b);
    options:
      - text: "`3`, потім `1` в окремому рядку"
        text_en: '`3`, then `1` on a separate line'
        correct: true
      - text: "`3.5`, потім `1` в окремому рядку"
        text_en: '`3.5`, then `1` on a separate line'
      - text: "`4`, потім `1` в окремому рядку"
        text_en: '`4`, then `1` on a separate line'
      - text: "`3`, потім `0.5` в окремому рядку"
        text_en: '`3`, then `0.5` on a separate line'
    explanation: >
      Коли обидва операнди `int`, оператор `/` виконує цілочисельне ділення й відкидає дробову частину (`7 / 2` дає `3`).
      Оператор `%` повертає остачу, тобто `1`. Щоб отримати `3.5`, один з операндів має бути `double`.
    explanation_en: >
      When both operands are `int`, the `/` operator performs integer division and discards the fractional part (`7 / 2` gives `3`). The `%` operator returns the remainder, which is `1`. To get `3.5`, one of the operands must be a `double`.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/arithmetic-operators#integer-division

  - id: csharp-017
    level: middle
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        int x = 7;
        var size = x switch
        {
            > 10 => "big",
            > 5 => "mid",
            _ => "small"
        };
        Console.WriteLine(size);
    options:
      - text: "`mid`"
        text_en: '`mid`'
        correct: true
      - text: "`big`"
        text_en: '`big`'
      - text: "`small`"
        text_en: '`small`'
      - text: "Помилка компіляції: гілка `> 5` перекривається гілкою `> 10`"
        text_en: 'Compile error: the `> 5` arm overlaps with the `> 10` arm'
    explanation: >
      Гілки `switch`-виразу перевіряються зверху вниз, виконується перша, що збіглася. Для `7` умова `> 10` хибна, а `> 5` істинна.
      Компілятор скаржиться лише на гілку, яку попередні вже повністю перекривають, а тут порядок коректний.
    explanation_en: >
      The arms of a `switch` expression are checked top to bottom and the first match runs. For `7`, `> 10` is false and `> 5` is true. The compiler complains only about an arm that earlier arms already fully cover, and here the order is valid.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/switch-expression
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/patterns#relational-patterns

  - id: csharp-018
    level: middle
    type: multiple
    text: Які твердження про `const` і `static readonly` для полів правильні?
    text_en: Which statements about `const` and `static readonly` fields are correct?
    options:
      - text: Значення `const` підставляється в код споживачів під час компіляції, тому їх треба перекомпілювати після зміни
        text_en: A `const` value is substituted into consumer code at compile time, so consumers must be recompiled after a change
        correct: true
      - text: "`static readonly` можна ініціалізувати значенням, яке обчислюється під час виконання, наприклад `DateTime.UtcNow`"
        text_en: '`static readonly` can be initialized with a value computed at run time, such as `DateTime.UtcNow`'
        correct: true
      - text: "`const` можна оголосити з типом `List<int>`, якщо присвоїти йому `new List<int>()` у ініціалізаторі"
        text_en: '`const` can be declared with type `List<int>` if it is assigned `new List<int>()` in the initializer'
      - text: "Поле `static readonly` можна присвоїти з будь-якого статичного методу класу, поки значення ще не читали"
        text_en: 'A `static readonly` field can be assigned from any static method of the class as long as the value has not been read yet'
    explanation: >
      `const` обмежений значеннями, відомими під час компіляції (числа, рядки, `null`), і вбудовується в IL споживачів.
      `static readonly` ініціалізується в ініціалізаторі чи статичному конструкторі, тож годиться для обчислюваних значень.
      Присвоїти його з довільного методу не можна.
    explanation_en: >
      `const` is limited to values known at compile time (numbers, strings, `null`) and is embedded in the IL of consumers. `static readonly` is initialized in an initializer or a static constructor, so it suits computed values. It cannot be assigned from an arbitrary method.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/const
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/readonly

  - id: csharp-019
    level: middle
    type: single
    text: Що станеться під час виконання цього коду?
    text_en: What happens when this code runs?
    code:
      lang: csharp
      source: |
        var seq = Gen(null);
        Console.WriteLine("created");
        foreach (var v in seq) { }

        static IEnumerable<int> Gen(string? name)
        {
            if (name is null) throw new ArgumentNullException(nameof(name));
            yield return 1;
        }
    options:
      - text: Спершу виведеться `created`, а виняток виникне лише в `foreach`
        text_en: '`created` is printed first, and the exception is thrown only in `foreach`'
        correct: true
      - text: Виняток виникне одразу на рядку `Gen(null)`, і `created` не виведеться
        text_en: The exception is thrown right at `Gen(null)`, and `created` is not printed
      - text: Виняток не виникне взагалі, бо `foreach` пропускає `null`-аргументи
        text_en: No exception is thrown at all, because `foreach` skips `null` arguments
      - text: Виведеться `created`, а виняток проковтне ітератор і колекція виявиться порожньою
        text_en: '`created` is printed, and the iterator swallows the exception so the sequence is empty'
    explanation: >
      Метод з `yield return` лише створює об'єкт-ітератор, а його тіло, разом із перевіркою аргументу, виконується
      під час першого `MoveNext()`. Тому перевірку аргументів виносять у зовнішній метод або локальну функцію.
    explanation_en: >
      A method with `yield return` only creates an iterator object, and its body, including the argument check, runs on the first `MoveNext()`. That is why argument validation is moved into an outer method or a local function.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/yield
      - https://learn.microsoft.com/en-us/dotnet/csharp/iterators

  - id: csharp-020
    level: middle
    type: single
    text: >
      Клас `Money` перевизначає `Equals` за значенням суми, але не перевизначає `GetHashCode`. Що станеться, якщо
      класти екземпляри `Money` у `HashSet<Money>`?
    text_en: >
      The `Money` class overrides `Equals` by amount but does not override `GetHashCode`. What happens if `Money`
      instances are put into a `HashSet<Money>`?
    options:
      - text: Два рівні за `Equals` об'єкти зазвичай потраплять у різні кошики, тож дублікат не знайдеться й додасться
        text_en: Two objects equal by `Equals` will usually land in different buckets, so the duplicate is not found and gets added
        correct: true
      - text: "`HashSet` викличе лише `Equals`, тому дублікати коректно відсіюються"
        text_en: '`HashSet` calls only `Equals`, so duplicates are filtered out correctly'
      - text: Код не скомпілюється, бо компілятор вимагає перевизначати обидва методи разом
        text_en: The code will not compile, because the compiler requires overriding both methods together
      - text: Під час додавання виникне `InvalidOperationException` про розбіжність `Equals` і `GetHashCode`
        text_en: An `InvalidOperationException` about the mismatch of `Equals` and `GetHashCode` is thrown on add
    explanation: >
      Хеш-колекції спершу обирають кошик за `GetHashCode()`, і `Equals` викликається лише для елементів з тим самим кошиком.
      Стандартний хеш посилальних типів залежить від ідентичності об'єкта, тож рівні значення мають різні хеші. Компілятор лише
      попереджає (CS0659), виняток не кидається.
    explanation_en: >
      Hash collections first pick a bucket by `GetHashCode()`, and `Equals` is called only for items in the same bucket. The default hash of reference types depends on object identity, so equal values have different hashes. The compiler only warns (CS0659), and no exception is thrown.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/api/system.object.gethashcode?view=net-10.0#remarks
      - https://learn.microsoft.com/en-us/dotnet/api/system.object.equals?view=net-10.0#notes-for-inheritors

  - id: csharp-021
    level: senior
    type: single
    text: Що станеться з цим кодом?
    text_en: What happens with this code?
    code:
      lang: csharp
      source: |
        var bot = new Bot();
        bot.Hello();

        interface IGreeter
        {
            void Hello() => Console.WriteLine("hi");
        }

        class Bot : IGreeter { }
    options:
      - text: "Помилка компіляції: `Hello` не є членом `Bot`, його видно лише через інтерфейс"
        text_en: 'Compile error: `Hello` is not a member of `Bot`, it is visible only through the interface'
        correct: true
      - text: "Виведеться `hi`, бо клас успадковує реалізацію методу за замовчуванням"
        text_en: '`hi` is printed, because the class inherits the default method implementation'
      - text: "Помилка компіляції: клас `Bot` мусить сам реалізувати `Hello`, інакше він не збереться"
        text_en: 'Compile error: class `Bot` must implement `Hello` itself, otherwise it will not build'
      - text: "Під час виконання виникне `NotImplementedException`, бо реалізації в класі немає"
        text_en: 'A `NotImplementedException` is thrown at run time, because the class has no implementation'
    explanation: >
      Реалізація методу за замовчуванням належить інтерфейсу і не стає членом класу. Тому `bot.Hello()` не компілюється,
      а `((IGreeter)bot).Hello()` або змінна типу `IGreeter` виведе `hi`. Реалізовувати метод у класі не обов'язково, саме для цього такі методи й додали.
    explanation_en: >
      A default interface implementation belongs to the interface and does not become a member of the class. So `bot.Hello()` does not compile, while `((IGreeter)bot).Hello()` or an `IGreeter` variable prints `hi`. The class is not required to implement the method, which is exactly why default methods were added.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/interface#default-interface-members
      - https://learn.microsoft.com/en-us/dotnet/csharp/advanced-topics/interface-implementation/default-interface-methods-versions

  - id: csharp-022
    level: senior
    type: multiple
    text: >
      Дано `record P(string Name, List<int> Items)` (клас) і `record B(int X, int Y)` та `record D(int X, int Y) : B(X, Y)`.
      Які твердження правильні?
    text_en: >
      Given `record P(string Name, List<int> Items)` (a class), `record B(int X, int Y)` and `record D(int X, int Y) : B(X, Y)`.
      Which statements are correct?
    options:
      - text: Вираз `p with { Name = "b" }` робить поверхневу копію, тож `Items` у копії вказує на той самий список
        text_en: The expression `p with { Name = "b" }` makes a shallow copy, so `Items` in the copy points to the same list
        correct: true
      - text: Два екземпляри `P` з однаковим `Name` і різними списками з однаковим вмістом не рівні за `==`
        text_en: Two `P` instances with the same `Name` and different lists with identical contents are not equal by `==`
        correct: true
      - text: "`new B(1, 2).Equals(new D(1, 2))` повертає `true`, бо всі властивості збігаються"
        text_en: '`new B(1, 2).Equals(new D(1, 2))` returns `true`, because all properties match'
      - text: Вираз `with` глибоко клонує вкладені об'єкти, тож зміна копії не торкається оригіналу
        text_en: The `with` expression deeply clones nested objects, so changing the copy does not affect the original
    explanation: >
      Згенерована рівність порівнює кожну властивість через її `Equals`, а `List<T>` порівнюється за посиланням, тому вміст не враховується.
      `with` копіює поля поверхнево. Рівність також порівнює `EqualityContract`, тобто точний тип, тож `B` і `D` не рівні.
    explanation_en: >
      The generated equality compares each property through its own `Equals`, and `List<T>` compares by reference, so contents are not considered. `with` copies fields shallowly. Equality also compares `EqualityContract`, i.e. the exact type, so `B` and `D` are not equal.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/builtin-types/record#value-equality
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/with-expression#nondestructive-mutation

  - id: csharp-023
    level: senior
    type: single
    text: >
      Цей код компілюється, а `List<object> l = new List<string>();` — ні. Що станеться на другому рядку під час виконання?
    text_en: >
      This code compiles, while `List<object> l = new List<string>();` does not. What happens on the second line at run time?
    code:
      lang: csharp
      source: |
        object[] arr = new string[1];
        arr[0] = 1;
    options:
      - text: "`ArrayTypeMismatchException`: масив перевіряє тип кожного запису"
        text_en: '`ArrayTypeMismatchException`: the array checks the type of every store'
        correct: true
      - text: "Число `1` автоматично перетвориться на рядок `\"1\"`, і код спрацює"
        text_en: 'The number `1` is converted to the string `"1"` automatically, and the code works'
      - text: "`InvalidCastException`: перевіряється приведення `arr` до `string[]`"
        text_en: '`InvalidCastException`: the cast of `arr` to `string[]` is checked'
      - text: "Масив тихо перетвориться на `object[]` з копіюванням, і запис пройде"
        text_en: 'The array is silently converted to `object[]` by copying, and the store succeeds'
    explanation: >
      Масиви посилальних типів коваріантні ще з C# 1, тому присвоєння компілюється. Об'єкт лишається `string[]`, і середовище виконання
      перевіряє тип під час запису, а узагальнені колекції зроблено інваріантними, щоб не мати цієї пастки.
    explanation_en: >
      Arrays of reference types have been covariant since C# 1, so the assignment compiles. The object remains a `string[]`, and the runtime checks the type on each store, while generic collections were made invariant to avoid this trap.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/concepts/covariance-contravariance/#covariance-for-arrays
      - https://learn.microsoft.com/en-us/dotnet/api/system.arraytypemismatchexception?view=net-10.0

  - id: csharp-024
    level: senior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        Box<int>.Count++;
        Box<string>.Count++;
        Box<int>.Count++;
        Console.WriteLine($"{Box<int>.Count} {Box<string>.Count}");

        class Box<T>
        {
            public static int Count;
        }
    options:
      - text: "`2 1`"
        text_en: '`2 1`'
        correct: true
      - text: "`3 3`"
        text_en: '`3 3`'
      - text: "`2 2`"
        text_en: '`2 2`'
      - text: "Помилка компіляції: узагальнений клас не може мати статичних полів"
        text_en: 'Compile error: a generic class cannot have static fields'
    explanation: >
      Кожен закритий конструйований тип, як-от `Box<int>` чи `Box<string>`, має власний набір статичних полів.
      Тому лічильники незалежні, а статичні поля в узагальнених класах цілком дозволені.
    explanation_en: >
      Each closed constructed type, such as `Box<int>` or `Box<string>`, has its own set of static fields. So the counters are independent, and static fields in generic classes are perfectly allowed.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/generics/generics-and-attributes
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/language-specification/classes#1558-static-and-instance-members
