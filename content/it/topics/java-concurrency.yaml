id: java-concurrency
title: Багатопотоковість у Java
title_en: Concurrency in Java
description: Thread, ExecutorService, CompletableFuture, synchronized, java.util.concurrent, virtual threads.
description_en: Thread, ExecutorService, CompletableFuture, synchronized, java.util.concurrent, virtual threads.
icon: gitmerge
questions:
  - id: java-concurrency-001
    level: junior
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        Thread t = new Thread(
            () -> System.out.println("in " + Thread.currentThread().getName()),
            "worker");
        t.run();
        t.start();
        t.join();
    options:
      - text: "`in main`, потім `in worker`"
        text_en: "`in main`, then `in worker`"
        correct: true
      - text: "`in worker` двічі"
        text_en: "`in worker` twice"
      - text: "`in worker`, потім `in main`"
        text_en: "`in worker`, then `in main`"
      - text: "`in main` двічі"
        text_en: "`in main` twice"
    explanation: >
      `run()` — звичайний виклик методу в поточному потоці (тут `main`), а новий потік створює лише `start()`.
      Тому перший рядок друкує `main`, а другий — `worker`; порядок підтверджено запуском.
    explanation_en: >
      `run()` is an ordinary method call on the current thread (here `main`); only `start()` creates a new thread. So the first line prints `main` and the second prints `worker`; the order was confirmed by running it.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Thread.html#start()
  - id: java-concurrency-002
    level: junior
    type: multiple
    text: Що гарантує `synchronized` у Java?
    text_en: "What does `synchronized` guarantee in Java?"
    options:
      - text: Одночасно лише один потік може тримати монітор того самого об'єкта
        text_en: "Only one thread at a time can hold the monitor of the same object"
        correct: true
      - text: Зміни, зроблені потоком до виходу з блоку, видимі наступному потоку, що входить у блок на тому ж моніторі
        text_en: "Changes made by a thread before leaving the block are visible to the next thread entering a block on the same monitor"
        correct: true
      - text: Потоки входять у блок у тому порядку, у якому звернулися до нього (чесна черга)
        text_en: "Threads enter the block in the order in which they requested it (a fair queue)"
      - text: Синхронізований метод екземпляра блокує всі синхронізовані методи будь-яких об'єктів цього класу
        text_en: "A synchronized instance method blocks all synchronized methods of any objects of this class"
    explanation: >
      Монітор дає взаємне виключення й видимість: розблокування монітора відбувається раніше за наступне блокування того самого монітора.
      Порядок входу при цьому не гарантується, а метод екземпляра блокує лише монітор свого об'єкта (`this`), а не всього класу.
    explanation_en: >
      A monitor provides mutual exclusion and visibility: unlocking a monitor happens-before every subsequent lock of that same monitor. Entry order is not guaranteed, and an instance method locks only the monitor of its own object (`this`), not of the whole class.
    sources:
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html#jls-17.4.5
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-14.html#jls-14.19
  - id: java-concurrency-003
    level: junior
    type: single
    text: Що станеться після того, як `main` завершить цей код (Java 25)?
    text_en: "What happens after `main` finishes this code (Java 25)?"
    code:
      lang: java
      source: |
        ExecutorService ex = Executors.newFixedThreadPool(2);
        ex.submit(() -> System.out.println("done")).get();
        System.out.println("main end");
    options:
      - text: Програма надрукує обидва рядки, але JVM не завершиться, бо потоки пулу не є демонами
        text_en: "Both lines print, but the JVM does not exit, because pool threads are not daemons"
        correct: true
      - text: Програма надрукує обидва рядки й одразу завершиться, бо `main` закінчився
        text_en: "The program prints both lines and exits right away, because `main` has finished"
      - text: Пул сам закриється, бо завдання виконано
        text_en: "The pool closes itself, because the task is done"
      - text: Програма викине `RejectedExecutionException`
        text_en: "The program throws `RejectedExecutionException`"
    explanation: >
      Потоки з фабрики за замовчуванням — не демони, тому живий пул тримає JVM, доки не буде викликано `shutdown()`. Неактивний `ExecutorService` слід закривати.
      Під час запуску з обмеженням у 4 секунди програма надрукувала обидва рядки й була зупинена таймером.
    explanation_en: >
      Threads from the default factory are not daemons, so a live pool keeps the JVM running until `shutdown()` is called. An unused `ExecutorService` should be closed. When run with a 4-second limit, the program printed both lines and was stopped by the timer.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ExecutorService.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Executors.html#defaultThreadFactory()
  - id: java-concurrency-004
    level: junior
    type: single
    text: Чому цей код (Java 25) зазвичай друкує число менше за 200000?
    text_en: "Why does this code (Java 25) usually print a number below 200000?"
    code:
      lang: java
      source: |
        static int c = 0;
        Runnable r = () -> { for (int i = 0; i < 100_000; i++) c++; };
        Thread t1 = new Thread(r), t2 = new Thread(r);
        t1.start(); t2.start();
        t1.join(); t2.join();
        System.out.println(c);
    options:
      - text: "`c++` — читання, збільшення й запис, тож оновлення двох потоків перекриваються"
        text_en: "`c++` is a read, an increment and a write, so the updates of the two threads overlap"
        correct: true
      - text: "Потік `t2` починає з нуля, бо `c` копіюється в кожен потік під час створення"
        text_en: "Thread `t2` starts from zero, because `c` is copied into each thread when it is created"
      - text: "Метод `join()` завершує потоки раніше, ніж вони закінчать свій цикл"
        text_en: "The `join()` method ends the threads before they finish their loop"
      - text: "Цикл у кожного потоку виконується менше 100000 разів через рішення планувальника"
        text_en: "Each thread's loop runs fewer than 100000 times because of scheduler decisions"
    explanation: >
      `c++` не атомарна, тому два потоки можуть прочитати те саме значення й записати однакове нове. Лічильник слід захистити `synchronized` або замінити на `AtomicInteger`.
      У запуску вийшло 149253.
    explanation_en: >
      `c++` is not atomic, so two threads can read the same value and write back the same new one. The counter should be protected with `synchronized` or replaced with `AtomicInteger`. The run printed 149253.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/atomic/package-summary.html
  - id: java-concurrency-005
    level: middle
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        static int load() { throw new IllegalStateException("boom"); }

        CompletableFuture.supplyAsync(Main::load)
            .thenApply(x -> x + 1)
            .exceptionally(ex -> {
                System.out.println(ex.getClass().getSimpleName()
                    + " / " + ex.getCause().getClass().getSimpleName());
                return -1;
            })
            .join();
    options:
      - text: "`CompletionException / IllegalStateException`"
        text_en: "`CompletionException / IllegalStateException`"
        correct: true
      - text: "`IllegalStateException`, а далі `NullPointerException` на `getCause()`"
        text_en: "`IllegalStateException`, then `NullPointerException` on `getCause()`"
      - text: "`ExecutionException / IllegalStateException`"
        text_en: "`ExecutionException / IllegalStateException`"
      - text: "`CompletionException / CompletionException`"
        text_en: "`CompletionException / CompletionException`"
    explanation: >
      Виняток із залежної стадії передається далі, загорнутий у `CompletionException`, тож в `exceptionally` приходить обгортка, а справжня причина лежить у `getCause()`. `ExecutionException` кидає `get()`, а не стадія.
      Поведінку підтверджено запуском еквівалентного коду.
    explanation_en: >
      An exception from a dependent stage is propagated wrapped in a `CompletionException`, so `exceptionally` receives the wrapper and the real cause is in `getCause()`. `ExecutionException` is thrown by `get()`, not by the stage. The behavior was confirmed by running equivalent code.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CompletionStage.html#exceptionally(java.util.function.Function)
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CompletableFuture.html
  - id: java-concurrency-006
    level: middle
    type: single
    text: Що може піти не так у цьому коді (Java 25)?
    text_en: "What can go wrong in this code (Java 25)?"
    code:
      lang: java
      source: |
        static boolean stop = false;

        Thread t = new Thread(() -> {
            long n = 0;
            while (!stop) n++;
        });
        t.start();
        Thread.sleep(500);
        stop = true;
        t.join();
    options:
      - text: "Потік може ніколи не побачити `stop = true`, бо поле не `volatile`, і тоді `join()` зависне"
        text_en: "The thread may never see `stop = true`, because the field is not `volatile`, and then `join()` hangs"
        correct: true
      - text: Запис у `boolean` не атомарний, тому потік побачить напівзаписане значення
        text_en: "A write to a `boolean` is not atomic, so the thread will see a half-written value"
      - text: Код не скомпілюється, бо змінна, що змінюється в іншому потоці, мусить бути `final`
        text_en: "The code does not compile, because a variable modified in another thread must be `final`"
      - text: Виклик `Thread.sleep` скидає кеш потоку, тож зміна завжди буде помічена
        text_en: "Calling `Thread.sleep` flushes the thread's cache, so the change will always be noticed"
    explanation: >
      Без `volatile` чи синхронізації між записом і читанням немає відношення happens-before, і JIT має право винести читання `stop` з циклу. Достатньо оголосити `volatile boolean stop`.
      Під час запуску потік після 2 секунд очікування `join` ще працював.
    explanation_en: >
      Without `volatile` or synchronization there is no happens-before relationship between the write and the read, and the JIT may hoist the read of `stop` out of the loop. Declaring `volatile boolean stop` is enough. In the run, the thread was still running after waiting 2 seconds for `join`.
    sources:
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html#jls-17.4.5
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.3.1.4
  - id: java-concurrency-007
    level: middle
    type: single
    text: Чому цей код небезпечний, хоча `cache` є `ConcurrentHashMap` (Java 25)?
    text_en: "Why is this code unsafe even though `cache` is a `ConcurrentHashMap` (Java 25)?"
    code:
      lang: java
      source: |
        if (!cache.containsKey(key)) {
            cache.put(key, load(key));
        }
    options:
      - text: "Між `containsKey` і `put` інший потік може вставити значення; потрібен `computeIfAbsent`"
        text_en: "Another thread can insert a value between `containsKey` and `put`; `computeIfAbsent` is needed"
        correct: true
      - text: Метод `put` у `ConcurrentHashMap` не потокобезпечний, тож потрібен зовнішній замок
        text_en: "The `put` method of `ConcurrentHashMap` is not thread-safe, so an external lock is needed"
      - text: Метод `containsKey` блокує всю таблицю, тому код працює повільно, а не неправильно
        text_en: "The `containsKey` method locks the whole table, so the code is slow rather than wrong"
      - text: Метод `containsKey` повертає застарілі дані, бо `ConcurrentHashMap` кешує результат
        text_en: "The `containsKey` method returns stale data, because `ConcurrentHashMap` caches the result"
    explanation: >
      Кожна окрема операція `ConcurrentHashMap` потокобезпечна, але послідовність «перевірити, потім діяти» — ні, і `load` може виконатись двічі або затерти чуже значення.
      `computeIfAbsent` та `putIfAbsent` виконують перевірку й вставку атомарно.
    explanation_en: >
      Each individual `ConcurrentHashMap` operation is thread-safe, but a "check, then act" sequence is not, and `load` may run twice or overwrite another thread's value. `computeIfAbsent` and `putIfAbsent` perform the check and the insertion atomically.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html#computeIfAbsent(K,java.util.function.Function)
  - id: java-concurrency-008
    level: middle
    type: multiple
    text: Які твердження про обробку винятків у завданнях `ThreadPoolExecutor` правильні (Java 25)?
    text_en: "Which statements about exception handling in `ThreadPoolExecutor` tasks are true (Java 25)?"
    options:
      - text: "Виняток із `submit` зберігається у `Future` і виходить із `get()` як `ExecutionException`"
        text_en: "An exception from `submit` is stored in the `Future` and comes out of `get()` as an `ExecutionException`"
        correct: true
      - text: "Виняток із `execute` не потрапляє у `Future`, а йде в обробник необроблених винятків потоку"
        text_en: "An exception from `execute` does not reach a `Future`; it goes to the thread's uncaught exception handler"
        correct: true
      - text: "Якщо не викликати `get()`, виняток із `submit` усе одно буде надруковано в `stderr` потоком пулу"
        text_en: "If `get()` is never called, an exception from `submit` is still printed to `stderr` by the pool thread"
      - text: "Метод `get()` кидає оригінальний виняток завдання напряму, без жодної обгортки `ExecutionException`"
        text_en: "The `get()` method throws the task's original exception directly, with no `ExecutionException` wrapper"
    explanation: >
      `submit` повертає `Future`, який «поглинає» виняток, тож без `get()` про збій нічого не видно. `execute` жодного `Future` не має, тому виняток доходить до `UncaughtExceptionHandler`, а у виводі видно стек із потоку `pool-1-thread-1`.
      Це підтверджено запуском.
    explanation_en: >
      `submit` returns a `Future` that "swallows" the exception, so without `get()` nothing shows the failure. `execute` has no `Future`, so the exception reaches the `UncaughtExceptionHandler`, and the output shows the stack trace from thread `pool-1-thread-1`. This was confirmed by running it.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Future.html#get()
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ThreadPoolExecutor.html
  - id: java-concurrency-009
    level: senior
    type: multiple
    text: Які твердження про віртуальні потоки в Java 25 правильні?
    text_en: "Which statements about virtual threads in Java 25 are true?"
    options:
      - text: "Для блокуючого I/O на кожну задачу створюють новий віртуальний потік, без пулу"
        text_en: "For blocking I/O, a new virtual thread is created for each task, without a pool"
        correct: true
      - text: "У Java 25 блокування в `synchronized` здебільшого не прив'язує потік до носія (JEP 491)"
        text_en: "In Java 25, blocking inside `synchronized` mostly does not pin the thread to its carrier (JEP 491)"
        correct: true
      - text: Віртуальні потоки прискорюють CPU-важкі обчислення, бо їх можна створити більше, ніж ядер
        text_en: "Virtual threads speed up CPU-heavy computations, because more of them can be created than there are cores"
      - text: "Одночасно може існувати не більше віртуальних потоків, ніж ядер процесора на сервері"
        text_en: "At any time there can be no more virtual threads than the server has processor cores"
    explanation: >
      Віртуальні потоки дешеві, тож їх не пулять, а обмежують паралелізм, наприклад, семафором. Вони виграють на задачах, що здебільшого чекають, а для CPU-навантаження бракує ядер, а не потоків.
      Починаючи з Java 24 `synchronized` більше не призводить до pinning у переважній більшості випадків.
    explanation_en: >
      Virtual threads are cheap, so they are not pooled; concurrency is limited instead, for example with a semaphore. They pay off on tasks that mostly wait, while for CPU-bound work it is cores that are lacking, not threads. Since Java 24, `synchronized` no longer causes pinning in the vast majority of cases.
    sources:
      - https://openjdk.org/jeps/491
      - https://openjdk.org/jeps/444
  - id: java-concurrency-010
    level: senior
    type: single
    text: Сервіс завис, а два потоки стоять у стані BLOCKED. Яким є найшвидший спосіб підтвердити взаємне блокування (deadlock) і яке виправлення правильне (Java 25)?
    text_en: "A service hung and two threads are in the BLOCKED state. What is the fastest way to confirm a deadlock, and which fix is correct (Java 25)?"
    code:
      lang: java
      source: |
        new Thread(() -> { synchronized (A) { pause(); synchronized (B) { } } }, "t1").start();
        new Thread(() -> { synchronized (B) { pause(); synchronized (A) { } } }, "t2").start();
    options:
      - text: "Зняти дамп потоків через `jcmd <pid> Thread.print` і узгодити порядок замків"
        text_en: "Take a thread dump with `jcmd <pid> Thread.print` and make the lock order consistent"
        correct: true
      - text: "Викликати `interrupt()` на заблокованих потоках, бо переривання знімає очікування монітора"
        text_en: "Call `interrupt()` on the blocked threads, because interruption ends the wait for a monitor"
      - text: "Збільшити розмір стека `-Xss`, бо глибока вкладеність викликів тримає замки в потоках"
        text_en: "Increase the stack size with `-Xss`, because deep call nesting holds the locks in the threads"
      - text: Замінити `synchronized` на `volatile` у полях `A` і `B`
        text_en: "Replace `synchronized` with `volatile` on the fields `A` and `B`"
    explanation: >
      Дамп потоків показує, хто який монітор тримає й чекає, а JVM прямо повідомляє про цикл очікування. Цикл розривається єдиним порядком захоплення замків (або одним замком).
      `interrupt()` не виводить потік з очікування монітора. У запуску `jcmd` вивів `Found one Java-level deadlock` для `t1` і `t2`.
    explanation_en: >
      A thread dump shows who holds which monitor and who is waiting, and the JVM reports the wait cycle directly. The cycle is broken by a single lock acquisition order (or one lock). `interrupt()` does not pull a thread out of a monitor wait. In the run, `jcmd` printed `Found one Java-level deadlock` for `t1` and `t2`.
    sources:
      - https://docs.oracle.com/en/java/javase/25/troubleshoot/troubleshooting-hanging-or-looping-process.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Thread.html#interrupt()
  - id: java-concurrency-011
    level: senior
    type: single
    text: Чому цей варіант double-checked locking без `volatile` вважають небезпечним (Java 25)?
    text_en: "Why is this double-checked locking variant without `volatile` considered unsafe (Java 25)?"
    code:
      lang: java
      source: |
        private static Config inst;

        static Config get() {
            if (inst == null) {
                synchronized (Holder.class) {
                    if (inst == null) inst = new Config();
                }
            }
            return inst;
        }
    options:
      - text: "Потік може побачити не `null`, але об'єкт із ще не видимими полями"
        text_en: "A thread may see a non-`null` reference to an object whose fields are not yet visible"
        correct: true
      - text: Другий потік завжди створить другий екземпляр, бо `synchronized` не захищає статичні поля
        text_en: "A second thread will always create a second instance, because `synchronized` does not protect static fields"
      - text: Перевірка `inst == null` поза блоком спричиняє deadlock
        text_en: "The `inst == null` check outside the block causes a deadlock"
      - text: "`synchronized (Holder.class)` недопустимий у статичному методі"
        text_en: "`synchronized (Holder.class)` is not allowed in a static method"
    explanation: >
      Запис посилання `inst` і запис полів нового об'єкта можуть стати видимими іншому потокові в іншому порядку, бо читання поза монітором не утворює happens-before. Виправлення — `volatile` на `inst` або ініціалізація через клас-холдер.
      Другий потік, що зайде в монітор, побачить уже встановлене значення, тож «другий екземпляр» не виникає.
    explanation_en: >
      The write of the `inst` reference and the writes of the new object's fields may become visible to another thread in a different order, because a read outside the monitor creates no happens-before. The fix is `volatile` on `inst` or initialization through a holder class. A second thread entering the monitor sees the value already set, so a "second instance" does not appear.
    sources:
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html#jls-17.4.5
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.3.1.4
  - id: java-concurrency-012
    level: senior
    type: single
    text: >-
      Пул створено як на коді нижче, і в нього поспіль подано 10 завдань по 100 мс. Скільки потоків він використає і чому (Java 25)?
    text_en: "The pool is created as in the code below, and 10 tasks of 100 ms each are submitted back to back. How many threads will it use, and why (Java 25)?"
    code:
      lang: java
      source: |
        var ex = new ThreadPoolExecutor(
            2, 4, 60, TimeUnit.SECONDS,
            new LinkedBlockingQueue<>());
    options:
      - text: "Два: після `corePoolSize` завдання йдуть у необмежену чергу, тож `maximumPoolSize` не використовується"
        text_en: "Two: after `corePoolSize`, tasks go to the unbounded queue, so `maximumPoolSize` is never used"
        correct: true
      - text: Чотири, бо надлишкові завдання одразу розширюють пул до максимуму
        text_en: "Four, because excess tasks immediately grow the pool to its maximum"
      - text: Десять, бо кожне завдання отримує власний потік
        text_en: "Ten, because each task gets its own thread"
      - text: Чотири, бо пул спершу заповнює чергу, а потім розширюється, поки не вичерпається `keepAliveTime`
        text_en: "Four, because the pool first fills the queue and then grows until `keepAliveTime` runs out"
    explanation: >
      Спершу пул створює потоки до `corePoolSize`, далі віддає перевагу черзі, а новий потік понад ядро додає лише тоді, коли чергу неможливо поповнити. Необмежена `LinkedBlockingQueue` не заповнюється, тож пул не виходить за 2 потоки.
      Запуск показав `threads=2`, а з `ArrayBlockingQueue(2)` — чотири потоки й відмови після переповнення.
    explanation_en: >
      The pool first creates threads up to `corePoolSize`, then prefers queuing, and adds a thread beyond the core only when the queue cannot accept the task. An unbounded `LinkedBlockingQueue` never fills up, so the pool never goes beyond 2 threads. The run showed `threads=2`, and with `ArrayBlockingQueue(2)` it showed four threads and rejections after overflow.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ThreadPoolExecutor.html
  - id: java-concurrency-013
    level: junior
    type: single
    text: Що станеться під час виконання цього коду в `main` (Java 25)?
    text_en: "What happens when this code runs in `main` (Java 25)?"
    code:
      lang: java
      source: |
        Object lock = new Object();
        lock.wait();
    options:
      - text: "`IllegalMonitorStateException`, бо `wait()` викликано без володіння монітором `lock`"
        text_en: "`IllegalMonitorStateException`, because `wait()` was called without owning the monitor of `lock`"
        correct: true
      - text: "Потік заблокується назавжди, бо ніхто не викличе `notify()` на цьому `lock`"
        text_en: "The thread blocks forever, because nobody will call `notify()` on this `lock`"
      - text: "`InterruptedException` одразу, бо потік `main` не має права чекати на об'єкті"
        text_en: "`InterruptedException` right away, because the `main` thread is not allowed to wait on an object"
      - text: "Помилка компіляції, бо `wait()` дозволено викликати лише всередині блоку `synchronized`"
        text_en: "A compile error, because `wait()` may only be called inside a `synchronized` block"
    explanation: >
      `wait()`, `notify()` і `notifyAll()` потрібно викликати, тримаючи монітор цього самого об'єкта, інакше під час виконання кидається `IllegalMonitorStateException`. Компілятор такої вимоги не перевіряє, тому це помилка часу виконання, а не компіляції.
    explanation_en: >
      `wait()`, `notify()` and `notifyAll()` must be called while holding the monitor of that same object, otherwise `IllegalMonitorStateException` is thrown at run time. The compiler does not check this requirement, so it is a run-time error rather than a compile error.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#wait()
  - id: java-concurrency-014
    level: junior
    type: multiple
    text: Які твердження про завершення `ExecutorService` правильні (Java 25)?
    text_en: "Which statements about shutting down an `ExecutorService` are true (Java 25)?"
    options:
      - text: "Після `shutdown()` нові завдання не приймаються, а вже подані (і ті, що в черзі) ще виконуються"
        text_en: "After `shutdown()` new tasks are rejected, while already submitted ones (including queued ones) still run"
        correct: true
      - text: "`shutdownNow()` повертає список завдань, що чекали в черзі й так і не почали виконання"
        text_en: "`shutdownNow()` returns the list of tasks that were waiting in the queue and never started"
        correct: true
      - text: "`shutdown()` блокує поточний потік, доки всі подані завдання не завершаться"
        text_en: "`shutdown()` blocks the current thread until all submitted tasks have finished"
      - text: "`shutdownNow()` гарантовано зупиняє завдання, що вже виконуються, навіть якщо вони ігнорують переривання"
        text_en: "`shutdownNow()` is guaranteed to stop tasks that are already running, even if they ignore interruption"
    explanation: >
      `shutdown()` лише ініціює впорядковане закриття й не чекає: для очікування викликають `awaitTermination`. `shutdownNow()` лише намагається зупинити виконувані завдання (зазвичай через переривання), тому завдання, що ігнорує переривання, продовжить працювати.
    explanation_en: >
      `shutdown()` only initiates an orderly shutdown and does not wait; to wait you call `awaitTermination`. `shutdownNow()` merely attempts to stop running tasks (typically via interruption), so a task that ignores interruption keeps running.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ExecutorService.html#shutdown()
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ExecutorService.html#shutdownNow()
  - id: java-concurrency-015
    level: junior
    type: single
    text: Що поверне `await` у цьому коді і чому (Java 25)?
    text_en: "What does `await` return in this code, and why (Java 25)?"
    code:
      lang: java
      source: |
        var latch = new CountDownLatch(2);
        new Thread(latch::countDown).start();
        boolean ok = latch.await(300, TimeUnit.MILLISECONDS);
        System.out.println(ok);
    options:
      - text: "`false`: лічильник лишився на 1, тож за тайм-аут очікування не завершилось"
        text_en: "`false`: the count stayed at 1, so the wait did not complete within the timeout"
        correct: true
      - text: "`true`: достатньо одного `countDown()`, щоб `await` відпустив потік"
        text_en: "`true`: a single `countDown()` is enough for `await` to release the thread"
      - text: "`true`: після тайм-ауту `CountDownLatch` сам скидає лічильник у нуль"
        text_en: "`true`: after the timeout `CountDownLatch` resets the counter to zero by itself"
      - text: "`InterruptedException`: `await` з тайм-аутом завжди завершується винятком"
        text_en: "`InterruptedException`: `await` with a timeout always ends with an exception"
    explanation: >
      `await` відпускає потоки лише коли лічильник досягає нуля; якщо за відведений час цього не сталося, метод повертає `false`. Лічильник сам не змінюється від плину часу.
    explanation_en: >
      `await` releases threads only when the count reaches zero; if that does not happen within the allotted time, the method returns `false`. The count does not change by itself as time passes.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CountDownLatch.html#await(long,java.util.concurrent.TimeUnit)
  - id: java-concurrency-016
    level: junior
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        Thread t = new Thread(() -> {
            try {
                Thread.sleep(5000);
            } catch (InterruptedException e) {
                System.out.println(Thread.currentThread().isInterrupted());
            }
        });
        t.start();
        t.interrupt();
        t.join();
    options:
      - text: "`false`: прапорець переривання скидається, коли кидається `InterruptedException`"
        text_en: "`false`: the interrupt flag is cleared when `InterruptedException` is thrown"
        correct: true
      - text: "`true`: прапорець лишається піднятим, доки його не скинуть вручну"
        text_en: "`true`: the flag stays raised until it is cleared manually"
      - text: "Нічого: `sleep` ігнорує переривання й спить усі 5 секунд"
        text_en: "Nothing: `sleep` ignores interruption and sleeps the full 5 seconds"
      - text: "`IllegalThreadStateException`: переривати можна лише потік, що вже заснув"
        text_en: "`IllegalThreadStateException`: only a thread that is already asleep can be interrupted"
    explanation: >
      `sleep` реагує на переривання, кидаючи `InterruptedException`, і при цьому скидає статус переривання. Тому в `catch` `isInterrupted()` дає `false`, а щоб не втратити сигнал, потік має знову викликати `Thread.currentThread().interrupt()`.
    explanation_en: >
      `sleep` reacts to interruption by throwing `InterruptedException` and clears the interrupt status at the same time. So inside `catch` `isInterrupted()` is `false`, and to avoid losing the signal the code should call `Thread.currentThread().interrupt()` again.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Thread.html#interrupt()
  - id: java-concurrency-017
    level: middle
    type: single
    text: Що виведе останній рядок і чому (Java 25)?
    text_en: "What does the last line print, and why (Java 25)?"
    code:
      lang: java
      source: |
        var lock = new ReentrantLock();
        Thread t = new Thread(() -> {
            lock.lock();
            throw new RuntimeException("fail");
        });
        t.start();
        t.join();
        System.out.println(lock.tryLock());
    options:
      - text: "`false`: `ReentrantLock` не звільняється сам, тож його слід знімати в `finally`"
        text_en: "`false`: a `ReentrantLock` is not released automatically, so it must be unlocked in `finally`"
        correct: true
      - text: "`true`: замок звільняється, коли потік-власник завершується, як і монітор у `synchronized`"
        text_en: "`true`: the lock is released when the owning thread ends, just like a monitor in `synchronized`"
      - text: "`true`: виняток у потоці автоматично викликає `unlock()` для всіх його замків"
        text_en: "`true`: an exception in the thread automatically calls `unlock()` for all of its locks"
      - text: "`IllegalMonitorStateException`: `tryLock()` не можна викликати з іншого потоку"
        text_en: "`IllegalMonitorStateException`: `tryLock()` cannot be called from another thread"
    explanation: >
      Монітор `synchronized` знімається компілятором при будь-якому виході з блоку, а `ReentrantLock` треба знімати явно, зазвичай у `finally`. Тут `unlock()` не викликано, тож замок лишається за завершеним потоком і `tryLock()` у `main` повертає `false`.
    explanation_en: >
      A `synchronized` monitor is released on any exit from the block, while a `ReentrantLock` must be released explicitly, usually in `finally`. Here `unlock()` is never called, so the lock stays held by the finished thread and `tryLock()` in `main` returns `false`.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/Lock.html
  - id: java-concurrency-018
    level: middle
    type: multiple
    text: Які твердження про `ThreadLocal` у потоках пулу правильні (Java 25)?
    text_en: "Which statements about `ThreadLocal` in pool threads are true (Java 25)?"
    options:
      - text: "Значення одного завдання може побачити наступне на тому самому потоці пулу без `remove()`"
        text_en: "One task's value can be seen by the next task on the same pool thread without `remove()`"
        correct: true
      - text: "Кожен потік має власну копію, тож `set` в одному не змінює значення в інших"
        text_en: "Each thread has its own copy, so `set` in one does not change the value in others"
        correct: true
      - text: "Значення очищується автоматично щойно завдання, що його встановило, завершується"
        text_en: "The value is cleared automatically when the task that set it finishes"
      - text: "Потік пулу бачить значення, яке встановив потік, що подав завдання через `submit`"
        text_en: "A pool thread sees the value that the submitting thread set before calling `submit`"
    explanation: >
      `ThreadLocal` прив'язаний до потоку, а не до завдання, а потоки пулу живуть довго й виконують багато завдань. Тому «залишки» попереднього завдання витікають у наступне, і значення треба знімати в `finally` через `remove()`.
    explanation_en: >
      A `ThreadLocal` is bound to the thread, not to the task, and pool threads live long and run many tasks. So leftovers of a previous task leak into the next one, and the value should be removed in `finally` with `remove()`.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/ThreadLocal.html
  - id: java-concurrency-019
    level: middle
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        public static void main(String[] args) {
            CompletableFuture.supplyAsync(() -> {
                try { Thread.sleep(500); } catch (InterruptedException e) { }
                System.out.println("done");
                return 1;
            });
            System.out.println("main end");
        }
    options:
      - text: "Лише `main end`: потоки спільного пулу — демони, тож JVM завершується до `done`"
        text_en: "Only `main end`: threads of the common pool are daemons, so the JVM exits before `done`"
        correct: true
      - text: "`main end`, потім `done`: JVM чекає на всі запущені `CompletableFuture`"
        text_en: "`main end`, then `done`: the JVM waits for all running `CompletableFuture`s"
      - text: "`main end`, потім `done`, а JVM не завершується, бо пул не закрито"
        text_en: "`main end`, then `done`, and the JVM does not exit, because the pool is not closed"
      - text: "Лише `done`: `main` завершується лише після виконання асинхронного завдання"
        text_en: "Only `done`: `main` ends only after the asynchronous task has run"
    explanation: >
      Без явного `Executor` асинхронні методи `CompletableFuture` працюють у `ForkJoinPool.commonPool()`, чиї потоки є демонами. Коли завершується останній недемонічний потік (`main`), JVM виходить, не чекаючи; тож результат треба дочекатися через `join()` чи `get()`.
    explanation_en: >
      Without an explicit `Executor`, the asynchronous methods of `CompletableFuture` run in `ForkJoinPool.commonPool()`, whose threads are daemons. When the last non-daemon thread (`main`) ends, the JVM exits without waiting, so the result must be awaited with `join()` or `get()`.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CompletableFuture.html#supplyAsync(java.util.function.Supplier)
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ForkJoinPool.html#commonPool()
  - id: java-concurrency-020
    level: middle
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        try (var ex = Executors.newFixedThreadPool(2)) {
            ex.submit(() -> {
                try { Thread.sleep(300); } catch (InterruptedException e) { }
                System.out.println("task");
            });
        }
        System.out.println("after");
    options:
      - text: "`task`, потім `after`: `close()` чекає завершення поданих завдань"
        text_en: "`task`, then `after`: `close()` waits for the submitted tasks to finish"
        correct: true
      - text: "`after`, потім `task`: `close()` лише забороняє нові завдання й одразу повертається"
        text_en: "`after`, then `task`: `close()` only forbids new tasks and returns immediately"
      - text: "Лише `after`: `close()` перериває завдання, що виконуються"
        text_en: "Only `after`: `close()` interrupts the tasks that are running"
      - text: "Код не скомпілюється: `ExecutorService` не можна оголошувати в `try`-with-resources"
        text_en: "The code does not compile: an `ExecutorService` cannot be declared in `try`-with-resources"
    explanation: >
      `ExecutorService` реалізує `AutoCloseable`; типова реалізація `close()` викликає `shutdown()` і чекає завершення завдань через `awaitTermination`. Тому `after` друкується лише після `task`, а явний `shutdown()` без очікування такої гарантії не дає.
    explanation_en: >
      `ExecutorService` implements `AutoCloseable`; the default `close()` calls `shutdown()` and waits for the tasks with `awaitTermination`. So `after` is printed only once `task` has finished, which a bare `shutdown()` without waiting does not guarantee.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ExecutorService.html#close()
  - id: java-concurrency-021
    level: senior
    type: multiple
    text: >-
      У сервісі (Java 25) паралельні стріми й `CompletableFuture.supplyAsync(...)` без `executor` блокують потік на HTTP-викликах, і весь сервіс повільнішає. Які твердження правильні?
    text_en: "In a service (Java 25), parallel streams and `CompletableFuture.supplyAsync(...)` without an `executor` block the thread on HTTP calls, and the whole service slows down. Which statements are true?"
    options:
      - text: "Вони ділять один `ForkJoinPool.commonPool()`, тож блокування в одному місці забирає потоки в інших"
        text_en: "They share one `ForkJoinPool.commonPool()`, so blocking in one place takes threads away from the others"
        correct: true
      - text: "Пул не компенсує блокуючий ввід-вивід, тому завдання можуть голодувати в черзі"
        text_en: "The pool does not compensate for blocking I/O, so tasks may starve in the queue"
        correct: true
      - text: "Пул сам додає потік на кожен блокуючий виклик HTTP, тож голодування бути не може"
        text_en: "The pool adds a thread for every blocking HTTP call by itself, so starvation cannot occur"
      - text: "Кожен `parallel()` стрім створює власний пул потоків, тож блокування одного не впливає на інші"
        text_en: "Each `parallel()` stream creates its own thread pool, so blocking in one does not affect the others"
    explanation: >
      Спільний пул має малу кількість потоків, розраховану на CPU-завдання, а виклики, що блокуються на вводі-виводі, не компенсуються автоматично (це вміє лише `ManagedBlocker`). Виправлення — власний `Executor` для блокуючих завдань або віртуальні потоки.
    explanation_en: >
      The common pool has a small number of threads sized for CPU-bound work, and calls that block on I/O are not compensated automatically (only `ManagedBlocker` supports that). The fix is a dedicated `Executor` for blocking tasks or virtual threads.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ForkJoinPool.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CompletableFuture.html
  - id: java-concurrency-022
    level: senior
    type: single
    text: >-
      Продюсер швидко подає завдання в цей пул (Java 25). Що відбудеться із завданнями, коли потік пулу й черга зайняті, і який це дає ефект?
    text_en: "A producer quickly submits tasks to this pool (Java 25). What happens to tasks when the pool thread and the queue are both busy, and what is the effect?"
    code:
      lang: java
      source: |
        var pool = new ThreadPoolExecutor(
            1, 1, 0, TimeUnit.SECONDS,
            new ArrayBlockingQueue<>(1),
            new ThreadPoolExecutor.CallerRunsPolicy());
    options:
      - text: "Їх виконує сам потік, що викликав `execute`, і це гальмує продюсера без втрати завдань"
        text_en: "The thread that called `execute` runs them itself, which slows the producer down without losing tasks"
        correct: true
      - text: "Кидається `RejectedExecutionException`, і продюсер має сам повторити подання завдання"
        text_en: "`RejectedExecutionException` is thrown, and the producer has to resubmit the task itself"
      - text: "Завдання тихо відкидаються, а продюсер продовжує працювати зі своєю швидкістю"
        text_en: "The tasks are silently discarded, and the producer keeps working at its own pace"
      - text: "Пул створює додатковий потік понад `maximumPoolSize`, доки черга не звільниться"
        text_en: "The pool creates an extra thread beyond `maximumPoolSize` until the queue frees up"
    explanation: >
      `CallerRunsPolicy` виконує відхилене завдання в потоці, що викликав `execute`, тому продюсер сам зайнятий і подає нові завдання повільніше, — це проста зворотна реакція (backpressure). `RejectedExecutionException` кидає типова `AbortPolicy`, а понад `maximumPoolSize` пул не росте.
    explanation_en: >
      `CallerRunsPolicy` runs the rejected task in the thread that called `execute`, so the producer is busy itself and submits new tasks more slowly, which is simple feedback control (backpressure). `RejectedExecutionException` comes from the default `AbortPolicy`, and the pool never grows beyond `maximumPoolSize`.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ThreadPoolExecutor.CallerRunsPolicy.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ThreadPoolExecutor.html
  - id: java-concurrency-023
    level: senior
    type: single
    text: >-
      Лічильник метрик оновлюють десятки потоків у гарячому шляху, а читають рідко (Java 25). `AtomicLong` показує високу конкуренцію на одній комірці. Що обрати і яка ціна?
    text_en: "A metrics counter is updated by dozens of threads on a hot path and read rarely (Java 25). `AtomicLong` shows high contention on a single cell. What should be chosen, and what is the cost?"
    options:
      - text: "`LongAdder`: оновлення йдуть у кілька комірок, але `sum()` не атомарний знімок, а пам'яті більше"
        text_en: "`LongAdder`: updates go to several cells, but `sum()` is no atomic snapshot and memory use is higher"
        correct: true
      - text: "`volatile long` із `c++`: `volatile` робить інкремент атомарним, а комірок немає зовсім"
        text_en: "`volatile long` with `c++`: `volatile` makes the increment atomic, and there are no cells at all"
      - text: "`synchronized` на лічильнику: монітор у JVM завжди швидший за CAS під високою конкуренцією за всіх потоків"
        text_en: "`synchronized` on the counter: a monitor in the JVM is always faster than CAS under high contention with all threads"
      - text: "`LongAdder`: він дає точне значення в кожну мить читання, а різниця лише в API"
        text_en: "`LongAdder`: it gives the exact value at every instant of reading, and the difference is only in the API"
    explanation: >
      За високої конкуренції `LongAdder` має суттєво вищу пропускну здатність, бо розносить оновлення по кількох комірках, але витрачає більше пам'яті, а `sum()` під час паралельних оновлень не є атомарним знімком. `volatile` не робить `c++` атомарним, а монітор під конкуренцією не швидший.
    explanation_en: >
      Under high contention `LongAdder` has significantly higher throughput because it spreads updates over several cells, but it uses more memory, and `sum()` during concurrent updates is not an atomic snapshot. `volatile` does not make `c++` atomic, and a monitor under contention is not faster.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/atomic/LongAdder.html
  - id: java-concurrency-024
    level: senior
    type: single
    text: >-
      Команда замінює `ThreadLocal` із контекстом запиту на `ScopedValue` у сервісі на віртуальних потоках (Java 25). Що правильно про цей код?
    text_en: "A team replaces a request-context `ThreadLocal` with `ScopedValue` in a service on virtual threads (Java 25). What is true about this code?"
    code:
      lang: java
      source: |
        static final ScopedValue<String> USER = ScopedValue.newInstance();

        ScopedValue.where(USER, "alice").run(() ->
            System.out.println(USER.get()));
        System.out.println(USER.isBound());
    options:
      - text: "Друкує `alice`, потім `false`: значення діє лише під час `run`, і воно незмінне в цій прив'язці"
        text_en: "Prints `alice`, then `false`: the value exists only during `run`, and it is immutable within this binding"
        correct: true
      - text: "Друкує `alice`, потім `true`: прив'язка живе до кінця потоку, як у `ThreadLocal`"
        text_en: "Prints `alice`, then `true`: the binding lives until the end of the thread, as with `ThreadLocal`"
      - text: "Не запуститься без `--enable-preview`, бо `ScopedValue` у Java 25 ще preview-API"
        text_en: "Will not run without `--enable-preview`, because `ScopedValue` is still a preview API in Java 25"
      - text: "Друкує `alice`, а далі в тому самому потоці можна викликати `USER.set(...)` для зміни значення"
        text_en: "Prints `alice`, and later in the same thread `USER.set(...)` can be called to change the value"
    explanation: >
      `ScopedValue` прив'язують лише на час виконання `run`/`call`, а метода `set` у нього немає: нове значення задають вкладеною прив'язкою. Після виходу `isBound()` повертає `false`, а `get()` кидає `NoSuchElementException`. Scoped Values стали остаточним API в Java 25 (JEP 506).
    explanation_en: >
      A `ScopedValue` is bound only for the duration of `run`/`call` and has no `set` method: a new value is given by a nested binding. After leaving, `isBound()` returns `false` and `get()` throws `NoSuchElementException`. Scoped Values became a final API in Java 25 (JEP 506).
    sources:
      - https://openjdk.org/jeps/506
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/ScopedValue.html
