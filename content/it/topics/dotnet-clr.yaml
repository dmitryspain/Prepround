id: dotnet-clr
title: CLR, пам'ять і GC
title_en: CLR, memory and GC
description: Value/reference types, stack/heap, GC і покоління, IDisposable, Span.
description_en: Value/reference types, stack/heap, GC and generations, IDisposable, Span.
icon: cpu
questions:
  - id: dotnet-clr-001
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: "What does this code print?"
    code:
      lang: csharp
      source: |
        var a = new PointStruct { X = 1 };
        var b = a;
        b.X = 2;

        var c = new PointClass { X = 1 };
        var d = c;
        d.X = 2;

        Console.WriteLine($"{a.X} {c.X}");

        struct PointStruct { public int X; }
        class PointClass { public int X; }
    options:
      - text: "`1 2`"
        text_en: "`1 2`"
        correct: true
      - text: "`2 2`"
        text_en: "`2 2`"
      - text: "`1 1`"
        text_en: "`1 1`"
      - text: "`2 1`"
        text_en: "`2 1`"
    explanation: >
      Присвоєння структури копіює все значення, тож `b` — окрема копія, і зміна `b.X` не торкається `a`.
      Присвоєння класу копіює лише посилання: `c` і `d` вказують на той самий об'єкт, тому зміну через `d`
      видно й через `c`.
    explanation_en: >
      Assigning a struct copies the whole value, so `b` is a separate copy and changing `b.X` does not
      affect `a`. Assigning a class copies only the reference: `c` and `d` point to the same object, so a
      change made through `d` is visible through `c` as well.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/design-guidelines/choosing-between-class-and-struct

  - id: dotnet-clr-002
    level: junior
    type: multiple
    text: "Які твердження про `IDisposable` і `using` правильні?"
    text_en: "Which statements about `IDisposable` and `using` are true?"
    options:
      - text: "`using` викликає `Dispose`, навіть якщо всередині блоку кинуто виняток"
        text_en: "`using` calls `Dispose` even if an exception is thrown inside the block"
        correct: true
      - text: "Змінну з `using var file = ...;` буде звільнено в кінці області видимості"
        text_en: "A variable from `using var file = ...;` is disposed at the end of its scope"
        correct: true
      - text: "`Dispose` звільняє файли чи з'єднання одразу, а не тоді, коли до об'єкта колись дійде GC"
        text_en: "`Dispose` releases files or connections immediately, rather than whenever the GC eventually gets to the object"
        correct: true
      - text: "GC сам викликає `Dispose` для кожного об'єкта, перш ніж його зібрати"
        text_en: "The GC itself calls `Dispose` on every object before collecting it"
      - text: "Після `Dispose` пам'ять, яку займає сам об'єкт у керованій купі, звільняється негайно"
        text_en: "After `Dispose`, the memory the object itself occupies on the managed heap is freed immediately"
    explanation: >
      `using` компілюється в `try`/`finally`, тому `Dispose` викликається за будь-якого виходу з блоку, а
      `using`-оголошення звільняє ресурс у кінці своєї області видимості. Сам GC про `Dispose` нічого не знає
      і не викликає його, а пам'ять об'єкта після `Dispose` однаково звільнить лише GC, коли об'єкт стане
      недосяжним.
    explanation_en: >
      `using` compiles to `try`/`finally`, so `Dispose` is called however the block exits, and a `using`
      declaration releases the resource at the end of its scope. The GC knows nothing about `Dispose` and
      does not call it, and the object's memory after `Dispose` is still freed only by the GC once the object becomes
      unreachable.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/using
      - https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/implementing-dispose#the-dispose-method

  - id: dotnet-clr-003
    level: junior
    type: single
    text: Які об'єкти може зібрати збирач сміття під час чергової збірки?
    text_en: "Which objects can the garbage collector reclaim during a collection?"
    options:
      - text: "Ті, до яких немає шляху посилань від коренів: статичних полів, локальних змінних, GC-хендлів"
        text_en: "Those with no reference path from the roots: static fields, local variables, GC handles"
        correct: true
      - text: "Лише ті, на які не посилається жоден об'єкт; два об'єкти, що посилаються один на одного, не зберуться"
        text_en: "Only those that no object references; two objects that reference each other will not be collected"
      - text: "Ті, що давно не використовувались, навіть якщо на них досі посилається статичне поле"
        text_en: "Those that have not been used for a long time, even if a static field still references them"
      - text: "Лише ті, для яких код уже викликав `Dispose`"
        text_en: "Only those for which the code has already called `Dispose`"
    explanation: >
      GC будує граф об'єктів, досяжних від коренів (статичні поля, локальні змінні на стеку потоків, регістри,
      GC-хендли), і все поза цим графом вважає сміттям. Тому два об'єкти, що посилаються лише один на одного,
      теж буде зібрано, якщо до них не дійти від коренів. `Dispose` і давність використання на це не впливають.
    explanation_en: >
      The GC builds a graph of objects reachable from the roots (static fields, local variables on thread
      stacks, registers, GC handles) and treats everything outside that graph as garbage. So two objects
      that reference only each other are collected too if they cannot be reached from the roots. `Dispose`
      and how long ago an object was used have no effect on this.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/fundamentals#memory-release

  - id: dotnet-clr-004
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: "What does this code print?"
    code:
      lang: csharp
      source: |
        int[] numbers = [1, 2, 3, 4, 5];
        Span<int> middle = numbers.AsSpan(1, 3);
        middle[0] = 42;
        Console.WriteLine(string.Join(",", numbers));
    options:
      - text: "`1,42,3,4,5`"
        text_en: "`1,42,3,4,5`"
        correct: true
      - text: "`1,2,3,4,5`"
        text_en: "`1,2,3,4,5`"
      - text: "`42,2,3,4,5`"
        text_en: "`42,2,3,4,5`"
      - text: "`1,2,42,4,5`"
        text_en: "`1,2,42,4,5`"
    explanation: >
      `AsSpan(1, 3)` не копіює елементи, а створює «вікно» на елементи масиву з індексами 1–3. Тому
      `middle[0]` — це той самий елемент, що й `numbers[1]`, і запис через span змінює сам масив.
    explanation_en: >
      `AsSpan(1, 3)` does not copy elements; it creates a "window" over the array elements at indexes 1-3.
      So `middle[0]` is the same element as `numbers[1]`, and writing through the span changes the array
      itself.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/memory-and-spans/

  - id: dotnet-clr-005
    level: middle
    type: single
    text: Що виведе цей код?
    text_en: "What does this code print?"
    code:
      lang: csharp
      source: |
        var counter = new Counter();
        ICounter boxed = counter;
        boxed.Increment();
        Console.WriteLine($"{counter.Value} {((Counter)boxed).Value}");

        interface ICounter { void Increment(); }

        struct Counter : ICounter
        {
            public int Value;
            public void Increment() => Value++;
        }
    options:
      - text: "`0 1`"
        text_en: "`0 1`"
        correct: true
      - text: "`1 1`"
        text_en: "`1 1`"
      - text: "`0 0`"
        text_en: "`0 0`"
      - text: "`1 0`"
        text_en: "`1 0`"
    explanation: >
      Присвоєння структури змінній інтерфейсного типу — це упаковування: у купі створюється новий об'єкт
      із копією значення. `Increment` змінює саме цю копію, тож упакований лічильник дорівнює 1, а `counter`
      лишається 0. Через такі несподіванки змінювані структури, які приводять до інтерфейсів, вважають пасткою.
    explanation_en: >
      Assigning a struct to an interface-typed variable is boxing: a new object holding a copy of the
      value is created on the heap. `Increment` changes that copy, so the boxed counter equals 1 while
      `counter` stays 0. Because of such surprises, mutable structs cast to interfaces are considered a
      trap.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/types/boxing-and-unboxing#boxing
      - https://learn.microsoft.com/en-us/dotnet/standard/design-guidelines/choosing-between-class-and-struct

  - id: dotnet-clr-006
    level: middle
    type: single
    text: Що виведе цей код?
    text_en: "What does this code print?"
    code:
      lang: csharp
      source: |
        var order = new object();
        Console.Write(GC.GetGeneration(order));
        GC.Collect();
        Console.Write(GC.GetGeneration(order));
        GC.Collect();
        Console.Write(GC.GetGeneration(order));
        GC.KeepAlive(order);
    options:
      - text: "`012`"
        text_en: "`012`"
        correct: true
      - text: "`000`"
        text_en: "`000`"
      - text: "`011`"
        text_en: "`011`"
      - text: "`022`"
        text_en: "`022`"
    explanation: >
      Новий об'єкт потрапляє в покоління 0, а той, що пережив збірку, переходить у наступне: після першої
      `GC.Collect()` він у поколінні 1, після другої — у 2, і далі там і лишається. На цьому тримаються
      покоління: більшість об'єктів помирає молодими, тож GC здебільшого збирає лише маленьке покоління 0.
    explanation_en: >
      A new object lands in generation 0, and one that survives a collection moves to the next generation:
      after the first `GC.Collect()` it is in generation 1, after the second in generation 2, and it stays
      there. Generations rely on this: most objects die young, so the GC usually collects only the small
      generation 0.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/fundamentals#survival-and-promotions

  - id: dotnet-clr-007
    level: middle
    type: single
    text: "Навіщо типовий метод `Dispose()` викликає `GC.SuppressFinalize(this)`?"
    text_en: "Why does a typical `Dispose()` method call `GC.SuppressFinalize(this)`?"
    options:
      - text: "Ресурси вже звільнено, тож GC не мусить викликати фіналізатор цього об'єкта"
        text_en: "The resources are already released, so the GC does not need to run this object's finalizer"
        correct: true
      - text: "Щоб GC зібрав об'єкт одразу, не чекаючи наступної збірки"
        text_en: "So the GC collects the object immediately, without waiting for the next collection"
      - text: "Щоб наступний виклик `Dispose` на тому самому об'єкті кинув виняток"
        text_en: "So that a subsequent `Dispose` call on the same object throws an exception"
      - text: "Щоб GC не переміщав об'єкт у пам'яті під час ущільнення купи"
        text_en: "So the GC does not move the object in memory during heap compaction"
    explanation: >
      `Dispose` уже виконав усе прибирання, тому `SuppressFinalize` повідомляє GC, що фіналізатор для цього
      об'єкта запускати не треба. Негайної збірки він не викликає і повторного `Dispose` не забороняє:
      повторний виклик метод має спокійно ігнорувати сам. Якщо фіналізатора в типу немає, виклик нічого не робить.
    explanation_en: >
      `Dispose` has already done all the cleanup, so `SuppressFinalize` tells the GC that the finalizer
      for this object need not run. It does not trigger an immediate collection and does not forbid a
      second `Dispose`: the method should simply ignore repeated calls on its own. If the type has no
      finalizer, the call does nothing.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/implementing-dispose#the-dispose-method

  - id: dotnet-clr-008
    level: middle
    type: multiple
    text: "Що з цього компілятор C# 14 не дозволить зробити зі `Span<byte>`?"
    text_en: "Which of these will the C# 14 compiler not allow with a `Span<byte>`?"
    options:
      - text: "Оголосити поле `private Span<byte> _buffer;` у звичайному класі"
        text_en: "Declare a field `private Span<byte> _buffer;` in an ordinary class"
        correct: true
      - text: "Захопити змінну типу `Span<byte>` у лямбду"
        text_en: "Capture a `Span<byte>` variable in a lambda"
        correct: true
      - text: "Присвоїти `Span<byte>` змінній типу `object`"
        text_en: "Assign a `Span<byte>` to a variable of type `object`"
        correct: true
      - text: "Взяти зріз `span.Slice(1, 2)` у синхронному методі"
        text_en: "Take a slice `span.Slice(1, 2)` in a synchronous method"
      - text: "Передати `Span<byte>` параметром у синхронний метод"
        text_en: "Pass a `Span<byte>` as a parameter to a synchronous method"
      - text: "Записати результат `stackalloc byte[16]` у змінну типу `Span<byte>`"
        text_en: "Assign the result of `stackalloc byte[16]` to a `Span<byte>` variable"
    explanation: >
      `Span<T>` — це `ref struct`: він може вказувати на пам'ять стеку, тому компілятор не дає йому
      потрапити в керовану купу. Звідси заборони на поле класу, захоплення в лямбду й упаковування в
      `object`. Локальні змінні, параметри, зрізи й `stackalloc` у синхронному коді — звичайне використання
      span, а якщо дані треба зберегти в полі, беруть `Memory<T>`.
    explanation_en: >
      `Span<T>` is a `ref struct`: it can point to stack memory, so the compiler does not let it end up on
      the managed heap. Hence the bans on class fields, lambda capture, and boxing into `object`. Locals,
      parameters, slices, and `stackalloc` in synchronous code are ordinary span usage, and if the data
      must be stored in a field, use `Memory<T>`.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/builtin-types/ref-struct
      - https://learn.microsoft.com/en-us/dotnet/standard/memory-and-spans/

  - id: dotnet-clr-009
    level: senior
    type: single
    text: >
      Сервіс на кожен запит створює тимчасовий `byte[]` на 1 МБ. Профайлер показує часті збірки
      покоління 2 і фрагментацію купи. Яке пояснення й виправлення правильні?
    text_en: "A service creates a temporary 1 MB `byte[]` on every request. The profiler shows frequent generation 2 collections and heap fragmentation. Which explanation and fix are correct?"
    options:
      - text: "Масиви від 85 000 байтів ідуть у LOH, яку збирають разом із поколінням 2; буфери варто брати з `ArrayPool<byte>.Shared`"
        text_en: "Arrays of 85,000 bytes or more go to the LOH, which is collected together with generation 2; take buffers from `ArrayPool<byte>.Shared`"
        correct: true
      - text: "Великі масиви переповнюють покоління 0, тож GC мусить збирати його частіше; допоможе регулярний виклик `GC.Collect()` після запиту"
        text_en: "Large arrays overflow generation 0, so the GC has to collect it more often; calling `GC.Collect()` regularly after each request will help"
      - text: "Масиви `byte[]` лежать у стеку, і його переповнення змушує GC збирати покоління 2; допоможе `stackalloc`"
        text_en: "`byte[]` arrays live on the stack, and its overflow forces the GC to collect generation 2; `stackalloc` will help"
      - text: "Купу великих об'єктів GC ущільнює на кожній збірці, і це дорого; допоможе вимкнути Server GC"
        text_en: "The GC compacts the large object heap on every collection, which is expensive; turning off Server GC will help"
    explanation: >
      Об'єкти від 85 000 байтів GC розміщує в купі великих об'єктів (LOH), яку збирає лише під час збірки
      покоління 2 і за замовчуванням не ущільнює. Тож кожен тимчасовий мегабайтний буфер наближає дорогу
      повну збірку й фрагментує LOH. Повторне використання буферів через пул прибирає ці алокації, а ручний
      `GC.Collect()` лише додасть повних збірок.
    explanation_en: >
      The GC places objects of 85,000 bytes or more on the large object heap (LOH), which it collects only
      during a generation 2 collection and by default does not compact. So each temporary megabyte buffer
      brings an expensive full collection closer and fragments the LOH. Reusing buffers through a pool
      removes those allocations, while a manual `GC.Collect()` would only add full collections.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/large-object-heap#loh-performance-implications
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/best-practices#minimize-large-object-allocations

  - id: dotnet-clr-010
    level: senior
    type: multiple
    text: >
      Команда хоче замінити клас `OrderLine` (10 полів, близько 80 байтів) на `struct`, щоб «прибрати
      алокації». Рядки часто передають у методи, зберігають у `List<OrderLine>` і приводять до інтерфейсу
      `IPriced`. Які наслідки реальні?
    text_en: "A team wants to replace the class `OrderLine` (10 fields, about 80 bytes) with a `struct` to \"remove allocations\". The lines are often passed to methods, stored in a `List<OrderLine>`, and cast to the interface `IPriced`. Which consequences are real?"
    options:
      - text: "Кожне присвоєння й передача в метод копіюватиме всі ~80 байтів, а не одне посилання"
        text_en: "Every assignment and every pass to a method will copy all ~80 bytes instead of a single reference"
        correct: true
      - text: "Кожне приведення до `IPriced` упаковуватиме значення, тобто створюватиме об'єкт у купі"
        text_en: "Every cast to `IPriced` will box the value, that is, create an object on the heap"
        correct: true
      - text: "Елементи `List<OrderLine>` лежатимуть усередині масиву списку в купі, а не в стеку"
        text_en: "The elements of `List<OrderLine>` will sit inside the list's array on the heap, not on the stack"
        correct: true
      - text: "Після переходу на `struct` ці дані взагалі не потраплятимуть у керовану купу"
        text_en: "After switching to `struct`, this data will not end up on the managed heap at all"
      - text: "Зміна поля в копії, яку повернув метод, одразу змінить і оригінальний елемент у списку"
        text_en: "Changing a field of a copy returned by a method will immediately change the original element in the list"
    explanation: >
      Структура копіюється цілком під час присвоєння й передачі, тож для великого типу це дорожче за
      копіювання посилання, а приведення до інтерфейсу упаковує її в об'єкт у купі. Типи-значення живуть
      або в стеку, або всередині об'єкта-власника, тож елементи списку лежать у його масиві в купі.
      Тому Framework Design Guidelines радять `struct` лише для малих (до 16 байтів), незмінних і рідко
      упаковуваних типів.
    explanation_en: >
      A struct is copied in full on assignment and passing, so for a large type that costs more than
      copying a reference, and casting to an interface boxes it into a heap object. Value types live
      either on the stack or inside their owning object, so list elements sit in its array on the heap.
      That is why the Framework Design Guidelines recommend `struct` only for small (up to 16 bytes),
      immutable, rarely boxed types.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/design-guidelines/choosing-between-class-and-struct
      - https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/types/boxing-and-unboxing#performance

  - id: dotnet-clr-011
    level: senior
    type: single
    text: "Навіщо в цьому методі умова замість простого `stackalloc byte[data.Length]`?"
    text_en: "Why does this method have a condition instead of a plain `stackalloc byte[data.Length]`?"
    code:
      lang: csharp
      source: |
        Console.WriteLine(Checksum(new byte[] { 1, 2, 3 }));
        Console.WriteLine(Checksum(new byte[100_000]));

        static int Checksum(ReadOnlySpan<byte> data)
        {
            const int StackLimit = 256;
            Span<byte> buffer = data.Length <= StackLimit
                ? stackalloc byte[StackLimit]
                : new byte[data.Length];
            data.CopyTo(buffer);
            int sum = 0;
            foreach (var b in buffer[..data.Length]) sum += b;
            return sum;
        }
    options:
      - text: "Стек обмежений, і завеликий `stackalloc` дає фатальний `StackOverflowException`"
        text_en: "The stack is limited, and an oversized `stackalloc` causes a fatal `StackOverflowException`"
        correct: true
      - text: "`stackalloc` приймає лише розмір, відомий під час компіляції, тому довжину замінено константою"
        text_en: "`stackalloc` accepts only a size known at compile time, so the length is replaced with a constant"
      - text: "Пам'ять від `stackalloc` теж збирає GC, і для великих буферів це дорожче, ніж `new byte[]`"
        text_en: "Memory from `stackalloc` is also collected by the GC, and for large buffers that costs more than `new byte[]`"
      - text: "`Span<byte>` не може вказувати на масив у купі, тому для великих даних потрібна окрема гілка"
        text_en: "`Span<byte>` cannot point to a heap array, so large data needs a separate branch"
    explanation: >
      Обсяг стеку обмежений, а його переповнення через `stackalloc` дає `StackOverflowException`, який
      завершує процес, тож документація радить класти в стек лише буфери до консервативного порогу, а більші
      виділяти в купі. Малий буфер у стеку не навантажує GC і зникає з виходом із методу, а `Span<byte>`
      однаково працює з обома джерелами пам'яті. Розмір `stackalloc` може бути й змінною, тому варіант про
      константу хибний.
    explanation_en: >
      Stack space is limited, and overflowing it via `stackalloc` raises `StackOverflowException`, which
      terminates the process, so the documentation advises placing only buffers up to a conservative
      threshold on the stack and allocating larger ones on the heap. A small stack buffer puts no load on
      the GC and disappears when the method returns, and `Span<byte>` works with both kinds of memory. The
      `stackalloc` size can also be a variable, so the option about a constant is wrong.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/stackalloc

  - id: dotnet-clr-012
    level: senior
    type: single
    text: >
      У довгоживучому сервісі пам'ять повільно росте. Дамп показує тисячі екземплярів `OrderSession`, і в кожного
      шлях до кореня GC проходить через статичну подію `PriceFeed.PriceChanged`. Що відбувається?
    text_en: "In a long-running service, memory slowly grows. A dump shows thousands of `OrderSession` instances, and for each of them the GC root path goes through the static event `PriceFeed.PriceChanged`. What is happening?"
    options:
      - text: "Підписка `+=` зберігає в делегаті посилання на підписника, і статична подія тримає сесії досяжними"
        text_en: "A `+=` subscription stores a reference to the subscriber in the delegate, and the static event keeps the sessions reachable"
        correct: true
      - text: "Об'єкти з обробниками подій GC збирає лише після фіналізатора, тому сесії застрягли в черзі фіналізації"
        text_en: "The GC collects objects with event handlers only after the finalizer runs, so the sessions are stuck in the finalization queue"
      - text: "Делегати подій тримають підписників через слабкі посилання, тож витік спричиняє щось інше"
        text_en: "Event delegates hold subscribers through weak references, so something else is causing the leak"
      - text: "Об'єкти з покоління 2 GC не збирає ніколи, тому старі сесії лишаються в пам'яті назавжди"
        text_en: "The GC never collects generation 2 objects, so old sessions stay in memory forever"
    explanation: >
      Підписка створює сильне посилання від джерела події на слухача, тож поки живе статична `PriceChanged`,
      живуть і всі підписані сесії, навіть якщо решта коду про них забула. Це звичайна досяжність від кореня,
      а не збій GC: покоління 2 теж збирається, а слабкими посилання стають лише в окремому шаблоні weak event.
      Виправлення — відписуватися через `-=`, наприклад у `Dispose` сесії.
    explanation_en: >
      A subscription creates a strong reference from the event source to the listener, so as long as the
      static `PriceChanged` lives, all subscribed sessions live too, even if the rest of the code has
      forgotten them. This is ordinary reachability from a root, not a GC failure: generation 2 is
      collected too, and references become weak only in the separate weak event pattern. The fix is to
      unsubscribe with `-=`, for example in the session's `Dispose`.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/desktop/wpf/events/weak-event-patterns#why-implement-the-weak-event-pattern
      - https://learn.microsoft.com/en-us/aspnet/core/performance/memory#persistent-object-references

  - id: dotnet-clr-013
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        var list = new List<int> { 1 };
        Mutate(list);
        Reassign(list);
        Console.WriteLine(list.Count);

        static void Mutate(List<int> items) { items.Add(2); }
        static void Reassign(List<int> items)
        {
            items = new List<int>();
            items.Add(7);
            items.Add(8);
            items.Add(9);
        }
    options:
      - text: "`2`"
        text_en: "`2`"
        correct: true
      - text: "`4`"
        text_en: "`4`"
      - text: "`3`"
        text_en: "`3`"
      - text: "`1`"
        text_en: "`1`"
    explanation: >
      Посилання на список передається в метод за значенням: `Mutate` через копію посилання додає елемент до
      того самого об'єкта, тому `Count` стає `2`. У `Reassign` присвоєння `items = new List<int>()`
      міняє лише локальну копію посилання, і додані там елементи йдуть до іншого списку. Спокусливе `4`
      уявляє, що нове присвоєння змінює список викликача.
    explanation_en: >
      The reference to the list is passed to the method by value: `Mutate` adds an element to the same
      object through the copy of the reference, so `Count` becomes `2`. In `Reassign` the assignment
      `items = new List<int>()` changes only the local copy of the reference, and the elements added
      there go to a different list. The tempting `4` assumes the new assignment changes the caller's
      list.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/ref
      - https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/classes-and-structs/passing-reference-type-parameters

  - id: dotnet-clr-014
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        int n = 1;
        Add(n);
        AddRef(ref n);
        Console.WriteLine(n);

        static void Add(int x) { x++; }
        static void AddRef(ref int x) { x++; }
    options:
      - text: "`2`"
        text_en: "`2`"
        correct: true
      - text: "`3`"
        text_en: "`3`"
      - text: "`1`"
        text_en: "`1`"
      - text: "Помилка компіляції: `ref` не можна застосувати до `int`"
        text_en: "A compile error: `ref` cannot be applied to `int`"
    explanation: >
      Параметр `x` в `Add` отримує копію значення, тому збільшення не бачить викликач. У `AddRef`
      параметр `ref` є псевдонімом самої змінної `n`, тож `x++` змінює саму `n`: `1` стає `2`. Спокусливе
      `3` хибне, бо перший виклик на `n` не впливає.
    explanation_en: >
      The parameter `x` in `Add` receives a copy of the value, so the caller never sees the increment. In
      `AddRef` the `ref` parameter is an alias of the variable `n` itself, so `x++` changes `n`: `1`
      becomes `2`. The tempting `3` is wrong because the first call has no effect on `n`.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/ref

  - id: dotnet-clr-015
    level: junior
    type: multiple
    text: "Які з цих ресурсів збирач сміття .NET сам не звільнить, тож їх має звільнити код?"
    text_en: "Which of these resources will the .NET garbage collector not release by itself, so the code must release them?"
    options:
      - text: "Блок пам'яті, виділений викликом `Marshal.AllocHGlobal`"
        text_en: "A memory block allocated by a call to `Marshal.AllocHGlobal`"
        correct: true
      - text: "Блок пам'яті, який повернула нативна бібліотека через P/Invoke"
        text_en: "A memory block returned by a native library through P/Invoke"
        correct: true
      - text: "Сирий неуправлюваний дескриптор, збережений у полі типу `IntPtr`"
        text_en: "A raw unmanaged handle stored in a field of type `IntPtr`"
        correct: true
      - text: "Масив `int[]`, на який у програмі більше немає жодних посилань"
        text_en: "An `int[]` array that no longer has any references in the program"
      - text: "Об'єкт `List<string>` із тисячами елементів, що втратив усі посилання"
        text_en: "A `List<string>` object with thousands of elements that lost all references"
    explanation: >
      GC керує лише керованою купою: він не виділяє й не звільняє неуправлювану пам'ять, а про дескриптори
      в `IntPtr` нічого не знає. Тому такі ресурси звільняють явно, зазвичай через `IDisposable` або
      `SafeHandle`. Недосяжні керовані об'єкти, навіть великі, збирач повертає сам.
    explanation_en: >
      The GC manages only the managed heap: it neither allocates nor releases unmanaged memory, and it
      knows nothing about handles stored in an `IntPtr`. Such resources are released explicitly, usually
      through `IDisposable` or `SafeHandle`. Unreachable managed objects, even large ones, are reclaimed
      by the collector itself.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/implementing-dispose
      - https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/unmanaged

  - id: dotnet-clr-016
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        int[] numbers = new int[3];
        string[] names = new string[2];
        Console.WriteLine($"{numbers[0]} {names[0] is null}");
    options:
      - text: "`0 True`"
        text_en: "`0 True`"
        correct: true
      - text: "`0 False`"
        text_en: "`0 False`"
      - text: "`null True`"
        text_en: "`null True`"
      - text: "`NullReferenceException` на `names[0]`"
        text_en: "`NullReferenceException` on `names[0]`"
    explanation: >
      Нові елементи масиву дістають значення за замовчуванням: `0` для `int` і `null` для посилальних типів,
      зокрема `string`. Порожнім рядком елемент не стає, тому `names[0] is null` дає `True`. Перевірка
      `is null` виняток не кидає.
    explanation_en: >
      New array elements get the default value: `0` for `int` and `null` for reference types, including
      `string`. An element does not become an empty string, so `names[0] is null` gives `True`. The
      `is null` check does not throw.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/builtin-types/default-values

  - id: dotnet-clr-017
    level: middle
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        var points = new Point[] { new(), new() };
        points[0].Bump();
        foreach (var p in points) p.Bump();
        Console.WriteLine($"{points[0].X} {points[1].X}");

        struct Point
        {
            public int X;
            public void Bump() => X++;
        }
    options:
      - text: "`1 0`"
        text_en: "`1 0`"
        correct: true
      - text: "`2 1`"
        text_en: "`2 1`"
      - text: "`0 0`"
        text_en: "`0 0`"
      - text: "Помилка компіляції: `foreach` забороняє викликати методи змінної ітерації"
        text_en: "A compile error: `foreach` forbids calling methods on the iteration variable"
    explanation: >
      Елемент масиву структур є змінною, тож `points[0].Bump()` змінює його на місці й дає `1`. Змінна
      `p` у `foreach` отримує копію елемента, тому `p.Bump()` змінює лише копію, а масив лишається
      незмінним: `points[1].X` дорівнює `0`. Змінити елементи на місці дозволяє лише `ref`-змінна
      ітерації. Присвоїти поле `p.X` компілятор би заборонив, а виклик методу дозволяє мовчки.
    explanation_en: >
      An element of a struct array is a variable, so `points[0].Bump()` changes it in place and gives `1`.
      The `foreach` variable `p` receives a copy of the element, so `p.Bump()` changes only the copy and
      the array stays unchanged: `points[1].X` is `0`. Only a `ref` iteration variable lets you change
      elements in place. The compiler would reject assigning the field `p.X`, but it silently allows the
      method call.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/builtin-types/struct
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/iteration-statements#the-foreach-statement

  - id: dotnet-clr-018
    level: middle
    type: multiple
    text: "Які твердження про фіналізатори (`~Type()`) у .NET 10 правильні?"
    text_en: "Which statements about finalizers (`~Type()`) in .NET 10 are correct?"
    options:
      - text: "Програміст не керує моментом виклику: його визначає збирач сміття"
        text_en: "The programmer does not control when it is called: the garbage collector decides"
        correct: true
      - text: "Під час завершення застосунку фіналізатори не гарантовано викликаються"
        text_en: "Finalizers are not guaranteed to be called when the application terminates"
        correct: true
      - text: "Фіналізатор не можна оголосити в структурі, лише в класі"
        text_en: "A finalizer cannot be declared in a struct, only in a class"
        correct: true
      - text: "Фіналізатор викликається одразу після того, як зникне останнє посилання на об'єкт"
        text_en: "The finalizer is called right after the last reference to the object disappears"
      - text: "Фіналізатор можна викликати явно, як звичайний метод: `obj.Finalize()`"
        text_en: "A finalizer can be called explicitly like a normal method: `obj.Finalize()`"
    explanation: >
      Момент запуску фіналізатора обирає GC, і він настає не одразу після втрати останнього посилання.
      У .NET 5 і новіших фіналізатори не запускаються як частина завершення застосунку, тому надійне
      прибирання потребує `Dispose`. Структури фіналізаторів мати не можуть, а викликати фіналізатор
      вручну не можна.
    explanation_en: >
      The GC chooses when a finalizer runs, and it does not happen right after the last reference is
      lost. In .NET 5 and later finalizers do not run as part of application termination, so reliable
      cleanup needs `Dispose`. Structs cannot have finalizers, and a finalizer cannot be called manually.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/classes-and-structs/finalizers
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/builtin-types/struct#limitations-with-the-design-of-a-structure-type

  - id: dotnet-clr-019
    level: middle
    type: single
    text: >
      Клас `Connection` реалізує `IDisposable`. Код викликає `conn.Dispose()` явно, а потім той самий
      об'єкт вдруге звільняє `using`. Яка поведінка `Dispose` відповідає настановам .NET?
    text_en: >
      The `Connection` class implements `IDisposable`. The code calls `conn.Dispose()` explicitly, and
      then a `using` disposes the same object a second time. Which `Dispose` behavior matches .NET
      guidelines?
    options:
      - text: "Повторні виклики нічого не роблять і не кидають винятків: `Dispose` має бути ідемпотентним"
        text_en: "Repeated calls do nothing and throw no exceptions: `Dispose` must be idempotent"
        correct: true
      - text: "Другий виклик кидає `ObjectDisposedException`, щоб виявити подвійне звільнення в коді"
        text_en: "The second call throws `ObjectDisposedException` to expose double disposal in the code"
      - text: "Другий виклик знову звільняє ресурс, бо `using` не знає про попередній виклик"
        text_en: "The second call releases the resource again, because `using` does not know about the earlier call"
      - text: "Компілятор забороняє явний `Dispose` для змінної, оголошеної в `using`"
        text_en: "The compiler forbids an explicit `Dispose` on a variable declared in `using`"
    explanation: >
      Настанови вимагають, щоб `Dispose` можна було викликати кілька разів без винятків, а наступні
      виклики нічого не робили. Тому типова реалізація тримає прапорець `_disposed` і виходить одразу.
      `ObjectDisposedException` доречний в інших членах після звільнення, але не в самому `Dispose`.
    explanation_en: >
      The guidelines require that `Dispose` can be called multiple times without exceptions, and that
      later calls do nothing. That is why the typical implementation keeps a `_disposed` flag and returns
      early. `ObjectDisposedException` fits other members after disposal, but not `Dispose` itself.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/implementing-dispose#dispose-and-disposebool

  - id: dotnet-clr-020
    level: middle
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        object boxed = 5;
        try
        {
            long value = (long)boxed;
            Console.WriteLine(value);
        }
        catch (InvalidCastException)
        {
            Console.WriteLine("InvalidCast");
        }
        Console.WriteLine((long)(int)boxed);
    options:
      - text: "`InvalidCast`, потім `5`"
        text_en: "`InvalidCast`, then `5`"
        correct: true
      - text: "`5`, потім `5`"
        text_en: "`5`, then `5`"
      - text: "`InvalidCast`, потім знову `InvalidCast`"
        text_en: "`InvalidCast`, then `InvalidCast` again"
      - text: "Помилка компіляції: `object` не можна явно привести до `long`"
        text_en: "A compile error: `object` cannot be explicitly cast to `long`"
    explanation: >
      Розпакувати можна лише в точний тип, який було упаковано: усередині `object` лежить `int`, тож
      `(long)boxed` кидає `InvalidCastException`, хоча `int` неявно перетворюється на `long`. Спершу
      розпаковують у `int`, а вже потім розширюють до `long`, тому останній рядок виводить `5`.
    explanation_en: >
      Unboxing works only to the exact type that was boxed: the `object` holds an `int`, so `(long)boxed`
      throws `InvalidCastException` even though `int` converts to `long` implicitly. Unboxing to `int`
      first and then widening to `long` works, so the last line prints `5`.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/types/boxing-and-unboxing#unboxing

  - id: dotnet-clr-021
    level: senior
    type: single
    text: >
      Сервіс на .NET 10 працює в контейнері з обмеженням пам'яті 1 ГБ. Параметри GC не задано. Що правильно
      про межу керованої купи?
    text_en: >
      A .NET 10 service runs in a container with a 1 GB memory limit. No GC settings are configured. What
      is correct about the managed heap limit?
    options:
      - text: "Ліміт контейнера вважається всією фізичною пам'яттю, а типова жорстка межа купи становить 75 % від нього"
        text_en: "The container limit is treated as total physical memory, and the default hard heap limit is 75 percent of it"
        correct: true
      - text: "Рантайм ігнорує ліміти cgroup і бачить пам'ять усього вузла, тож купа росте, доки контейнер не вб'є OOM-killer"
        text_en: "The runtime ignores cgroup limits and sees the whole node's memory, so the heap grows until the OOM killer stops the container"
      - text: "Купа обмежена рівно 1 ГБ, а інші потреби процесу, як-от стеки потоків, виходять за цю межу"
        text_en: "The heap is limited to exactly 1 GB, and other needs of the process, such as thread stacks, go beyond that limit"
      - text: "Типова межа дорівнює 20 МБ, і більшу купу доводиться вмикати вручну налаштуванням `GCHeapHardLimit`"
        text_en: "The default limit is 20 MB, and a larger heap has to be enabled manually with the `GCHeapHardLimit` setting"
    explanation: >
      Якщо процес працює в середовищі з обмеженою пам'яттю, наприклад у контейнері, рантайм вважає цей
      ліміт загальною фізичною пам'яттю, а типове значення `GCHeapHardLimitPercent` дорівнює 75 %. Решта
      лишається під не керовану пам'ять, стеки та інше. Тому для 1 ГБ купа обмежена приблизно 768 МБ, а не
      всім гігабайтом.
    explanation_en: >
      When the process runs in an environment with a memory limit, such as a container, the runtime treats
      that limit as total physical memory, and the default `GCHeapHardLimitPercent` is 75 percent. The
      rest remains for unmanaged memory, stacks and other needs. So for 1 GB the heap is capped at about
      768 MB, not the whole gigabyte.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/runtime-config/garbage-collector#heap-hard-limit-percent

  - id: dotnet-clr-022
    level: senior
    type: single
    text: >
      Пакетний обробник на 32-ядерному сервері без інших навантажень цінує пропускну здатність, а не
      затримку окремого виклику. Яку властивість Server GC варто врахувати, обираючи його замість
      Workstation GC?
    text_en: >
      A batch processor on a 32-core server with no other workloads values throughput over the latency of
      a single call. Which property of Server GC should be considered when choosing it over Workstation
      GC?
    options:
      - text: "Для кожного логічного процесора є окрема купа й виділений потік GC, і купи збираються одночасно"
        text_en: "Each logical processor gets its own heap and a dedicated GC thread, collected simultaneously"
        correct: true
      - text: "Збірка виконується на потоці користувача, який її спричинив, тому виділених потоків GC немає"
        text_en: "Collection runs on the user thread that triggered it, so there are no dedicated GC threads"
      - text: "Server GC має одну спільну купу й один потік GC, але збирає її без жодних пауз"
        text_en: "Server GC has one shared heap and one GC thread, but collects it with no pauses at all"
      - text: "Server GC збирає лише покоління 0 і 1, тому покоління 2 залишається поза збіркою"
        text_en: "Server GC collects only generations 0 and 1, so generation 2 is left out of collection"
    explanation: >
      Server GC створює купу й виділений потік збирання на кожен логічний процесор, і купи збираються
      паралельно. Це дає більшу пропускну здатність на багатоядерних машинах. Збірка на потоці користувача
      без виділених потоків описує Workstation GC. Пауз Server GC не усуває, а покоління 2 збирає так само.
    explanation_en: >
      Server GC creates a heap and a dedicated collection thread for each logical processor, and the
      heaps are collected in parallel. This gives higher throughput on multicore machines. Collection on
      the triggering user thread with no dedicated threads describes Workstation GC. Server GC does not
      remove pauses, and it collects generation 2 as well.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/workstation-server-gc#server-gc

  - id: dotnet-clr-023
    level: senior
    type: multiple
    text: >
      Код бере буфери з `ArrayPool<byte>.Shared`. Які практики й твердження про це правильні?
    text_en: >
      Code takes buffers from `ArrayPool<byte>.Shared`. Which practices and statements about this are
      correct?
    options:
      - text: "`Rent(100)` може повернути масив довший за 100 елементів, тож довжину даних слід передавати окремо"
        text_en: "`Rent(100)` may return an array longer than 100 elements, so the data length must be passed separately"
        correct: true
      - text: "Після `Return` масивом користуватися не можна: його може отримати інший виклик `Rent`"
        text_en: "After `Return` the array must not be used: another `Rent` call may receive it"
        correct: true
      - text: "Вміст орендованого масиву не гарантовано нульовий, тому не можна покладатися на порожні дані"
        text_en: "The contents of a rented array are not guaranteed to be zero, so empty data must not be assumed"
        correct: true
      - text: "Якщо повернути масив із `clearArray: false`, пул однаково обнулить його перед повторною видачею"
        text_en: "If an array is returned with `clearArray: false`, the pool still zeroes it before handing it out again"
      - text: "Масив, який не повернули в пул, назавжди лишається в пам'яті, бо GC його не бачить"
        text_en: "An array that was never returned to the pool stays in memory forever, because the GC cannot see it"
    explanation: >
      `Rent` гарантує буфер щонайменше потрібної довжини, а не точної, і його вміст може лишитися від
      попереднього власника. Після `Return` власність передано пулові, тож подальше використання псує
      чужі дані. Із `clearArray: false` вміст залишається як є. Загублений масив просто збере GC, пул
      втратить лише можливість його перевикористати.
    explanation_en: >
      `Rent` guarantees a buffer of at least the requested length, not exactly that, and its contents may
      be left over from a previous owner. After `Return` ownership passes back to the pool, so further
      use corrupts someone else's data. With `clearArray: false` the contents are left unchanged. A lost
      array is simply collected by the GC, and the pool only loses the chance to reuse it.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/api/system.buffers.arraypool-1.return
      - https://learn.microsoft.com/en-us/dotnet/api/system.buffers.arraypool-1.rent

  - id: dotnet-clr-024
    level: senior
    type: single
    text: >
      Клас напряму тримає неуправлювану пам'ять і має фіналізатор, що викликає `Dispose(false)`. У гілці
      `Dispose(bool disposing)` для `disposing == false` хтось додав `_logger.Flush()` і `_cache.Dispose()`
      (обидва поля — керовані об'єкти). Чому це небезпечно?
    text_en: >
      A class directly holds unmanaged memory and has a finalizer that calls `Dispose(false)`. In the
      `disposing == false` path of `Dispose(bool disposing)`, someone added `_logger.Flush()` and
      `_cache.Dispose()` (both fields are managed objects). Why is this dangerous?
    options:
      - text: "Порядок, у якому GC фіналізує керовані об'єкти, не визначений, тож вони можуть уже бути звільнені чи недійсні"
        text_en: "The order in which the GC finalizes managed objects is nondeterministic, so they may already be disposed or invalid"
        correct: true
      - text: "Фіналізатор виконується на потоці користувача, тож блокування в `Flush` зависає весь застосунок"
        text_en: "The finalizer runs on a user thread, so blocking in `Flush` freezes the whole application"
      - text: "Після `Dispose(false)` GC більше не збирає об'єкт, тож будь-який виклик у цій гілці викликає витік пам'яті"
        text_en: "After `Dispose(false)` the GC no longer collects the object, so any call in this path causes a memory leak"
      - text: "Керовані поля в гілці фіналізатора завжди дорівнюють `null`, тож кожен виклик закінчується `NullReferenceException`"
        text_en: "Managed fields are always `null` in the finalizer path, so every call ends with `NullReferenceException`"
    explanation: >
      Гілка `false` має звільняти лише неуправлювані ресурси: під час фіналізації керовані об'єкти
      могли вже бути звільнені, бо порядок їх фіналізації не визначений. Тому настанови забороняють
      торкатися їх звідти. Поля при цьому не обнуляються автоматично, а справжня небезпека в недійсному
      стані об'єктів. Керовані ресурси звільняють у гілці `disposing == true`.
    explanation_en: >
      The `false` path should release only unmanaged resources: during finalization managed objects may
      already be disposed, because the order of their finalization is nondeterministic. That is why the
      guidelines forbid touching them from there. Fields are not nulled automatically, and the real
      danger is the invalid state of those objects. Managed resources are released in the
      `disposing == true` path.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/implementing-dispose#the-disposebool-method-overload
      - https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/classes-and-structs/finalizers
