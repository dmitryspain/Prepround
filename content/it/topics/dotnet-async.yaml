id: dotnet-async
title: Async і багатопотоковість
title_en: Async and multithreading
description: Task, async/await, SynchronizationContext, lock, TPL, Channels, дедлоки.
description_en: Task, async/await, SynchronizationContext, lock, TPL, Channels, deadlocks.
icon: zap
questions:
  - id: dotnet-async-001
    level: junior
    type: single
    text: "Чим `await task` відрізняється від `task.Wait()`, якщо задача ще не завершилась?"
    text_en: "How does `await task` differ from `task.Wait()` if the task has not completed yet?"
    options:
      - text: "`await` не блокує потік і продовжить метод після завершення задачі, а `Wait()` блокує"
        text_en: "`await` does not block the thread and resumes the method after the task completes, while `Wait()` blocks"
        correct: true
      - text: "`await` запускає задачу в окремому потоці, а `Wait()` виконує її в поточному"
        text_en: "`await` runs the task on a separate thread, while `Wait()` runs it on the current one"
      - text: "Нічим: обидва блокують поточний потік, `await` лише коротший запис"
        text_en: "No difference: both block the current thread, `await` is just shorter syntax"
      - text: "`await` лише запускає задачу й одразу йде далі, а результат потім беруть через `Result`"
        text_en: "`await` only starts the task and moves on immediately, and the result is then taken through `Result`"
    explanation: >
      На незавершеній задачі `await` реєструє решту методу як продовження й повертає керування викликачу,
      тож потік вільний для іншої роботи. Окремих потоків `async` і `await` самі не створюють, тому варіант
      про «окремий потік» хибний. `Wait()` і `Result` натомість тримають потік заблокованим до кінця задачі.
    explanation_en: >
      On an incomplete task, `await` registers the rest of the method as a continuation and returns control to
      the caller, so the thread is free for other work. `async` and `await` do not create separate threads
      themselves, so the "separate thread" option is wrong. `Wait()` and `Result`, by contrast, keep the thread
      blocked until the task finishes.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/operators/await
      - https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/task-asynchronous-programming-model#threads

  - id: dotnet-async-002
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: "What does this code print?"
    code:
      lang: csharp
      source: |
        Console.Write("A");
        var task = PrintAsync();
        Console.Write("C");
        await task;
        Console.Write("E");

        static async Task PrintAsync()
        {
            Console.Write("B");
            await Task.Delay(100);
            Console.Write("D");
        }
    options:
      - text: "`ABCDE`"
        text_en: "`ABCDE`"
        correct: true
      - text: "`ACBDE`"
        text_en: "`ACBDE`"
      - text: "`ACEBD`"
        text_en: "`ACEBD`"
      - text: "`ABDCE`"
        text_en: "`ABDCE`"
    explanation: >
      Async-метод виконується синхронно до першого `await` незавершеної задачі, тому `B` друкується ще до
      повернення з `PrintAsync`. На `await Task.Delay` метод повертає керування, друкується `C`, а `await task`
      чекає, поки `PrintAsync` виведе `D`, і лише потім виводиться `E`.
    explanation_en: >
      An async method runs synchronously up to the first `await` of an incomplete task, so `B` is printed
      before `PrintAsync` returns. At `await Task.Delay` the method returns control, `C` is printed, and `await
      task` waits until `PrintAsync` prints `D`, and only then is `E` printed.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/task-asynchronous-programming-model#what-happens-in-an-async-method

  - id: dotnet-async-003
    level: junior
    type: multiple
    text: "Які твердження про оператор `lock` правильні?"
    text_en: "Which statements about the `lock` statement are true?"
    options:
      - text: "Тіло `lock` на тому самому об'єкті одночасно виконує щонайбільше один потік"
        text_en: "The body of `lock` on the same object is executed by at most one thread at a time"
        correct: true
      - text: "Блокування знімається, навіть якщо в тілі `lock` кинуто виняток"
        text_en: "The lock is released even if an exception is thrown in the body of `lock`"
        correct: true
      - text: "Використати `await` усередині тіла `lock` не можна: це помилка компіляції"
        text_en: "Using `await` inside the body of `lock` is not allowed: it is a compile error"
        correct: true
      - text: "Потік, який дійшов до зайнятого `lock`, отримує виняток замість очікування"
        text_en: "A thread that reaches a held `lock` gets an exception instead of waiting"
      - text: "`lock` не дає іншим потокам читати поля об'єкта, навіть якщо вони не беруть блокування"
        text_en: "`lock` prevents other threads from reading the object's fields, even if they do not acquire the lock"
    explanation: >
      `lock` дає взаємне виключення: інші потоки чекають, поки блокування звільниться, а не отримують виняток.
      Компілятор розгортає його в `try`/`finally`, тому вихід через виняток теж знімає блокування, а `await`
      у тілі заборонено. Захищає `lock` лише той код, який бере те саме блокування: читання поля без `lock`
      ніхто не зупинить.
    explanation_en: >
      `lock` provides mutual exclusion: other threads wait until the lock is released rather than getting an
      exception. The compiler expands it into `try`/`finally`, so leaving through an exception also releases
      the lock, and `await` in the body is forbidden. `lock` protects only code that takes the same lock:
      nobody stops a read of a field made without `lock`.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/lock

  - id: dotnet-async-004
    level: junior
    type: single
    text: Приблизно скільки часу покаже цей код?
    text_en: "Approximately how much time will this code show?"
    code:
      lang: csharp
      source: |
        using System.Diagnostics;

        var stopwatch = Stopwatch.StartNew();
        Task first = Task.Delay(1000);
        Task second = Task.Delay(1000);
        await Task.WhenAll(first, second);
        Console.WriteLine(stopwatch.Elapsed);
    options:
      - text: "Близько 1 секунди: обидві затримки йдуть одночасно"
        text_en: "About 1 second: both delays run at the same time"
        correct: true
      - text: "Близько 2 секунд: друга затримка почнеться лише тоді, коли закінчиться перша"
        text_en: "About 2 seconds: the second delay starts only when the first one finishes"
      - text: "Майже 0: `Task.WhenAll` не чекає задач, а лише об'єднує їх в одну"
        text_en: "Almost 0: `Task.WhenAll` does not wait for the tasks, it only combines them into one"
      - text: "Залежить від кількості ядер: кожна затримка займає окреме ядро"
        text_en: "Depends on the number of cores: each delay occupies a separate core"
    explanation: >
      Метод, що повертає `Task`, запускає операцію одразу, тож обидві затримки йдуть паралельно ще до
      `WhenAll`. `await Task.WhenAll` завершується, коли завершились усі задачі, тобто приблизно через секунду.
      Дві секунди вийшли б, якби кожну затримку чекали окремим `await` одразу після створення.
    explanation_en: >
      A method that returns a `Task` starts the operation right away, so both delays run in parallel before
      `WhenAll`. `await Task.WhenAll` completes when all the tasks have completed, i.e. after about a second.
      Two seconds would result if each delay were awaited separately with its own `await` right after creation.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/#start-tasks-concurrently
      - https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/#apply-await-expressions-to-tasks-efficiently

  - id: dotnet-async-005
    level: middle
    type: single
    text: Що станеться під час запуску цього консольного застосунку?
    text_en: "What happens when this console application runs?"
    code:
      lang: csharp
      source: |
        try
        {
            SendAsync();
        }
        catch (InvalidOperationException)
        {
            Console.WriteLine("caught");
        }

        await Task.Delay(500);
        Console.WriteLine("done");

        static async void SendAsync()
        {
            await Task.Delay(100);
            throw new InvalidOperationException("boom");
        }
    options:
      - text: "Процес упаде з необробленим винятком, не вивівши ні `caught`, ні `done`"
        text_en: "The process crashes with an unhandled exception, printing neither `caught` nor `done`"
        correct: true
      - text: "Виведе `caught`, бо виклик обгорнуто в `try`, а потім `done`"
        text_en: "Prints `caught` because the call is wrapped in `try`, and then `done`"
      - text: "Виведе лише `done`: виняток зникне, бо результат методу ніхто не чекав"
        text_en: "Prints only `done`: the exception disappears because nobody awaited the method's result"
      - text: "Помилка компіляції: `async`-метод мусить повертати `Task`"
        text_en: "Compile error: an `async` method must return `Task`"
    explanation: >
      У `async void` немає `Task`, куди можна зберегти виняток, тому викликач не може його перехопити:
      на момент кидка `SendAsync` уже повернула керування з `try`. У консольному застосунку виняток кидає
      потік із пулу, ніхто його не обробляє, і процес завершується. Тихо зникнути міг би виняток із
      `async Task`, яку ніхто не чекав, тому `async void` лишають лише для обробників подій.
    explanation_en: >
      `async void` has no `Task` in which to store the exception, so the caller cannot catch it: by the time of
      the throw, `SendAsync` has already returned control from the `try`. In a console application the
      exception is thrown on a thread-pool thread, nobody handles it, and the process terminates. An exception
      from an `async Task` that nobody awaited could vanish silently, which is why `async void` is kept only
      for event handlers.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/async-return-types#void-return-type
      - https://learn.microsoft.com/en-us/archive/msdn-magazine/2013/march/async-await-best-practices-in-asynchronous-programming#avoid-async-void

  - id: dotnet-async-006
    level: middle
    type: multiple
    text: Обидві задачі падають. Які твердження про цей код правильні?
    text_en: "Both tasks fail. Which statements about this code are true?"
    code:
      lang: csharp
      source: |
        var all = Task.WhenAll(FailAsync("first", 100), FailAsync("second", 200));
        try
        {
            await all;
        }
        catch (Exception ex)
        {
            Console.WriteLine($"{ex.GetType().Name}: {ex.Message}");
            Console.WriteLine(all.Exception!.InnerExceptions.Count);
        }

        static async Task FailAsync(string name, int delayMs)
        {
            await Task.Delay(delayMs);
            throw new InvalidOperationException(name);
        }
    options:
      - text: "`catch` отримає `InvalidOperationException` з текстом `first`, а не `AggregateException`"
        text_en: "`catch` receives an `InvalidOperationException` with the text `first`, not an `AggregateException`"
        correct: true
      - text: "`all.Exception.InnerExceptions` містить обидва винятки, тож другий рядок виведе `2`"
        text_en: "`all.Exception.InnerExceptions` contains both exceptions, so the second line prints `2`"
        correct: true
      - text: "`catch` отримає `AggregateException`, у якому зібрано обидва винятки обох задач"
        text_en: "`catch` receives an `AggregateException` that collects both exceptions of both tasks"
      - text: "`await all` кине виняток одразу, щойно впаде перша задача, не чекаючи, поки завершиться друга"
        text_en: "`await all` throws as soon as the first task fails, without waiting for the second to finish"
      - text: "Друга задача буде автоматично скасована токеном, щойно впаде перша"
        text_en: "The second task is automatically canceled by a token as soon as the first one fails"
    explanation: >
      Задача з `Task.WhenAll` завершується, лише коли завершились усі передані задачі, і зберігає всі їхні
      винятки. `await` перекидає з неї перший виняток як є, без обгортки, тому `catch (AggregateException)`
      тут не спрацював би. Решта винятків доступна через `Task.Exception.InnerExceptions`, а `AggregateException`
      отримує той, хто блокується через `Wait()` чи `Result`.
    explanation_en: >
      The task from `Task.WhenAll` completes only when all the passed tasks have completed, and it stores all
      of their exceptions. `await` rethrows the first exception from it as is, without a wrapper, so `catch
      (AggregateException)` would not fire here. The remaining exceptions are available through
      `Task.Exception.InnerExceptions`, while `AggregateException` is received by the one who blocks with
      `Wait()` or `Result`.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/#handle-asynchronous-exceptions
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task.whenall

  - id: dotnet-async-007
    level: middle
    type: single
    text: "Що змінює `ConfigureAwait(false)` у виразі `await stream.ReadAsync(buffer).ConfigureAwait(false)`?"
    text_en: "What does `ConfigureAwait(false)` change in the expression `await stream.ReadAsync(buffer).ConfigureAwait(false)`?"
    options:
      - text: "Продовження після `await` не повертається в захоплений `SynchronizationContext`"
        text_en: "The continuation after `await` is not marshaled back to the captured `SynchronizationContext`"
        correct: true
      - text: "Сама операція читання виконуватиметься в окремому потоці з пулу, а не в поточному потоці"
        text_en: "The read operation itself will run on a separate thread-pool thread rather than the current thread"
      - text: "Винятки з `ReadAsync` не перекидатимуться в метод, який чекає на результат"
        text_en: "Exceptions from `ReadAsync` will not be rethrown in the method awaiting the result"
      - text: "Якщо задача вже завершена, код після `await` гарантовано перейде в інший потік"
        text_en: "If the task has already completed, the code after `await` is guaranteed to move to another thread"
    explanation: >
      `ConfigureAwait` впливає лише на те, де виконається продовження: з `false` його не повертають у
      початковий контекст. Саму операцію він нікуди не переносить. Якщо ж задача на момент `await` уже
      завершена, код після `await` просто йде далі синхронно в тому самому потоці.
    explanation_en: >
      `ConfigureAwait` affects only where the continuation runs: with `false` it is not returned to the
      original context. It does not move the operation itself anywhere. If the task is already complete at the
      time of `await`, the code after `await` simply continues synchronously on the same thread.
    sources:
      - https://devblogs.microsoft.com/dotnet/configureawait-faq/

  - id: dotnet-async-008
    level: middle
    type: single
    text: >
      Продюсер пише в канал `Channel.CreateBounded<Order>(100)` швидше, ніж консюмер читає.
      Що відбувається, коли в каналі вже 100 елементів?
    text_en: >
      A producer writes to `Channel.CreateBounded<Order>(100)` faster than the consumer reads. What
      happens when the channel already holds 100 items?
    options:
      - text: "`WriteAsync` чекатиме на вільне місце, а `TryWrite` одразу поверне `false`"
        text_en: "`WriteAsync` waits for free space, while `TryWrite` returns `false` immediately"
        correct: true
      - text: "`WriteAsync` кине `ChannelClosedException`, бо канал переповнено"
        text_en: "`WriteAsync` throws `ChannelClosedException` because the channel is full"
      - text: "Канал мовчки відкине найстаріший елемент, щоб записати новий"
        text_en: "The channel silently drops the oldest item to write the new one"
      - text: "Канал збільшить місткість, бо обмеження в конструкторі діє лише як підказка для пам'яті"
        text_en: "The channel increases its capacity, because the limit in the constructor is only a memory hint"
    explanation: >
      За замовчуванням обмежений канал працює в режимі `BoundedChannelFullMode.Wait`: запис асинхронно чекає
      на вільне місце, і так продюсер отримує зворотний тиск (backpressure). Відкидання найстаріших чи
      найновіших елементів відбувається лише тоді, коли такий `FullMode` задано явно.
    explanation_en: >
      By default a bounded channel works in `BoundedChannelFullMode.Wait` mode: a write waits asynchronously
      for free space, and this is how the producer gets backpressure. Dropping the oldest or newest items
      happens only when such a `FullMode` is set explicitly.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/channels#bounded-channels

  - id: dotnet-async-009
    level: senior
    type: single
    text: У WPF-застосунку натискання кнопки назавжди «вішає» інтерфейс. Чому?
    text_en: "In a WPF application, clicking the button hangs the UI forever. Why?"
    code:
      lang: csharp
      source: |
        private void OnLoadClick(object sender, RoutedEventArgs e)
        {
            var data = LoadAsync().Result;
            ResultText.Text = data;
        }

        private async Task<string> LoadAsync()
        {
            var json = await _httpClient.GetStringAsync(_url);
            return json.Trim();
        }
    options:
      - text: "Продовження після `await` чекає на UI-потік, а той заблоковано на `.Result`"
        text_en: "The continuation after `await` waits for the UI thread, which is blocked on `.Result`"
        correct: true
      - text: "`HttpClient` не можна викликати з UI-потоку, тому запит ніколи не відправляється"
        text_en: "`HttpClient` cannot be called from the UI thread, so the request is never sent"
      - text: "`.Result` на незавершеній задачі одразу кидає виняток, а WPF мовчки його ковтає"
        text_en: "`.Result` on an incomplete task throws an exception immediately, and WPF silently swallows it"
      - text: "Вичерпано пул потоків: `GetStringAsync` тримає потік пулу весь час, поки чекає на відповідь"
        text_en: "The thread pool is exhausted: `GetStringAsync` holds a pool thread the whole time it waits for the response"
    explanation: >
      `await` захоплює `SynchronizationContext` UI-потоку й намагається виконати там продовження `LoadAsync`,
      але єдиний UI-потік синхронно чекає на `.Result`, і жоден не може рушити далі. Виправлення: зробити
      обробник `async void` і писати `await LoadAsync()`, тобто async до кінця; `ConfigureAwait(false)` у
      бібліотечному коді теж знімає цей дедлок. Пул потоків тут ні до чого: заблоковано саме UI-потік.
    explanation_en: >
      `await` captures the UI thread's `SynchronizationContext` and tries to run the continuation of
      `LoadAsync` there, but the only UI thread is synchronously waiting on `.Result`, so neither can proceed.
      The fix: make the handler `async void` and write `await LoadAsync()`, i.e. async all the way;
      `ConfigureAwait(false)` in library code also removes this deadlock. The thread pool is irrelevant here:
      it is the UI thread that is blocked.
    sources:
      - https://devblogs.microsoft.com/dotnet/configureawait-faq/
      - https://learn.microsoft.com/en-us/archive/msdn-magazine/2013/march/async-await-best-practices-in-asynchronous-programming#async-all-the-way

  - id: dotnet-async-010
    level: senior
    type: multiple
    text: >
      API на ASP.NET Core під навантаженням відповідає дедалі повільніше. У контролерах асинхронні виклики
      до бази чекають через `.Result` і `.Wait()`. Які спостереження й висновки відповідають цій ситуації?
    text_en: >
      An ASP.NET Core API responds slower and slower under load. Controllers wait for asynchronous
      database calls with `.Result` and `.Wait()`. Which observations and conclusions match this
      situation?
    options:
      - text: "Кількість потоків у пулі повільно, але стабільно росте, а CPU завантажено значно менше ніж на 100 %"
        text_en: "The number of thread-pool threads grows slowly but steadily, and CPU usage is well below 100%"
        correct: true
      - text: "Класичного дедлоку, як у WPF, немає: в ASP.NET Core немає `SynchronizationContext`"
        text_en: "There is no classic deadlock as in WPF: ASP.NET Core has no `SynchronizationContext`"
        correct: true
      - text: "Виправлення — `await` замість `.Result` і `.Wait()`, щоб потік повертався в пул на час запиту"
        text_en: "The fix is `await` instead of `.Result` and `.Wait()`, so the thread returns to the pool while the query runs"
        correct: true
      - text: "CPU завантажено майже на 100 %, бо заблоковані потоки весь час активно крутяться в циклі очікування результату"
        text_en: "CPU usage is close to 100% because the blocked threads are constantly spinning in a loop waiting for the result"
      - text: "Щойно всі потоки пулу зайнято, нові запити одразу отримують `503 Service Unavailable`"
        text_en: "As soon as all pool threads are busy, new requests immediately get `503 Service Unavailable`"
    explanation: >
      Блокувальне очікування тримає потік пулу на весь час запиту до бази, нові запити стоять у черзі, а пул
      додає потоки поступово, тож затримки ростуть за низького CPU. Класичного дедлоку немає, бо продовженню
      не потрібен якийсь особливий потік, але пропускна здатність падає. Лікується це асинхронністю до кінця:
      з `await` потік повертається в пул і обслуговує інші запити.
    explanation_en: >
      Blocking waits hold a pool thread for the entire database request, new requests queue up, and the pool
      adds threads gradually, so latency grows while CPU stays low. There is no classic deadlock because the
      continuation does not need any special thread, but throughput drops. The cure is async all the way: with
      `await` the thread returns to the pool and serves other requests.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/diagnostics/debug-threadpool-starvation#detect-threadpool-starvation
      - https://devblogs.microsoft.com/dotnet/configureawait-faq/

  - id: dotnet-async-011
    level: senior
    type: multiple
    text: "Метод повертає `ValueTask<int>`. Які дії з отриманим значенням неприпустимі?"
    text_en: "A method returns `ValueTask<int>`. Which actions on the received value are not allowed?"
    options:
      - text: "Двічі зробити `await` того самого екземпляра"
        text_en: "Using `await` on the same instance twice"
        correct: true
      - text: "Прочитати `.Result`, поки операція ще не завершилась"
        text_en: "Reading `.Result` while the operation has not completed yet"
        correct: true
      - text: "Двічі викликати `AsTask()` на тому самому екземплярі"
        text_en: "Calling `AsTask()` twice on the same instance"
        correct: true
      - text: "Один раз зробити `await` одразу після виклику"
        text_en: "Using `await` once right after the call"
      - text: "Один раз викликати `AsTask()` і чекати отриманий `Task` багато разів"
        text_en: "Calling `AsTask()` once and awaiting the resulting `Task` many times"
    explanation: >
      `ValueTask<T>` допомагає уникнути алокації, коли результат часто готовий синхронно, але спожити його
      можна лише один раз: повторний `await`, кілька `AsTask()` чи `.Result` до завершення дають невизначену
      поведінку. Якщо результат потрібен кілька разів або в `WhenAll`, його один раз перетворюють на `Task`.
      Тому за замовчуванням методи повертають `Task`, а `ValueTask` беруть, коли профілювання показало, що
      алокації справді заважають.
    explanation_en: >
      `ValueTask<T>` helps avoid allocation when the result is often ready synchronously, but it can be
      consumed only once: a repeated `await`, multiple `AsTask()` calls, or `.Result` before completion give
      undefined behavior. If the result is needed several times or in `WhenAll`, convert it to a `Task` once.
      That is why methods return `Task` by default, and `ValueTask` is chosen when profiling has shown that
      allocations really matter.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.valuetask-1#remarks

  - id: dotnet-async-012
    level: senior
    type: single
    text: Що виведе цей код?
    text_en: "What does this code print?"
    code:
      lang: csharp
      source: |
        await Task.Factory.StartNew(async () =>
        {
            await Task.Delay(1000);
            Console.WriteLine("inner");
        });
        Console.WriteLine("outer");
        await Task.Delay(2000);
    options:
      - text: "`outer`, а приблизно через секунду `inner`"
        text_en: "`outer`, and about a second later `inner`"
        correct: true
      - text: "`inner`, а потім `outer`"
        text_en: "`inner`, then `outer`"
      - text: "Лише `outer`: внутрішня задача скасовується, коли завершилась зовнішня"
        text_en: "Only `outer`: the inner task is canceled when the outer one completes"
      - text: "Помилка компіляції: `StartNew` не приймає async-лямбду"
        text_en: "Compile error: `StartNew` does not accept an async lambda"
    explanation: >
      Для async-лямбди `StartNew` повертає `Task<Task>`, і зовнішня задача завершується, щойно лямбда дійшла
      до першого `await` і повернула внутрішню задачу. Тому `await` чекає лише запуск, а не саму роботу.
      `Task.Run` сам розгортає внутрішню задачу, тож з ним вийшло б `inner`, а потім `outer`; зі `StartNew`
      для цього потрібен `.Unwrap()`.
    explanation_en: >
      For an async lambda `StartNew` returns `Task<Task>`, and the outer task completes as soon as the lambda
      reaches the first `await` and returns the inner task. So `await` waits only for the start, not the work
      itself. `Task.Run` unwraps the inner task itself, so with it the output would be `inner`, then `outer`;
      with `StartNew` you need `.Unwrap()` for that.
    sources:
      - https://devblogs.microsoft.com/dotnet/task-run-vs-task-factory-startnew/

  - id: dotnet-async-013
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        var slow = GetAsync("slow", 300);
        var fast = GetAsync("fast", 50);

        var first = await Task.WhenAny(slow, fast);
        Console.WriteLine(first.Result);

        static async Task<string> GetAsync(string name, int ms)
        {
            await Task.Delay(ms);
            return name;
        }
    options:
      - text: "`fast`, бо `WhenAny` повертає задачу, яка завершилась першою"
        text_en: "`fast`, because `WhenAny` returns the task that completed first"
        correct: true
      - text: "`slow`, бо `WhenAny` повертає першу задачу зі списку аргументів"
        text_en: "`slow`, because `WhenAny` returns the first task from the argument list"
      - text: "`slow`, бо `WhenAny` чекає, поки завершаться всі передані задачі"
        text_en: "`slow`, because `WhenAny` waits until all the passed tasks finish"
      - text: "Код не скомпілюється, бо `WhenAny` повертає `Task<Task<string>>`, який не можна `await`"
        text_en: "The code does not compile, because `WhenAny` returns a `Task<Task<string>>` that cannot be used with `await`"
    explanation: >
      `Task.WhenAny` повертає задачу, яка завершується, щойно завершиться будь-яка з переданих, а її
      результат — саме та переможна задача. Порядок аргументів нічого не вирішує, а решта задач
      продовжує виконуватись. `Task<Task<string>>` справді повертається, але після `await` ми
      отримуємо внутрішню `Task<string>`.
    explanation_en: >
      `Task.WhenAny` returns a task that completes as soon as any of the passed tasks completes, and its
      result is that winning task. Argument order decides nothing, and the other tasks keep running.
      A `Task<Task<string>>` is indeed returned, but after `await` we get the inner `Task<string>`.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task.whenany

  - id: dotnet-async-014
    level: junior
    type: single
    text: >
      Довгий цикл у задачі отримав `cts.Token`, але в тілі циклу токен ніде не перевіряється.
      Що зробить виклик `cts.Cancel()`?
    text_en: >
      A long loop in a task received `cts.Token`, but the loop body never checks the token.
      What will `cts.Cancel()` do?
    options:
      - text: "Токен перейде у стан скасовано, але цикл і далі виконуватиметься до кінця"
        text_en: "The token will become canceled, but the loop will keep running to the end"
        correct: true
      - text: "Потік задачі буде негайно зупинено через `ThreadAbortException`"
        text_en: "The task's thread will be stopped immediately with a `ThreadAbortException`"
      - text: "Цикл завершиться на наступній ітерації, бо рантайм сам перевіряє токен"
        text_en: "The loop will end on the next iteration, because the runtime checks the token itself"
      - text: "Виклик `Cancel()` блокуватиметься, доки цикл не завершиться сам"
        text_en: "The `Cancel()` call will block until the loop finishes by itself"
    explanation: >
      Скасування в .NET кооперативне: `Cancel()` лише виставляє прапорець і викликає зареєстровані
      колбеки. Код сам має перевіряти токен (`ThrowIfCancellationRequested`) або передавати його в API,
      що підтримують скасування. Примусової зупинки потоку в сучасному .NET немає.
    explanation_en: >
      Cancellation in .NET is cooperative: `Cancel()` only sets a flag and invokes registered callbacks.
      The code itself must check the token (`ThrowIfCancellationRequested`) or pass it to APIs that
      support cancellation. Modern .NET has no forced thread termination.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/standard/threading/cancellation-in-managed-threads

  - id: dotnet-async-015
    level: junior
    type: multiple
    text: >
      Кілька потоків одночасно збільшують спільне поле `int _count`. Які способи роблять підрахунок
      коректним?
    text_en: >
      Several threads increment a shared `int _count` field at the same time. Which approaches make the
      counting correct?
    options:
      - text: "`Interlocked.Increment(ref _count)` замість `_count++` у кожному потоці"
        text_en: "`Interlocked.Increment(ref _count)` instead of `_count++` in every thread"
        correct: true
      - text: "`lock (_gate) { _count++; }` для спільного `_gate` в усіх потоках"
        text_en: "`lock (_gate) { _count++; }` on a `_gate` shared by all threads"
        correct: true
      - text: "Оголосити поле як `volatile int _count` і писати `_count++` у кожному потоці"
        text_en: "Declare the field as `volatile int _count` and write `_count++` in every thread"
      - text: "Писати `_count++` усередині `Task.Run` для кожного збільшення"
        text_en: "Write `_count++` inside `Task.Run` for each increment"
    explanation: >
      `_count++` — це читання, додавання й запис, тож без синхронізації потоки втрачають оновлення.
      `Interlocked.Increment` робить це атомарно, а `lock` дозволяє змінювати поле лише одному потоку
      одночасно. `volatile` гарантує свіжість читання й запису, але не робить атомарним складений
      `++`, а `Task.Run` синхронізації не додає.
    explanation_en: >
      `_count++` is a read, an add and a write, so without synchronization threads lose updates.
      `Interlocked.Increment` does it atomically, and `lock` lets only one thread change the field at a
      time. `volatile` guarantees fresh reads and writes but does not make a compound `++` atomic, and
      `Task.Run` adds no synchronization.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.interlocked.increment
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/lock

  - id: dotnet-async-016
    level: junior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        using System.Diagnostics;

        var sw = Stopwatch.StartNew();
        await WaitAsync();
        Console.Write("3");
        Console.WriteLine($" {sw.ElapsedMilliseconds >= 2000}");

        static async Task WaitAsync()
        {
            Console.Write("1");
            Task.Delay(2000);
            Console.Write("2");
        }
    options:
      - text: "`123 False`: затримку не очікували, тож метод не чекав"
        text_en: "`123 False`: the delay was not awaited, so the method did not wait"
        correct: true
      - text: "`123 True`: `await WaitAsync()` дочекається й вкладеної затримки"
        text_en: "`123 True`: `await WaitAsync()` also waits for the nested delay"
      - text: "`13 False`: рядок після `Task.Delay` буде пропущено до кінця затримки"
        text_en: "`13 False`: the line after `Task.Delay` is skipped until the delay ends"
      - text: "`12 True`: `await` у `Main` зупинить програму раніше, ніж виведеться `3`"
        text_en: "`12 True`: the `await` in `Main` stops the program before `3` is printed"
    explanation: >
      `Task.Delay(2000)` лише створює задачу. Без `await` метод не віддає керування й іде далі, а сама
      задача лишається без нагляду. Тож `2` виводиться одразу, `WaitAsync` завершується за долі
      секунди, і умова щодо 2000 мс хибна. Компілятор попереджає про це кодом CS4014.
    explanation_en: >
      `Task.Delay(2000)` only creates a task. Without `await` the method does not yield and moves on,
      while the task itself is left unattended. So `2` prints immediately, `WaitAsync` finishes in a
      fraction of a second, and the 2000 ms condition is false. The compiler warns about this with
      CS4014.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/compiler-messages/cs4014
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task.delay

  - id: dotnet-async-017
    level: middle
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        Task t = FailAsync();
        Console.WriteLine("called");
        try
        {
            await t;
        }
        catch (InvalidOperationException)
        {
            Console.WriteLine("caught");
        }

        static async Task FailAsync()
        {
            throw new InvalidOperationException("boom");
        }
    options:
      - text: "`called`, потім `caught`: виняток зберігається в задачі й кидається на `await`"
        text_en: "`called`, then `caught`: the exception is stored in the task and thrown at `await`"
        correct: true
      - text: "Лише `caught`: виняток вилітає з виклику `FailAsync()` до рядка `called`"
        text_en: "Only `caught`: the exception escapes the `FailAsync()` call before the `called` line"
      - text: "`called`, потім необроблений виняток: `catch` не ловить винятки з задач"
        text_en: "`called`, then an unhandled exception: `catch` does not catch exceptions from tasks"
      - text: "Нічого: програму завершує необроблений виняток ще до першого рядка виводу"
        text_en: "Nothing: an unhandled exception terminates the program before any output"
    explanation: >
      Метод з `async` не кидає виняток викликачу: компілятор перехоплює його й кладе в повернену задачу
      (стан `Faulted`). Виклик `FailAsync()` повертається нормально, тож `called` виводиться першим, а
      виняток перекидається аж на `await t`, де його і ловить `catch`.
    explanation_en: >
      An `async` method does not throw to the caller: the compiler catches the exception and stores it in
      the returned task (`Faulted` state). The `FailAsync()` call returns normally, so `called` prints
      first, and the exception is rethrown only at `await t`, where `catch` handles it.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/async-return-types#task-return-type
      - https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/async-return-types

  - id: dotnet-async-018
    level: middle
    type: single
    text: >
      Секція коду з `await` усередині має виконуватись не більше ніж одним викликом одночасно в межах
      процесу. Що застосувати?
    text_en: >
      A code section with `await` inside must run in at most one call at a time within the process. What
      should be used?
    options:
      - text: "`SemaphoreSlim(1, 1)`: `await WaitAsync()` перед секцією і `Release()` у `finally`"
        text_en: "`SemaphoreSlim(1, 1)`: `await WaitAsync()` before the section and `Release()` in `finally`"
        correct: true
      - text: "`lock` на спільному об'єкті навколо всього тіла разом з `await`"
        text_en: "`lock` on a shared object around the whole body, including the `await`"
      - text: "`Monitor.Enter` перед `await` і `Monitor.Exit` після нього в тому ж методі"
        text_en: "`Monitor.Enter` before the `await` and `Monitor.Exit` after it in the same method"
      - text: "`Mutex`: `WaitOne()` перед секцією і `ReleaseMutex()` у `finally` після неї"
        text_en: "`Mutex`: `WaitOne()` before the section and `ReleaseMutex()` in `finally` after it"
    explanation: >
      `lock` з `await` усередині не компілюється. `Monitor` і `Mutex` прив'язані до потоку, що їх узяв,
      а після `await` метод може продовжитись на іншому потоці, тож `Exit`/`ReleaseMutex` там кине виняток.
      `SemaphoreSlim` не має власника-потоку й має `WaitAsync`, що не блокує потік.
    explanation_en: >
      `lock` with an `await` inside does not compile. `Monitor` and `Mutex` are tied to the thread that
      acquired them, and after `await` the method may resume on another thread, so `Exit`/`ReleaseMutex`
      there will throw. `SemaphoreSlim` has no owning thread and offers `WaitAsync`, which does not block
      a thread.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/lock
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.semaphoreslim.waitasync

  - id: dotnet-async-019
    level: middle
    type: multiple
    text: "Які твердження про `TaskCompletionSource<int>` правильні?"
    text_en: "Which statements about `TaskCompletionSource<int>` are correct?"
    options:
      - text: "Повторний `SetResult` кидає `InvalidOperationException`, а `TrySetResult` повертає `false`"
        text_en: "A repeated `SetResult` throws `InvalidOperationException`, while `TrySetResult` returns `false`"
        correct: true
      - text: "Задачу не виконує жоден потік: вона завершується, коли хтось викличе `Set…`-метод"
        text_en: "No thread runs the task: it completes when someone calls a `Set…` method on its source"
        correct: true
      - text: "Після `TrySetCanceled()` `await` задачі кидає `OperationCanceledException` чи похідний"
        text_en: "After `TrySetCanceled()`, `await` on the task throws `OperationCanceledException` or a derived type"
        correct: true
      - text: "`SetException(ex)` завершує задачу у стані `Canceled`, а не `Faulted`, бо виняток вважається скасуванням"
        text_en: "`SetException(ex)` completes the task in the `Canceled` state rather than `Faulted`"
      - text: "Створення `TaskCompletionSource` займає потік пулу, який чекає виклику `SetResult`"
        text_en: "Creating a `TaskCompletionSource` occupies a pool thread that waits for `SetResult`"
    explanation: >
      Задача з `TaskCompletionSource` — це «ручна» задача без коду, що виконується: стан змінюють лише
      `Set…`-методи, і лише раз (інакше виняток, а `TrySet…` повертає `false`). Скасована задача
      кидає `OperationCanceledException` (на практиці `TaskCanceledException`), а `SetException`
      дає стан `Faulted`. Жодного потоку вона не займає.
    explanation_en: >
      A `TaskCompletionSource` task is a "manual" task with no code running behind it: only the `Set…`
      methods change its state, and only once (otherwise an exception, while `TrySet…` returns `false`).
      A canceled task throws `OperationCanceledException` (in practice `TaskCanceledException`), and
      `SetException` gives the `Faulted` state. It occupies no thread.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.taskcompletionsource-1
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.taskcompletionsource-1.setresult

  - id: dotnet-async-020
    level: middle
    type: single
    text: >
      Екшен ASP.NET Core 10 викликає синхронний метод репозиторію так: `await Task.Run(() => _repo.GetAll())`.
      Що це дає під навантаженням?
    text_en: >
      An ASP.NET Core 10 action calls a synchronous repository method like this:
      `await Task.Run(() => _repo.GetAll())`. What does this give under load?
    options:
      - text: "Масштабованості не додає: потік пулу все одно блокується, а до цього додається зайве планування"
        text_en: "No scalability gain: a pool thread is still blocked, and extra scheduling is added on top"
        correct: true
      - text: "Запит обслуговується швидше, бо блокування відбувається вже не на потоці запиту"
        text_en: "The request is served faster, because the blocking no longer happens on the request thread"
      - text: "Виклик стає справді асинхронним, бо `Task.Run` перетворює блокувальний ввід-вивід на неблокувальний"
        text_en: "The call becomes truly asynchronous, because `Task.Run` turns blocking I/O into non-blocking I/O"
      - text: "Це рекомендований спосіб викликати синхронний API, коли в нього немає асинхронної версії"
        text_en: "This is the recommended way to call a synchronous API when it has no asynchronous version"
    explanation: >
      Код ASP.NET Core і так виконується на потоках пулу, тож `Task.Run` лише переносить блокування з
      одного потоку пулу на інший і додає накладні витрати на планування. Кількість одночасно
      зайнятих потоків не змінюється. Справжній виграш дає асинхронний API, який не тримає потік
      під час очікування.
    explanation_en: >
      ASP.NET Core code already runs on thread pool threads, so `Task.Run` only moves the blocking from
      one pool thread to another and adds scheduling overhead. The number of busy threads stays the
      same. A real gain comes from an asynchronous API that does not hold a thread while waiting.
    sources:
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/best-practices#avoid-blocking-calls

  - id: dotnet-async-021
    level: senior
    type: single
    text: >
      Розробник пише `Parallel.ForEach(items, async item => await ProcessAsync(item));` (.NET 10) і
      вважає, що після рядка вся обробка завершена. Що відбувається насправді?
    text_en: >
      A developer writes `Parallel.ForEach(items, async item => await ProcessAsync(item));` (.NET 10)
      and assumes all processing is finished after this line. What actually happens?
    options:
      - text: "Лямбда стає `async void`, тож цикл завершується до кінця `ProcessAsync`, а виняток може обвалити процес"
        text_en: "The lambda becomes `async void`, so the loop ends before `ProcessAsync` finishes, and an exception can crash the process"
        correct: true
      - text: "`Parallel.ForEach` бачить задачі, які повертає лямбда, і чекає на кожну, тому все завершено"
        text_en: "`Parallel.ForEach` sees the tasks the lambda returns and waits for each, so everything is finished"
      - text: "Код не компілюється, бо `Parallel.ForEach` забороняє `async`-лямбди в тілі циклу"
        text_en: "The code does not compile, because `Parallel.ForEach` forbids `async` lambdas in the loop body"
      - text: "Обробка йде послідовно: `await` у лямбді вимикає паралелізм, але цикл теж чекає на все"
        text_en: "Processing is sequential: `await` in the lambda disables parallelism, but the loop still waits for everything"
    explanation: >
      `Parallel.ForEach` приймає `Action<T>`, тому `async`-лямбда компілюється як `async void`: цикл бачить
      лише синхронну частину до першого `await` і повертається. Решта працює «у фоні», а необроблений виняток
      з `async void` потрапляє в контекст, що може завершити процес. Для асинхронної роботи є
      `Parallel.ForEachAsync` (.NET 6+).
    explanation_en: >
      `Parallel.ForEach` takes an `Action<T>`, so the `async` lambda compiles as `async void`: the loop
      sees only the synchronous part before the first `await` and returns. The rest runs "in the
      background", and an unhandled exception from `async void` goes to a context that can terminate the
      process. For asynchronous work there is `Parallel.ForEachAsync` (.NET 6+).
    sources:
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.parallel.foreachasync
      - https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/async-return-types#void-return-type

  - id: dotnet-async-022
    level: senior
    type: multiple
    text: >
      Продюсер у `Channel.CreateUnbounded<int>()` записав 1 і 2, а потім завершив запис через
      `writer.Complete()`. Які твердження правильні?
    text_en: >
      A producer wrote 1 and 2 to `Channel.CreateUnbounded<int>()` and then finished writing with
      `writer.Complete()`. Which statements are correct?
    options:
      - text: "Читач через `ReadAllAsync` отримає 1 і 2, а потім цикл `await foreach` завершиться"
        text_en: "A reader using `ReadAllAsync` gets 1 and 2, and then the `await foreach` loop ends"
        correct: true
      - text: "`WriteAsync` у такий канал кидає `ChannelClosedException`, а `TryWrite` повертає `false`"
        text_en: "`WriteAsync` to such a channel throws `ChannelClosedException`, while `TryWrite` returns `false`"
        correct: true
      - text: "Після `Complete(ex)` читач вичитає буфер, а далі `ReadAllAsync` кине цей виняток"
        text_en: "After `Complete(ex)` the reader drains the buffer, and then `ReadAllAsync` throws that exception"
        correct: true
      - text: "Елементи, які читач ще не забрав, відкидаються в момент виклику `Complete()`"
        text_en: "Items the reader has not taken yet are discarded at the moment `Complete()` is called"
      - text: "`ReadAllAsync` після вичитування буфера чекає нових елементів, доки не скасують токен"
        text_en: "After draining the buffer, `ReadAllAsync` waits for new items until the token is canceled"
    explanation: >
      `Complete` означає «більше записів не буде», а не «забудь накопичене»: читачі вичитують буфер до кінця,
      і лише тоді `ReadAllAsync` завершується (або кидає виняток, переданий у `Complete(ex)`). Нові записи
      після завершення відхиляються. Саме тому читач, якому не передали сигнал завершення, чекає вічно.
    explanation_en: >
      `Complete` means "no more writes will come", not "forget what is buffered": readers drain the buffer
      to the end, and only then does `ReadAllAsync` finish (or throw the exception passed to
      `Complete(ex)`). New writes after completion are rejected. That is why a reader that is never given
      the completion signal waits forever.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/extensions/channels
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.channels.channelwriter-1.complete

  - id: dotnet-async-023
    level: senior
    type: single
    text: Що виведе цей код?
    text_en: What does this code print?
    code:
      lang: csharp
      source: |
        var tenant = new AsyncLocal<string>();
        tenant.Value = "A";

        await SetAsync();
        Console.WriteLine(tenant.Value);

        SetSync();
        Console.WriteLine(tenant.Value);

        async Task SetAsync()
        {
            tenant.Value = "B";
            await Task.Delay(10);
        }

        void SetSync() => tenant.Value = "C";
    options:
      - text: "`A`, потім `C`: зміна в `async`-методі не повертається до викликача, в синхронному — так"
        text_en: "`A`, then `C`: a change in an `async` method does not flow back to the caller; in a sync one it does"
        correct: true
      - text: "`B`, потім `C`: `AsyncLocal` бачить усі зміни, зроблені нижче за стеком викликів"
        text_en: "`B`, then `C`: `AsyncLocal` sees all changes made lower in the call stack"
      - text: "`A`, потім `A`: значення `AsyncLocal` після присвоєння стає незмінним у цьому контексті"
        text_en: "`A`, then `A`: an `AsyncLocal` value becomes immutable in this context after assignment"
      - text: "`B`, потім `B`: після `await` рантайм синхронізує значення з останнім присвоєнням"
        text_en: "`B`, then `B`: after `await` the runtime syncs the value to the latest assignment"
    explanation: >
      `AsyncLocal` живе в `ExecutionContext`, який тече вниз за асинхронним потоком викликів. Кожен
      `async`-метод працює зі своєю копією контексту, і зміни в ньому при поверненні до викликача
      скасовуються, тому після `SetAsync` видно `A`. Синхронний `SetSync` виконується у тому ж контексті, тож
      його запис `C` лишається.
    explanation_en: >
      `AsyncLocal` lives in the `ExecutionContext`, which flows down the asynchronous call chain. Each
      `async` method works with its own copy of the context, and changes made in it are undone when
      control returns to the caller, so after `SetAsync` you see `A`. The synchronous `SetSync` runs in
      the same context, so its write `C` stays.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.asynclocal-1
      - https://devblogs.microsoft.com/dotnet/how-async-await-really-works/

  - id: dotnet-async-024
    level: senior
    type: single
    text: >
      У .NET 10 з налаштуваннями за замовчуванням виклик `_ = SaveAsync();` запускає задачу, яка падає з
      винятком. Ніхто не робить `await` і не читає `Exception`. Що станеться?
    text_en: >
      In .NET 10 with default settings, the call `_ = SaveAsync();` starts a task that fails with an
      exception. Nobody uses `await` on it or reads `Exception`. What will happen?
    options:
      - text: "Процес працює далі; виняток лише спливе в `UnobservedTaskException`, коли GC збере задачу"
        text_en: "The process keeps running; the exception only surfaces in `UnobservedTaskException` once the GC collects the task"
        correct: true
      - text: "Процес негайно завершується необробленим винятком у потоці пулу, де впала задача"
        text_en: "The process terminates immediately with an unhandled exception on the thread where the task failed"
      - text: "Виняток повертається в метод, що викликав `SaveAsync()`, при наступному `await` у ньому"
        text_en: "The exception returns to the method that called `SaveAsync()` at the next `await` in it"
      - text: "Виняток переходить у наступну задачу, яка виконається на тому самому потоці пулу після неї"
        text_en: "The exception moves into the next task that runs on the same thread pool thread"
    explanation: >
      Із .NET 4.5 необроблений виняток задачі за замовчуванням не завершує процес. Його «помічає» лише
      фіналізація задачі, що відбувається довільно пізно, коли GC збере об'єкт. Тоді спрацьовує
      `UnobservedTaskException`, і рантайм його ковтає. На практиці помилки fire-and-forget губляться
      або з'являються через несподівано довгий час.
    explanation_en: >
      Since .NET 4.5, an unobserved task exception does not terminate the process by default. It is
      noticed only when the task is finalized, at an arbitrarily late time when the GC collects the
      object. Then `UnobservedTaskException` is raised and the runtime swallows it. In practice
      fire-and-forget errors get lost or show up unexpectedly late.
    sources:
      - https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.taskscheduler.unobservedtaskexception
      - https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/exception-handling-task-parallel-library
