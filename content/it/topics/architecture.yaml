id: architecture
title: Архітектура й патерни
title_en: Architecture and patterns
description: SOLID, GoF-патерни, Clean Architecture, DDD, мікросервіси, system design.
description_en: SOLID, GoF patterns, Clean Architecture, DDD, microservices, system design.
icon: boxes
questions:
  - id: architecture-001
    level: junior
    type: single
    text: Що стверджує принцип єдиної відповідальності (SRP)?
    text_en: What does the single responsibility principle (SRP) state?
    options:
    - text: Клас має мати лише одну причину для змін, тобто відповідати за одну річ
      text_en: A class should have only one reason to change, that is, be responsible for one thing
      correct: true
    - text: Клас має містити лише один публічний метод, щоб його було легко тестувати
      text_en: A class should contain only one public method so that it is easy to test
    - text: Кожен клас має наслідувати лише один базовий клас, щоб уникнути множинного наслідування
      text_en: Each class should inherit from only one base class to avoid multiple inheritance
    - text: Один клас має використовуватися лише в одному модулі застосунку, без повторного використання
      text_en: One class should be used in only one module of the application, with no reuse
    explanation: |
      SRP не про кількість методів, а про причини змін: якщо клас міняється і через формат звіту, і через правила розрахунку, він робить забагато. Через це зміни в одній відповідальності не ламають іншу.
    explanation_en: |
      SRP is not about the number of methods but about reasons to change: if a class changes both because of the report format and because of the calculation rules, it does too much. This way, changes to one responsibility do not break another.
    sources:
    - https://learn.microsoft.com/en-us/dotnet/architecture/modern-web-apps-azure/architectural-principles#single-responsibility
  - id: architecture-002
    level: junior
    type: single
    text: Яку проблему має цей псевдокод з погляду принципу інверсії залежностей і як її виправити?
    text_en: What problem does this pseudocode have from the dependency inversion principle's point of view, and how can it be fixed?
    code:
      lang: text
      source: |
        class OrderService:
            def __init__(self):
                self.repo = SqlOrderRepository()

            def place(self, order):
                self.repo.save(order)
    options:
    - text: Сервіс жорстко привʼязаний до `SqlOrderRepository`, тож залежність слід передавати як абстракцію
      text_en: The service is tightly coupled to `SqlOrderRepository`, so the dependency should be passed in as an abstraction
      correct: true
    - text: Сервіс не має приватних полів, тому їх треба зробити публічними для зручності тестування коду
      text_en: The service has no private fields, so they should be made public to make the code easier to test
    - text: Метод `place` має повертати значення, щоб результат збереження можна було перевірити в тесті
      text_en: The `place` method should return a value so that the result of saving can be checked in a test
    - text: Проблеми немає, бо створення залежності всередині класу є найпростішим і найзрозумілішим варіантом
      text_en: There is no problem, because creating a dependency inside the class is the simplest and clearest option
    explanation: |
      Модуль вищого рівня має залежати від абстракції (наприклад, `OrderRepository`), а не від SQL-реалізації. Тоді її можна підмінити в тестах чи при зміні сховища.
    explanation_en: |
      A higher-level module should depend on an abstraction (for example, `OrderRepository`), not on the SQL implementation. Then it can be replaced in tests or when the storage changes.
    sources:
    - https://learn.microsoft.com/en-us/dotnet/architecture/modern-web-apps-azure/architectural-principles#dependency-inversion
  - id: architecture-003
    level: junior
    type: single
    text: Яку задачу розв'язує патерн Observer?
    text_en: What problem does the Observer pattern solve?
    options:
    - text: Дозволяє обʼєкту сповіщати підписників про зміну стану, не знаючи їхніх типів
      text_en: It lets an object notify subscribers about a state change without knowing their types
      correct: true
    - text: Створює обʼєкти за описом, ховаючи від клієнта клас конкретної реалізації
      text_en: It creates objects from a description, hiding the concrete implementation class from the client
    - text: Додає обʼєкту поведінку обгортанням в інший обʼєкт того самого інтерфейсу
      text_en: It adds behavior to an object by wrapping it in another object with the same interface
    - text: Гарантує, що від класу існує лише один екземпляр на весь застосунок
      text_en: It guarantees that only one instance of a class exists in the whole application
    explanation: |
      Видавець зберігає список підписників і викликає їх при зміні. Створення обʼєктів — це фабрики, обгортання — Decorator, єдиний екземпляр — Singleton.
    explanation_en: |
      The publisher keeps a list of subscribers and calls them when something changes. Creating objects is the job of factories, wrapping is Decorator, and a single instance is Singleton.
    sources:
    - https://learn.microsoft.com/en-us/dotnet/standard/events/observer-design-pattern
  - id: architecture-004
    level: junior
    type: single
    text: Що відрізняє мікросервісну архітектуру від монолітної?
    text_en: What distinguishes a microservice architecture from a monolithic one?
    options:
    - text: Застосунок складається з малих слабко звʼязаних сервісів, які можна розгортати незалежно
      text_en: Small, loosely coupled services that can be deployed independently
      correct: true
    - text: Усі сервіси зобовʼязані використовувати одну спільну базу даних
      text_en: All services are required to use one shared database
    - text: Сервіси компілюються в один виконуваний файл, але мають різні папки
      text_en: The services are compiled into one executable file but have different folders
    - text: Мікросервіси завжди швидші, бо мережеві виклики дешевші за виклики в памʼяті
      text_en: Microservices are always faster, because network calls are cheaper than in-memory calls
    explanation: |
      Незалежне розгортання дає автономію команд і масштабування по частинах, але додає мережеві виклики, розподілені дані й операційну складність. Спільна БД якраз зводить автономію нанівець.
    explanation_en: |
      Independent deployment gives teams autonomy and scaling individual parts, but adds network calls, distributed data, and operational complexity. A shared database is exactly what undermines that autonomy.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/microservices/
  - id: architecture-005
    level: middle
    type: single
    text: Який принцип порушує цей код?
    text_en: Which principle does this code violate?
    code:
      lang: text
      source: |
        class Bird:
            def fly(self): ...

        class Penguin(Bird):
            def fly(self):
                raise NotSupportedError()

        def migrate(birds):
            for b in birds:
                b.fly()
    options:
    - text: Принцип підстановки Лісков, бо `Penguin` не підставляється замість `Bird`
      text_en: The Liskov substitution principle, because `Penguin` cannot be substituted for `Bird`
      correct: true
    - text: Принцип відкритості/закритості, бо клас `Bird` не можна розширити
      text_en: The open/closed principle, because the `Bird` class cannot be extended
    - text: Принцип єдиної відповідальності, бо `Bird` має лише один метод
      text_en: The single responsibility principle, because `Bird` has only one method
    - text: Порушень немає, бо виняток у перевизначеному методі є нормальною поведінкою
      text_en: There is no violation, because an exception in an overridden method is normal behavior
    explanation: |
      Код, який працює з `Bird`, має працювати з будь-яким підтипом, а тут `migrate` падає на пінгвіні. Політ виносять в окремий інтерфейс чи підклас (`FlyingBird`), а не перевизначають метод винятком.
    explanation_en: |
      Code that works with `Bird` must work with any subtype, but here `migrate` fails on a penguin. Flying is moved into a separate interface or subclass (`FlyingBird`) instead of overriding the method with an exception.
    sources:
    - https://blog.cleancoder.com/uncle-bob/2020/10/18/Solid-Relevance.html
  - id: architecture-006
    level: middle
    type: single
    text: Що вимагає правило залежностей (dependency rule) у Clean Architecture?
    text_en: What does the dependency rule in Clean Architecture require?
    options:
    - text: 'Залежності спрямовані всередину: домен не знає про базу даних, UI чи фреймворк'
      text_en: 'Dependencies point inward: the domain knows nothing about the database, the UI, or the framework'
      correct: true
    - text: Внутрішні шари викликають зовнішні напряму, щоб уникнути зайвих абстракцій і прошарків
      text_en: Inner layers call outer ones directly, to avoid unnecessary abstractions and layers
    - text: Усі шари залежать від шару доступу до даних, бо він є основою всієї системи
      text_en: All layers depend on the data access layer, because it is the foundation of the whole system
    - text: Шар домену має посилатися на ORM, щоб самостійно зберігати свої сутності в базі
      text_en: The domain layer should reference the ORM so that it can save its own entities to the database
    explanation: |
      Зовнішні шари (UI, інфраструктура) залежать від внутрішніх, а не навпаки. Коли внутрішньому шару потрібне сховище, він оголошує інтерфейс, а реалізацію постачає інфраструктура.
    explanation_en: |
      Outer layers (UI, infrastructure) depend on inner ones, not the other way around. When an inner layer needs storage, it declares an interface, and infrastructure supplies the implementation.
    sources:
    - https://learn.microsoft.com/en-us/dotnet/architecture/modern-web-apps-azure/common-web-application-architectures#clean-architecture
  - id: architecture-007
    level: middle
    type: multiple
    text: Які твердження про агрегати (aggregates) в DDD правильні?
    text_en: Which statements about aggregates in DDD are true?
    options:
    - text: Агрегат є межею узгодженості, і рівно одна його сутність є коренем
      text_en: An aggregate is a consistency boundary with exactly one root entity
      correct: true
    - text: На інші агрегати посилаються за ідентифікатором, а не прямим посиланням
      text_en: Other aggregates are referenced by identifier rather than by a direct reference
      correct: true
    - text: Агрегати проєктують малими, лише з даних для однієї транзакції
      text_en: Aggregates are kept small, holding only the data for one transaction
      correct: true
    - text: Кожна таблиця бази даних має відповідати одному агрегату
      text_en: Each table in the database schema should correspond to one aggregate
    explanation: |
      Агрегат визначає транзакційну межу, а не схему таблиць. Зведення в один агрегат незалежних сутностей змушує їхні оновлення змагатися за ті самі блокування. Між агрегатами достатньо кінцевої узгодженості.
    explanation_en: |
      An aggregate defines a transactional boundary, not a table schema. Merging independent entities into one aggregate makes their updates compete for the same locks. Eventual consistency is enough between aggregates.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/microservices/model/tactical-ddd
  - id: architecture-008
    level: middle
    type: single
    text: Що означає патерн CQRS?
    text_en: What does the CQRS pattern mean?
    options:
    - text: Операції запису й читання розділяють у різні моделі, які можна оптимізувати окремо
      text_en: Write and read operations are split into different models that can be optimized separately
      correct: true
    - text: Кожна команда обовʼязково зберігається як подія, а стан відновлюється з журналу подій
      text_en: Every command must be stored as an event, and the state is rebuilt from the event log
    - text: Для читання й запису потрібні дві різні фізичні бази даних на різних серверах
      text_en: Reading and writing require two different physical databases on different servers
    - text: Усі запити виконуються асинхронно через чергу повідомлень між клієнтом і сервером
      text_en: All queries run asynchronously through a message queue between the client and the server
    explanation: |
      CQRS — це розділення моделей читання й запису, а не вимога Event Sourcing чи двох СУБД. Їх часто поєднують, але вони незалежні.
    explanation_en: |
      CQRS is the separation of read and write models, not a requirement for Event Sourcing or two DBMSs. They are often combined, but they are independent.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs
  - id: architecture-009
    level: senior
    type: single
    text: У мікросервісах замовлення, склад і платежі мають власні БД. Склад уже зарезервував товар, але платіж не пройшов. Який підхід узгодженості доречний?
    text_en: In a microservice system, orders, inventory, and payments each have their own database. Inventory has already reserved the goods, but the payment failed. Which consistency approach is appropriate?
    options:
    - text: Сага з компенсувальною транзакцією, яка скасовує резерв на складі
      text_en: A saga with a compensating transaction that cancels the reservation
      correct: true
    - text: Одна розподілена ACID-транзакція між усіма БД, яка відкотить усе автоматично
      text_en: One distributed ACID transaction across all databases that rolls everything back automatically
    - text: Нічого не робити, бо склад розбереться, коли хтось повторить замовлення
      text_en: Do nothing, because inventory will sort it out when someone repeats the order
    - text: Перенести всі таблиці в одну БД, щоб обійтися без узгодження між сервісами
      text_en: Move all tables into one database to avoid coordination between services
    explanation: |
      Сага розбиває процес на локальні транзакції, а при збої виконує компенсувальні дії, що скасовують уже виконані кроки. Розподілені транзакції між сервісами погано масштабуються й зменшують автономію, а спільна БД руйнує межі сервісів.
    explanation_en: |
      A saga splits the process into local transactions and, on failure, runs compensating actions that undo the steps already completed. Distributed transactions across services scale poorly and reduce autonomy, and a shared database destroys service boundaries.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/saga
  - id: architecture-010
    level: senior
    type: multiple
    text: Які твердження про патерн Circuit Breaker правильні?
    text_en: Which statements about the Circuit Breaker pattern are true?
    options:
    - text: У стані Open виклики одразу завершуються помилкою, не доходячи до залежності
      text_en: In the Open state, calls fail immediately without reaching the dependency
      correct: true
    - text: У стані Half-Open пропускають обмежену кількість запитів, щоб перевірити, чи залежність відновилася
      text_en: In the Half-Open state, a limited number of requests pass to test whether the dependency recovered
      correct: true
    - text: Він замінює Retry, тому повторні спроби після його впровадження не потрібні
      text_en: It replaces Retry, so retries are no longer needed once the breaker is adopted in a service
    - text: У стані Open запити накопичуються в черзі й виконуються після відновлення залежності
      text_en: In the Open state, requests pile up in a queue and are executed once the dependency recovers
    explanation: |
      Circuit Breaker зупиняє виклики, які ймовірно не вдадуться, і не дає збою каскадно поширитися. Retry вирішує іншу задачу (перечекати тимчасову помилку), тому їх поєднують, а логіка retry має припиняти спроби, коли брейкер розімкнено.
    explanation_en: |
      Circuit Breaker stops calls that are likely to fail and prevents the failure from spreading in a cascade. Retry solves a different problem (waiting out a transient error), so they are combined, and the retry logic should stop trying when the breaker is open.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker
  - id: architecture-011
    level: senior
    type: multiple
    text: Сервіс масово повторює запити до перевантаженої залежності й погіршує ситуацію (retry storm). Які заходи допоможуть?
    text_en: A service aggressively retries requests to an overloaded dependency and makes things worse (a retry storm). Which measures will help?
    options:
    - text: Обмежити кількість спроб і загальний час повторів
      text_en: Limit the number of attempts and the total retry time
      correct: true
    - text: Збільшувати паузу між спробами, наприклад за експоненційним backoff
      text_en: Increase the pause between attempts, for example with exponential backoff
      correct: true
    - text: Повторювати негайно без паузи, щоб швидше отримати відповідь
      text_en: Retry immediately without a pause to get a response faster
    - text: Повторювати без обмеження для критичних операцій, поки не вдасться
      text_en: Retry without a limit for critical operations until they succeed
    explanation: |
      Кожна клієнтська спроба додає навантаження на сервіс, що й так не справляється. Обмеження й зростаюча пауза дають йому час відновитися. Негайні та безмежні повтори лише поглиблюють збій.
    explanation_en: |
      Every client attempt adds load to a service that is already struggling. A limit and a growing pause give it time to recover. Immediate and unlimited retries only deepen the failure.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/antipatterns/retry-storm/
  - id: architecture-012
    level: senior
    type: single
    text: У системі з Event Sourcing знайшли помилкову подію `OrderPriceSet` в уже збереженому потоці. Як правильно виправити стан?
    text_en: In a system with Event Sourcing, an erroneous `OrderPriceSet` event was found in an already stored stream. How should the state be corrected properly?
    options:
    - text: Додати нову подію, яка виправляє або скасовує наслідки помилкової, не змінюючи історію
      text_en: Append a new event that corrects or reverses the erroneous one, keeping history intact
      correct: true
    - text: Знайти й відредагувати помилкову подію безпосередньо в сховищі подій, оновивши її поля
      text_en: Find and edit the erroneous event directly in the event store, updating its fields
    - text: Видалити всі події після помилкової й відтворити їх заново з виправленими даними
      text_en: Delete all events after the erroneous one and replay them with the corrected data
    - text: Перезаписати поточний стан у проєкції, а журнал подій залишити без жодних змін
      text_en: Overwrite the current state in the projection and leave the event log completely unchanged
    explanation: |
      Події є незмінним журналом фактів, тож виправлення виражають новими (компенсувальними) подіями, і історія помилки зберігається. Правка лише проєкції зникне при наступному відтворенні з журналу.
    explanation_en: |
      Events are an immutable log of facts, so corrections are expressed as new (compensating) events, and the history of the mistake is preserved. A fix made only to the projection will disappear on the next replay from the log.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing
  - id: architecture-013
    level: junior
    type: single
    text: Що стверджує принцип відкритості/закритості (OCP)?
    text_en: What does the open-closed principle (OCP) state?
    options:
    - text: Модуль має розширюватися новою поведінкою без правок наявного коду, наприклад через абстракцію й нові реалізації
      text_en: A module should gain new behavior without editing its existing code, for example via an abstraction and new implementations
      correct: true
    - text: Вихідний код класу має бути відкритий для читання всім командам, але закритий для запуску без перевірки прав
      text_en: A class's source code should be open for reading by all teams in the company but closed for running without a permission check
    - text: Усі поля класу мають бути закритими (private), а відкритими лишаються лише методи доступу до них
      text_en: All fields of a class should be private, leaving only the accessor methods public
    - text: Клас має розширювати поведінку виключно наслідуванням і не повинен приймати залежності ззовні
      text_en: A class should extend behavior solely through inheritance and must not accept dependencies from outside
    explanation: |
      OCP: модуль відкритий для розширення, але закритий для модифікації. Нову поведінку додають новими реалізаціями абстракції, а не правкою вже протестованого коду. Це не про приватність полів і не про права доступу до коду.
    explanation_en: |
      OCP: a module is open for extension but closed for modification. New behavior is added through new implementations of an abstraction rather than by editing already tested code. It has nothing to do with field privacy or code access rights.
    sources:
    - https://blog.cleancoder.com/uncle-bob/2020/10/18/Solid-Relevance.html
    - https://blog.cleancoder.com/uncle-bob/2014/05/12/TheOpenClosedPrinciple.html
  - id: architecture-014
    level: junior
    type: single
    text: Який патерн кешування реалізує цей псевдокод?
    text_en: Which caching pattern does this pseudocode implement?
    code:
      lang: text
      source: |
        function getProduct(id):
            item = cache.get(id)
            if item is null:
                item = db.load(id)
                cache.set(id, item, ttl)
            return item
    options:
    - text: Cache-Aside, бо застосунок сам завантажує дані з БД і кладе їх у кеш при промаху
      text_en: Cache-Aside, because the application itself loads data from the database and puts it into the cache on a miss
      correct: true
    - text: Write-through, бо кожне звернення синхронно оновлює і кеш, і сховище даних
      text_en: Write-through, because every access synchronously updates both the cache and the data store
    - text: Read-through, бо сам кеш завантажує відсутні дані з БД, а застосунок звертається лише до кешу
      text_en: Read-through, because the cache itself loads missing data from the database and the application talks only to the cache
    - text: Write-behind, бо записи спершу потрапляють у кеш і лише згодом асинхронно в БД
      text_en: Write-behind, because writes first land in the cache and only later reach the database asynchronously
    explanation: |
      Тут логіку промаху виконує сам застосунок: перевіряє кеш, при промаху читає БД і заповнює кеш. Це Cache-Aside. У read-through цю роботу бере на себе компонент кешу, а write-through і write-behind стосуються шляху запису, якого в коді немає.
    explanation_en: |
      Here the application itself handles the miss: it checks the cache, reads the database on a miss and fills the cache. That is Cache-Aside. In read-through the cache component does this work, while write-through and write-behind concern the write path, which is absent from the code.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
  - id: architecture-015
    level: junior
    type: multiple
    text: Які твердження про принцип розділення інтерфейсів (ISP) правильні?
    text_en: Which statements about the interface segregation principle (ISP) are correct?
    options:
    - text: Клієнт не має залежати від методів, які він не використовує
      text_en: A client should not depend on methods it does not use
      correct: true
    - text: Великий інтерфейс розбивають на кілька вужчих відповідно до потреб різних клієнтів
      text_en: A large interface is split into several narrower ones according to the needs of different clients
      correct: true
    - text: Вужчі інтерфейси зменшують коло клієнтів, яких зачіпає зміна окремого методу
      text_en: Narrower interfaces reduce the set of clients affected by a change to a single method
      correct: true
    - text: Кожен інтерфейс має містити рівно один метод, інакше принцип порушено
      text_en: Every interface must contain exactly one method, otherwise the principle is violated
    - text: Клас не може реалізовувати кілька інтерфейсів одночасно, бо це збільшує зв'язність
      text_en: A class cannot implement several interfaces at once because that increases coupling
    explanation: |
      ISP вимагає малих інтерфейсів, щоб користувачі не залежали від непотрібного, і саме тому зміна одного методу зачіпає менше клієнтів. Правило «один метод на інтерфейс» принцип не висуває, а реалізація кількох вузьких інтерфейсів одним класом є нормальною.
    explanation_en: |
      ISP calls for small interfaces so that users do not depend on things they do not need, which is why a change to one method affects fewer clients. The principle does not demand one method per interface, and implementing several narrow interfaces in one class is perfectly fine.
    sources:
    - https://blog.cleancoder.com/uncle-bob/2020/10/18/Solid-Relevance.html
  - id: architecture-016
    level: junior
    type: single
    text: Для чого в доменно-орієнтованому проєктуванні використовують патерн Repository?
    text_en: What is the Repository pattern used for in domain-driven design?
    options:
    - text: Щоб сховати доступ до даних за абстракцією з доменного шару, і доменна модель не залежала від технології БД
      text_en: To hide data access behind a domain-layer abstraction so the domain does not depend on the database technology
      correct: true
    - text: Щоб автоматично створювати індекси та оптимізувати плани запитів у сховищі даних для всіх сутностей
      text_en: To automatically create indexes and optimize query plans in the data store for every entity
    - text: Щоб кешувати результати всіх запитів у пам'яті застосунку та зменшувати навантаження на мережу
      text_en: To cache the results of all queries in application memory and so reduce network and database load
    - text: Щоб замінити транзакції, об'єднавши зміни кількох агрегатів в одну атомарну операцію запису
      text_en: To replace transactions by merging changes to several aggregates into one atomic write operation
    explanation: |
      Repository тримає питання збереження поза доменною моделлю: інтерфейси оголошені в домені, а реалізації з доступом до конкретної БД живуть в інфраструктурі. Кешування, індекси й транзакції — окремі механізми.
    explanation_en: |
      Repository keeps persistence concerns out of the domain model: interfaces are declared in the domain, while implementations that access a concrete database live in infrastructure. Caching, indexes and transactions are separate mechanisms.
    sources:
    - https://learn.microsoft.com/en-us/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/infrastructure-persistence-layer-design#the-repository-pattern
  - id: architecture-017
    level: middle
    type: single
    text: Команда замінює старий монолітний застосунок без зупинки роботи. Як працює патерн Strangler Fig?
    text_en: A team is replacing an old monolithic application without downtime. How does the Strangler Fig pattern work?
    options:
    - text: Перед обома системами стоїть фасад, який поступово перенаправляє окремі функції на нову систему, доки стара не стане непотрібною
      text_en: A facade in front of both systems gradually redirects features to the new system until the old one is unneeded
      correct: true
    - text: Нову систему будують повністю окремо, а в запланований день весь трафік за один раз перемикають на неї
      text_en: The new system is built entirely separately, and on a planned day all traffic is switched over to it at once without a rollback
    - text: Код старого монолітного застосунку переписують на місці, модуль за модулем, без жодного нового окремого сервісу
      text_en: The code of the old monolith is rewritten in place, module by module, without any new separate service
    - text: Обидві системи постійно викликають одна одну синхронно, тож жодну з них не можна вимкнути
      text_en: Both systems permanently call each other synchronously, so neither of them can ever be switched off
    explanation: |
      Фасад маршрутизує запити: спершу все йде до старої системи, а з кожною ітерацією дедалі більше функцій перенаправляється на нову. Це відрізняє патерн від «великого вибуху» з одноразовим перемиканням.
    explanation_en: |
      The facade routes requests: at first everything goes to the old system, and with each iteration more features are redirected to the new one. This is what distinguishes the pattern from a big-bang cutover.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/strangler-fig
  - id: architecture-018
    level: middle
    type: single
    text: Сервіс замовлень інтегрується зі застарілою ERP, чия модель даних і термінологія відрізняються від його власних. Яку роль виконує anti-corruption layer?
    text_en: An orders service integrates with a legacy ERP whose data model and terminology differ from its own. What role does an anti-corruption layer play?
    options:
    - text: Адаптер між підсистемами, що перекладає запити й моделі, тож чужа семантика не потрапляє в домен
      text_en: An adapter between subsystems that translates requests and models, keeping foreign semantics out of the domain
      correct: true
    - text: Це кеш відповідей ERP, який зменшує кількість викликів і вирівнює час їхнього виконання
      text_en: It is a cache of ERP responses that reduces the number of calls and evens out their response times at peak hours
    - text: Це шар шифрування й автентифікації, що захищає всі виклики між двома підсистемами
      text_en: It is an encryption and authentication layer that protects and signs all calls between the two subsystems
    - text: Це спільна база даних, куди обидві підсистеми пишуть у єдиному форматі
      text_en: It is a shared database that both subsystems write to in a single common format
    explanation: |
      Anti-corruption layer ставлять на межі підсистем із різною семантикою: він перекладає комунікацію, і жодна зі сторін не змушена підлаштовувати власну модель. Захист, кешування чи спільна БД — не його призначення.
    explanation_en: |
      An anti-corruption layer is placed at the boundary of subsystems with different semantics: it translates communication, so neither side has to bend its own model. Security, caching or a shared database are not its purpose.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/anti-corruption-layer
  - id: architecture-019
    level: middle
    type: multiple
    text: Які рішення реалізують патерн Bulkhead?
    text_en: Which solutions implement the Bulkhead pattern?
    options:
    - text: Клієнт має окремий пул з'єднань для кожного сервісу, який викликає
      text_en: A client has a separate connection pool for each service it calls
      correct: true
    - text: Екземпляри сервісу розділено на групи за навантаженням і вимогами до доступності споживачів
      text_en: Service instances are partitioned into groups by the load and availability requirements of their consumers
      correct: true
    - text: Після серії помилок виклики до залежності припиняються, а за певний час пробують знову
      text_en: After a series of errors calls to a dependency are stopped and retried again after a set time
    - text: Невдалий виклик повторюється зі зростаючою затримкою між спробами
      text_en: A failed call is repeated with an increasing delay between attempts
    explanation: |
      Bulkhead ізолює ресурси на окремі пули, щоб збій чи перевантаження однієї залежності не вичерпали ресурси інших. Припинення викликів після серії помилок — це Circuit Breaker, а повтори із затримкою — Retry.
    explanation_en: |
      Bulkhead isolates resources into separate pools so that the failure or overload of one dependency cannot exhaust the resources of others. Stopping calls after a series of errors is Circuit Breaker, and repeating with a delay is Retry.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/bulkhead
  - id: architecture-020
    level: middle
    type: single
    text: Мобільний і веб-клієнти потребують різних обсягів і форм даних, а єдиний універсальний бекенд обростає умовною логікою для кожного з них. Що пропонує патерн Backends for Frontends?
    text_en: Mobile and web clients need different amounts and shapes of data, and a single general-purpose backend is accumulating conditional logic for each of them. What does the Backends for Frontends pattern suggest?
    options:
    - text: Окремий бекенд для кожного типу клієнтського інтерфейсу, налаштований під його потреби
      text_en: A separate backend for each type of client interface, tailored to its needs
      correct: true
    - text: Єдиний API, у якому клієнт передає параметр типу пристрою, а сервер вибирає гілку логіки
      text_en: A single API in which the client passes a device-type parameter and the server picks a logic branch
    - text: Окремий мікросервіс на кожну таблицю бази даних, до якого клієнти звертаються напряму
      text_en: A separate microservice for each database table that clients call directly
    - text: Обов'язкову заміну REST на GraphQL, щоб клієнти самі описували потрібні дані
      text_en: A mandatory replacement of REST with GraphQL so that clients describe the data they need themselves
    explanation: |
      Суть BFF — окремий бекенд на кожен фронтенд, який можна налаштувати під нього й розвивати незалежно, без вузького місця в спільному універсальному бекенді. Параметр типу пристрою лишає ту саму спільну логіку з гілками.
    explanation_en: |
      The essence of BFF is a separate backend per frontend, which can be tailored to it and evolved independently, without a bottleneck in a shared general-purpose backend. A device-type parameter keeps the same shared logic with branches.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/backends-for-frontends
  - id: architecture-021
    level: senior
    type: single
    text: Мультитенантний сервіс шардує дані за `tenant_id`. Тенанти реєструються послідовно (1, 2, 3, …), і найактивніші завжди найновіші. Що станеться за діапазонного шардування та що це змінить хеш?
    text_en: A multitenant service shards data by `tenant_id`. Tenants register sequentially (1, 2, 3, …), and the most active ones are always the newest. What happens with range sharding, and what changes with hashing?
    options:
    - text: За діапазонів навантаження зосередиться на кількох останніх шардах (hotspot), а хеш від id розподілить послідовних тенантів між шардами
      text_en: With ranges the load concentrates on the last few shards (a hotspot), while a hash of the id spreads sequential tenants across shards
      correct: true
    - text: Діапазони розподілять навантаження рівномірно, бо кожен діапазон має однаковий розмір, тож хеш лише ускладнить маршрутизацію
      text_en: Ranges spread the load evenly because every range has the same size, so hashing would only complicate routing
    - text: За діапазонів проблем немає, а хеш зосередить усіх нових тенантів в одному шарді, бо їхні id йдуть підряд
      text_en: Ranges cause no problems, while hashing would put all new tenants in one shard because their ids are consecutive
    - text: Обидві стратегії дають однаковий розподіл, бо навантаження вирівнює сам механізм реплікації між шардами
      text_en: Both strategies give the same distribution because the replication mechanism between shards evens out the load itself
    explanation: |
      Діапазонна стратегія відображає послідовні id на послідовні шарди, тож найновіші й найактивніші тенанти опиняються в кількох шардах. Хеш зазвичай розкидає послідовні id по різних шардах, тому зменшує ризик hotspot, хоча й втрачає зручність діапазонних запитів.
    explanation_en: |
      The range strategy maps consecutive ids to consecutive shards, so the newest and most active tenants end up in a few shards. A hash usually scatters consecutive ids across different shards, which reduces the hotspot risk, although it loses the convenience of range queries.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/sharding
  - id: architecture-022
    level: senior
    type: multiple
    text: Перед сервісом поставили чергу за патерном Queue-Based Load Leveling. Які твердження правильні?
    text_en: A queue was placed in front of a service following the Queue-Based Load Leveling pattern. Which statements are correct?
    options:
    - text: Черга буферизує піки навантаження, а сервіс забирає повідомлення у власному темпі
      text_en: The queue buffers load peaks, and the service takes messages at its own pace
      correct: true
    - text: Якщо середня швидкість продюсерів перевищує швидкість споживачів, черга зростає і затримка збільшується
      text_en: If the average producer rate exceeds the consumer rate, the queue keeps growing and latency increases
      correct: true
    - text: Масштабування споживачів без обмеження їхньої сукупної швидкості лише переносить перевантаження на залежності нижче за ланцюгом
      text_en: Scaling consumers without bounding their aggregate rate only moves the overload to downstream dependencies
      correct: true
    - text: Клієнт отримує результат обробки в тій самій відповіді, бо черга робить виклик синхронним
      text_en: The client receives the processing result in the same response because the queue makes the call synchronous
    - text: Моніторити глибину черги не потрібно, бо буфер гарантує, що перевантаження сервісу неможливе
      text_en: Monitoring queue depth is unnecessary because the buffer guarantees that overloading the service is impossible
    explanation: |
      Черга лише згладжує тимчасові піки: коли постійний потік продюсерів перевищує пропускну здатність споживачів, вона росте, тож глибину треба моніторити, а масштабування споживачів тримати в безпечних межах. Сам патерн асинхронний, тому результат не повертається в тій самій відповіді.
    explanation_en: |
      The queue only smooths temporary peaks: when the sustained producer flow exceeds consumer throughput it grows, so depth must be monitored and consumer scaling kept within safe bounds. The pattern itself is asynchronous, so the result is not returned in the same response.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/queue-based-load-leveling
  - id: architecture-023
    level: senior
    type: single
    text: Сервіс читає через Cache-Aside, але після оновлення запису користувачі недовго бачать старе значення. Що відбувається за патерном і що робити, якщо свіжість одразу після запису критична?
    text_en: A service reads through Cache-Aside, but after a record is updated users briefly see the old value. What happens under the pattern, and what to do if freshness right after a write is critical?
    options:
    - text: Запис інвалідує елемент кешу, наступне читання його перезавантажує, тож між ними можливе застаріле значення; для свіжості — write-through
      text_en: A write invalidates the cache item, the next read reloads it, so a stale value is possible in between; for freshness use write-through
      correct: true
    - text: Кеш після запису в БД оновлюється самостійно й одразу, тож застарілі значення виникають лише через помилки в коді застосунку
      text_en: The cache updates itself immediately after the database write, so stale values appear only because of bugs in application code
    - text: Застаріле значення неминуче за будь-якого кешування, тому єдиний засіб — подовжити TTL записів і чекати їхнього закінчення
      text_en: A stale value is unavoidable with any caching, so the only remedy is to lengthen the TTL of entries
    - text: Свіжість забезпечить перехід на read-through, бо кеш сам стежить за змінами даних у БД і оновлює записи
      text_en: Switching to read-through will ensure freshness because the cache itself watches for changes to data in the database
    explanation: |
      За Cache-Aside запис змінює сховище й інвалідує елемент кешу, а повторно його заповнює наступне читання, тож між цими подіями читач може побачити промах або застаріле значення. Write-through оновлює сховище й кеш в одній операції запису. Подовження TTL лише збільшує вікно застарілості.
    explanation_en: |
      With Cache-Aside a write changes the data store and invalidates the cache item, and the next read repopulates it, so a reader may see a miss or a stale value in between. Write-through updates the store and the cache in one write operation. A longer TTL only widens the staleness window.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
  - id: architecture-024
    level: senior
    type: single
    text: Десять екземплярів споживача читають одну чергу (Competing Consumers), а події одного замовлення треба обробляти за порядком. Що правильно?
    text_en: Ten consumer instances read one queue (Competing Consumers), and the events of one order must be processed in order. What is correct?
    options:
    - text: Порядок між екземплярами не гарантований, тому обробку роблять ідемпотентною або групують повідомлення замовлення (сесії) для одного споживача
      text_en: Order across instances is not guaranteed, so make processing idempotent or group the order's messages (sessions) for one consumer
      correct: true
    - text: Черга FIFO гарантує, що повідомлення обробляються й завершуються в тому ж порядку незалежно від кількості споживачів і часу обробки
      text_en: A FIFO queue guarantees that messages are processed and completed in the same order regardless of the number of consumers and processing times
    - text: Додавання споживачів порядок не змінює, бо кожне повідомлення отримує лише один екземпляр
      text_en: Adding consumers does not change the order because each message is received by only one instance
    - text: Порядок забезпечить глобальне блокування між усіма екземплярами, і це єдиний прийнятний спосіб
      text_en: A global lock held across all instances will ensure the order, and this is the only acceptable way to do it
    explanation: |
      Порядок, у якому екземпляри отримують повідомлення, не гарантований і не обов'язково збігається з порядком створення. Тому обробку роблять ідемпотентною чи незалежною від порядку, а там, де порядок потрібен, використовують сесії або групи, що віддають усі повідомлення групи одному споживачу.
    explanation_en: |
      The order in which instances receive messages is not guaranteed and does not necessarily match creation order. So processing is made idempotent or order-independent, and where order matters, sessions or groups are used that deliver all messages of a group to one consumer.
    sources:
    - https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers
