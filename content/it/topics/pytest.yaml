id: pytest
title: Тестування в Python
title_en: Testing in Python
description: pytest, фікстури, параметризація, моки.
description_en: pytest, fixtures, parametrization, mocks.
icon: pytest
questions:
  - id: pytest-001
    level: junior
    type: single
    text: Яку пару файлу й функції pytest збере за правилами пошуку тестів за замовчуванням?
    text_en: Which file and function pair does pytest collect under the default test discovery rules?
    options:
      - text: Файл `test_math.py` і функцію `test_add`
        text_en: File `test_math.py` and function `test_add`
        correct: true
      - text: Файл `math_tests.py` і функцію `test_add`
        text_en: File `math_tests.py` and function `test_add`
      - text: Файл `test_math.py` і функцію `check_add`
        text_en: File `test_math.py` and function `check_add`
      - text: Файл `math.py` і функцію `test_add`
        text_en: File `math.py` and function `test_add`
    explanation: >
      За замовчуванням pytest шукає файли `test_*.py` або `*_test.py`, а в них функції й методи з префіксом `test`.
      `math_tests.py` не підпадає під жоден шаблон імені файлу, а `check_add` не має потрібного префікса.
    explanation_en: >
      By default, pytest looks for files named `test_*.py` or `*_test.py`, and in them for functions and methods with the `test` prefix. `math_tests.py` matches neither file name pattern, and `check_add` does not have the required prefix.
    sources:
      - https://docs.pytest.org/en/stable/explanation/goodpractices.html#conventions-for-python-test-discovery
  - id: pytest-002
    level: junior
    type: single
    text: Як у pytest записують перевірку в тесті і що він показує, коли вона падає?
    text_en: How do you write a check in a pytest test, and what does it show when the check fails?
    options:
      - text: Звичайним `assert`; pytest переписує його й показує значення частин виразу
        text_en: With a plain `assert`; pytest rewrites it and shows the values of the expression parts
        correct: true
      - text: Лише методами на кшталт `self.assertEqual`, бо голий `assert` pytest просто ігнорує
        text_en: Only with methods like `self.assertEqual`, because pytest simply ignores a bare `assert`
      - text: Звичайним `assert`, але в звіті буде лише `AssertionError` без жодних значень
        text_en: With a plain `assert`, but the report shows only `AssertionError` with no values
      - text: Спеціальною функцією `pytest.check()`, яку імпортують з основного пакета pytest
        text_en: With a special `pytest.check()` function imported from the main pytest package
    explanation: >
      pytest перехоплює `assert` на етапі імпорту модуля тесту (assertion rewriting) і при падінні виводить проміжні значення виразу.
      Тому класи `unittest.TestCase` і методи `assertEqual` для нього не потрібні.
    explanation_en: >
      pytest intercepts `assert` when the test module is imported (assertion rewriting) and prints the intermediate values of the expression on failure. That is why `unittest.TestCase` classes and `assertEqual` methods are not needed for it.
    sources:
      - https://docs.pytest.org/en/stable/how-to/assert.html#asserting-with-the-assert-statement
  - id: pytest-003
    level: junior
    type: single
    text: Як тест `test_sum` отримує дані з фікстури `numbers`?
    text_en: How does the `test_sum` test get data from the `numbers` fixture?
    code:
      lang: python
      source: |
        import pytest

        @pytest.fixture
        def numbers():
            return [1, 2, 3]

        def test_sum(numbers):
            assert sum(numbers) == 6
    options:
      - text: "Через параметр із тим самим іменем: pytest викликає фікстуру й підставляє її результат"
        text_en: "Through a parameter with the same name: pytest calls the fixture and passes in its result"
        correct: true
      - text: Тест сам викликає `numbers()` у своєму тілі, а декоратор лише реєструє функцію
        text_en: The test calls `numbers()` itself in its body, and the decorator only registers the function
      - text: Фікстуру треба імпортувати в тест і передати в декоратор `@pytest.use`
        text_en: The fixture must be imported into the test and passed to the `@pytest.use` decorator
      - text: Результат фікстури зберігається в глобальній змінній `numbers`, яку тест читає
        text_en: The fixture result is stored in a global variable `numbers` that the test reads
    explanation: >
      pytest зіставляє імена параметрів тесту з іменами фікстур, викликає їх і передає значення. Прямий виклик фікстури як звичайної функції не підтримується.
    explanation_en: >
      pytest matches the test's parameter names to fixture names, calls the fixtures, and passes in the values. Calling a fixture directly as a regular function is not supported.
    sources:
      - https://docs.pytest.org/en/stable/how-to/fixtures.html#requesting-fixtures
  - id: pytest-004
    level: junior
    type: multiple
    text: Які з цих маркерів вбудовані в pytest?
    text_en: Which of these markers are built into pytest?
    options:
      - text: "`@pytest.mark.skip`"
        text_en: "`@pytest.mark.skip`"
        correct: true
      - text: "`@pytest.mark.xfail`"
        text_en: "`@pytest.mark.xfail`"
        correct: true
      - text: "`@pytest.mark.parametrize`"
        text_en: "`@pytest.mark.parametrize`"
        correct: true
      - text: "`@pytest.mark.slow`"
        text_en: "`@pytest.mark.slow`"
      - text: "`@pytest.mark.retry`"
        text_en: "`@pytest.mark.retry`"
    explanation: >
      `skip`, `skipif`, `xfail`, `parametrize`, `usefixtures` і `filterwarnings` вбудовані. Маркери на кшталт `slow` команда вигадує сама й реєструє в конфігурації,
      а повтор нестабільних тестів дає сторонній плагін, не ядро pytest.
    explanation_en: >
      `skip`, `skipif`, `xfail`, `parametrize`, `usefixtures`, and `filterwarnings` are built in. Markers like `slow` are invented by the team and registered in the configuration, while retrying flaky tests is provided by a third-party plugin, not by the pytest core.
    sources:
      - https://docs.pytest.org/en/stable/reference/reference.html#marks
  - id: pytest-005
    level: middle
    type: single
    text: Скільки разів виконається код до `yield` у фікстурі, якщо обидва тести модуля її використовують?
    text_en: How many times does the code before `yield` in the fixture run if both tests in the module use it?
    code:
      lang: python
      source: |
        import pytest

        @pytest.fixture(scope="module")
        def conn():
            print("open")
            yield "db"
            print("close")

        def test_a(conn):
            assert conn == "db"

        def test_b(conn):
            assert conn == "db"
    options:
      - text: Один раз, а `close` виконається після останнього тесту модуля
        text_en: Once, and `close` runs after the last test of the module
        correct: true
      - text: "Двічі: перед кожним тестом, а `close` після кожного"
        text_en: "Twice: before each test, and `close` after each one"
      - text: Один раз, а `close` одразу після першого тесту, який її використав
        text_en: Once, and `close` right after the first test that used it
      - text: Двічі `open` перед першим тестом і двічі `close` після другого
        text_en: Two `open` calls before the first test and two `close` calls after the second
    explanation: >
      Область `module` означає один екземпляр фікстури на модуль: створюється при першому запиті й знищується після останнього тесту модуля.
      За типової області `function` було б два `open` і два `close`.
    explanation_en: >
      The `module` scope means one fixture instance per module: it is created on the first request and torn down after the last test of the module. With the default `function` scope there would be two `open` and two `close` calls.
    sources:
      - https://docs.pytest.org/en/stable/how-to/fixtures.html#fixture-scopes
  - id: pytest-006
    level: middle
    type: single
    text: Скільки тестів pytest згенерує з цієї функції?
    text_en: How many tests will pytest generate from this function?
    code:
      lang: python
      source: |
        import pytest

        @pytest.mark.parametrize("a", [1, 2, 3])
        @pytest.mark.parametrize("b", [10, 20])
        def test_pair(a, b):
            assert a < b
    options:
      - text: Шість, по одному на кожну комбінацію `a` і `b`
        text_en: Six, one for each combination of `a` and `b`
        correct: true
      - text: П'ять, бо значення двох списків просто складаються
        text_en: Five, because the values of the two lists are simply added up
      - text: Три, бо береться лише верхній декоратор
        text_en: Three, because only the top decorator is used
      - text: Два, бо береться лише нижній декоратор
        text_en: Two, because only the bottom decorator is used
    explanation: >
      Кілька `parametrize` на одній функції перемножуються, тож виходить 3 × 2 = 6 тестів.
      Щоб запускати значення парами без комбінацій, їх передають в одному декораторі з двома іменами.
    explanation_en: >
      Several `parametrize` decorators on one function multiply, so you get 3 × 2 = 6 tests. To run the values as pairs without combinations, pass them in a single decorator with two names.
    sources:
      - https://docs.pytest.org/en/stable/how-to/parametrize.html#pytest-mark-parametrize
  - id: pytest-007
    level: middle
    type: single
    text: Тест патчить `app.clients.fetch`, але `load()` усе одно викликає справжню функцію. Чому?
    text_en: The test patches `app.clients.fetch`, but `load()` still calls the real function. Why?
    code:
      lang: python
      source: |
        # app/service.py
        from app.clients import fetch

        def load():
            return fetch()

        # test_service.py
        from unittest.mock import patch
        from app.service import load

        def test_load():
            with patch("app.clients.fetch") as m:
                load()
    options:
      - text: Після `from ... import` модуль `service` має власне ім'я `fetch`, тож патчити треба `app.service.fetch`
        text_en: After `from ... import`, the `service` module has its own name `fetch`, so you must patch `app.service.fetch`
        correct: true
      - text: "`patch` працює лише як декоратор, а в блоці `with` він мовчки нічого не підміняє в модулях"
        text_en: "`patch` works only as a decorator, and in a `with` block it silently replaces nothing in modules"
      - text: "`patch` не підміняє функції, імпортовані з іншого пакета: він працює лише з методами класів"
        text_en: "`patch` does not replace functions imported from another package: it works only with class methods"
      - text: Підміну треба вмикати окремим викликом `m.start()`, а без нього `patch` лише створює об'єкт `Mock`
        text_en: The patch must be activated with a separate `m.start()` call, and without it `patch` only creates a `Mock` object
    explanation: >
      `patch` підміняє ім'я в просторі імен модуля, а не сам об'єкт функції. Після `from app.clients import fetch` `service` тримає власне ім'я,
      яке підміна `app.clients.fetch` не зачіпає. Правило з документації: патчимо там, де об'єкт шукають, а не там, де його визначено.
    explanation_en: >
      `patch` replaces a name in a module's namespace, not the function object itself. After `from app.clients import fetch`, `service` holds its own name, which patching `app.clients.fetch` does not affect. The rule from the documentation: patch where an object is looked up, not where it is defined.
    sources:
      - https://docs.python.org/3/library/unittest.mock.html#where-to-patch
  - id: pytest-008
    level: middle
    type: multiple
    text: Що правильно про фікстури з `yield`?
    text_en: Which statements about fixtures with `yield` are true?
    options:
      - text: Код після `yield` — це teardown, він виконується після завершення тесту
        text_en: The code after `yield` is the teardown, and it runs after the test finishes
        correct: true
      - text: Teardown фікстур одного тесту йде у порядку, зворотному до setup
        text_en: Teardown of a test's fixtures runs in the reverse order of setup
        correct: true
      - text: Якщо фікстура впала до `yield`, її teardown пропускається, а решти виконуються
        text_en: If a fixture fails before `yield`, its teardown is skipped, while the others still run
        correct: true
      - text: Якщо сам тест упав, код після `yield` пропускається, щоб зберегти стан для розбору падіння
        text_en: If the test itself fails, the code after `yield` is skipped to keep the state for debugging
      - text: Teardown виконується в тому ж порядку, у якому фікстури було створено при setup
        text_en: Teardown runs in the same order in which the fixtures were set up
    explanation: >
      pytest ставить фікстури в лінійний порядок, запускає кожну до `yield`, а після тесту проходить список у зворотному напрямку й виконує залишок кожної.
      Падіння тесту teardown не скасовує, а винятком до `yield` скасовується лише teardown самої цієї фікстури.
    explanation_en: >
      pytest arranges the fixtures in a linear order, runs each one up to `yield`, and after the test walks the list in reverse and runs the remainder of each. A failing test does not cancel teardown, and an exception before `yield` cancels only the teardown of that one fixture.
    sources:
      - https://docs.pytest.org/en/stable/how-to/fixtures.html#yield-fixtures-recommended
      - https://docs.pytest.org/en/stable/how-to/fixtures.html#handling-errors-for-yield-fixture
  - id: pytest-009
    level: senior
    type: single
    text: Що буде вмістом `order` у кінці цього тесту (фікстури однакової області `function`)?
    text_en: What will `order` contain at the end of this test (all fixtures have the same `function` scope)?
    code:
      lang: python
      source: |
        import pytest

        @pytest.fixture
        def order():
            return []

        @pytest.fixture
        def b(order):
            order.append("b")

        @pytest.fixture
        def a(b, order):
            order.append("a")

        @pytest.fixture(autouse=True)
        def z(order):
            order.append("z")

        def test_it(a, order):
            print(order)
    options:
      - text: "`['z', 'b', 'a']`"
        text_en: "`['z', 'b', 'a']`"
        correct: true
      - text: "`['b', 'a', 'z']`"
        text_en: "`['b', 'a', 'z']`"
      - text: "`['a', 'b', 'z']`"
        text_en: "`['a', 'b', 'z']`"
      - text: "`['z', 'a', 'b']`"
        text_en: "`['z', 'a', 'b']`"
    explanation: >
      Autouse-фікстури виконуються першими в межах своєї області, а залежності визначають решту: `a` залежить від `b`, тож `b` іде перед `a`.
      Порядок оголошення й порядок параметрів тесту на це не впливають.
    explanation_en: >
      Autouse fixtures run first within their scope, and dependencies determine the rest: `a` depends on `b`, so `b` goes before `a`. The declaration order and the order of the test's parameters do not matter.
    sources:
      - https://docs.pytest.org/en/stable/reference/fixtures.html#autouse-fixtures-are-executed-first-within-their-scope
  - id: pytest-010
    level: senior
    type: single
    text: Яку проблему вирішує `patch(..., autospec=True)` порівняно зі звичайним `patch`, що створює `MagicMock`?
    text_en: What problem does `patch(..., autospec=True)` solve compared with a regular `patch` that creates a `MagicMock`?
    options:
      - text: Мок повторює сигнатуру й атрибути оригіналу, тож хибний виклик чи неіснуючий метод дають помилку
        text_en: The mock copies the original's signature and attributes, so a bad call or nonexistent method raises an error
        correct: true
      - text: Мок перестає записувати виклики, тому тест працює швидше й менше навантажує пам'ять процесу
        text_en: The mock stops recording calls, so the test runs faster and puts less load on process memory
      - text: Мок сам повертає значення, які справжня функція повернула б на цих самих аргументах
        text_en: The mock itself returns the values the real function would return for the same arguments
      - text: Патч лишається активним після завершення тесту, і наступні тести отримують ту саму підміну
        text_en: The patch stays active after the test ends, and later tests get the same replacement
    explanation: >
      Звичайний `MagicMock` приймає будь-які аргументи й будь-які атрибути, тому тест може проходити, коли оригінал уже змінив сигнатуру.
      Auto-speccing створює мок за специфікацією реального об'єкта, і помилковий виклик дає той самий `TypeError`, що й справжній код.
    explanation_en: >
      A regular `MagicMock` accepts any arguments and any attributes, so a test can pass even when the original has already changed its signature. Auto-speccing creates the mock from the spec of the real object, and a wrong call raises the same `TypeError` as the real code would.
    sources:
      - https://docs.python.org/3/library/unittest.mock.html#autospeccing
  - id: pytest-011
    level: senior
    type: multiple
    text: Що правильно про `@pytest.mark.xfail`?
    text_en: Which statements about `@pytest.mark.xfail` are true?
    options:
      - text: За замовчуванням несподівано пройдений тест (XPASS) не валить набір, а лише потрапляє в підсумок
        text_en: By default, an unexpectedly passing test (XPASS) does not fail the suite and only appears in the summary
        correct: true
      - text: З `strict=True` XPASS вважається провалом набору
        text_en: With `strict=True`, XPASS counts as a suite failure
        correct: true
      - text: Значення `strict` за замовчуванням для всього проєкту можна змінити опцією `xfail_strict` у конфігурації
        text_en: The default `strict` value for the whole project can be changed with the `xfail_strict` option in the configuration
        correct: true
      - text: Тест із `xfail` не виконується, pytest одразу позначає його як очікувано впалий
        text_en: A test marked `xfail` is not executed, and pytest immediately reports it as an expected failure
      - text: Очікуваний провал такого тесту рахується в підсумку як `failed`
        text_en: The expected failure of such a test is counted in the summary as `failed`
    explanation: >
      `xfail` запускає тест і порівнює результат із очікуванням: падіння дає `xfailed`, проходження дає `xpassed`.
      Строгий режим перетворює `xpassed` на помилку, щоб виправлену помилку не забули зняти з позначки.
      Починаючи з pytest 9.0 опція називається `strict_xfail`, а `xfail_strict` лишається її аліасом.
    explanation_en: >
      `xfail` runs the test and compares the result with the expectation: a failure gives `xfailed`, a pass gives `xpassed`. Strict mode turns `xpassed` into a failure so that nobody forgets to remove the marker once the bug is fixed. Starting with pytest 9.0 the option is called `strict_xfail`, and `xfail_strict` remains its alias.
    sources:
      - https://docs.pytest.org/en/stable/how-to/skipping.html#strict-parameter
  - id: pytest-012
    level: senior
    type: multiple
    text: Що правильно про `conftest.py` і видимість фікстур?
    text_en: Which statements about `conftest.py` and fixture visibility are true?
    options:
      - text: Фікстури з `conftest.py` доступні тестам у цій теці та вкладених без жодного імпорту
        text_en: Fixtures from `conftest.py` are available to tests in that directory and its subdirectories without any import
        correct: true
      - text: Фікстуру з тим самим іменем у тестовому модулі або в `conftest.py` глибшої теки перекриває ту, що вище
        text_en: A fixture with the same name in a test module or in a deeper directory's `conftest.py` overrides the one higher up
        correct: true
      - text: Фікстури з `conftest.py` сусідньої теки також видимі, бо pytest складає всі в один реєстр
        text_en: Fixtures from a sibling directory's `conftest.py` are also visible, because pytest collects them all into one registry
      - text: Щоб скористатися фікстурою з `conftest.py`, її треба імпортувати рядком `from conftest import ...`
        text_en: To use a fixture from `conftest.py`, you must import it with the line `from conftest import ...`
    explanation: >
      Видимість фікстури визначає місце її оголошення: `conftest.py` діє на свою теку й вкладені, а ближче оголошення перекриває дальше.
      Сусідні гілки теки одна одної не бачать, тож спільні фікстури піднімають у спільний предок.
    explanation_en: >
      A fixture's visibility is determined by where it is declared: `conftest.py` applies to its own directory and the nested ones, and a closer declaration overrides a farther one. Sibling branches of the directory tree do not see each other, so shared fixtures are moved up to a common ancestor.
    sources:
