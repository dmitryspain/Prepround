id: hibernate-jpa
title: Hibernate і JPA
title_en: Hibernate and JPA
description: Сутності, зв'язки, lazy/eager, N+1, транзакції, кеш першого/другого рівня.
description_en: Entities, relationships, lazy/eager, N+1, transactions, first/second-level cache.
icon: hibernate
questions:
  - id: hibernate-jpa-001
    level: junior
    type: multiple
    text: Які вимоги Jakarta Persistence 3.2 ставить до класу сутності?
    text_en: "Which requirements does Jakarta Persistence 3.2 place on an entity class?"
    options:
      - text: "Клас має бути позначений `@Entity` (або оголошений сутністю в XML-дескрипторі)"
        text_en: "The class must be annotated with `@Entity` (or declared an entity in XML)"
        correct: true
      - text: "Клас не може бути `final`"
        text_en: "The class cannot be `final`"
        correct: true
      - text: "Має бути `public` або `protected` конструктор без параметрів"
        text_en: "It must have a `public` or `protected` constructor with no parameters"
        correct: true
      - text: "Клас має реалізовувати `java.io.Serializable`"
        text_en: "The class must implement the `java.io.Serializable` interface"
      - text: "Для кожного поля мають бути публічні `get` і `set`"
        text_en: "Every field must have a public `get` method and a public `set` method"
    explanation: >
      Провайдеру потрібно створювати екземпляри й підміняти їх проксі, тому клас не може бути `final`
      і має конструктор без параметрів. `Serializable` стає потрібним лише тоді, коли відокремлені
      екземпляри передають за значенням (наприклад, віддалено), а геттери й сеттери не потрібні, якщо використовується доступ через поля.
    explanation_en: >
      The provider must create instances and replace them with proxies, so the class cannot be `final` and needs a no-argument constructor. `Serializable` becomes necessary only when detached instances are passed by value (for example, remotely), and getters and setters are not needed when field access is used.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
  - id: hibernate-jpa-002
    level: junior
    type: single
    text: >
      Яке значення Hibernate запише в колонку `status` для замовлення зі статусом `PAID`?
    text_en: "Which value will Hibernate write to the `status` column for an order with the status `PAID`?"
    code:
      lang: java
      source: |
        public enum Status { NEW, PAID, SHIPPED }

        @Entity
        public class Orders {
            @Id @GeneratedValue Long id;
            Status status;   // no @Enumerated
        }
    options:
      - text: "Число `1`: порядковий номер константи, що відлічується від нуля"
        text_en: "The number `1`: the constant's ordinal, counted from zero"
        correct: true
      - text: "Рядок `PAID`: ім'я константи"
        text_en: "The string `PAID`: the constant's name"
      - text: "Число `2`: порядковий номер константи, що відлічується від одиниці"
        text_en: "The number `2`: the constant's ordinal, counted from one"
      - text: "Нічого: без `@Enumerated` поле не зберігається"
        text_en: "Nothing: without `@Enumerated` the field is not persisted"
    explanation: >
      Для enum-поля без `@Enumerated` діє `EnumType.ORDINAL`, тобто зберігається позиція константи з нуля.
      Це крихко: вставка нової константи посередині змінить зміст уже збережених рядків, тому часто явно вказують `EnumType.STRING`.
    explanation_en: >
      Without `@Enumerated`, an enum field uses `EnumType.ORDINAL`, so the constant's position counted from zero is stored. This is fragile: inserting a new constant in the middle changes the meaning of rows already stored, which is why `EnumType.STRING` is often specified explicitly.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
  - id: hibernate-jpa-003
    level: junior
    type: single
    text: Що станеться з базою даних під час коміту цієї транзакції?
    text_en: "What happens to the database when this transaction commits?"
    code:
      lang: java
      source: |
        em.getTransaction().begin();
        User u = em.find(User.class, 1L);
        u.setName("Anna");
        em.getTransaction().commit();
    options:
      - text: "Hibernate помітить зміну керованої сутності й виконає `UPDATE` під час `flush` перед комітом"
        text_en: "Hibernate detects the change to the managed entity and runs an `UPDATE` during `flush` before the commit"
        correct: true
      - text: "Нічого, бо без явного виклику `em.persist(u)` або `em.merge(u)` зміни не зберігаються"
        text_en: "Nothing, because without an explicit call to `em.persist(u)` or `em.merge(u)` changes are not saved"
      - text: "Буде виконано `INSERT` нового рядка з іменем `Anna`"
        text_en: "An `INSERT` of a new row with the name `Anna` is executed"
      - text: "Транзакція впаде, бо сутність потрібно спершу заблокувати"
        text_en: "The transaction fails, because the entity must be locked first"
    explanation: >
      Сутність, отримана через `find`, керована контекстом персистентності, який порівнює її з початковим станом (dirty checking).
      Окремий виклик `merge` потрібен лише для відокремлених екземплярів.
    explanation_en: >
      An entity obtained through `find` is managed by the persistence context, which compares it with its initial state (dirty checking). A separate `merge` call is needed only for detached instances.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
  - id: hibernate-jpa-004
    level: junior
    type: single
    text: Що означає `mappedBy` в анотації `@OneToMany(mappedBy = "order")`?
    text_en: 'What does `mappedBy` mean in the annotation `@OneToMany(mappedBy = "order")`?'
    options:
      - text: "Власник зв'язку — поле `order` на іншій стороні; ця сторона колонку FK не записує"
        text_en: "The `order` field on the other side owns the relationship; this side writes no FK column"
        correct: true
      - text: "Hibernate створить окрему таблицю зв'язку з назвою `order`"
        text_en: "Hibernate will create a separate join table named `order` for the relationship"
      - text: "Операції з батьком каскадно застосовуватимуться до всіх елементів колекції"
        text_en: "Operations on the parent will be cascaded to all elements of the collection"
      - text: "Колекція завантажуватиметься лише тоді, коли до неї звернуться"
        text_en: "The collection will be loaded only when it is accessed, not with the parent"
    explanation: >
      Із двох боків двонаправленого зв'язку база оновлюється лише за власником, тобто `@ManyToOne`-стороною.
      `mappedBy` позначає зворотну сторону. Каскади й ліниве завантаження налаштовуються окремими атрибутами `cascade` та `fetch`.
    explanation_en: >
      Of the two sides of a bidirectional relationship, the database is updated only through the owner, that is, the `@ManyToOne` side. `mappedBy` marks the inverse side. Cascades and lazy loading are configured by the separate attributes `cascade` and `fetch`.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
  - id: hibernate-jpa-005
    level: middle
    type: single
    text: >
      У Hibernate 7 в базі 100 книжок із 100 різними авторами. Скільки SQL-запитів приблизно виконає цей код?
    text_en: "In Hibernate 7, the database has 100 books with 100 different authors. Approximately how many SQL queries will this code run?"
    code:
      lang: java
      source: |
        @Entity
        public class Book {
            @Id Long id;
            @ManyToOne Author author;   // fetch not specified
        }

        List<Book> books = em.createQuery("select b from Book b", Book.class)
                             .getResultList();
    options:
      - text: "До 101: один запит за книжками й по одному додатковому на кожного автора"
        text_en: "Up to 101: one query for the books and one extra query for each author"
        correct: true
      - text: "Рівно 1: `@ManyToOne` завжди підтягується через `JOIN` у тому самому запиті"
        text_en: "Exactly 1: `@ManyToOne` is always fetched through a `JOIN` in the same query"
      - text: "Рівно 1: за замовчуванням `@ManyToOne` лінивий, тож авторів ніхто не вантажить"
        text_en: "Exactly 1: `@ManyToOne` is lazy by default, so nobody loads the authors"
      - text: "Рівно 2: Hibernate збере ідентифікатори авторів і завантажить усіх одним `IN`"
        text_en: "Exactly 2: Hibernate will collect the author identifiers and load them all with a single `IN`"
    explanation: >
      `@ManyToOne` за замовчуванням має `fetch = EAGER`, але JPQL його не враховує у власному `SELECT`.
      Тому Hibernate довантажує кожного ще не завантаженого автора окремим запитом. Це класична проблема N+1, і її вирішують `join fetch`, графом сутностей або `@BatchSize`.
    explanation_en: >
      `@ManyToOne` has `fetch = EAGER` by default, but JPQL does not take it into account in its own `SELECT`. So Hibernate loads each author that is not yet loaded with a separate query. This is the classic N+1 problem, solved with `join fetch`, an entity graph, or `@BatchSize`.
    sources:
      - https://docs.jboss.org/hibernate/orm/7.0/userguide/html_single/Hibernate_User_Guide.html
  - id: hibernate-jpa-006
    level: middle
    type: single
    text: Чому останній рядок кидає `LazyInitializationException`?
    text_en: "Why does the last line throw `LazyInitializationException`?"
    code:
      lang: java
      source: |
        Order order;
        try (EntityManager em = emf.createEntityManager()) {
            order = em.find(Order.class, 1L);
        }
        System.out.println(order.getItems().size());   // @OneToMany, lazy
    options:
      - text: "Колекція лінива, а контекст персистентності вже закрито, тож дозавантажити її нема як"
        text_en: "The collection is lazy and the persistence context is already closed, so there is no way to load it"
        correct: true
      - text: "Метод `find` не завантажує зв'язки, і їх можна читати лише через JPQL"
        text_en: "The `find` method does not load relationships, and they can only be read through JPQL"
      - text: "Метод `size()` на колекції сутності заборонений поза транзакцією"
        text_en: "The `size()` method on an entity's collection is forbidden outside a transaction"
      - text: "Після `close()` потрібно було викликати `em.flush()`, інакше колекція порожня"
        text_en: "After `close()` you should have called `em.flush()`, otherwise the collection is empty"
    explanation: >
      Замість колекції в сутності лежить проксі, що читає дані через відкриту сесію. Найнадійніше виправлення: підтягнути потрібні зв'язки
      до закриття контексту (`join fetch`, граф сутностей), а не робити все `EAGER`.
    explanation_en: >
      Instead of the collection, the entity holds a proxy that reads data through an open session. The most reliable fix is to fetch the needed relationships before the context is closed (`join fetch`, an entity graph) rather than making everything `EAGER`.
    sources:
      - https://docs.jboss.org/hibernate/orm/7.0/userguide/html_single/Hibernate_User_Guide.html
  - id: hibernate-jpa-007
    level: middle
    type: single
    text: >
      Що станеться, якщо у керованого замовлення з `@OneToMany(mappedBy = "order", orphanRemoval = true)`
      видалити позицію з колекції `items` і зробити `flush`?
    text_en: 'What happens if, for a managed order with `@OneToMany(mappedBy = "order", orphanRemoval = true)`, an item is removed from the `items` collection and `flush` is called?'
    options:
      - text: "Рядок позиції буде видалено з бази командою `DELETE`"
        text_en: "The item's row is deleted from the database with a `DELETE` command"
        correct: true
      - text: "Рядок позиції лишиться в таблиці, а в ньому обнулиться зовнішній ключ"
        text_en: "The item's row stays in the table, but its foreign key is set to null"
      - text: "Рядок лишиться без змін: колекція є зворотною стороною, тому база не оновлюється"
        text_en: "The row stays unchanged: the collection is the inverse side, so the database is not updated"
      - text: "Буде видалено й саме замовлення, бо в нього більше немає цієї позиції"
        text_en: "The order itself is deleted too, because it no longer has this item"
    explanation: >
      `orphanRemoval` означає, що сутність, виключена зі зв'язку, видаляється під час `flush`. Без цього прапорця на зворотній стороні
      нічого не змінилося б, а видалення замовлення цей атрибут не спричиняє.
    explanation_en: >
      `orphanRemoval` means that an entity removed from the relationship is deleted during `flush`. Without this flag, nothing would change on the inverse side, and this attribute does not cause the order itself to be deleted.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
  - id: hibernate-jpa-008
    level: middle
    type: multiple
    text: Які твердження про різницю між `em.find` і `em.getReference` у Jakarta Persistence правильні?
    text_en: "Which statements about the difference between `em.find` and `em.getReference` in Jakarta Persistence are true?"
    options:
      - text: "`find` повертає `null`, якщо рядка з таким ключем немає"
        text_en: "`find` returns `null` if there is no row with that key"
        correct: true
      - text: "`getReference` може повернути проксі без запиту до бази, а стан підвантажується пізніше"
        text_en: "`getReference` may return a proxy without querying the database, and the state is loaded later"
        correct: true
      - text: "Якщо рядка немає, `EntityNotFoundException` виникає при першому зверненні до стану посилання"
        text_en: "If the row does not exist, `EntityNotFoundException` occurs on the first access to the reference's state"
        correct: true
      - text: "`getReference` завжди одразу виконує `SELECT` і повертає `null` для відсутнього рядка"
        text_en: "`getReference` always immediately runs a `SELECT` and returns `null` for a missing row"
      - text: "`find` кидає `EntityNotFoundException`, коли сутності з таким ключем у базі немає"
        text_en: "`find` throws `EntityNotFoundException` when there is no entity with that key in the database"
    explanation: >
      `find` повертає сутність або `null`, тоді як `getReference` дає посилання, стан якого може завантажуватись ліниво. Тому відсутність рядка проявляється
      винятком `EntityNotFoundException` лише під час доступу до стану. Таке посилання зручно підставляти у зв'язок, не читаючи сутність.
    explanation_en: >
      `find` returns the entity or `null`, whereas `getReference` gives a reference whose state may be loaded lazily. So a missing row shows up as `EntityNotFoundException` only when the state is accessed. Such a reference is convenient to plug into a relationship without reading the entity.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
  - id: hibernate-jpa-009
    level: senior
    type: single
    text: >
      Запит `select a from Author a join fetch a.books` викликають із `setMaxResults(10)`. Що відбувається у Hibernate 6.x і 7.0–7.3?
    text_en: "The query `select a from Author a join fetch a.books` is called with `setMaxResults(10)`. What happens in Hibernate 6.x and 7.0–7.3?"
    options:
      - text: "Обмеження не потрапляє в SQL: Hibernate читає всі збіги й застосовує ліміт у пам'яті"
        text_en: "The limit does not reach the SQL: Hibernate reads all matches and applies the limit in memory"
        correct: true
      - text: "У SQL додається `LIMIT 10`, тож повертається рівно 10 рядків з авторами та книжками"
        text_en: "`LIMIT 10` is added to the SQL, so exactly 10 rows with authors and books are returned"
      - text: "Hibernate мовчки ігнорує `setMaxResults` і повертає всіх авторів без жодного попередження"
        text_en: "Hibernate silently ignores `setMaxResults` and returns all authors without any warning"
      - text: "Запит завершується помилкою, бо `join fetch` із пагінацією заборонений"
        text_en: "The query fails with an error, because `join fetch` with pagination is forbidden"
    explanation: >
      Рядки результату дублюються по книжках, тому ліміт у SQL обрізав би колекції, і Hibernate застосовує його в пам'яті (з попередженням `HHH90003004`).
      Починаючи з 7.4 ліміт іде в SQL-підзапит, а стару поведінку повертає hint `org.hibernate.limitInMemory`.
      Типове рішення для старіших версій: спершу вибрати сторінку ідентифікаторів, а потім довантажити книжки другим запитом.
    explanation_en: >
      Result rows are duplicated per book, so an SQL limit would truncate the collections, and Hibernate applies it in memory (with the warning `HHH90003004`). Starting with 7.4 the limit goes into an SQL subquery, and the old behavior is restored by the hint `org.hibernate.limitInMemory`. The typical solution for older versions: first select a page of identifiers, then load the books with a second query.
    sources:
      - https://docs.jboss.org/hibernate/orm/7.0/querylanguage/html_single/Hibernate_Query_Language.html
      - https://docs.hibernate.org/orm/7.4/migration-guide/migration-guide.html
  - id: hibernate-jpa-010
    level: senior
    type: single
    text: Що виведе цей код, якщо початковий статус користувача з `id = 1` дорівнює `ACTIVE`?
    text_en: "What does this code print if the initial status of the user with `id = 1` is `ACTIVE`?"
    code:
      lang: java
      source: |
        em.getTransaction().begin();
        User u = em.find(User.class, 1L);
        em.createQuery("update User x set x.status = 'BLOCKED' where x.id = 1")
          .executeUpdate();
        System.out.println(u.getStatus());
        System.out.println(em.find(User.class, 1L).getStatus());
        em.getTransaction().commit();
    options:
      - text: "`ACTIVE` і `ACTIVE`: масовий `UPDATE` не синхронізує контекст персистентності"
        text_en: "`ACTIVE` and `ACTIVE`: a bulk `UPDATE` does not synchronize the persistence context"
        correct: true
      - text: "`BLOCKED` і `BLOCKED`: Hibernate оновлює керовані сутності після масового `UPDATE`"
        text_en: "`BLOCKED` and `BLOCKED`: Hibernate refreshes managed entities after a bulk `UPDATE`"
      - text: "`ACTIVE` і `BLOCKED`: `find` завжди перечитує рядок із бази"
        text_en: "`ACTIVE` and `BLOCKED`: `find` always rereads the row from the database"
      - text: "Виняток, бо масове оновлення не можна виконувати, коли в контексті є керовані сутності"
        text_en: "An exception, because a bulk update cannot be run when the context has managed entities"
    explanation: >
      Масовий `UPDATE` іде прямо в базу, а керований екземпляр у кеші першого рівня лишається старим. Повторний `find` повертає той самий екземпляр
      з контексту. Тому масові операції виконують на початку транзакції або після цього роблять `refresh` чи `clear`.
    explanation_en: >
      A bulk `UPDATE` goes straight to the database, while the managed instance in the first-level cache stays old. The second `find` returns the same instance from the context. So bulk operations are run at the start of a transaction, or followed by `refresh` or `clear`.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
      - https://docs.jboss.org/hibernate/orm/7.0/querylanguage/html_single/Hibernate_Query_Language.html
  - id: hibernate-jpa-011
    level: senior
    type: multiple
    text: Які твердження про кеш другого рівня Hibernate 7 правильні?
    text_en: "Which statements about the Hibernate 7 second-level cache are true?"
    options:
      - text: "Він прив'язаний до `EntityManagerFactory`, тому спільний для всіх її сесій"
        text_en: "It is bound to the `EntityManagerFactory`, so it is shared by all of its sessions"
        correct: true
      - text: "За `ENABLE_SELECTIVE` сутність кешується лише з анотацією `@Cacheable`"
        text_en: "With `ENABLE_SELECTIVE`, an entity is cached only if it has `@Cacheable`"
        correct: true
      - text: "Сутності лежать у розібраному вигляді (значення атрибутів), а не як об'єкти"
        text_en: "Entities are stored in disassembled form (attribute values), not as objects"
        correct: true
      - text: "Кеш запитів вмикається автоматично, щойно ввімкнено кеш другого рівня для сутностей"
        text_en: "The query cache is enabled automatically as soon as the second-level cache is enabled for entities"
      - text: "Кеш очищається щоразу, коли закривається `EntityManager`, який його заповнив"
        text_en: "The cache is cleared every time the `EntityManager` that populated it is closed"
    explanation: >
      Кеш другого рівня живе стільки, скільки фабрика, тоді як контекст персистентності очищається разом з `EntityManager`.
      Кеш запитів вимкнений за замовчуванням: його вмикають окремою властивістю і позначають запити кешованими.
    explanation_en: >
      The second-level cache lives as long as the factory, whereas the persistence context is cleared together with the `EntityManager`. The query cache is disabled by default: it is enabled by a separate property and queries are marked as cacheable.
    sources:
      - https://docs.jboss.org/hibernate/orm/7.0/userguide/html_single/Hibernate_User_Guide.html
  - id: hibernate-jpa-012
    level: senior
    type: single
    text: >
      Сутність `Product` має поле `@Version`. Дві транзакції (T1 і T2) завантажили той самий рядок із версією 5 і змінили ціну.
      T1 закомітила першою. Що станеться з T2?
    text_en: "The entity `Product` has an `@Version` field. Two transactions (T1 and T2) loaded the same row with version 5 and changed the price. T1 committed first. What happens to T2?"
    code:
      lang: java
      source: |
        @Entity
        public class Product {
            @Id Long id;
            @Version long version;
            BigDecimal price;
        }
        // T1 and T2: p = em.find(Product.class, 1L); p.setPrice(...); commit
    options:
      - text: "`UPDATE` з умовою на версію зачепить 0 рядків: T2 отримає `OptimisticLockException`"
        text_en: "An `UPDATE` with a version condition affects 0 rows: T2 gets `OptimisticLockException`"
        correct: true
      - text: "T2 мовчки перезапише ціну від T1, а версія стане 7"
        text_en: "T2 silently overwrites T1's price, and the version becomes 7"
      - text: "T2 заблокується на `UPDATE`, поки T1 не закомітить, а потім успішно завершиться"
        text_en: "T2 blocks on `UPDATE` until T1 commits, and then completes successfully"
      - text: "Hibernate автоматично перечитає рядок і повторить зміну T2 на версії 6"
        text_en: "Hibernate automatically rereads the row and repeats T2's change on version 6"
    explanation: >
      Оптимістичне блокування не тримає блокувань під час роботи: при коміті версія в `WHERE` уже не збігається, тому провайдер кидає
      `OptimisticLockException` і позначає транзакцію на відкат. Застосунок сам вирішує, чи повторити операцію.
    explanation_en: >
      Optimistic locking holds no locks while work is in progress: at commit the version in `WHERE` no longer matches, so the provider throws `OptimisticLockException` and marks the transaction for rollback. The application decides whether to retry the operation.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
  - id: hibernate-jpa-013
    level: junior
    type: single
    text: Який JPQL-запит правильно вибере користувачів за іменем для цієї сутності?
    text_en: "Which JPQL query correctly selects users by name for this entity?"
    code:
      lang: java
      source: |
        @Entity
        @Table(name = "app_user")
        public class User {
            @Id Long id;
            @Column(name = "full_name") String name;
        }
    options:
      - text: "`select u from User u where u.name = :name`: назва сутності й ім'я поля класу"
        text_en: "`select u from User u where u.name = :name`: the entity name and the class field name"
        correct: true
      - text: "`select u from app_user u where u.full_name = :name`: назва таблиці й колонка"
        text_en: "`select u from app_user u where u.full_name = :name`: the table name and the column"
      - text: "`select u from User u where u.full_name = :name`: назва сутності й колонка"
        text_en: "`select u from User u where u.full_name = :name`: the entity name and the column"
      - text: "`from app_user where full_name = :name`: скорочена форма запиту без `select`"
        text_en: "`from app_user where full_name = :name`: a short query form without `select`"
    explanation: >
      JPQL працює з об'єктною моделлю: у `from` стоїть ім'я сутності (за замовчуванням — ім'я класу), а в умовах — атрибути класу.
      Імена таблиці й колонки з `@Table` та `@Column` потрібні лише в нативному SQL, і саме тому три інші запити не пройдуть розбір.
    explanation_en: >
      JPQL works with the object model: `from` holds the entity name (by default the class name) and conditions use class attributes. Table and column names from `@Table` and `@Column` matter only in native SQL, which is why the other three queries fail to parse.
    sources:
      - https://docs.jboss.org/hibernate/orm/7.0/querylanguage/html_single/Hibernate_Query_Language.html#from-clause
  - id: hibernate-jpa-014
    level: junior
    type: multiple
    text: Які поля сутності Hibernate (доступ через поля, Jakarta Persistence 3.2) буде збережено в базі?
    text_en: "Which fields of a Hibernate entity (field access, Jakarta Persistence 3.2) will be persisted to the database?"
    options:
      - text: "Звичайне поле `String nickname` без жодних анотацій"
        text_en: "A plain field `String nickname` with no annotations at all"
        correct: true
      - text: "Поле `String nickname`, позначене `@Basic`, без `@Column`"
        text_en: "A field `String nickname` marked with `@Basic` but without `@Column`"
        correct: true
      - text: "Поле `transient String cache`, оголошене з ключовим словом Java `transient`"
        text_en: "A field `transient String cache` declared with the Java keyword `transient`"
      - text: "Поле `String temp`, позначене анотацією `@Transient`"
        text_en: "A field `String temp` marked with the `@Transient` annotation"
      - text: "Поле `String nickname` без `@Basic` чи `@Column`, коли для нього є лише приватний геттер"
        text_en: "A field `String nickname` without `@Basic` or `@Column`, when it has only a private getter"
        correct: true
    explanation: >
      За специфікацією кожна нетимчасова змінна екземпляра, не позначена `@Transient`, є персистентною, а `@Basic` і `@Column` лише уточнюють відображення.
      Поле з ключовим словом `transient` або з `@Transient` пропускається, і наявність геттера на це не впливає.
    explanation_en: >
      By the specification, every non-transient instance variable not annotated with `@Transient` is persistent, while `@Basic` and `@Column` only refine the mapping. A field with the `transient` keyword or `@Transient` is skipped, and the presence of a getter does not matter.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
  - id: hibernate-jpa-015
    level: junior
    type: single
    text: Що станеться під час коміту цієї транзакції?
    text_en: "What happens when this transaction commits?"
    code:
      lang: java
      source: |
        @Entity
        public class Order {
            @Id @GeneratedValue Long id;
            @OneToMany List<Item> items = new ArrayList<>();   // no cascade
        }

        em.getTransaction().begin();
        Order order = new Order();
        order.items.add(new Item());
        em.persist(order);
        em.getTransaction().commit();
    options:
      - text: "Коміт завершиться помилкою: `Order` посилається на `Item`, якого немає серед керованих"
        text_en: "The commit fails: `Order` references an `Item` that is not among the managed entities"
        correct: true
      - text: "Hibernate збереже `Order` разом з `Item`, бо елемент лежить у колекції збереженої сутності"
        text_en: "Hibernate saves `Order` together with `Item`, because the element sits in the collection of a saved entity"
      - text: "Збережеться лише `Order`, а новий `Item` без попередження буде проігноровано"
        text_en: "Only `Order` is saved, and the new `Item` is ignored without any warning"
      - text: "`Item` буде записано пізніше, під час першого читання колекції `items`"
        text_en: "`Item` will be written later, when the `items` collection is first read"
    explanation: >
      `persist` поширюється на зв'язані сутності лише за `cascade = PERSIST` (або `ALL`). Без нього `Item` лишається transient, і під час `flush`
      Hibernate виявляє посилання на незбережений екземпляр та кидає виняток. Мовчазного ігнорування немає.
    explanation_en: >
      `persist` reaches related entities only with `cascade = PERSIST` (or `ALL`). Without it `Item` stays transient, and during `flush` Hibernate detects the reference to an unsaved instance and throws an exception. Nothing is silently ignored.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
      - https://docs.jboss.org/hibernate/orm/7.0/userguide/html_single/Hibernate_User_Guide.html#pc-cascade
  - id: hibernate-jpa-016
    level: junior
    type: single
    text: Де Hibernate збереже поля `street` і `city` у цьому відображенні?
    text_en: "Where will Hibernate store the `street` and `city` fields in this mapping?"
    code:
      lang: java
      source: |
        @Embeddable
        public class Address {
            String street;
            String city;
        }

        @Entity
        public class Customer {
            @Id Long id;
            @Embedded Address address;
        }
    options:
      - text: "У колонках таблиці `Customer`, як і решта її полів, без окремого рядка"
        text_en: "In columns of the `Customer` table, like its other fields"
        correct: true
      - text: "В окремій таблиці `Address`, а в `Customer` з'явиться зовнішній ключ на неї"
        text_en: "In a separate `Address` table, and `Customer` gets a foreign key column pointing to it"
      - text: "В одній колонці `address` у вигляді серіалізованого значення об'єкта"
        text_en: "In a single `address` column as a serialized object value"
      - text: "Ніде: вбудований клас без `@Id` Hibernate пропускає під час відображення"
        text_en: "Nowhere: Hibernate skips an embedded class without an `@Id` during mapping"
    explanation: >
      Вбудований тип не має власної ідентичності й не є сутністю, тому його атрибути стають колонками таблиці власника.
      Окрема таблиця з ключем була б відображенням `@OneToOne` на сутність.
    explanation_en: >
      An embeddable type has no identity of its own and is not an entity, so its attributes become columns of the owner's table. A separate table with a key would be a `@OneToOne` mapping to an entity.
    sources:
      - https://docs.jboss.org/hibernate/orm/7.0/userguide/html_single/Hibernate_User_Guide.html#embeddables
  - id: hibernate-jpa-017
    level: middle
    type: single
    text: >
      У базі є користувач `id = 1` з іменем `a`. Яке ім'я буде в базі після виконання цього коду?
    text_en: "The database has a user with `id = 1` and the name `a`. What name will be in the database after this code runs?"
    code:
      lang: java
      source: |
        User detached = new User();
        detached.setId(1L);
        detached.setName("b");

        em.getTransaction().begin();
        User managed = em.merge(detached);
        detached.setName("c");
        em.getTransaction().commit();
    options:
      - text: "`b`: керованою стає копія, повернена `merge`, а подальша зміна `detached` її не зачіпає"
        text_en: "`b`: the copy returned by `merge` is managed; the later change to `detached` does not reach it"
        correct: true
      - text: "`c`: `merge` робить переданий об'єкт керованим, тож остання зміна потрапить в базу"
        text_en: "`c`: `merge` makes the passed object managed, so the last change reaches the database"
      - text: "`a`: `merge` лише читає рядок, а записує зміни виключно `persist`"
        text_en: "`a`: `merge` only reads the row, and only `persist` writes changes"
      - text: "Виняток, бо `merge` не можна викликати для об'єкта з уже наявним у базі `id`"
        text_en: "An exception, because `merge` cannot be called for an object whose `id` already exists in the database"
    explanation: >
      `merge` копіює стан переданого екземпляра в керований екземпляр і повертає саме його, а аргумент лишається відокремленим.
      Зміни після виклику треба робити на поверненому об'єкті, інакше вони тихо губляться.
    explanation_en: >
      `merge` copies the state of the passed instance into a managed instance and returns that one, while the argument stays detached. Changes after the call must be made on the returned object, otherwise they are lost silently.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
  - id: hibernate-jpa-018
    level: middle
    type: single
    text: >
      У таблиці `users` уже є 1 рядок. Режим скидання (flush mode) стандартний. Що поверне запит у цьому коді?
    text_en: "The `users` table already has 1 row. The flush mode is the default. What will the query return in this code?"
    code:
      lang: java
      source: |
        em.getTransaction().begin();
        User u = new User();
        u.setId(2L);
        em.persist(u);

        Long n = em.createQuery("select count(x) from User x", Long.class)
                   .getSingleResult();
    options:
      - text: "`2`: перед запитом, якого стосуються зміни, Hibernate скидає накопичені зміни в базу"
        text_en: "`2`: before a query the changes affect, Hibernate flushes pending changes to the database"
        correct: true
      - text: "`1`: `INSERT` виконується лише під час коміту, тож запит не бачить нового користувача"
        text_en: "`1`: the `INSERT` runs only at commit time, so the query does not see the new user row yet"
      - text: "`1`: `persist` лише ставить сутність у чергу, поки не викликано `em.flush()` явно"
        text_en: "`1`: `persist` only queues the entity until `em.flush()` is called explicitly"
      - text: "Виняток, бо запит у транзакції з незбереженими змінами заборонений"
        text_en: "An exception, because a query inside a transaction with unsaved changes is forbidden"
    explanation: >
      За `FlushModeType.AUTO` провайдер зобов'язаний зробити видимими для запиту всі зміни контексту, що можуть вплинути на його результат,
      тому перед `select` виконується `INSERT`. Явний `flush` потрібен лише за режиму `COMMIT`.
    explanation_en: >
      With `FlushModeType.AUTO` the provider must make visible to the query all context changes that could affect its result, so the `INSERT` runs before the `select`. An explicit `flush` is needed only in `COMMIT` mode.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
  - id: hibernate-jpa-019
    level: middle
    type: single
    text: Що станеться під час виконання цього запиту в Hibernate 7?
    text_en: "What happens when this query runs in Hibernate 7?"
    code:
      lang: java
      source: |
        @Entity
        public class Author {
            @Id Long id;
            @OneToMany(mappedBy = "author") List<Book> books;
            @OneToMany(mappedBy = "author") List<Award> awards;
        }

        em.createQuery(
            "select a from Author a join fetch a.books join fetch a.awards",
            Author.class).getResultList();
    options:
      - text: "Кидається `MultipleBagFetchException`: два `List` без порядку не можна підтягнути разом"
        text_en: "`MultipleBagFetchException`: two `List` bags cannot be fetched together"
        correct: true
      - text: "Запит виконається одним `JOIN`, а книги й нагороди прийдуть без дублікатів авторів"
        text_en: "The query runs as one `JOIN`, and books and awards arrive without duplicate authors"
      - text: "Hibernate підтягне першу колекцію, а другу мовчки лишить лінивою"
        text_en: "Hibernate fetches the first collection and silently leaves the second one lazy"
      - text: "Запит виконається, але ліміт і порядок рядків застосуються в пам'яті"
        text_en: "The query runs, but the limit and row order are applied in memory"
    explanation: >
      Hibernate не вміє однозначно відновити кілька колекцій-«мішків» (`List` без `@OrderColumn`) з одного декартового добутку, тому відмовляє з `MultipleBagFetchException`.
      Вихід: `Set`, `@OrderColumn` або `join fetch` однієї колекції й окремий запит чи підзапитне завантаження для другої.
    explanation_en: >
      Hibernate cannot unambiguously rebuild several bag collections (a `List` without `@OrderColumn`) from one Cartesian product, so it refuses with `MultipleBagFetchException`. The way out: a `Set`, `@OrderColumn`, or `join fetch` for one collection and a separate query or subselect fetching for the other.
    sources:
      - https://docs.jboss.org/hibernate/orm/7.0/javadocs/org/hibernate/loader/MultipleBagFetchException.html
      - https://docs.jboss.org/hibernate/orm/7.0/introduction/html_single/Hibernate_Introduction.html
  - id: hibernate-jpa-020
    level: middle
    type: multiple
    text: Які твердження про стратегії наслідування сутностей у Jakarta Persistence 3.2 правильні?
    text_en: "Which statements about entity inheritance strategies in Jakarta Persistence 3.2 are true?"
    options:
      - text: "Без анотації `@Inheritance` на кореневій сутності діє стратегія `SINGLE_TABLE`"
        text_en: "Without an `@Inheritance` annotation on the root entity, the `SINGLE_TABLE` strategy applies"
        correct: true
      - text: "Клас з `@MappedSuperclass` не є сутністю, тому `select b from Base b` для нього недопустимий"
        text_en: "A class with `@MappedSuperclass` is not an entity, so `select b from Base b` is not allowed for it"
        correct: true
      - text: "За `TABLE_PER_CLASS` поліморфний запит до базового типу об'єднує таблиці підтипів через `UNION`"
        text_en: "With `TABLE_PER_CLASS`, a polymorphic query on the base type combines the subtype tables with `UNION`"
        correct: true
      - text: "За `JOINED` усі підтипи лежать в одній таблиці, а тип рядка визначає колонка-дискримінатор"
        text_en: "With `JOINED`, all subtypes live in one table, and a discriminator column determines the row type"
      - text: "За `SINGLE_TABLE` кожен підтип має власну таблицю з тим самим первинним ключем, що й у кореня"
        text_en: "With `SINGLE_TABLE`, each subtype has its own table with the same primary key as the root"
    explanation: >
      `SINGLE_TABLE` типовий і зберігає всю ієрархію в одній таблиці, а `JOINED` дає таблицю на кожен клас із з'єднанням за ключем.
      Змішані ознаки в двох останніх варіантах належать кожна іншій стратегії. Mapped superclass лише передає відображення нащадкам і не запитується.
    explanation_en: >
      `SINGLE_TABLE` is the default and stores the whole hierarchy in one table, while `JOINED` gives a table per class joined by key. The mixed-up features in the last two options each belong to the other strategy. A mapped superclass only passes its mapping to descendants and cannot be queried.
    sources:
      - https://jakarta.ee/specifications/persistence/3.2/jakarta-persistence-spec-3.2
      - https://docs.jboss.org/hibernate/orm/7.0/userguide/html_single/Hibernate_User_Guide.html#entity-inheritance
  - id: hibernate-jpa-021
    level: senior
    type: single
    text: >
      Імпорт 50 000 нових сутностей `Event` із `hibernate.jdbc.batch_size=50` виконує `INSERT` по одному, хоча драйвер пакетування підтримує.
      Ключ оголошено як `@GeneratedValue(strategy = GenerationType.IDENTITY)`. Яка причина і що змінити?
    text_en: "Importing 50,000 new `Event` entities with `hibernate.jdbc.batch_size=50` runs the `INSERT`s one by one, although the driver supports batching. The key is declared as `@GeneratedValue(strategy = GenerationType.IDENTITY)`. What is the cause and what should change?"
    options:
      - text: "Для `IDENTITY` ключ дає лише сам `INSERT`, тож Hibernate не пакетує вставки; перейти на `SEQUENCE`"
        text_en: "With `IDENTITY` only the `INSERT` yields the key, so Hibernate skips batching; switch to `SEQUENCE`"
        correct: true
      - text: "`batch_size` діє лише на `UPDATE` і `DELETE`; для вставок потрібен окремий параметр `hibernate.insert_batch`"
        text_en: "`batch_size` applies only to `UPDATE` and `DELETE`; inserts need a separate `hibernate.insert_batch` setting"
      - text: "Пакети не збираються, доки після кожного `persist` не викликано `flush()`; додати цей виклик у цикл"
        text_en: "Batches are not assembled until `flush()` is called after each `persist`; add that call to the loop"
      - text: "Пакетування вимкнене, бо сутність має зв'язки `LAZY`; змінити їх на `EAGER`"
        text_en: "Batching is off because the entity has `LAZY` associations; change them to `EAGER`"
    explanation: >
      Hibernate має виконати `INSERT` одразу, щоб отримати згенерований ключ, тому з `IDENTITY` він прозоро вимикає JDBC-пакетування вставок.
      `SEQUENCE` з розумним `allocationSize` отримує ключі наперед, і вставки можна групувати. Параметра `hibernate.insert_batch` не існує, а `flush()` після кожного `persist` лише гарантує одиночні вставки.
    explanation_en: >
      Hibernate must run the `INSERT` immediately to obtain the generated key, so with `IDENTITY` it transparently disables JDBC batching of inserts. `SEQUENCE` with a sensible `allocationSize` gets keys in advance and inserts can be grouped. The `hibernate.insert_batch` setting does not exist, and `flush()` after every `persist` only guarantees single inserts.
    sources:
      - https://docs.jboss.org/hibernate/orm/7.0/userguide/html_single/Hibernate_User_Guide.html#batch
  - id: hibernate-jpa-022
    level: senior
    type: single
    text: >
      Двонаправлений `@OneToOne`: у `Owner` є `@OneToOne(mappedBy = "owner", fetch = FetchType.LAZY) Profile profile`. Розширення байткоду не вмикали.
      Що станеться під час `em.find(Owner.class, id)` у Hibernate 7?
    text_en: "A bidirectional `@OneToOne`: `Owner` has `@OneToOne(mappedBy = \"owner\", fetch = FetchType.LAZY) Profile profile`. Bytecode enhancement is not enabled. What happens during `em.find(Owner.class, id)` in Hibernate 7?"
    options:
      - text: "Hibernate завантажить і `Profile` одразу, бо без запиту не знає, чи зв'язаний рядок існує"
        text_en: "Hibernate loads `Profile` right away, since it cannot know whether a related row exists"
        correct: true
      - text: "У полі `profile` буде проксі, а `SELECT` виконається під час першого звернення до нього"
        text_en: "The `profile` field will hold a proxy, and the `SELECT` runs on the first access to it"
      - text: "Поле `profile` залишиться `null`, поки не викликати `em.refresh(owner)`"
        text_en: "The `profile` field stays `null` until `em.refresh(owner)` is called"
      - text: "Кидається виняток під час старту, бо `LAZY` на зворотній стороні `@OneToOne` не дозволений"
        text_en: "An exception is thrown at startup, because `LAZY` on the inverse side of a `@OneToOne` is not allowed"
    explanation: >
      Для зворотної сторони `@OneToOne` проксі неможливий: поле має бути або `null`, або об'єктом, а це відомо лише після запиту.
      Тому Hibernate ігнорує `LAZY` і підтягує зв'язок додатковим запитом (звідси N+1). Лінивою її робить розширення байткоду, а надійніше — однонаправлений `@OneToOne` із `@MapsId`.
    explanation_en: >
      A proxy is impossible for the inverse side of a `@OneToOne`: the field must be either `null` or an object, and that is known only after a query. So Hibernate ignores `LAZY` and loads the association with an extra query (hence N+1). Bytecode enhancement makes it lazy, and a more reliable choice is a unidirectional `@OneToOne` with `@MapsId`.
    sources:
      - https://docs.jboss.org/hibernate/orm/7.0/userguide/html_single/Hibernate_User_Guide.html#associations-one-to-one-bidirectional-lazy
  - id: hibernate-jpa-023
    level: senior
    type: multiple
    text: >
      Імпорт мільйона рядків робить цикл `em.persist(...)` в одній транзакції з одним `EntityManager`; наприкінці коміт.
      Які твердження правильні?
    text_en: "Importing a million rows runs a loop of `em.persist(...)` in one transaction with a single `EntityManager`; a commit at the end. Which statements are true?"
    options:
      - text: "Кожна збережена сутність лишається керованою в контексті, тож пам'ять росте аж до `OutOfMemoryError`"
        text_en: "Every saved entity stays managed in the context, so memory grows up to an `OutOfMemoryError`"
        correct: true
      - text: "Періодичні `flush()` разом із `clear()` тримають розмір контексту обмеженим"
        text_en: "Periodic `flush()` together with `clear()` keeps the context size bounded"
        correct: true
      - text: "`StatelessSession` не має контексту персистентності, тож не накопичує сутності"
        text_en: "`StatelessSession` has no persistence context, so it does not accumulate entities"
        correct: true
      - text: "Сам `flush()` без `clear()` звільняє пам'ять, бо Hibernate забуває вже записані сутності"
        text_en: "`flush()` without `clear()` frees memory, as Hibernate forgets written entities"
      - text: "Після `INSERT` Hibernate сам виселяє сутність із контексту, тож проблема лише в обсязі транзакції"
        text_en: "After the `INSERT`, Hibernate evicts the entity itself, so only the transaction size matters"
    explanation: >
      Контекст персистентності тримає посилання на кожну керовану сутність і перевіряє їх на зміни, тож без `clear()` він росте. `flush()` лише синхронізує стан із базою
      і нічого не виселяє. `StatelessSession` працює без кешу першого рівня й автоматичного перевіряння змін: операції виконуються синхронно, а повернені сутності відокремлені.
    explanation_en: >
      The persistence context keeps a reference to every managed entity and checks them for changes, so without `clear()` it keeps growing. `flush()` only synchronizes state with the database and evicts nothing. `StatelessSession` works without a first-level cache and automatic dirty checking: operations run synchronously and returned entities are detached.
    sources:
      - https://docs.jboss.org/hibernate/orm/7.0/userguide/html_single/Hibernate_User_Guide.html#batch
  - id: hibernate-jpa-024
    level: senior
    type: single
    text: Що виведе цей код, якщо `equals` і `hashCode` сутності `Tag` обчислюються лише з генерованого `id`?
    text_en: "What does this code print if the `equals` and `hashCode` of the `Tag` entity are computed only from the generated `id`?"
    code:
      lang: java
      source: |
        @Entity
        public class Tag {
            @Id @GeneratedValue Long id;
            @Override public boolean equals(Object o) {
                return o instanceof Tag t && Objects.equals(id, t.id);
            }
            @Override public int hashCode() { return Objects.hash(id); }
        }

        Set<Tag> set = new HashSet<>();
        Tag tag = new Tag();
        set.add(tag);
        em.persist(tag);
        System.out.println(set.contains(tag));
    options:
      - text: "`false`: після `persist` хеш змінився, і `HashSet` шукає елемент не в тому кошику"
        text_en: "`false`: after `persist` the hash changed, so `HashSet` looks in the wrong bucket"
        correct: true
      - text: "`true`: Hibernate після присвоєння `id` сам перебудовує хеш-таблицю колекції"
        text_en: "`true`: Hibernate rebuilds the collection's hash table itself after assigning the `id`"
      - text: "`true`: це той самий екземпляр, а `HashSet` порівнює посилання, не викликаючи `equals`"
        text_en: "`true`: it is the same instance, and `HashSet` compares references without calling `equals`"
      - text: "Виняток `ConcurrentModificationException`, бо хеш змінився, поки елемент у множині"
        text_en: "A `ConcurrentModificationException`, because the hash changed while the element was in the set"
    explanation: >
      На момент `add` ідентифікатор ще `null`, а після `persist` він отримує значення, тож `hashCode` змінюється, поки об'єкт лежить у множині, і контракт `Set` порушено.
      Типові виходи: хеш від бізнес-ключа, ключ, призначений до додавання, або сталий `hashCode`. Hibernate за кошиками `HashSet` не стежить.
    explanation_en: >
      At `add` time the identifier is still `null` and after `persist` it gets a value, so `hashCode` changes while the object sits in the set, which breaks the `Set` contract. Typical ways out: a hash from a business key, a key assigned before adding, or a constant `hashCode`. Hibernate does not track the buckets of a `HashSet`.
    sources:
      - https://docs.jboss.org/hibernate/orm/7.0/userguide/html_single/Hibernate_User_Guide.html#mapping-model-pojo-equalshashcode
