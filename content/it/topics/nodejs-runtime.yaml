id: nodejs-runtime
title: Node.js runtime
description: Event loop і фази, libuv, streams, buffers, worker threads, модулі.
questions:
  - id: nodejs-runtime-001
    level: junior
    type: multiple
    text: Які твердження про libuv у складі Node.js правильні?
    options:
      - text: "libuv реалізує event loop і кросплатформний асинхронний ввід-вивід для Node.js"
        correct: true
      - text: "Файлові операції `fs` і `crypto.pbkdf2` виконуються у пулі потоків libuv"
        correct: true
      - text: "Мережеві сокети обслуговуються через механізми ОС (epoll, kqueue, IOCP), а не через пул потоків"
        correct: true
      - text: "Кожен JS-колбек виконується в окремому потоці з пулу libuv, тому Node.js працює паралельно"
      - text: "Пул потоків libuv відповідає за виконання вашого JavaScript-коду, а `V8` лише компілює його"
    explanation: >
      JavaScript виконується в одному головному потоці, а libuv лише віддає туди колбеки після завершення роботи. Пул потоків потрібен для операцій, які
      ОС не вміє робити неблокувально (файли, `crypto`, `zlib`, `dns.lookup`); мережа натомість спирається на системні механізми повідомлень.
    sources:
      - https://docs.libuv.org/en/v1.x/design.html
      - https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop

  - id: nodejs-runtime-002
    level: junior
    type: single
    text: Що виведе код і чому?
    code:
      lang: javascript
      source: |
        const fs = require('node:fs');

        fs.readFile(__filename, () => console.log('read done'));
        console.log('after call');
    options:
      - text: "Спершу `after call`, потім `read done`: `readFile` неблокувальний, колбек прийде після читання"
        correct: true
      - text: "Спершу `read done`, потім `after call`: `readFile` блокує потік, доки не прочитає весь файл повністю"
      - text: "Лише `after call`: без `await` колбек `readFile` ніколи не викликається, бо Node чекає проміс"
      - text: "Порядок випадковий: колбек може запуститися будь-коли, навіть посеред виконання наступного рядка"
    explanation: >
      `fs.readFile` ставить роботу в пул потоків і одразу повертає керування, а колбек потрапляє в чергу event loop лише після читання. Колбек не може
      перервати синхронний код, тож `after call` завжди виходить першим. Блокувальним був би `readFileSync`.
    sources:
      - https://nodejs.org/api/fs.html
      - https://nodejs.org/en/learn/asynchronous-work/asynchronous-flow-control

  - id: nodejs-runtime-003
    level: junior
    type: multiple
    text: Які твердження про `process` у Node.js правильні?
    options:
      - text: "`process.argv[2]` — перший аргумент, переданий користувачем у командному рядку"
        correct: true
      - text: "Значення в `process.env` завжди є рядками, тож `process.env.PORT` треба самостійно перетворювати на число"
        correct: true
      - text: "Ненульовий код у `process.exit(code)` сигналізує оболонці й CI про помилку"
        correct: true
      - text: "`process.argv[0]` — перший аргумент користувача, а шлях до Node.js там не зберігається"
      - text: "`process.env.PORT` автоматично повертає число, якщо змінна середовища містить лише цифри"
    explanation: >
      У `process.argv` перший елемент — шлях до виконуваного файла Node.js, другий — шлях до скрипта, а аргументи користувача починаються з третього.
      Змінні середовища завжди текстові, тому число потрібно розбирати вручну.
    sources:
      - https://nodejs.org/api/process.html

  - id: nodejs-runtime-004
    level: junior
    type: single
    text: Що виведе код?
    code:
      lang: javascript
      source: |
        const s = 'привіт';
        console.log(s.length, Buffer.byteLength(s), Buffer.from(s).length);
    options:
      - text: "`6 12 12`: рядок має 6 символів, а в UTF-8 кожна українська літера займає 2 байти"
        correct: true
      - text: "`6 6 6`: один символ завжди дорівнює одному байту"
      - text: "`12 12 12`: `length` рядка в Node.js рахує байти, а не кодові одиниці UTF-16"
      - text: "`6 12 6`: `Buffer.from` за замовчуванням зберігає лише по одному байту на символ"
    explanation: >
      `length` рядка рахує кодові одиниці UTF-16, а `Buffer` — байти в кодуванні, яке за замовчуванням є UTF-8. Кирилична літера кодується двома байтами,
      тому `Buffer.byteLength` вдвічі більший за довжину рядка.
    sources:
      - https://nodejs.org/api/buffer.html

  - id: nodejs-runtime-005
    level: middle
    type: single
    text: Що виведе код, якщо `setTimeout` і `setImmediate` викликано всередині колбека `fs.readFile`?
    code:
      lang: javascript
      source: |
        const fs = require('node:fs');

        fs.readFile(__filename, () => {
          setTimeout(() => console.log('timeout'), 0);
          setImmediate(() => console.log('immediate'));
        });
    options:
      - text: "Завжди `immediate`, потім `timeout`: після poll іде фаза check, а таймери чекають наступної ітерації"
        correct: true
      - text: "Завжди `timeout`, потім `immediate`: таймер із нульовою затримкою спрацьовує негайно після poll"
      - text: "Порядок не визначений: залежить від навантаження процесу, як і в головному модулі скрипта"
      - text: "Спершу `immediate`, а `timeout` не виведеться, бо колбек уже в фазі poll"
    explanation: >
      Колбек I/O виконується у фазі poll, за якою одразу йде фаза check, де живе `setImmediate`. Таймери перевіряються лише на початку наступної ітерації.
      З головного модуля порядок справді недетермінований, але всередині I/O-колбека він фіксований.
    sources:
      - https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick#setimmediate-vs-settimeout

  - id: nodejs-runtime-006
    level: middle
    type: single
    text: У якому порядку CommonJS-скрипт виведе рядки?
    code:
      lang: javascript
      source: |
        setTimeout(() => console.log('timeout'), 0);
        setImmediate(() => console.log('immediate'));
        process.nextTick(() => console.log('tick'));
        Promise.resolve().then(() => console.log('promise'));
        console.log('sync');
    options:
      - text: "`sync`, `tick`, `promise`, а далі `timeout` і `immediate` у непередбачуваному порядку"
        correct: true
      - text: "`sync`, `promise`, `tick`, а далі `timeout` і `immediate` у непередбачуваному порядку"
      - text: "`sync`, `timeout`, `immediate`, `tick`, `promise`: черги мікрозадач виконуються після кожної фази"
      - text: "`sync`, `tick`, `timeout`, `promise`, `immediate`: `nextTick` належить до фази таймерів"
    explanation: >
      Після синхронного коду Node спершу вичерпує чергу `process.nextTick`, потім чергу мікрозадач промісів, і лише тоді event loop переходить до фаз.
      Тому `tick` завжди передує `promise` у CommonJS-модулі, а порядок `timeout` / `immediate` з головного модуля залежить від швидкодії процесу.
    sources:
      - https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick#processnexttick

  - id: nodejs-runtime-007
    level: middle
    type: single
    text: Чому для з'єднання потоків у продакшн-коді радять `stream.pipeline()`, а не ланцюжок `.pipe()`?
    options:
      - text: "`pipeline()` передає помилку з будь-якої ланки в один колбек і знищує всі потоки, а `.pipe()` цього не робить"
        correct: true
      - text: "`pipeline()` швидший за `.pipe()`, бо читає дані великими блоками в обхід внутрішнього буфера потоку"
      - text: "Лише `pipeline()` підтримує зворотний тиск: `.pipe()` читає дані без урахування швидкості приймача даних"
      - text: "`.pipe()` застарів і видаляється у новіших версіях, тому `pipeline()` — його єдина заміна"
    explanation: >
      Зворотний тиск обробляють обидва підходи. Різниця в обробці помилок: після помилки джерела `.pipe()` лишає приймач відкритим, і через це
      можуть витікати дескриптори файлів. `pipeline()` викликає `destroy(err)` для всіх потоків ланцюжка й повідомляє про помилку один раз.
    sources:
      - https://nodejs.org/api/stream.html#streampipelinesource-transforms-destination-callback

  - id: nodejs-runtime-008
    level: middle
    type: multiple
    text: Які твердження про `worker_threads` правильні?
    options:
      - text: "Кожен воркер виконується в окремому ізоляті V8 зі своїм власним event loop і своєю купою"
        correct: true
      - text: "Воркери спілкуються через `postMessage` і можуть ділити пам'ять через `SharedArrayBuffer`"
        correct: true
      - text: "Воркери корисні передусім для CPU-інтенсивної роботи на JavaScript, а не для вводу-виводу"
        correct: true
      - text: "Воркери ділять із головним потоком глобальні змінні, тож об'єкти доступні напряму"
      - text: "Воркер прискорює ввід-вивід, бо вбудований асинхронний I/O Node.js менш ефективний"
    explanation: >
      Воркер має власний ізольований стан, тому дані копіюються через structured clone або передаються як `ArrayBuffer`. Асинхронний I/O у Node.js
      і так не блокує головний потік, тож воркери для нього зазвичай не потрібні й можуть бути навіть повільнішими.
    sources:
      - https://nodejs.org/api/worker_threads.html

  - id: nodejs-runtime-009
    level: senior
    type: single
    text: >
      Сервіс виконує 8 одночасних асинхронних `crypto.pbkdf2`, і водночас запити з `fs.readFile` відповідають із помітною затримкою,
      хоча CPU не завантажений на 100 %. Яка причина і що зробити?
    options:
      - text: "Пул потоків libuv має 4 потоки за замовчуванням і спільний для `fs`, `crypto`, `zlib`, `dns.lookup`; розмір задає `UV_THREADPOOL_SIZE`"
        correct: true
      - text: "Асинхронний `pbkdf2` виконується в головному потоці й блокує event loop, тому його треба замінити на синхронний `pbkdf2Sync` в обробнику"
      - text: "Кожна операція отримує окремий потік автоматично, тож причина лише в обмеженні файлових дескрипторів у `ulimit` на хості"
      - text: "Пул потоків окремий для кожного модуля, тому `crypto` і `fs` не впливають одна на одну, а проблема в `setImmediate`"
    explanation: >
      Файлові операції й частина `crypto` ділять один пул із чотирьох потоків, тому чотири довгі хешування займають його повністю, а `readFile` стоїть
      у черзі. Збільшити пул можна через `UV_THREADPOOL_SIZE` до старту процесу. Перевірено: 8 викликів `pbkdf2` завершуються двома хвилями по 4.
    sources:
      - https://nodejs.org/api/cli.html#uv_threadpool_sizesize
      - https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop

  - id: nodejs-runtime-010
    level: senior
    type: single
    text: Що станеться з процесом Node.js 24 під час виконання цього коду без жодних обробників і прапорців?
    code:
      lang: javascript
      source: |
        Promise.reject(new Error('boom'));
        setTimeout(() => console.log('still alive'), 100);
    options:
      - text: "Необроблене відхилення стає винятком: процес завершується з ненульовим кодом, `still alive` не виведеться"
        correct: true
      - text: "Процес лише виведе попередження в `stderr`, продовжить роботу й виведе `still alive` через 100 мс"
      - text: "Помилка мовчки ігнорується, а `still alive` виведеться: проміси ніколи не можуть завершити процес Node.js аварійно"
      - text: "Процес завершиться лише після 100 мс, коли відпрацює таймер, із кодом 0"
    explanation: >
      Із Node.js 15 режим `--unhandled-rejections` за замовчуванням `throw`: якщо відхилення не оброблено, воно піднімається як `uncaughtException`,
      і без обробника процес падає. До цього був лише `warning`. Захищатися слід `.catch()` / `try`-`await`, а не глобальним обробником.
    sources:
      - https://nodejs.org/api/cli.html#--unhandled-rejectionsmode
      - https://nodejs.org/api/process.html

  - id: nodejs-runtime-011
    level: senior
    type: multiple
    text: Які твердження про зворотний тиск (backpressure) у streams правильні?
    options:
      - text: "`writable.write()` повертає `false`, коли внутрішній буфер перевищив `highWaterMark`, і далі слід чекати події `drain`"
        correct: true
      - text: "Якщо ігнорувати `false` і писати далі, дані не губляться, а буфер у пам'яті продовжує рости"
        correct: true
      - text: "`pipeline()` і `.pipe()` самі призупиняють читання джерела, поки приймач не звільнить буфер"
        correct: true
      - text: "`false` від `write()` означає, що дані відкинуто, і запис треба повторити після події `drain`"
      - text: "`highWaterMark` — жорсткий ліміт: спроба записати понад нього одразу кидає виняток"
    explanation: >
      `highWaterMark` — лише поріг, після якого потік просить зупинитися; жодних даних не відкидається й виняток не кидається. Якщо не зважати на сигнал,
      пам'ять зростає, поки не вичерпається. Зворотний тиск автоматично обробляють `.pipe()` і `pipeline()`.
    sources:
      - https://nodejs.org/api/stream.html
      - https://nodejs.org/en/learn/modules/backpressuring-in-streams

  - id: nodejs-runtime-012
    level: senior
    type: single
    text: >
      У Node.js 24 CommonJS-файл викликає `require('./lib.mjs')`, де `lib.mjs` — ES-модуль. Що станеться?
    options:
      - text: "Працює, якщо в модулі та його залежностях немає top-level `await`; інакше буде `ERR_REQUIRE_ASYNC_MODULE`"
        correct: true
      - text: "Завжди `ERR_REQUIRE_ESM`: з CommonJS можна завантажити ES-модуль лише через динамічний `import()`"
      - text: "Працює завжди: `require` дочекається top-level `await` і синхронно поверне готовий результат"
      - text: "Працює лише з прапорцем `--experimental-require-module`, без нього поведінка така сама, як у Node.js 20.0"
    explanation: >
      Починаючи з Node.js 22.12 `require()` може синхронно завантажувати ES-модулі без прапорця. Синхронний `require` не вміє чекати, тому модульний граф
      із top-level `await` відхиляється з `ERR_REQUIRE_ASYNC_MODULE`. Перевірено запуском на Node 24.
    sources:
      - https://nodejs.org/api/modules.html#loading-ecmascript-modules-using-require
