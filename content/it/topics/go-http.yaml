id: go-http
title: net/http і фреймворки
title_en: net/http and frameworks
description: net/http, middleware, Gin/Echo, graceful shutdown.
description_en: net/http, middleware, Gin/Echo, graceful shutdown.
icon: globe
questions:
  - id: go-http-001
    level: junior
    type: single
    text: Що поверне цей код для запиту `GET /items/42` (Go 1.27)?
    text_en: What does this code return for the request `GET /items/42` (Go 1.27)?
    code:
      lang: go
      source: |
        mux := http.NewServeMux()
        mux.HandleFunc("GET /items/{id}", func(w http.ResponseWriter, r *http.Request) {
            fmt.Fprint(w, "item ", r.PathValue("id"))
        })
        rec := httptest.NewRecorder()
        mux.ServeHTTP(rec, httptest.NewRequest("GET", "/items/42", nil))
        fmt.Println(rec.Code, rec.Body.String())
    options:
      - text: '`200 item 42`'
        text_en: '`200 item 42`'
        correct: true
      - text: '`200 item {id}`'
        text_en: '`200 item {id}`'
      - text: '`404 404 page not found`, бо шаблон із методом у `ServeMux` не підтримується'
        text_en: '`404 404 page not found`, because a pattern with a method is not supported in `ServeMux`'
      - text: 'Код не скомпілюється: змінні `{id}` у шляху доступні лише у Gin і Echo'
        text_en: 'The code does not compile: `{id}` path variables are available only in Gin and Echo'
    explanation: >
      Починаючи з Go 1.22 `ServeMux` приймає в шаблоні метод і змінні сегменти, а значення сегмента повертає `r.PathValue`. Запит `GET /items/42` збігається з шаблоном, тому код відповіді 200, а `id` дорівнює `42`.
    explanation_en: >
      Since Go 1.22, `ServeMux` accepts a method and wildcard segments in a pattern, and `r.PathValue` returns the segment value. The request `GET /items/42` matches the pattern, so the response code is 200 and `id` equals `42`.
    sources:
      - https://go.dev/doc/go1.22#enhanced_routing_patterns
      - https://pkg.go.dev/net/http#hdr-Patterns-ServeMux
  - id: go-http-002
    level: junior
    type: single
    text: Що виведе цей код (Go 1.27)?
    text_en: What does this code print (Go 1.27)?
    code:
      lang: go
      source: |
        h := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            fmt.Fprint(w, "ok")
            w.WriteHeader(http.StatusTeapot)
        })
        rec := httptest.NewRecorder()
        h.ServeHTTP(rec, httptest.NewRequest("GET", "/", nil))
        fmt.Println(rec.Code, rec.Body.String())
    options:
      - text: '`200 ok`'
        text_en: '`200 ok`'
        correct: true
      - text: '`418 ok`'
        text_en: '`418 ok`'
      - text: '`418` і порожнє тіло, бо `WriteHeader` перезаписує відповідь'
        text_en: '`418` and an empty body, because `WriteHeader` overwrites the response'
      - text: Паніка під час виконання, бо заголовок уже надіслано
        text_en: A panic at run time, because the header has already been sent
    explanation: >
      Перший `Write` без явного `WriteHeader` неявно надсилає статус 200. Пізніший `WriteHeader` не змінює статус: сервер лише пише в лог про зайвий виклик, а паніки немає. Тому статус задають до першого запису в тіло.
    explanation_en: >
      The first `Write` without an explicit `WriteHeader` implicitly sends status 200. A later `WriteHeader` does not change the status: the server only logs a message about the superfluous call, and there is no panic. So set the status before the first write to the body.
    sources:
      - https://pkg.go.dev/net/http#ResponseWriter
  - id: go-http-003
    level: junior
    type: multiple
    text: 'Які твердження про відповідь `http.Get` правильні (Go 1.27)?'
    text_en: Which statements about the `http.Get` response are true (Go 1.27)?
    options:
      - text: Тіло відповіді треба закрити, коли воно більше не потрібне
        text_en: The response body must be closed when it is no longer needed
        correct: true
      - text: Відповідь зі статусом 404 не дає `err != nil`; код статусу перевіряють окремо
        text_en: A 404 response does not produce `err != nil`; the status code is checked separately
        correct: true
      - text: Якщо `err == nil`, то `resp` не `nil`, і `resp.Body` теж не `nil`
        text_en: If `err == nil`, then `resp` is not `nil`, and `resp.Body` is not `nil` either
        correct: true
      - text: Закривати `resp.Body` не обов'язково, бо збирач сміття сам закриє з'єднання
        text_en: Closing `resp.Body` is not required, because the garbage collector closes the connection itself
      - text: Клієнт `http.DefaultClient` перериває запит, який триває довше за 30 секунд
        text_en: '`http.DefaultClient` aborts a request that takes longer than 30 seconds'
    explanation: >
      `Get` повертає помилку лише за проблем із запитом чи з'єднанням, а не за статусом не 2xx, і тіло завжди треба закривати. Збирач сміття з'єднання не звільняє, а `DefaultClient` має нульовий `Timeout`, тобто ліміту часу немає.
    explanation_en: >
      `Get` returns an error only for problems with the request or the connection, not for a non-2xx status, and the body must always be closed. The garbage collector does not release the connection, and `DefaultClient` has a zero `Timeout`, meaning there is no time limit.
    sources:
      - https://pkg.go.dev/net/http#Get
      - https://pkg.go.dev/net/http#Client
  - id: go-http-004
    level: junior
    type: single
    text: Що поверне цей код для `GET /users/7` (Echo v5.4)?
    text_en: What does this code return for `GET /users/7` (Echo v5.4)?
    code:
      lang: go
      source: |
        e := echo.New()
        e.GET("/users/:id", func(c *echo.Context) error {
            return c.String(200, "user "+c.Param("id"))
        })
        rec := httptest.NewRecorder()
        e.ServeHTTP(rec, httptest.NewRequest("GET", "/users/7", nil))
        fmt.Println(rec.Code, rec.Body.String())
    options:
      - text: '`200 user 7`'
        text_en: '`200 user 7`'
        correct: true
      - text: '`200 user :id`'
        text_en: '`200 user :id`'
      - text: '`404`, бо параметри шляху в Echo задаються лише через `{id}`'
        text_en: '`404`, because path parameters in Echo are specified only via `{id}`'
      - text: '`200 user ` з порожнім значенням, бо `Param` читає query-рядок'
        text_en: '`200 user ` with an empty value, because `Param` reads the query string'
    explanation: >
      Echo позначає параметр шляху двокрапкою, а `c.Param("id")` повертає фактичний сегмент, тобто `7`. Query-параметри читають окремим методом `QueryParam`. Echo сам реалізує `http.Handler`, тому його можна викликати через `httptest` без порту.
    explanation_en: >
      Echo marks a path parameter with a colon, and `c.Param("id")` returns the actual segment, that is `7`. Query parameters are read with a separate method, `QueryParam`. Echo itself implements `http.Handler`, so it can be called through `httptest` without a port.
    sources:
      - https://echo.labstack.com/guide/routing/
  - id: go-http-005
    level: middle
    type: single
    text: Який порядок виводу дасть цей код (Go 1.27)?
    text_en: What output order does this code produce (Go 1.27)?
    code:
      lang: go
      source: |
        func wrap(name string) func(http.Handler) http.Handler {
            return func(next http.Handler) http.Handler {
                return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                    fmt.Println(name, "before")
                    next.ServeHTTP(w, r)
                    fmt.Println(name, "after")
                })
            }
        }

        final := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            fmt.Println("handler")
        })
        h := wrap("A")(wrap("B")(final))
        h.ServeHTTP(httptest.NewRecorder(), httptest.NewRequest("GET", "/", nil))
    options:
      - text: '`A before`, `B before`, `handler`, `B after`, `A after`'
        text_en: '`A before`, `B before`, `handler`, `B after`, `A after`'
        correct: true
      - text: '`A before`, `A after`, `B before`, `B after`, `handler`'
        text_en: '`A before`, `A after`, `B before`, `B after`, `handler`'
      - text: '`B before`, `A before`, `handler`, `A after`, `B after`'
        text_en: '`B before`, `A before`, `handler`, `A after`, `B after`'
      - text: '`A before`, `B before`, `handler`, `A after`, `B after`'
        text_en: '`A before`, `B before`, `handler`, `A after`, `B after`'
    explanation: >
      Зовнішній обгортник `A` виконує свій код до виклику `next`, потім керування йде всередину, а після повернення кожен шар завершує свою частину у зворотному порядку. Тому «after» стоять у порядку `B`, потім `A`.
    explanation_en: >
      The outer wrapper `A` runs its code before calling `next`, then control goes inward, and after returning each layer finishes its part in reverse order. So the "after" lines go in the order `B`, then `A`.
    sources:
      - https://pkg.go.dev/net/http#Handler
      - https://pkg.go.dev/net/http#HandlerFunc
  - id: go-http-006
    level: middle
    type: single
    text: >
      Сервіс викликає `http.Get(url)` до зовнішнього API. Одного дня API приймає з'єднання, але перестає відповідати. Що станеться з горутиною, яка викликала `http.Get` (Go 1.27)?
    text_en: A service calls `http.Get(url)` to an external API. One day the API accepts connections but stops responding. What happens to the goroutine that called `http.Get` (Go 1.27)?
    options:
      - text: Вона блокуватиметься, доки API не відповість чи не розірве з'єднання, бо в `DefaultClient` ліміту часу немає
        text_en: It blocks until the API responds or closes the connection, because `DefaultClient` has no time limit
        correct: true
      - text: '`http.Get` поверне помилку через 30 секунд, бо `DefaultClient` має такий таймаут'
        text_en: '`http.Get` returns an error after 30 seconds, because `DefaultClient` has that timeout'
      - text: '`http.Get` повернеться з `resp` зі статусом 504, бо клієнт сам вирішить, що сервер недоступний'
        text_en: '`http.Get` returns a `resp` with status 504, because the client decides on its own that the server is unavailable'
      - text: Запит перерветься, щойно завершиться горутина, яка його викликала
        text_en: The request is aborted as soon as the goroutine that called it finishes
    explanation: >
      Нульовий `Client.Timeout` означає відсутність ліміту, тож зависла відповідь тримає горутину довільно довго, а таких горутин у навантаженні накопичується багато. Виправлення: власний `http.Client{Timeout: …}` або контекст із дедлайном у `NewRequestWithContext`.
    explanation_en: >
      A zero `Client.Timeout` means no limit, so a hung response holds the goroutine for an arbitrarily long time, and under load many such goroutines pile up. The fix: your own `http.Client{Timeout: …}` or a context with a deadline in `NewRequestWithContext`.
    sources:
      - https://pkg.go.dev/net/http#Client
      - https://pkg.go.dev/net/http#NewRequestWithContext
  - id: go-http-007
    level: middle
    type: single
    text: Що поверне цей код для запиту `POST /items` (Go 1.27)?
    text_en: What does this code return for the request `POST /items` (Go 1.27)?
    code:
      lang: go
      source: |
        mux := http.NewServeMux()
        mux.HandleFunc("GET /items", func(w http.ResponseWriter, r *http.Request) {
            fmt.Fprint(w, "list")
        })
        rec := httptest.NewRecorder()
        mux.ServeHTTP(rec, httptest.NewRequest("POST", "/items", nil))
        fmt.Println(rec.Code, rec.Header().Get("Allow"))
    options:
      - text: '`405 GET, HEAD`'
        text_en: '`405 GET, HEAD`'
        correct: true
      - text: '`404` і порожній заголовок `Allow`'
        text_en: '`404` and an empty `Allow` header'
      - text: '`200` і порожній заголовок `Allow`, бо метод ігнорується'
        text_en: '`200` and an empty `Allow` header, because the method is ignored'
      - text: '`405` і порожній заголовок `Allow`, бо мультиплексор не знає, які методи дозволені'
        text_en: '`405` and an empty `Allow` header, because the multiplexer does not know which methods are allowed'
    explanation: >
      Шлях збігається, а метод ні, тому мультиплексор Go 1.22+ відповідає 405 і заповнює `Allow` методами, які шлях підтримує: шаблон `GET` охоплює ще й `HEAD`. Код 404 був би лише тоді, коли жоден шаблон не підходить за шляхом.
    explanation_en: >
      The path matches but the method does not, so the Go 1.22+ multiplexer responds with 405 and fills `Allow` with the methods the path supports: the `GET` pattern also covers `HEAD`. A 404 would occur only when no pattern matches by path.
    sources:
      - https://pkg.go.dev/net/http#hdr-Patterns-ServeMux
      - https://go.dev/blog/routing-enhancements
  - id: go-http-008
    level: middle
    type: single
    text: Що виведе цей код і яку відповідь отримає клієнт без заголовка `X-Token` (Gin 1.12)?
    text_en: What does this code print and what response does the client get without the `X-Token` header (Gin 1.12)?
    code:
      lang: go
      source: |
        r := gin.New()
        r.Use(func(c *gin.Context) {
            if c.GetHeader("X-Token") == "" {
                c.AbortWithStatus(http.StatusUnauthorized)
                fmt.Println("after abort")
            }
            c.Next()
            fmt.Println("after next")
        })
        r.GET("/", func(c *gin.Context) {
            fmt.Println("handler")
            c.String(200, "ok")
        })
        rec := httptest.NewRecorder()
        r.ServeHTTP(rec, httptest.NewRequest("GET", "/", nil))
        fmt.Println(rec.Code)
    options:
      - text: '`after abort`, `after next`, `401`; обробник маршруту не викликається'
        text_en: '`after abort`, `after next`, `401`; the route handler is not called'
        correct: true
      - text: '`after next`, `401`; решта middleware пропускається ще до `println`'
        text_en: '`after next`, `401`; the rest of the middleware is skipped even before `println`'
      - text: '`after abort`, `handler`, `after next`, `401`, бо `Next` ігнорує `Abort`'
        text_en: '`after abort`, `handler`, `after next`, `401`, because `Next` ignores `Abort`'
      - text: '`after abort`, `handler`, `after next`, `200`, бо `c.String` перекриває статус'
        text_en: '`after abort`, `handler`, `after next`, `200`, because `c.String` overrides the status'
    explanation: >
      `Abort` лише позначає ланцюжок як перерваний і не зупиняє виконання поточної функції, тому обидва `Println` виконуються. Далі `c.Next()` бачить прапорець і не викликає наступні обробники. Щоб вийти одразу, після `Abort` потрібен `return`.
    explanation_en: >
      `Abort` only marks the chain as aborted and does not stop execution of the current function, so both `Println` calls run. Then `c.Next()` sees the flag and does not call the next handlers. To exit immediately, `return` is needed after `Abort`.
    sources:
      - https://pkg.go.dev/github.com/gin-gonic/gin#Context.Abort
  - id: go-http-009
    level: senior
    type: multiple
    text: 'Які твердження про таймаути `http.Server` правильні (Go 1.27)?'
    text_en: Which statements about `http.Server` timeouts are true (Go 1.27)?
    options:
      - text: '`ReadHeaderTimeout` обмежує лише читання заголовків запиту, а читання тіла лишається на розсуд обробника'
        text_en: '`ReadHeaderTimeout` limits only reading the request headers, while reading the body is left to the handler'
        correct: true
      - text: '`ReadTimeout` охоплює читання всього запиту разом із тілом'
        text_en: '`ReadTimeout` covers reading the entire request, including the body'
        correct: true
      - text: Якщо `IdleTimeout` нульовий, для з'єднань у режимі keep-alive береться значення `ReadTimeout`
        text_en: If `IdleTimeout` is zero, the `ReadTimeout` value is used for connections in keep-alive mode
        correct: true
      - text: Сервер без таймаутів безпечний, бо сам закриває будь-яке з'єднання, що простоює понад 30 секунд
        text_en: A server without timeouts is safe, because it automatically closes any connection idle for over 30 seconds
      - text: '`WriteTimeout` скидається після кожного виклику `Write`, тож обмежує паузу між частинами відповіді'
        text_en: '`WriteTimeout` is reset after every `Write` call, so it limits the pause between response parts'
    explanation: >
      Нульові таймаути означають «без обмежень», тому повільний клієнт, що мляво шле заголовки, тримає з'єднання скільки захоче, і саме проти цього задають `ReadHeaderTimeout`. `WriteTimeout` не скидається після кожного `Write`: його відлік оновлюється, коли читається заголовок нового запиту.
    explanation_en: >
      Zero timeouts mean "no limit", so a slow client that sluggishly sends headers holds the connection as long as it likes, and `ReadHeaderTimeout` is set against exactly that. `WriteTimeout` is not reset after every `Write`: its countdown is refreshed when the header of a new request is read.
    sources:
      - https://pkg.go.dev/net/http#Server
  - id: go-http-010
    level: senior
    type: single
    text: >
      Сервіс на `net/http` має такий `main`. Після `SIGTERM` в оркестраторі кілька довгих запитів обриваються, хоча `Shutdown` має ліміт 30 секунд (Go 1.27). Що відбувається і що виправити?
    text_en: A service on `net/http` has the following `main`. After `SIGTERM` in the orchestrator several long requests are cut off, even though `Shutdown` has a 30-second limit (Go 1.27). What happens and what should be fixed?
    code:
      lang: go
      source: |
        srv := &http.Server{Addr: ":8080", Handler: mux}
        go func() {
            <-sigCh
            ctx, cancel := context.WithTimeout(context.Background(), 30*time.Second)
            defer cancel()
            srv.Shutdown(ctx)
        }()
        if err := srv.ListenAndServe(); err != nil {
            log.Fatal(err)
        }
    options:
      - text: '`ListenAndServe` одразу повертає `ErrServerClosed`, `log.Fatal` вбиває процес до кінця `Shutdown`; треба ігнорувати цю помилку й дочекатися `Shutdown`'
        text_en: '`ListenAndServe` returns `ErrServerClosed` right away, `log.Fatal` kills the process before `Shutdown` finishes; this error should be ignored and `Shutdown` awaited'
        correct: true
      - text: '`Shutdown` одразу закриває всі активні з''єднання, тож його слід замінити на `Close`, який дозволяє запитам завершитися коректно'
        text_en: '`Shutdown` closes all active connections immediately, so it should be replaced with `Close`, which lets requests finish gracefully'
      - text: '`Shutdown` не діє, доки `ListenAndServe` не повернеться, тому його слід викликати лише з обробника запиту до `mux`'
        text_en: '`Shutdown` has no effect until `ListenAndServe` returns, so it should be called only from a request handler of `mux`'
      - text: Ліміт 30 секунд замалий для таких запитів; обриви зникнуть, якщо замінити `context.WithTimeout` на `context.Background()`
        text_en: The 30-second limit is too short for such requests; the cutoffs will disappear if `context.WithTimeout` is replaced with `context.Background()`
    explanation: >
      Документація прямо попереджає: після `Shutdown` методи `Serve` повертають `ErrServerClosed` одразу, тож програма не повинна виходити, доки `Shutdown` не повернеться. Тут `log.Fatal` вбиває процес негайно. Правильно трактувати `ErrServerClosed` як нормальний вихід і дочекатися горутини з `Shutdown`.
    explanation_en: >
      The documentation warns explicitly: after `Shutdown`, the `Serve` methods return `ErrServerClosed` immediately, so the program must not exit until `Shutdown` returns. Here `log.Fatal` kills the process at once. The right approach is to treat `ErrServerClosed` as a normal exit and wait for the goroutine with `Shutdown`.
    sources:
      - https://pkg.go.dev/net/http#Server.Shutdown
      - https://pkg.go.dev/net/http#ErrServerClosed
  - id: go-http-011
    level: senior
    type: multiple
    text: 'Які твердження про `r.Context()` у серверному обробнику правильні (Go 1.27)?'
    text_en: Which statements about `r.Context()` in a server handler are true (Go 1.27)?
    options:
      - text: Контекст скасовується, коли клієнт закриває з'єднання, тож довгий обробник може вчасно припинити роботу
        text_en: The context is canceled when the client closes the connection, so a long handler can stop working in time
        correct: true
      - text: Контекст також скасовується, коли `ServeHTTP` повертається, тому горутина, що пережила обробник, побачить скасований контекст
        text_en: The context is also canceled when `ServeHTTP` returns, so a goroutine that outlives the handler will see a canceled context
        correct: true
      - text: Скасування допомагає лише тоді, коли обробник передає `r.Context()` у виклики БД і HTTP або слухає `Done()`
        text_en: Cancellation helps only when the handler passes `r.Context()` to DB and HTTP calls or listens on `Done()`
        correct: true
      - text: Контекст скасовується автоматично, щойно обробник почав писати відповідь, тому після `Write` ним користуватись не можна
        text_en: The context is canceled automatically as soon as the handler starts writing the response, so it cannot be used after `Write`
      - text: Контекст запиту завжди `context.Background()`, а скасування клієнта сервер сигналізує лише через `panic`
        text_en: The request context is always `context.Background()`, and the server signals client cancellation only through `panic`
    explanation: >
      Серверний контекст скасовується, коли закривається з'єднання клієнта, скасовується запит (HTTP/2) або повертається `ServeHTTP`. Саме скасування нічого не зупиняє: код має сам спостерігати за контекстом, інакше робота триває даремно. Початок запису відповіді контекст не скасовує.
    explanation_en: >
      The server context is canceled when the client's connection closes, the request is canceled (HTTP/2), or `ServeHTTP` returns. Cancellation by itself stops nothing: the code has to watch the context itself, otherwise the work continues for nothing. Starting to write the response does not cancel the context.
    sources:
      - https://pkg.go.dev/net/http#Request.Context
  - id: go-http-012
    level: senior
    type: single
    text: >
      Сервіс робить тисячі запитів на секунду до одного upstream. Моніторинг показує постійний ріст нових TCP-з'єднань до нього, хоча `Transport` стандартний. Код читає лише статус і робить `defer resp.Body.Close()`, а великі тіла відповідей (кілька мегабайт) ігнорує (Go 1.27). Яка найімовірніша причина і виправлення?
    text_en: A service makes thousands of requests per second to one upstream. Monitoring shows a steady growth of new TCP connections to it, even though the `Transport` is the default one. The code reads only the status and does `defer resp.Body.Close()`, while ignoring large response bodies (several megabytes) (Go 1.27). What is the most likely cause and fix?
    options:
      - text: Тіло не вичитане до EOF, тому з'єднання не повертається в пул; перед `Close` потрібен `io.Copy(io.Discard, resp.Body)`
        text_en: The body is not read to EOF, so the connection does not return to the pool; `io.Copy(io.Discard, resp.Body)` is needed before `Close`
        correct: true
      - text: '`defer resp.Body.Close()` завжди розриває TCP-з''єднання з upstream, тож відкладений `Close` треба прибрати з коду'
        text_en: '`defer resp.Body.Close()` always tears down the TCP connection to the upstream, so the deferred `Close` should be removed from the code'
      - text: "Стандартний `Transport` не вміє keep-alive, тому потрібен власний `Transport` із полем `DisableKeepAlives: false`"
        text_en: 'The default `Transport` does not support keep-alive, so a custom `Transport` with the field `DisableKeepAlives: false` is needed'
      - text: Перевикористанню заважає `Client.Timeout` на клієнті, тому цей ліміт часу краще прибрати зовсім
        text_en: '`Client.Timeout` on the client prevents reuse, so this time limit is better removed altogether'
    explanation: >
      Для повторного використання keep-alive-з'єднання тіло має бути прочитане до EOF і закрите. З Go 1.27 `Close()` сам дочитує непрочитане, але лише до консервативного ліміту (близько 256 КіБ), тож великі тіла треба вичитати вручну, інакше з'єднання закривається і кожен запит відкриває нове. Keep-alive у стандартному `Transport` увімкнений, а `Client.Timeout` перевикористання не блокує.
    explanation_en: >
      To reuse a keep-alive connection, the body must be read to EOF and closed. Since Go 1.27, `Close()` drains the unread remainder itself, but only up to a conservative limit (about 256 KiB), so large bodies must be read manually, otherwise the connection is closed and every request opens a new one. Keep-alive is enabled in the default `Transport`, and `Client.Timeout` does not block reuse.
    sources:
      - https://pkg.go.dev/net/http#Client.Do
      - https://go.dev/doc/go1.27#nethttppkgnethttp
