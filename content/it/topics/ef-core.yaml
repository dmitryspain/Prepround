id: ef-core
title: Entity Framework Core
title_en: Entity Framework Core
description: DbContext, відстеження змін, міграції, завантаження зв'язків, N+1, продуктивність.
description_en: DbContext, change tracking, migrations, loading related data, N+1, performance.
icon: database
questions:
  - id: ef-core-001
    level: junior
    type: single
    text: Що робить `SaveChanges()`?
    text_en: What does `SaveChanges()` do?
    options:
      - text: Записує в базу всі відстежувані зміни, за замовчуванням в одній транзакції
        text_en: Writes all tracked changes to the database, in a single transaction by default
        correct: true
      - text: Зберігає лише сутність, яку змінили останньою, а решту змін відкидає
        text_en: Saves only the entity that was modified last and discards all the other changes
      - text: Перечитує з бази всі відстежувані сутності й оновлює їхні значення в пам'яті
        text_en: Reloads all tracked entities from the database and refreshes their in-memory values
      - text: Створює міграцію за змінами моделі й застосовує її до бази даних
        text_en: Creates a migration from the model changes and applies it to the database
    explanation: >
      `SaveChanges` бере зміни з ChangeTracker і виконує потрібні `INSERT`, `UPDATE` і `DELETE`.
      Це додані, змінені й видалені сутності. Якщо провайдер підтримує транзакції, усі зміни одного виклику йдуть в одній транзакції:
      застосуються або всі, або жодна.
    explanation_en: >
      `SaveChanges` takes the changes from the ChangeTracker and runs the required `INSERT`, `UPDATE`, and `DELETE` commands.
      These cover the added, modified, and deleted entities. If the provider supports transactions, all changes from one call run in a single transaction:
      either all of them are applied or none.

  - id: ef-core-002
    level: junior
    type: single
    text: З яким життєвим циклом `AddDbContext` за замовчуванням реєструє `DbContext` в ASP.NET Core?
    text_en: With which lifetime does `AddDbContext` register the `DbContext` in ASP.NET Core by default?
    options:
      - text: Scoped — один екземпляр на HTTP-запит
        text_en: Scoped — one instance per HTTP request
        correct: true
      - text: Singleton — один екземпляр на весь застосунок
        text_en: Singleton — one instance for the whole application
      - text: Transient — новий екземпляр щоразу, коли його запитують із контейнера
        text_en: Transient — a new instance every time it is requested from the container
      - text: "Ніяким: `AddDbContext` не реєструє контекст у DI"
        text_en: "None: `AddDbContext` does not register the context in DI"
    explanation: >
      `AddDbContext` за замовчуванням реєструє контекст як scoped, тобто один екземпляр на запит.
      `DbContext` не потокобезпечний і накопичує відстежувані сутності, тому один екземпляр на весь застосунок — помилка.
    explanation_en: >
      By default `AddDbContext` registers the context as scoped, that is, one instance per request.
      `DbContext` is not thread-safe and accumulates tracked entities, so a single instance for the whole application is a mistake.

  - id: ef-core-003
    level: junior
    type: multiple
    text: Які твердження про міграції EF Core правильні?
    text_en: Which statements about EF Core migrations are true?
    options:
      - text: "`dotnet ef migrations add` створює клас міграції за змінами в моделі"
        text_en: "`dotnet ef migrations add` creates a migration class from the changes in the model"
        correct: true
      - text: "`dotnet ef database update` застосовує до бази ще не застосовані міграції"
        text_en: "`dotnet ef database update` applies the migrations not yet applied to the database"
        correct: true
      - text: Застосовані міграції EF Core записує в таблицю `__EFMigrationsHistory`
        text_en: EF Core records applied migrations in the `__EFMigrationsHistory` table
        correct: true
      - text: "`dotnet ef migrations add` одразу змінює схему бази, без окремої команди"
        text_en: "`dotnet ef migrations add` changes the database schema right away, with no separate command"
      - text: Останню міграцію можна прибрати лише вручну, видаливши її файли з проєкту
        text_en: The latest migration can be removed only manually, by deleting its files from the project
    explanation: >
      `migrations add` лише генерує код міграції й оновлює знімок моделі, а схему бази змінює `database update`.
      Історію застосованих міграцій EF Core веде в `__EFMigrationsHistory`, а ще не застосовану останню міграцію
      прибирає `dotnet ef migrations remove`.
    explanation_en: >
      `migrations add` only generates the migration code and updates the model snapshot, while `database update` changes the database schema.
      EF Core keeps the history of applied migrations in `__EFMigrationsHistory`, and a latest migration that
      has not been applied yet is removed with `dotnet ef migrations remove`.

  - id: ef-core-004
    level: junior
    type: single
    text: Що робить `Include` у цьому запиті?
    text_en: What does `Include` do in this query?
    code:
      lang: csharp
      source: |
        var blogs = await db.Blogs
            .Include(b => b.Posts)
            .ToListAsync();
    options:
      - text: Завантажує пости разом із блогами (eager loading)
        text_en: Loads the posts together with the blogs (eager loading)
        correct: true
      - text: Повертає лише ті блоги, у яких є хоча б один пост
        text_en: Returns only the blogs that have at least one post
      - text: "Вмикає lazy loading для `Posts`, тож пости підтягнуться під час першого звернення"
        text_en: "Enables lazy loading for `Posts`, so the posts are fetched on first access"
      - text: Додає пости до відстеження контекстом без запиту до бази
        text_en: Adds the posts to the context's tracking without querying the database
    explanation: >
      `Include` — це eager loading: пов'язані сутності завантажуються разом з основними, за замовчуванням тим самим SQL-запитом.
      Фільтром він не є: блоги без постів теж потраплять у результат, з порожньою колекцією.
    explanation_en: >
      `Include` is eager loading: related entities are loaded together with the main ones, by default in the same SQL query.
      It is not a filter: blogs without posts are in the result too, with an empty collection.

  - id: ef-core-005
    level: middle
    type: single
    text: Що робить `AsNoTracking()` у запиті EF Core?
    text_en: What does `AsNoTracking()` do in an EF Core query?
    options:
      - text: Вимикає відстеження змін для отриманих сутностей
        text_en: Disables change tracking for the returned entities
        correct: true
      - text: Кешує результат запиту між викликами
        text_en: Caches the query result in memory between calls
      - text: Автоматично завантажує пов'язані сутності
        text_en: Automatically loads related entities for each result
      - text: Робить запит асинхронним
        text_en: Makes the query asynchronous
    explanation: >
      Сутності не потрапляють у ChangeTracker, тож читання швидше й займає менше пам'яті.
      Але зміни в них `SaveChanges` не збереже, поки їх не приєднати через `Attach` або `Update`.
    explanation_en: >
      The entities are not added to the ChangeTracker, so reading is faster and uses less memory.
      But `SaveChanges` will not save changes made to them until they are attached with `Attach` or `Update`.

  - id: ef-core-006
    level: middle
    type: multiple
    text: Lazy loading увімкнено (`UseLazyLoadingProxies`). Які зміни прибирають проблему N+1 у цьому коді?
    text_en: Lazy loading is enabled (`UseLazyLoadingProxies`). Which changes remove the N+1 problem in this code?
    code:
      lang: csharp
      source: |
        var orders = await db.Orders.ToListAsync();
        foreach (var order in orders)
        {
            Console.WriteLine(order.Customer.Name);
        }
    options:
      - text: "Додати `.Include(o => o.Customer)` перед `ToListAsync()`"
        text_en: "Add `.Include(o => o.Customer)` before `ToListAsync()`"
        correct: true
      - text: "Вибрати в запиті лише потрібне: `.Select(o => new { o.Id, CustomerName = o.Customer.Name })`"
        text_en: "Select only what is needed in the query: `.Select(o => new { o.Id, CustomerName = o.Customer.Name })`"
        correct: true
      - text: "Додати `.AsNoTracking()`: без відстеження lazy loading не робитиме окремих запитів"
        text_en: "Add `.AsNoTracking()`: without tracking, lazy loading will not issue separate queries"
      - text: "Замінити `ToListAsync()` на синхронний `ToList()`, щоб запити виконувалися швидше"
        text_en: "Replace `ToListAsync()` with the synchronous `ToList()` so the queries run faster"
      - text: Обгорнути весь цикл в одну явну транзакцію, щоб звернення до бази об'єдналися
        text_en: Wrap the whole loop in one explicit transaction so the database calls are merged
    explanation: >
      Тут один запит отримує замовлення, а потім lazy loading для кожного замовлення робить ще один запит за клієнтом.
      `Include` і проєкція з `o.Customer.Name` дають `JOIN` в одному SQL-запиті, а відстеження,
      синхронний виклик і транзакція кількість запитів не змінюють.
    explanation_en: >
      Here one query gets the orders, and then lazy loading issues one more query for the customer of each order.
      `Include` and the projection with `o.Customer.Name` produce a `JOIN` in a single SQL query, while tracking,
      a synchronous call, and a transaction do not change the number of queries.

  - id: ef-core-007
    level: middle
    type: single
    text: Чим `db.Users.Find(id)` відрізняється від `db.Users.FirstOrDefault(u => u.Id == id)`?
    text_en: How does `db.Users.Find(id)` differ from `db.Users.FirstOrDefault(u => u.Id == id)`?
    options:
      - text: "`Find` спершу шукає серед відстежуваних сутностей і йде в базу, лише якщо там її немає"
        text_en: "`Find` first looks among the tracked entities and goes to the database only if it is not there"
        correct: true
      - text: "`Find` завжди робить запит до бази й перезаписує вже відстежувану сутність"
        text_en: "`Find` always queries the database and overwrites the entity that is already tracked"
      - text: "`Find` шукає за будь-якою властивістю, а не лише за первинним ключем"
        text_en: "`Find` searches by any property, not only by the primary key"
      - text: "`Find` повертає сутність без відстеження, як `AsNoTracking`"
        text_en: "`Find` returns the entity without tracking, like `AsNoTracking`"
    explanation: >
      `Find` шукає за первинним ключем і спершу перевіряє ChangeTracker: якщо сутність уже відстежується,
      запиту до бази не буде. `FirstOrDefault` завжди виконує SQL-запит.
    explanation_en: >
      `Find` searches by primary key and checks the ChangeTracker first: if the entity is already tracked,
      there is no database query. `FirstOrDefault` always runs an SQL query.

  - id: ef-core-008
    level: middle
    type: single
    text: >
      Сутність завантажено звичайним запитом із відстеженням, потім змінено одну її властивість.
      Що зробить `SaveChanges()`?
    text_en: >
      An entity was loaded with a regular tracking query, and then one of its properties was changed.
      What will `SaveChanges()` do?
    options:
      - text: "Виконає `UPDATE`, який записує лише змінену колонку"
        text_en: "Run an `UPDATE` that writes only the changed column"
        correct: true
      - text: "Нічого не збереже: спершу обов'язково треба викликати `db.Update(entity)`"
        text_en: "Save nothing: `db.Update(entity)` must be called first"
      - text: "Виконає `UPDATE` усіх колонок рядка"
        text_en: "Run an `UPDATE` of all the columns of the row"
      - text: Видалить рядок і вставить його заново
        text_en: Delete the row and insert it again
    explanation: >
      Для відстежуваних сутностей EF Core зберігає знімок початкових значень і в `SaveChanges` порівнює з ним поточні.
      Змінено одну властивість, тож `UPDATE` містить лише її. `Update()` потрібен для від'єднаних сутностей
      і позначає зміненими всі властивості.
    explanation_en: >
      For tracked entities, EF Core keeps a snapshot of the original values and compares the current ones with it in `SaveChanges`.
      One property was changed, so the `UPDATE` contains only that one. `Update()` is needed for detached entities
      and marks all properties as modified.

  - id: ef-core-009
    level: senior
    type: multiple
    text: Які твердження про `ExecuteUpdate` і `ExecuteDelete` правильні?
    text_en: Which statements about `ExecuteUpdate` and `ExecuteDelete` are true?
    options:
      - text: "Виконуються в базі одразу, без завантаження сутностей і без `SaveChanges()`"
        text_en: "They run in the database immediately, without loading entities and without `SaveChanges()`"
        correct: true
      - text: "Не оновлюють ChangeTracker: уже завантажені в контекст сутності не дізнаються про зміни"
        text_en: "They do not update the ChangeTracker: entities already loaded into the context do not learn about the changes"
        correct: true
      - text: Спершу завантажують сутності в ChangeTracker, а потім змінюють кожну окремо
        text_en: They first load the entities into the ChangeTracker and then modify each one separately
      - text: "Зміни потрапляють у базу лише після виклику `SaveChanges()` у цьому ж контексті"
        text_en: "The changes reach the database only after `SaveChanges()` is called on the same context"
      - text: Працюють лише з однією сутністю, яку заздалегідь знайдено за первинним ключем
        text_en: They work only with a single entity that has been looked up by primary key beforehand
    explanation: >
      `ExecuteUpdate` і `ExecuteDelete` (з EF Core 7) перекладаються в одну SQL-команду `UPDATE` або `DELETE`
      і виконуються одразу. ChangeTracker вони не чіпають, тож відстежувані сутності лишаються зі старими значеннями,
      і синхронізувати їх треба самостійно.
    explanation_en: >
      `ExecuteUpdate` and `ExecuteDelete` (since EF Core 7) are translated into a single SQL `UPDATE` or `DELETE` command
      and run immediately. They do not touch the ChangeTracker, so tracked entities keep their old values,
      and you have to synchronize them yourself.

  - id: ef-core-010
    level: senior
    type: single
    text: Навіщо в запиті з кількома `Include` колекцій викликати `AsSplitQuery()`?
    text_en: Why call `AsSplitQuery()` in a query with several collection `Include`s?
    options:
      - text: >
          Щоб уникнути «картезіанського вибуху»: замість одного `JOIN` EF виконає запит на кожну колекцію
        text_en: >
          To avoid a "cartesian explosion": instead of a single `JOIN`, EF runs one query per collection
        correct: true
      - text: Щоб EF виконав частини запиту паралельно в кількох потоках і швидше зібрав результат
        text_en: So that EF runs the parts of the query in parallel on several threads and assembles the result faster
      - text: Щоб розбити результат на сторінки й повертати його частинами за кілька викликів
        text_en: To split the result into pages and return it in parts over several calls
      - text: Щоб усі частини запиту гарантовано бачили той самий знімок даних навіть без транзакції
        text_en: So that all parts of the query are guaranteed to see the same data snapshot even without a transaction
    explanation: >
      Один запит з `JOIN` двох колекцій повертає добуток їхніх рядків і дублює дані батьківської сутності.
      Split-запити це прибирають ціною кількох звернень до бази, а без серіалізованої чи snapshot-транзакції
      дані між цими зверненнями можуть розійтися.
    explanation_en: >
      A single query with a `JOIN` of two collections returns the product of their rows and duplicates the parent entity's data.
      Split queries remove this at the cost of several database round trips, and without a serializable or snapshot transaction
      the data can diverge between those round trips.

  - id: ef-core-011
    level: senior
    type: single
    text: Що станеться під час виклику `GetVipsAsync()` в EF Core 3.0 і новіших?
    text_en: What happens when `GetVipsAsync()` is called in EF Core 3.0 and later?
    code:
      lang: csharp
      source: |
        public async Task<List<Customer>> GetVipsAsync() =>
            await _db.Customers
                .Where(c => IsVip(c))
                .ToListAsync();

        private static bool IsVip(Customer customer) => customer.TotalSpent > 10_000;
    options:
      - text: "Виняток `InvalidOperationException`: `IsVip` не можна перекласти в SQL"
        text_en: "An `InvalidOperationException`: `IsVip` cannot be translated to SQL"
        correct: true
      - text: EF завантажить усіх клієнтів і відфільтрує їх у пам'яті на клієнті
        text_en: EF will load all the customers and filter them in memory on the client
      - text: "EF проаналізує тіло `IsVip` і перекладе його в умову SQL `WHERE`"
        text_en: "EF will analyze the body of `IsVip` and translate it into a SQL `WHERE` condition"
      - text: Запит поверне порожній список, бо умову `IsVip` не вдалося обчислити на боці бази
        text_en: The query will return an empty list because the `IsVip` condition could not be evaluated on the database side
    explanation: >
      EF Core не бачить тіла скомпільованого методу, тож не може перекласти його в SQL.
      З версії 3.0 обчислення на клієнті дозволене лише в останньому `Select`, а неперекладний вираз
      деінде в запиті дає виняток, а не тихе завантаження всієї таблиці.
    explanation_en: >
      EF Core cannot see the body of a compiled method, so it cannot translate it to SQL.
      Since version 3.0, client evaluation is allowed only in the final `Select`, and an untranslatable expression
      anywhere else in the query throws an exception instead of silently loading the whole table.

  - id: ef-core-012
    level: senior
    type: multiple
    text: Які твердження про оптимістичну конкурентність в EF Core правильні?
    text_en: Which statements about optimistic concurrency in EF Core are true?
    options:
      - text: "Токен конкурентності (`[ConcurrencyCheck]` або `IsRowVersion()`) EF додає в умову `WHERE` команд `UPDATE` і `DELETE`"
        text_en: "EF adds the concurrency token (`[ConcurrencyCheck]` or `IsRowVersion()`) to the `WHERE` clause of `UPDATE` and `DELETE` commands"
        correct: true
      - text: "Якщо команда не змінила жодного рядка, `SaveChanges` кидає `DbUpdateConcurrencyException`"
        text_en: "If a command affected no rows, `SaveChanges` throws `DbUpdateConcurrencyException`"
        correct: true
      - text: "Під час читання EF Core за замовчуванням блокує рядок через `SELECT … FOR UPDATE` до кінця транзакції"
        text_en: "When reading, EF Core by default locks the row with `SELECT … FOR UPDATE` until the end of the transaction"
      - text: "Коли токен налаштовано, EF розв'язує конфлікт сам: перемагає останній запис, а виняток не кидається"
        text_en: "Once a token is configured, EF resolves the conflict itself: the last write wins and no exception is thrown"
    explanation: >
      EF Core не блокує рядки, а перевіряє, що токен у базі досі той, який було прочитано.
      Якщо рядок тим часом змінили, `UPDATE` не знайде його за умовою, і EF кине `DbUpdateConcurrencyException`,
      а як розв'язати конфлікт, вирішує код застосунку.
    explanation_en: >
      EF Core does not lock rows; it checks that the token in the database is still the one that was read.
      If the row was changed in the meantime, the `UPDATE` will not find it by the condition, and EF will throw `DbUpdateConcurrencyException`,
      while how to resolve the conflict is up to the application code.

  - id: ef-core-013
    level: junior
    type: single
    text: >
      Яку властивість EF Core за конвенцією, без жодних атрибутів і Fluent API,
      робить первинним ключем сутності `Order`?
    text_en: >
      Which property does EF Core, by convention and without any attributes or Fluent API,
      make the primary key of an `Order` entity?
    options:
      - text: "Властивість з назвою `Id` або `OrderId`"
        text_en: "A property named `Id` or `OrderId`"
        correct: true
      - text: "Першу за порядком оголошення властивість типу `int` або `Guid`"
        text_en: "The first property of type `int` or `Guid` in declaration order"
      - text: "Будь-яку властивість, назва якої закінчується на `Key` або `Number`"
        text_en: "Any property whose name ends with `Key` or `Number`"
      - text: "Жодну: без явного налаштування ключа модель EF Core не збереться"
        text_en: "None: without an explicit key configuration the EF Core model will not build"
    explanation: >
      Конвенція шукає властивість `Id` або `OrderId` (ім'я типу з `Id`). Порядок оголошення й тип тут нічого не вирішують,
      а модель без жодної такої властивості справді не збереться, але саме через відсутність ключа за конвенцією.
    explanation_en: >
      The convention looks for a property named `Id` or `OrderId` (the type name plus `Id`). Declaration order and type do not matter here,
      and a model with no such property would indeed fail to build, but only because no key was found by convention.
    sources:
      - https://learn.microsoft.com/en-us/ef/core/modeling/keys

  - id: ef-core-014
    level: junior
    type: single
    text: >
      Який стан має сутність, яку щойно передали в `db.Users.Add(user)`,
      якщо `SaveChanges()` ще не викликали?
    text_en: >
      What state does an entity have right after it was passed to `db.Users.Add(user)`,
      if `SaveChanges()` has not been called yet?
    options:
      - text: "`Added`: контекст відстежує її й вставить рядок під час `SaveChanges()`"
        text_en: "`Added`: the context tracks it and will insert a row during `SaveChanges()`"
        correct: true
      - text: "`Unchanged`: сутність уже в базі, оскільки `Add` одразу виконує `INSERT`"
        text_en: "`Unchanged`: the entity is already in the database because `Add` runs the `INSERT` at once"
      - text: "`Detached`: контекст нічого не знає про неї до виклику `SaveChanges()`"
        text_en: "`Detached`: the context knows nothing about it until `SaveChanges()` is called"
      - text: "`Modified`: контекст позначає зміненою кожну властивість нової сутності"
        text_en: "`Modified`: the context marks every property of the new entity as changed"
    explanation: >
      `Add` лише починає відстежувати сутність зі станом `Added`, до бази нічого не йде.
      `INSERT` виконується на `SaveChanges()`, після чого стан стає `Unchanged`.
    explanation_en: >
      `Add` only starts tracking the entity in the `Added` state, and nothing is sent to the database.
      The `INSERT` runs on `SaveChanges()`, after which the state becomes `Unchanged`.
    sources:
      - https://learn.microsoft.com/en-us/ef/core/change-tracking/explicit-tracking

  - id: ef-core-015
    level: junior
    type: single
    text: Коли в цьому коді EF Core надішле SQL-запит до бази?
    text_en: When does EF Core send an SQL query to the database in this code?
    code:
      lang: csharp
      source: |
        var query = db.Orders.Where(o => o.Total > 100);
        query = query.OrderBy(o => o.CreatedAt);
        var list = await query.ToListAsync();
    options:
      - text: "Лише на `ToListAsync()`: один запит з `WHERE` і `ORDER BY`"
        text_en: "Only on `ToListAsync()`: a single query with `WHERE` and `ORDER BY`"
        correct: true
      - text: "На `Where`: цей запит виконується одразу, а `OrderBy` сортує вже отримані рядки в пам'яті"
        text_en: "On `Where`: this query runs at once, and `OrderBy` then sorts the rows already received in memory"
      - text: "Тричі: окремий запит на кожен рядок, який змінює змінну `query`"
        text_en: "Three times: a separate query for each line that changes the `query` variable"
      - text: "На `Where` і на `ToListAsync()`: перший запит перевіряє, чи є в таблиці підхожі рядки"
        text_en: "On `Where` and on `ToListAsync()`: the first query checks whether the table has any matching rows"
    explanation: >
      `Where` і `OrderBy` лише доповнюють дерево запиту `IQueryable`. EF Core переклав би його в SQL і виконав
      тільки під час перебору результату, тут це `ToListAsync()`.
    explanation_en: >
      `Where` and `OrderBy` only extend the `IQueryable` query tree. EF Core translates it to SQL and executes it
      only when the result is enumerated, which here is `ToListAsync()`.
    sources:
      - https://learn.microsoft.com/en-us/ef/core/querying/how-query-works

  - id: ef-core-016
    level: junior
    type: multiple
    text: >
      У проєкті ввімкнено nullable reference types. Які твердження про налаштування колонок за конвенціями EF Core правильні?
    text_en: >
      Nullable reference types are enabled in the project. Which statements about column configuration by EF Core conventions are true?
    options:
      - text: "Властивість `string Name` стає обов'язковою: колонка отримує обмеження `NOT NULL`"
        text_en: "A property `string Name` becomes required: the column gets a `NOT NULL` constraint"
        correct: true
      - text: "Властивість `string? Note` стає необов'язковою: колонка допускає значення `NULL`"
        text_en: "A property `string? Note` becomes optional: the column allows `NULL` values"
        correct: true
      - text: "Властивість `int Age` допускає `NULL`, бо `int` — тип значення"
        text_en: "A property `int Age` allows `NULL`, because `int` is a value type"
      - text: "Кожна властивість посилального типу допускає `NULL`, поки немає `[Required]`"
        text_en: "Every reference-type property allows `NULL` until there is `[Required]`"
    explanation: >
      Коли nullable reference types увімкнено, обов'язковість береться з C#: `string` — обов'язкова, `string?` — ні.
      Типи значень без `?` (`int`) теж обов'язкові, тож `[Required]` для `string` додавати не потрібно.
    explanation_en: >
      With nullable reference types enabled, requiredness comes from C#: `string` is required and `string?` is not.
      Value types without `?` (`int`) are required as well, so `[Required]` is not needed on a `string`.
    sources:
      - https://learn.microsoft.com/en-us/ef/core/modeling/entity-properties#required-and-optional-properties

  - id: ef-core-017
    level: middle
    type: single
    text: Що виведе цей код, якщо користувач з `Id = 1` існує, а контекст створено щойно?
    text_en: What does this code print if the user with `Id = 1` exists and the context was just created?
    code:
      lang: csharp
      source: |
        var a = await db.Users.FirstAsync(u => u.Id == 1);
        var b = await db.Users.FirstAsync(u => u.Id == 1);
        var c = await db.Users.AsNoTracking().FirstAsync(u => u.Id == 1);
        Console.WriteLine($"{ReferenceEquals(a, b)} {ReferenceEquals(a, c)}");
    options:
      - text: "`True False`: другий запит повертає вже відстежуваний екземпляр, а `AsNoTracking` створює новий"
        text_en: "`True False`: the second query returns the tracked instance, while `AsNoTracking` creates a new one"
        correct: true
      - text: "`False False`: кожен запит до бази матеріалізує окремий об'єкт"
        text_en: "`False False`: every database query materializes a separate object"
      - text: "`True True`: усі три запити читають один рядок, тож повертається той самий об'єкт"
        text_en: "`True True`: all three queries read the same row, so the same object is returned"
      - text: "`False True`: перший екземпляр замінюється тим, що повернув запит без відстеження"
        text_en: "`False True`: the first instance is replaced by the one returned by the no-tracking query"
    explanation: >
      Відстежуваний запит робить identity resolution: для ключа, який уже є в ChangeTracker, повертає наявний екземпляр.
      Запит без відстеження не звертається до ChangeTracker і щоразу створює новий об'єкт.
    explanation_en: >
      A tracking query performs identity resolution: for a key already in the ChangeTracker it returns the existing instance.
      A no-tracking query does not consult the ChangeTracker and creates a new object each time.
    sources:
      - https://learn.microsoft.com/en-us/ef/core/querying/tracking#identity-resolution

  - id: ef-core-018
    level: middle
    type: single
    text: >
      У моделі за конвенціями `Post` має `int BlogId` і навігацію `Blog`, а `Blog` має `List<Post> Posts`.
      Що станеться на реляційній базі, якщо викликати `db.Remove(blog)` без завантаження постів і `SaveChanges()`?
    text_en: >
      In a model built by conventions, `Post` has `int BlogId` and a `Blog` navigation, and `Blog` has `List<Post> Posts`.
      What happens on a relational database if you call `db.Remove(blog)` without loading the posts and then `SaveChanges()`?
    options:
      - text: "Блог видалиться, а його пости видалить сама база завдяки каскадному видаленню"
        text_en: "The blog is deleted, and the database itself deletes its posts through cascade delete"
        correct: true
      - text: "`SaveChanges()` кине виняток, бо в блога лишилися пости, яких EF не завантажив"
        text_en: "`SaveChanges()` throws, because the blog still has posts that EF did not load"
      - text: "Блог видалиться, а в постах `BlogId` стане `NULL`, бо EF очистить зовнішній ключ"
        text_en: "The blog is deleted and `BlogId` in the posts becomes `NULL`, because EF clears the foreign key"
      - text: "Видалиться лише блог, а пости залишаться в таблиці з `BlogId` видаленого блога"
        text_en: "Only the blog is deleted, and the posts stay in the table with the deleted blog's `BlogId`"
    explanation: >
      Зв'язок обов'язковий, бо `BlogId` не допускає `NULL`, а обов'язкові зв'язки за конвенцією налаштовано на каскадне видалення.
      Тому в схемі є `ON DELETE CASCADE`, і навантажувати пости в контекст не потрібно. Занулення зовнішнього ключа
      стосується необов'язкових зв'язків.
    explanation_en: >
      The relationship is required because `BlogId` does not allow `NULL`, and required relationships are configured for cascade delete by convention.
      So the schema has `ON DELETE CASCADE` and the posts do not need to be loaded into the context. Nulling the foreign key
      applies to optional relationships.
    sources:
      - https://learn.microsoft.com/en-us/ef/core/saving/cascade-delete

  - id: ef-core-019
    level: middle
    type: multiple
    text: Які твердження про використання одного екземпляра `DbContext` у паралельному коді правильні?
    text_en: Which statements about using a single `DbContext` instance in concurrent code are true?
    options:
      - text: "Екземпляр `DbContext` не потокобезпечний: його не можна одночасно використовувати з кількох потоків"
        text_en: "A `DbContext` instance is not thread-safe: it must not be used from several threads at the same time"
        correct: true
      - text: "Запуск двох запитів на одному контексті через `Task.WhenAll` без очікування першого може дати `InvalidOperationException`"
        text_en: "Starting two queries on one context via `Task.WhenAll` without awaiting the first can throw `InvalidOperationException`"
        correct: true
      - text: "Для паралельних операцій кожна задача має брати власний контекст, наприклад із `IDbContextFactory`"
        text_en: "For parallel operations each task should get its own context, for example from `IDbContextFactory`"
        correct: true
      - text: "Реєстрація контексту як Scoped робить його потокобезпечним, бо екземпляр створюється один на запит"
        text_en: "Registering the context as Scoped makes it thread-safe, because one instance is created per request"
      - text: "Виклик `AsNoTracking()` на запитах дозволяє безпечно ділити один контекст між потоками"
        text_en: "Calling `AsNoTracking()` on the queries lets you safely share one context between threads"
    explanation: >
      `DbContext` розрахований на один потік і одну одиницю роботи, а друга операція, запущена до завершення першої,
      дає `InvalidOperationException`. Scoped лише обмежує час життя екземпляра, а `AsNoTracking` не змінює того,
      що контекст має внутрішній стан. Для паралелізму потрібні окремі екземпляри.
    explanation_en: >
      `DbContext` is designed for a single thread and a single unit of work, and a second operation started before the first completes
      throws `InvalidOperationException`. Scoped only limits the instance lifetime, and `AsNoTracking` does not change
      the fact that the context has internal state. Parallelism requires separate instances.
    sources:
      - https://learn.microsoft.com/en-us/ef/core/dbcontext-configuration/#avoiding-dbcontext-threading-issues

  - id: ef-core-020
    level: middle
    type: single
    text: >
      Що поверне цей запит у щойно створеному контексті, де в ChangeTracker ще немає сутностей?
    text_en: >
      What does this query return in a freshly created context whose ChangeTracker has no entities yet?
    code:
      lang: csharp
      source: |
        var blogs = await db.Blogs
            .Include(b => b.Posts.Where(p => p.IsPublished))
            .ToListAsync();
    options:
      - text: "Усі блоги; у `Posts` кожного лише опубліковані пости, а в блога без таких колекція порожня"
        text_en: "All blogs; each `Posts` contains only published posts, and a blog without any has an empty collection"
        correct: true
      - text: "Лише блоги, у яких є хоча б один опублікований пост, разом з їхніми постами"
        text_en: "Only blogs that have at least one published post, together with their posts"
      - text: "Усі блоги з усіма постами: умову всередині `Include` EF ігнорує"
        text_en: "All blogs with all their posts: EF ignores the condition inside `Include`"
      - text: "`InvalidOperationException`: `Include` приймає лише шлях до навігації без операторів"
        text_en: "`InvalidOperationException`: `Include` accepts only a navigation path without operators"
    explanation: >
      Відфільтроване включення (EF Core 5+) обмежує лише завантажену колекцію, а не набір кореневих сутностей.
      Щоб відфільтрувати самі блоги, потрібен окремий `Where` на `Blogs`.
    explanation_en: >
      A filtered include (EF Core 5+) restricts only the loaded collection, not the set of root entities.
      To filter the blogs themselves you need a separate `Where` on `Blogs`.
    sources:
      - https://learn.microsoft.com/en-us/ef/core/querying/related-data/eager#filtered-include

  - id: ef-core-021
    level: senior
    type: single
    text: >
      Контекст має властивість `TenantId`, яку застосунок виставляє на початку кожного запиту, а глобальний фільтр
      відсікає чужі дані. Команда переходить з `AddDbContext` на `AddDbContextPool`. У чому ризик?
    text_en: >
      The context has a `TenantId` property that the application sets at the start of each request, and a global filter
      cuts off other tenants' data. The team switches from `AddDbContext` to `AddDbContextPool`. What is the risk?
    options:
      - text: >
          Екземпляр живе між запитами, а конструктор і `OnConfiguring` виконуються лише раз, тож значення з них не оновиться
        text_en: >
          The instance lives across requests, and the constructor and `OnConfiguring` run only once, so a value from them will not refresh
        correct: true
      - text: "Пул створює новий екземпляр на кожен запит, тож `TenantId` щоразу скидається в `0`, а вся вигода від пулу зникає"
        text_en: "The pool creates a new instance for every request, so `TenantId` is reset to `0` each time and the pool gives no benefit"
      - text: "Глобальні фільтри запитів не працюють із контекстом, узятим із пулу, і їх треба застосовувати в кожному запиті вручну"
        text_en: "Global query filters do not work with a context taken from the pool and must be applied manually in every query"
      - text: "Пулінг вимагає, щоб кожен сервіс, який використовує контекст, був зареєстрований як Singleton"
        text_en: "Pooling requires every service that uses the context to be registered as a Singleton"
    explanation: >
      Із пулом контекст фактично ділиться між запитами, а одноразові місця ініціалізації виконуються лише раз.
      Мінливий стан, як-от tenant, треба передавати під час кожної видачі з пулу, наприклад через фабрику контексту,
      яка виставляє `TenantId` перед віддачею екземпляра.
    explanation_en: >
      With pooling the context is effectively shared between requests, and one-time initialization places run only once.
      Changing state such as a tenant must be supplied each time an instance is handed out of the pool, for example through a context factory
      that sets `TenantId` before returning the instance.
    sources:
      - https://learn.microsoft.com/en-us/ef/core/performance/advanced-performance-topics#managing-state-in-pooled-contexts

  - id: ef-core-022
    level: senior
    type: multiple
    text: Контекст налаштовано з `EnableRetryOnFailure()`. Які твердження правильні?
    text_en: A context is configured with `EnableRetryOnFailure()`. Which statements are true?
    options:
      - text: "Кожен запит і кожен `SaveChangesAsync()` при тимчасовій помилці повторюється як одна одиниця"
        text_en: "Each query and each `SaveChangesAsync()` call is retried as a single unit on a transient failure"
        correct: true
      - text: "Власну транзакцію виконують у `CreateExecutionStrategy().ExecuteAsync(...)`, щоб блок повторювався разом"
        text_en: "A user transaction runs inside `CreateExecutionStrategy().ExecuteAsync(...)` so the block is retried together"
        correct: true
      - text: "Виклик `BeginTransactionAsync()` без обгортки працює, але повтори для такої транзакції просто вимкнені"
        text_en: "Calling `BeginTransactionAsync()` without a wrapper works, but retries for such a transaction are simply turned off"
      - text: "Стратегія повторює команду після будь-якого винятку, зокрема порушення унікального індексу"
        text_en: "The strategy retries a command after any exception, including a unique index violation"
    explanation: >
      Стратегія повторює лише тимчасові збої, а для транзакції, яку відкрив код, повторювати треба весь блок,
      тож EF вимагає обгортку й без неї кидає `InvalidOperationException`. Помилки на кшталт порушення унікальності
      тимчасовими не вважаються.
    explanation_en: >
      The strategy retries only transient failures, and for a transaction opened by your code the whole block must be replayed,
      so EF requires the wrapper and throws `InvalidOperationException` without it. Errors such as a uniqueness violation
      are not considered transient.
    sources:
      - https://learn.microsoft.com/en-us/ef/core/miscellaneous/connection-resiliency#execution-strategies-and-transactions

  - id: ef-core-023
    level: senior
    type: single
    text: >
      Імпорт у циклі додає 2 млн рядків через один `DbContext` і викликає `SaveChanges()` кожні 1000.
      З кожним пакетом зростають пам'ять і час `SaveChanges()`. Що усуває причину?
    text_en: >
      An import loop adds 2 million rows through a single `DbContext` and calls `SaveChanges()` every 1000.
      Memory and `SaveChanges()` time grow with every batch. What removes the cause?
    options:
      - text: >
          Після кожного пакета очищати відстеження (`ChangeTracker.Clear()`) або брати новий короткоживучий контекст на пакет
        text_en: >
          After each batch, clear tracking (`ChangeTracker.Clear()`) or use a new short-lived context per batch
        correct: true
      - text: "Вимкнути `AutoDetectChangesEnabled`: тоді контекст перестане тримати посилання на додані сутності"
        text_en: "Turn off `AutoDetectChangesEnabled`: then the context stops holding references to the added entities"
      - text: "Викликати `GC.Collect()` після кожного пакета, щоб збирач прибрав уже збережені сутності"
        text_en: "Call `GC.Collect()` after each batch so the collector removes the already saved entities"
      - text: "Замінити `Add` на `AddAsync`, щоб збережені сутності не лишалися в пам'яті між пакетами"
        text_en: "Replace `Add` with `AddAsync` so saved entities do not stay in memory between batches"
    explanation: >
      Контекст тримає посилання на всі відстежувані сутності, тож вони не потрапляють під збирання сміття,
      а `DetectChanges` проходить дедалі більший набір. `AutoDetectChangesEnabled` лише зменшує роботу з порівняння
      і сутностей з трекера не прибирає. `AddAsync` потрібен лише для генераторів значень, що звертаються до бази.
    explanation_en: >
      The context holds references to every tracked entity, so they are never garbage-collected,
      and `DetectChanges` walks an ever-growing set. `AutoDetectChangesEnabled` only reduces comparison work
      and does not remove entities from the tracker. `AddAsync` matters only for value generators that go to the database.
    sources:
      - https://learn.microsoft.com/en-us/ef/core/change-tracking/
      - https://learn.microsoft.com/en-us/ef/core/performance/efficient-updating

  - id: ef-core-024
    level: senior
    type: single
    text: >
      Таблиця `Orders` має 50 млн рядків, індекс по `(CreatedAt, Id)`, а сторінки віддаються так.
      Запити для глибоких сторінок повільні, і час росте з номером сторінки. Що змінити?
    text_en: >
      The `Orders` table has 50 million rows and an index on `(CreatedAt, Id)`, and pages are served like this.
      Queries for deep pages are slow, and the time grows with the page number. What should change?
    code:
      lang: csharp
      source: |
        var page = await db.Orders
            .OrderBy(o => o.CreatedAt).ThenBy(o => o.Id)
            .Skip(pageNumber * 20).Take(20)
            .ToListAsync();
    options:
      - text: >
          Перейти на keyset: пам'ятати `(CreatedAt, Id)` останнього рядка й брати наступні через `Where`
        text_en: >
          Switch to keyset: remember `(CreatedAt, Id)` of the last row and take the next ones with a `Where`
        correct: true
      - text: "Додати `AsNoTracking()`: саме відстеження робить час залежним від номера сторінки запиту"
        text_en: "Add `AsNoTracking()`: tracking is what makes the time depend on the page number"
      - text: "Збільшити `Take` до 1000 і віддавати клієнту потрібні 20 рядків із нього"
        text_en: "Raise `Take` to 1000 and hand the client the needed 20 rows out of it"
      - text: "Завантажити всю таблицю через `ToListAsync()` і вирізати сторінки в пам'яті"
        text_en: "Load the whole table with `ToListAsync()` and slice the pages in the application memory"
    explanation: >
      З `Skip(N)` база все одно мусить пройти перші N рядків, тому глибокі сторінки дорожчають.
      Keyset-пагінація замінює зсув умовою `WHERE`, яку індекс по тих самих колонках виконує за пошуком,
      за умови стабільного унікального порядку (тут завдяки `Id`).
    explanation_en: >
      With `Skip(N)` the database still has to walk the first N rows, so deep pages get more expensive.
      Keyset pagination replaces the offset with a `WHERE` condition that an index on the same columns serves by seeking,
      provided the ordering is stable and unique (here thanks to `Id`).
    sources:
