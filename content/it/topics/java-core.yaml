id: java-core
title: Java Core
title_en: Core Java
description: ООП, колекції, generics, Stream API, винятки, records, equals/hashCode.
description_en: OOP, collections, generics, Stream API, exceptions, records, equals/hashCode.
icon: openjdk
questions:
  - id: java-core-001
    level: junior
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        String a = "java";
        String b = new String("java");
        System.out.println(a == b);
        System.out.println(a.equals(b));
        System.out.println(a == b.intern());
    options:
      - text: "`false`, `true`, `true`"
        text_en: "`false`, `true`, `true`"
        correct: true
      - text: "`true`, `true`, `true`"
        text_en: "`true`, `true`, `true`"
      - text: "`false`, `true`, `false`"
        text_en: "`false`, `true`, `false`"
      - text: "`false`, `false`, `true`"
        text_en: "`false`, `false`, `true`"
    explanation: >
      Оператор `==` порівнює посилання, а `new String("java")` завжди створює новий об'єкт, тож перший рядок дає `false`.
      `equals` порівнює вміст, а `intern()` повертає канонічний екземпляр із пулу рядків, на який посилається й літерал `a`.
    explanation_en: >
      The `==` operator compares references, and `new String("java")` always creates a new object, so the first line prints `false`.
      `equals` compares content, and `intern()` returns the canonical instance from the string pool, which the literal `a` also refers to.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/String.html#intern()
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.21.3
  - id: java-core-002
    level: junior
    type: multiple
    text: Які з цих типів належать до перевірюваних (checked) винятків у Java?
    text_en: "Which of these types are checked exceptions in Java?"
    options:
      - text: "`java.io.IOException`"
        text_en: "`java.io.IOException`"
        correct: true
      - text: "`java.sql.SQLException`"
        text_en: "`java.sql.SQLException`"
        correct: true
      - text: "`IllegalStateException`"
        text_en: "`IllegalStateException`"
      - text: "`OutOfMemoryError`"
        text_en: "`OutOfMemoryError`"
    explanation: >
      Перевірюваними є `Throwable` та його підкласи, окрім `RuntimeException`, `Error` і їхніх нащадків; компілятор вимагає їх обробити або оголосити в `throws`.
      `IllegalStateException` походить від `RuntimeException`, а `OutOfMemoryError` — від `Error`, тож обидва неперевірювані.
    explanation_en: >
      Checked exceptions are `Throwable` and its subclasses, except `RuntimeException`, `Error`, and their descendants; the compiler requires them to be handled or declared in `throws`.
      `IllegalStateException` extends `RuntimeException` and `OutOfMemoryError` extends `Error`, so both are unchecked.
    sources:
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-11.html#jls-11.1.1
  - id: java-core-003
    level: junior
    type: single
    text: Що станеться під час виконання цього коду (Java 25)?
    text_en: "What happens when this code runs (Java 25)?"
    code:
      lang: java
      source: |
        List<Integer> nums = List.of(1, 2, 3);
        nums.add(4);
    options:
      - text: "Буде викинуто `UnsupportedOperationException`"
        text_en: "`UnsupportedOperationException` is thrown"
        correct: true
      - text: "У список додасться елемент, а розмір стане 4"
        text_en: "The element is added and the size becomes 4"
      - text: "Код не скомпілюється, бо `List.of` повертає масив"
        text_en: "The code does not compile because `List.of` returns an array"
      - text: "Елемент мовчки проігнорується, список лишиться з трьох елементів"
        text_en: "The element is silently ignored and the list keeps its three elements"
    explanation: >
      Колекції з фабричних методів `List.of`, `Set.of`, `Map.of` незмінні, і будь-яка спроба їх змінити закінчується `UnsupportedOperationException`.
      Код компілюється нормально, бо метод `add` є в інтерфейсі `List`; помилка виникає лише під час виконання.
    explanation_en: >
      Collections from the `List.of`, `Set.of`, and `Map.of` factory methods are unmodifiable, and any attempt to modify them ends with `UnsupportedOperationException`.
      The code compiles fine because `add` is declared in the `List` interface; the error occurs only at run time.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/List.html#unmodifiable
  - id: java-core-004
    level: junior
    type: multiple
    text: Що компілятор Java 25 автоматично створює для оголошення `record Point(int x, int y) {}`?
    text_en: "What does the Java 25 compiler automatically generate for the declaration `record Point(int x, int y) {}`?"
    options:
      - text: "Приватні `final`-поля та канонічний конструктор"
        text_en: "Private `final` fields and a canonical constructor"
        correct: true
      - text: "Методи доступу `x()` і `y()`"
        text_en: "Accessor methods `x()` and `y()`"
        correct: true
      - text: "Методи `setX(int)` і `setY(int)`"
        text_en: "Methods `setX(int)` and `setY(int)`"
      - text: "Конструктор без параметрів `Point()`"
        text_en: "A no-argument constructor `Point()`"
    explanation: >
      Для record компілятор додає приватні `final`-поля, канонічний конструктор, методи доступу з іменами компонентів, а також `equals`, `hashCode` і `toString`.
      Сеттерів немає, бо стан запису незмінний, а конструктор без параметрів не створюється, якщо його не оголосити вручну.
    explanation_en: >
      For a record the compiler adds private `final` fields, a canonical constructor, accessor methods named after the components, and also `equals`, `hashCode`, and `toString`.
      There are no setters because a record's state is immutable, and a no-argument constructor is not created unless you declare it manually.
    sources:
      - https://openjdk.org/jeps/395
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-8.html#jls-8.10
  - id: java-core-005
    level: middle
    type: single
    text: >-
      У класі перевизначено `equals`, але не `hashCode`. Що може піти не так (Java 25)?
    text_en: "A class overrides `equals` but not `hashCode`. What can go wrong (Java 25)?"
    code:
      lang: java
      source: |
        class Pt {
            int x;
            Pt(int x) { this.x = x; }
            @Override public boolean equals(Object o) {
                return o instanceof Pt p && p.x == x;
            }
        }
        Set<Pt> set = new HashSet<>();
        set.add(new Pt(1));
        boolean found = set.contains(new Pt(1));
    options:
      - text: "`found` може бути `false`: рівні об'єкти шукаються в різних кошиках"
        text_en: "`found` may be `false`: equal objects are looked up in different buckets"
        correct: true
      - text: "Код не скомпілюється без перевизначення `hashCode`"
        text_en: "The code does not compile without overriding `hashCode`"
      - text: "`HashSet` порівнює лише `hashCode`, тож `found` завжди `true`"
        text_en: "`HashSet` compares only `hashCode`, so `found` is always `true`"
      - text: "`add` викине виняток, бо контракт `equals` порушено"
        text_en: "`add` throws an exception because the `equals` contract is violated"
    explanation: >
      Контракт вимагає, щоб рівні за `equals` об'єкти мали однаковий `hashCode`. Тут використовується ідентичний хеш-код за замовчуванням, тож `HashSet` шукає в іншому кошику і на практиці повертає `false` (під час запуску вийшло саме так).
      Компілятор такого порушення не помічає.
    explanation_en: >
      The contract requires objects that are equal by `equals` to have the same `hashCode`. Here the default identity hash code is used, so `HashSet` looks in a different bucket and in practice returns `false` (this is what happened when run).
      The compiler does not notice such a violation.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#hashCode()
  - id: java-core-006
    level: middle
    type: single
    text: Що відбудеться під час виконання цього коду (Java 25)?
    text_en: "What happens when this code runs (Java 25)?"
    code:
      lang: java
      source: |
        List<Integer> list = new ArrayList<>(List.of(1, 2, 3, 4));
        for (Integer i : list) {
            if (i == 2) list.remove(i);
        }
    options:
      - text: "Буде викинуто `ConcurrentModificationException`"
        text_en: "`ConcurrentModificationException` is thrown"
        correct: true
      - text: "Елемент `2` видалиться, і цикл спокійно завершиться"
        text_en: "Element `2` is removed and the loop finishes normally"
      - text: "Буде викинуто `IndexOutOfBoundsException` через зсув індексів"
        text_en: "`IndexOutOfBoundsException` is thrown because of shifted indexes"
      - text: "Буде викинуто `UnsupportedOperationException`, бо в циклі `for-each` колекцію змінювати заборонено"
        text_en: "`UnsupportedOperationException` is thrown because modifying a collection in a `for-each` loop is forbidden"
    explanation: >
      Ітератор `ArrayList` швидко падає (fail-fast): він порівнює лічильник структурних змін зі своїм, і після `remove` повз нього наступний виклик `next()` кидає `ConcurrentModificationException`.
      Безпечні шляхи — `removeIf` або `Iterator.remove()`.
    explanation_en: >
      The `ArrayList` iterator is fail-fast: it compares the structural modification count with its own, and after `remove` bypassing it, the next `next()` call throws `ConcurrentModificationException`.
      The safe approaches are `removeIf` or `Iterator.remove()`.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/ArrayList.html
  - id: java-core-007
    level: middle
    type: multiple
    text: >-
      Нехай оголошено `List<Integer> ints = new ArrayList<>();`. Які з цих присвоєнь компілюються?
    text_en: "Suppose `List<Integer> ints = new ArrayList<>();` is declared. Which of these assignments compile?"
    options:
      - text: "`List<? extends Number> a = ints;`"
        text_en: "`List<? extends Number> a = ints;`"
        correct: true
      - text: "`List<?> b = ints;`"
        text_en: "`List<?> b = ints;`"
        correct: true
      - text: "`List<Number> c = ints;`"
        text_en: "`List<Number> c = ints;`"
      - text: "`List<Object> d = ints;`"
        text_en: "`List<Object> d = ints;`"
    explanation: >
      Параметризовані типи інваріантні: `List<Integer>` не є підтипом `List<Number>` чи `List<Object>`, інакше через такий посилальний тип у список цілих можна було б покласти `Double`.
      Символи підстановки `? extends Number` і `?` дозволяють читати елементи й тому сумісні з `List<Integer>`; компілятор для `List<Number>` дає `incompatible types`.
    explanation_en: >
      Parameterized types are invariant: `List<Integer>` is not a subtype of `List<Number>` or `List<Object>`, otherwise a `Double` could be put into a list of integers through such a reference type.
      The wildcards `? extends Number` and `?` allow reading elements and are therefore compatible with `List<Integer>`; for `List<Number>` the compiler reports `incompatible types`.
    sources:
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html#jls-4.5.1
      - https://dev.java/learn/generics/wildcards/
  - id: java-core-008
    level: middle
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        class Res implements AutoCloseable {
            final String n;
            Res(String n) { this.n = n; System.out.println("open " + n); }
            public void close() { System.out.println("close " + n); }
        }
        try (Res r1 = new Res("A"); Res r2 = new Res("B")) {
            System.out.println("body");
            throw new RuntimeException("x");
        } catch (RuntimeException e) {
            System.out.println("catch");
        } finally {
            System.out.println("finally");
        }
    options:
      - text: "`open A`, `open B`, `body`, `close B`, `close A`, `catch`, `finally`"
        text_en: "`open A`, `open B`, `body`, `close B`, `close A`, `catch`, `finally`"
        correct: true
      - text: "`open A`, `open B`, `body`, `close A`, `close B`, `catch`, `finally`"
        text_en: "`open A`, `open B`, `body`, `close A`, `close B`, `catch`, `finally`"
      - text: "`open A`, `open B`, `body`, `catch`, `close B`, `close A`, `finally`"
        text_en: "`open A`, `open B`, `body`, `catch`, `close B`, `close A`, `finally`"
      - text: "`open A`, `open B`, `body`, `catch`, `finally`, `close B`, `close A`"
        text_en: "`open A`, `open B`, `body`, `catch`, `finally`, `close B`, `close A`"
    explanation: >
      Ресурси закриваються в порядку, оберненому до відкриття, і до виконання `catch` та `finally`, бо вони належать до розширеної форми `try`, яка спершу звільняє ресурси.
      Тому `close B` і `close A` друкуються перед `catch`; результат підтверджено запуском.
    explanation_en: >
      Resources are closed in the reverse order of opening, and before `catch` and `finally` run, because those belong to the extended form of `try`, which releases resources first.
      So `close B` and `close A` are printed before `catch`; the result was confirmed by running the code.
    sources:
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-14.html#jls-14.20.3
  - id: java-core-009
    level: senior
    type: single
    text: >-
      Об'єкт, що є ключем `HashMap`, змінили після `put` так, що змінився його `hashCode`. Що побачить код (Java 25)?
    text_en: "A `HashMap` key object was modified after `put` so that its `hashCode` changed. What will the code observe (Java 25)?"
    code:
      lang: java
      source: |
        class MK {
            int id;
            MK(int id) { this.id = id; }
            @Override public boolean equals(Object o) { return o instanceof MK m && m.id == id; }
            @Override public int hashCode() { return id; }
        }
        Map<MK, String> m = new HashMap<>();
        MK k = new MK(1);
        m.put(k, "v");
        k.id = 2;
        // m.size(), m.get(k), m.containsKey(k), iteration over entrySet()
    options:
      - text: "`size()` — 1, `get(k)` і `containsKey(k)` не знаходять, перебір запис показує"
        text_en: "`size()` is 1, `get(k)` and `containsKey(k)` do not find it, iteration shows the entry"
        correct: true
      - text: "`get(k)` знаходить запис, бо мапа зберігає посилання на той самий об'єкт"
        text_en: "`get(k)` finds the entry because the map stores a reference to the same object"
      - text: "Запис автоматично переміщується в новий кошик, тому `get(k)` повертає `v`"
        text_en: "The entry is automatically moved to the new bucket, so `get(k)` returns `v`"
      - text: "`size()` стає 0, бо `HashMap` видаляє записи зі зміненими ключами"
        text_en: "`size()` becomes 0 because `HashMap` removes entries with modified keys"
    explanation: >
      `HashMap` обчислює кошик у момент `put` і не стежить за ключем далі: запис лежить у кошику для хеша 1, а `get(k)` шукає в кошику для 2.
      Запис «губиться» для пошуку, але залишається в мапі, тому видно його лише під час перебору. Через це ключами роблять незмінні об'єкти; результат підтверджено запуском.
    explanation_en: >
      `HashMap` computes the bucket at `put` time and does not track the key afterward: the entry sits in the bucket for hash 1, while `get(k)` looks in the bucket for 2.
      The entry becomes "lost" for lookup but stays in the map, so it is visible only during iteration. This is why immutable objects are used as keys; the result was confirmed by running the code.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Map.html
  - id: java-core-010
    level: senior
    type: single
    text: >-
      У бібліотеці через сире (raw) посилання в `List<String>` потрапило число. Де саме з'явиться `ClassCastException` (Java 25)?
    text_en: "Through a raw reference in a library, a number got into a `List<String>`. Where exactly will `ClassCastException` appear (Java 25)?"
    code:
      lang: java
      source: |
        List raw = new ArrayList<String>();
        raw.add(42);                       // (1)
        List<String> ls = raw;             // (2)
        int n = ls.size();                 // (3)
        String s = ls.get(0);              // (4)
    options:
      - text: "У рядку (4): компілятор вставляє приведення до `String` у місці читання елемента"
        text_en: "On line (4): the compiler inserts a cast to `String` where the element is read"
        correct: true
      - text: "У рядку (1): `add` перевіряє тип елемента в `ArrayList<String>` під час виконання"
        text_en: "On line (1): `add` checks the element type in `ArrayList<String>` at run time"
      - text: "У рядку (2): присвоєння сирого списку типізованому відхиляється віртуальною машиною"
        text_en: "On line (2): assigning a raw list to a typed one is rejected by the virtual machine"
      - text: "Виняток не виникне взагалі, бо після стирання типів усе є `Object`"
        text_en: "No exception occurs at all, because after type erasure everything is `Object`"
    explanation: >
      Через стирання типів дженерики не існують під час виконання, тому `add(42)` і присвоєння проходять (компілятор лише попереджає про unchecked). Приведення до `String` вставляється в місці використання, тому збій виникає далеко від справжньої причини, і це називають heap pollution.
      Те, що виняток у рядку (4), підтверджено запуском.
    explanation_en: >
      Because of type erasure, generics do not exist at run time, so `add(42)` and the assignment succeed (the compiler only warns about unchecked). The cast to `String` is inserted at the point of use, so the failure appears far from the real cause, which is called heap pollution.
      That the exception occurs on line (4) was confirmed by running the code.
    sources:
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-4.html#jls-4.12.2
      - https://dev.java/learn/generics/type-erasure/
  - id: java-core-011
    level: senior
    type: single
    text: >-
      Скільки елементів буде в кожній множині після цього коду (Java 25)?
    text_en: "How many elements will each set contain after this code (Java 25)?"
    code:
      lang: java
      source: |
        var a = new BigDecimal("1.0");
        var b = new BigDecimal("1.00");
        Set<BigDecimal> hash = new HashSet<>(List.of(a, b));
        Set<BigDecimal> tree = new TreeSet<>(List.of(a, b));
    options:
      - text: "`hash` — 2, `tree` — 1"
        text_en: "`hash` is 2, `tree` is 1"
        correct: true
      - text: "`hash` — 1, `tree` — 1"
        text_en: "`hash` is 1, `tree` is 1"
      - text: "`hash` — 2, `tree` — 2"
        text_en: "`hash` is 2, `tree` is 2"
      - text: "`hash` — 1, `tree` — 2"
        text_en: "`hash` is 1, `tree` is 2"
    explanation: >
      У `BigDecimal` метод `equals` враховує масштаб (`1.0` і `1.00` різні), а `compareTo` ні. `HashSet` спирається на `equals`/`hashCode`, а `TreeSet` лише на порівняння, тож вважає значення однаковим і лишає один елемент.
      Це приклад порядку, неузгодженого з `equals`; результат підтверджено запуском.
    explanation_en: >
      In `BigDecimal`, `equals` takes scale into account (`1.0` and `1.00` differ), while `compareTo` does not. `HashSet` relies on `equals`/`hashCode`, while `TreeSet` relies only on comparison, so it treats the values as the same and keeps one element.
      This is an example of ordering inconsistent with `equals`; the result was confirmed by running the code.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/math/BigDecimal.html#equals(java.lang.Object)
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/SortedSet.html
  - id: java-core-012
    level: senior
    type: multiple
    text: >-
      Є `record Team(String name, List<String> members) {}`. Екземпляр створено з `ArrayList`, на яку код зберіг посилання. Які твердження правильні (Java 25)?
    text_en: "There is `record Team(String name, List<String> members) {}`. An instance was created from an `ArrayList` that the code kept a reference to. Which statements are true (Java 25)?"
    options:
      - text: "Зміни вихідного `ArrayList` видно через `team.members()`"
        text_en: "Changes to the original `ArrayList` are visible through `team.members()`"
        correct: true
      - text: "Компактний конструктор із `members = List.copyOf(members);` робить захисну копію"
        text_en: "A compact constructor with `members = List.copyOf(members);` makes a defensive copy"
        correct: true
      - text: "Поля record є `final`, тому `team.members().add(\"x\")` завжди викидає виняток"
        text_en: "Record fields are `final`, so `team.members().add(\"x\")` always throws an exception"
      - text: "Компілятор не дозволяє передавати в компонент record змінну колекцію"
        text_en: "The compiler does not allow passing a mutable collection to a record component"
    explanation: >
      `final` фіксує лише посилання на список, а не його вміст, тому record захищає від перепризначення полів, але не від зміни вкладених змінних об'єктів.
      Захисну копію роблять у компактному конструкторі: `List.copyOf` створює незмінну копію. Поведінку підтверджено запуском.
    explanation_en: >
      `final` fixes only the reference to the list, not its contents, so a record protects against reassigning fields but not against changes to nested mutable objects.
      The defensive copy is made in the compact constructor: `List.copyOf` creates an unmodifiable copy. The behavior was confirmed by running the code.
    sources:
      - https://openjdk.org/jeps/395
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/List.html#copyOf(java.util.Collection)
  - id: java-core-013
    level: junior
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        Integer a = 127, b = 127;
        Integer c = 128, d = 128;
        System.out.println(a == b);
        System.out.println(c == d);
        System.out.println(c.equals(d));
    options:
      - text: "`true`, `false`, `true`"
        text_en: "`true`, `false`, `true`"
        correct: true
      - text: "`true`, `true`, `true`"
        text_en: "`true`, `true`, `true`"
      - text: "`false`, `false`, `true`"
        text_en: "`false`, `false`, `true`"
      - text: "`true`, `false`, `false`"
        text_en: "`true`, `false`, `false`"
    explanation: >
      Автопакування викликає `Integer.valueOf`, який повторно використовує закешовані об'єкти для значень від -128 до 127, тож `a == b` порівнює одне й те саме посилання.
      Для 128 створюються два різні об'єкти, і `==` дає `false`, а `equals` порівнює значення, тому повертає `true`. Обгортки порівнюють через `equals`.
    explanation_en: >
      Autoboxing calls `Integer.valueOf`, which reuses cached objects for values from -128 to 127, so `a == b` compares the same reference.
      For 128 two different objects are created and `==` gives `false`, while `equals` compares values and returns `true`. Wrapper objects should be compared with `equals`.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Integer.html#valueOf(int)
  - id: java-core-014
    level: junior
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        Stream.of(1, 2, 3)
              .peek(x -> System.out.println("peek " + x))
              .map(x -> x * 2);
        System.out.println("after");
    options:
      - text: "Лише `after`: без термінальної операції конвеєр не виконується"
        text_en: "Only `after`: no terminal operation, so the pipeline never runs"
        correct: true
      - text: "`peek 1`, `peek 2`, `peek 3`, потім `after`"
        text_en: "`peek 1`, `peek 2`, `peek 3`, then `after`"
      - text: "Спершу `after`, потім `peek 1`, `peek 2`, `peek 3`"
        text_en: "First `after`, then `peek 1`, `peek 2`, `peek 3`"
      - text: "Помилка компіляції, бо результат `map` не використано"
        text_en: "A compile error, because the result of `map` is not used"
    explanation: >
      Проміжні операції `Stream` ліниві: вони лише описують конвеєр, а обробка елементів починається, коли викликано термінальну операцію (`collect`, `forEach`, `count` тощо).
      Тут її немає, тож `peek` не спрацьовує жодного разу; компілятор не вимагає використовувати результат.
    explanation_en: >
      Intermediate `Stream` operations are lazy: they only describe the pipeline, and elements start being processed when a terminal operation (`collect`, `forEach`, `count`, and so on) is invoked.
      There is none here, so `peek` never runs; the compiler does not require the result to be used.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/package-summary.html#StreamOps
  - id: java-core-015
    level: junior
    type: multiple
    text: Що може містити оголошення інтерфейсу в Java 25?
    text_en: "What can an interface declaration contain in Java 25?"
    options:
      - text: "Метод `default` із тілом"
        text_en: "A `default` method with a body"
        correct: true
      - text: "Приватний метод із тілом для спільної логіки `default`-методів"
        text_en: "A private method with a body for logic shared by `default` methods"
        correct: true
      - text: "Нестатичне поле, яке кожна реалізація зберігає окремо"
        text_en: "A non-static field stored separately per implementation"
      - text: "Конструктор для ініціалізації стану реалізацій"
        text_en: "A constructor initializing implementation state"
    explanation: >
      Із Java 8 інтерфейс може мати `default`- і `static`-методи, а з Java 9 — приватні методи, які виносять спільний код.
      Поля інтерфейсу завжди неявно `public static final` (константи), а конструкторів в інтерфейсах немає, бо вони не мають власного стану екземпляра.
    explanation_en: >
      Since Java 8 an interface can have `default` and `static` methods, and since Java 9 private methods that extract shared code.
      Interface fields are always implicitly `public static final` (constants), and interfaces have no constructors because they have no instance state of their own.
    sources:
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-9.html#jls-9.4
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-9.html#jls-9.3
  - id: java-core-016
    level: junior
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        System.out.println(1 + 2 + "a" + 1 + 2);
    options:
      - text: "`3a12`"
        text_en: "`3a12`"
        correct: true
      - text: "`12a12`"
        text_en: "`12a12`"
      - text: "`3a3`"
        text_en: "`3a3`"
      - text: "`1+2a1+2`"
        text_en: "`1+2a1+2`"
    explanation: >
      Оператор `+` виконується зліва направо: `1 + 2` — ще додавання чисел і дає `3`, а після цього з рядком `"a"` усе далі є конкатенацією, тож `1` і `2` дописуються як цифри.
      Варіант `3a3` помилково припускає, що числа після рядка знову додаються.
    explanation_en: >
      The `+` operator is evaluated left to right: `1 + 2` is still numeric addition and gives `3`, and after meeting the string `"a"` everything further is concatenation, so `1` and `2` are appended as digits.
      The `3a3` option wrongly assumes that numbers after the string are added together again.
    sources:
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.18.1
  - id: java-core-017
    level: middle
    type: single
    text: Що станеться під час виконання цього коду (Java 25)?
    text_en: "What happens when this code runs (Java 25)?"
    code:
      lang: java
      source: |
        Map<String, Integer> m = Stream.of("a", "b", "a")
            .collect(Collectors.toMap(s -> s, s -> 1));
    options:
      - text: "Буде викинуто `IllegalStateException` через дублікат ключа `a`"
        text_en: "`IllegalStateException` is thrown because of the duplicate key `a`"
        correct: true
      - text: "Мапа міститиме `a=1` і `b=1`, бо пізніше значення замінює раніше"
        text_en: "The map will contain `a=1` and `b=1`, because the later value replaces the earlier one"
      - text: "Мапа міститиме `a=2` і `b=1`, бо однакові ключі підсумовуються"
        text_en: "The map will contain `a=2` and `b=1`, because equal keys are summed"
      - text: "Буде викинуто `NullPointerException`, бо мапа ще не створена"
        text_en: "`NullPointerException` is thrown because the map has not been created yet"
    explanation: >
      `toMap` із двома аргументами не вміє об'єднувати значення однакових ключів і кидає `IllegalStateException` з повідомленням про дублікат.
      Щоб злити значення, передають третій аргумент, функцію злиття, наприклад `Integer::sum`; для групування за ключем використовують `groupingBy`.
    explanation_en: >
      `toMap` with two arguments cannot merge values of equal keys and throws `IllegalStateException` with a duplicate-key message.
      To merge values you pass a third argument, a merge function such as `Integer::sum`; for grouping by key you use `groupingBy`.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/Collectors.html#toMap(java.util.function.Function,java.util.function.Function)
  - id: java-core-018
    level: middle
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        class Base {
            Base() { init(); }
            void init() { System.out.println("Base"); }
        }
        class Der extends Base {
            String s = "x";
            Der() { super(); System.out.println("Der " + s); }
            @Override void init() { System.out.println("init " + s); }
        }
        new Der();
    options:
      - text: "`init null`, потім `Der x`"
        text_en: "`init null`, then `Der x`"
        correct: true
      - text: "`init x`, потім `Der x`"
        text_en: "`init x`, then `Der x`"
      - text: "`Base`, потім `Der x`"
        text_en: "`Base`, then `Der x`"
      - text: "`NullPointerException` у конструкторі `Base`"
        text_en: "`NullPointerException` in the `Base` constructor"
    explanation: >
      Конструктор `Base` виконується до ініціалізаторів полів `Der`, але виклик `init()` є віртуальним і потрапляє в перевизначений метод підкласу.
      Поле `s` ще має значення за замовчуванням `null`, а конкатенація `null` з рядком виняток не кидає. Через цю пастку з конструктора не викликають перевизначувані методи.
    explanation_en: >
      The `Base` constructor runs before the `Der` field initializers, but the `init()` call is virtual and lands in the subclass override.
      The field `s` still has its default value `null`, and concatenating `null` with a string does not throw. This trap is why overridable methods are not called from constructors.
    sources:
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-12.html#jls-12.5
  - id: java-core-019
    level: middle
    type: multiple
    text: >-
      Які твердження про `Arrays.asList(array)` і `List.of(...)` правильні (Java 25)?
    text_en: "Which statements about `Arrays.asList(array)` and `List.of(...)` are true (Java 25)?"
    code:
      lang: java
      source: |
        String[] arr = {"a", "b"};
        List<String> l = Arrays.asList(arr);
        l.set(0, "z");
    options:
      - text: "Після `l.set(0, \"z\")` перший елемент масиву `arr` теж стає `\"z\"`"
        text_en: "After `l.set(0, \"z\")` the first element of the array `arr` also becomes `\"z\"`"
        correct: true
      - text: "`List.of(\"a\", null)` кидає `NullPointerException`"
        text_en: "`List.of(\"a\", null)` throws `NullPointerException`"
        correct: true
      - text: "`l.add(\"c\")` розширює список і заодно масив `arr` до трьох елементів"
        text_en: "`l.add(\"c\")` grows the list and the array `arr` to three elements"
      - text: "`List.of(\"a\", \"b\").set(0, \"z\")` змінює елемент без винятку"
        text_en: "`List.of(\"a\", \"b\").set(0, \"z\")` changes the element without an exception"
    explanation: >
      `Arrays.asList` повертає список фіксованого розміру, що є «вікном» над масивом: `set` пише в масив, а `add` і `remove` кидають `UnsupportedOperationException`.
      `List.of` повністю незмінний, тому `set` теж кидає виняток, і він не приймає `null`.
    explanation_en: >
      `Arrays.asList` returns a fixed-size list that is a "window" over the array: `set` writes through to the array, while `add` and `remove` throw `UnsupportedOperationException`.
      `List.of` is fully unmodifiable, so `set` throws as well, and it rejects `null`.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Arrays.html#asList(T...)
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/List.html#unmodifiable
  - id: java-core-020
    level: middle
    type: single
    text: Що виведе програма (Java 25)?
    text_en: "What does the program print (Java 25)?"
    code:
      lang: java
      source: |
        static String compute() {
            System.out.println("computed");
            return "d";
        }
        String r = Optional.of("v").orElse(compute());
        System.out.println(r);
    options:
      - text: "`computed`, потім `v`"
        text_en: "`computed`, then `v`"
        correct: true
      - text: "Лише `v`, бо значення в `Optional` є"
        text_en: "Only `v`, because the `Optional` has a value"
      - text: "`v`, потім `computed`"
        text_en: "`v`, then `computed`"
      - text: "Лише `computed`, бо `orElse` завжди повертає свій аргумент"
        text_en: "Only `computed`, because `orElse` always returns its argument"
    explanation: >
      Аргумент `orElse` обчислюється ще до виклику методу, незалежно від того, чи є значення в `Optional`, тому `compute()` виконується завжди.
      Для дорогого або побічного значення за замовчуванням використовують `orElseGet(() -> compute())`, який викликає постачальник лише для порожнього `Optional`.
    explanation_en: >
      The argument of `orElse` is evaluated before the method is called, regardless of whether the `Optional` has a value, so `compute()` always runs.
      For an expensive or side-effecting default you use `orElseGet(() -> compute())`, which invokes the supplier only for an empty `Optional`.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Optional.html#orElseGet(java.util.function.Supplier)
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.12.4.2
  - id: java-core-021
    level: senior
    type: single
    text: >-
      До `sealed`-інтерфейсу додали третій дозволений підтип `Tri`. Що станеться з цим `switch` у Java 25?
    text_en: "A third permitted subtype `Tri` was added to a `sealed` interface. What happens to this `switch` in Java 25?"
    code:
      lang: java
      source: |
        sealed interface Shape permits Circle, Square, Tri {}
        record Circle(double r) implements Shape {}
        record Square(double s) implements Shape {}
        record Tri(double s) implements Shape {}

        static double area(Shape s) {
            return switch (s) {
                case Circle c -> Math.PI * c.r() * c.r();
                case Square q -> q.s() * q.s();
            };
        }
    options:
      - text: "Помилка компіляції: `switch` не покриває всі можливі значення"
        text_en: "A compile error: the `switch` does not cover all possible values"
        correct: true
      - text: "Код скомпілюється, а для `Tri` під час виконання повернеться `0.0`"
        text_en: "The code compiles, and for `Tri` it returns `0.0` at run time"
      - text: "Код скомпілюється з попередженням, а для `Tri` виникне `MatchException`"
        text_en: "The code compiles with a warning, and `Tri` causes a `MatchException`"
      - text: "Код скомпілюється, бо `Tri` потрапляє в гілку найближчого підтипу"
        text_en: "The code compiles, because `Tri` falls into the branch of the nearest subtype"
    explanation: >
      Вираз `switch` має бути вичерпним, а для запечатаної ієрархії компілятор знає повний перелік підтипів і відхиляє `switch` без гілки для `Tri` та без `default`.
      Тому для таких ієрархій `default` не пишуть: без нього додавання підтипу одразу підсвічує всі місця, які треба оновити.
    explanation_en: >
      A `switch` expression must be exhaustive, and for a sealed hierarchy the compiler knows the full list of subtypes and rejects a `switch` with no branch for `Tri` and no `default`.
      That is why `default` is not written for such hierarchies: without it, adding a subtype immediately points to every place that needs updating.
    sources:
      - https://openjdk.org/jeps/409
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-15.html#jls-15.28.1
  - id: java-core-022
    level: senior
    type: single
    text: >-
      Список цілих відсортовано компаратором-різницею, але порядок хибний: `Integer.MIN_VALUE` опинився в кінці, а не на початку. Чому (Java 25)?
    text_en: "A list of integers was sorted with a subtraction comparator, but the order is wrong: `Integer.MIN_VALUE` ended up at the end instead of the start. Why (Java 25)?"
    code:
      lang: java
      source: |
        List<Integer> li = new ArrayList<>(
            List.of(Integer.MAX_VALUE, -2, 5, Integer.MIN_VALUE, 1));
        li.sort((x, y) -> x - y);
        // [2147483647, -2, 1, 5, -2147483648]
    options:
      - text: "Різниця переповнює `int`, знак результату хибний; потрібен `Integer.compare`"
        text_en: "The difference overflows `int`, so the sign is wrong; `Integer.compare` is needed"
        correct: true
      - text: "`List.sort` нестабільний, тому порядок рівних елементів довільний"
        text_en: "`List.sort` is unstable, so the order of equal elements is arbitrary"
      - text: "Лямбда порівнює об'єкти `Integer` за посиланням, а не за значенням"
        text_en: "The lambda compares `Integer` objects by reference, not by value"
      - text: "Компаратор має повертати лише `-1`, `0` або `1`, а різниця повертає інші числа"
        text_en: "A comparator must return only `-1`, `0` or `1`, and the difference returns other numbers"
    explanation: >
      Для `MAX_VALUE - (-2)` і подібних пар різниця виходить за межі `int` і змінює знак, тож компаратор порушує транзитивність, а результат сортування стає непередбачуваним.
      Правильно писати `Integer.compare(x, y)` або `Comparator.naturalOrder()`. Сортування стабільне, а в лямбді `-` розпаковує значення, а не порівнює посилання. Важливий лише знак результату компаратора, а не його величина.
    explanation_en: >
      For pairs like `MAX_VALUE - (-2)` the difference goes beyond the `int` range and flips sign, so the comparator violates transitivity and the sort result becomes unpredictable.
      The correct form is `Integer.compare(x, y)` or `Comparator.naturalOrder()`. The sort is stable, and in the lambda `-` unboxes values rather than comparing references. Only the sign of the comparator result matters, not its magnitude.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Comparator.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Integer.html#compare(int,int)
  - id: java-core-023
    level: senior
    type: multiple
    text: >-
      Ресурс у `try-with-resources` кидає виняток із `close()`. Які твердження правильні (Java 25)?
    text_en: "A resource in `try-with-resources` throws an exception from `close()`. Which statements are true (Java 25)?"
    code:
      lang: java
      source: |
        class R implements AutoCloseable {
            public void close() { throw new IllegalStateException("close"); }
        }
        try (R r = new R()) {
            throw new RuntimeException("body");
        } catch (Exception e) {
            // e.getMessage(), e.getSuppressed()
        }
    options:
      - text: "У `catch` потрапляє виняток `body`, а виняток `close` лежить у `getSuppressed()`"
        text_en: "`catch` receives the `body` exception, and the `close` exception is in `getSuppressed()`"
        correct: true
      - text: "Якщо тіло `try` завершилось нормально, виняток із `close()` викидається як основний"
        text_en: "If the `try` body completes normally, the exception from `close()` is thrown as the primary one"
        correct: true
      - text: "Виняток із `close()` замінює виняток тіла, тож `body` безповоротно втрачається"
        text_en: "The exception from `close()` replaces the body exception, so `body` is lost for good"
      - text: "`getSuppressed()` порожній, бо `close()` виконується вже після завершення `catch`"
        text_en: "`getSuppressed()` is empty, because `close()` runs only after `catch` has finished"
    explanation: >
      Якщо основний виняток уже є, `try-with-resources` додає винятки закриття через `addSuppressed`, тож першопричина не губиться; у `try-finally` ручний `close()` у `finally` міг би її затерти.
      Без основного винятку помилка `close()` стає основною. Закриття відбувається до виконання `catch`.
    explanation_en: >
      If a primary exception already exists, `try-with-resources` attaches close exceptions via `addSuppressed`, so the root cause is not lost; in `try-finally` a manual `close()` in `finally` could overwrite it.
      Without a primary exception, the `close()` error becomes the primary one. Closing happens before `catch` runs.
    sources:
      - https://docs.oracle.com/javase/specs/jls/se25/html/jls-14.html#jls-14.20.3.1
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Throwable.html#addSuppressed(java.lang.Throwable)
  - id: java-core-024
    level: senior
    type: single
    text: >-
      Підклас додає поле й розширює `equals`. Що поверне цей код і що це означає для контракту `equals` (Java 25)?
    text_en: "A subclass adds a field and extends `equals`. What does this code return and what does it mean for the `equals` contract (Java 25)?"
    code:
      lang: java
      source: |
        class P {
            int x;
            P(int x) { this.x = x; }
            @Override public boolean equals(Object o) { return o instanceof P p && p.x == x; }
            @Override public int hashCode() { return x; }
        }
        class CP extends P {
            String c;
            CP(int x, String c) { super(x); this.c = c; }
            @Override public boolean equals(Object o) {
                return o instanceof CP p && p.x == x && p.c.equals(c);
            }
            @Override public int hashCode() { return x; }
        }
        P p = new P(1);
        CP cp = new CP(1, "red");
        // p.equals(cp) ?   cp.equals(p) ?
    options:
      - text: "`true` і `false`: порушено симетричність, тож `equals` непридатний"
        text_en: "`true` and `false`: symmetry is violated, so `equals` is broken"
        correct: true
      - text: "`true` і `true`: `CP` успадковує `P`, тому порівняння завжди рівне"
        text_en: "`true` and `true`: `CP` inherits from `P`, so the comparison is always equal"
      - text: "`false` і `false`: різні класи ніколи не бувають рівними"
        text_en: "`false` and `false`: objects of different classes are never equal"
      - text: "`false` і `true`: `equals` викликається в іншому порядку аргументів"
        text_en: "`false` and `true`: `equals` is called with the arguments in the other order"
    explanation: >
      `p.equals(cp)` перевіряє лише `x`, тож `true`, а `cp.equals(p)` вимагає, щоб аргумент був `CP`, тож `false`. Контракт `equals` вимагає симетричності: `a.equals(b)` тоді й лише тоді, коли `b.equals(a)`.
      Якщо підклас додає значущі поля, симетрію зберігають через `getClass()`, композицію замість успадкування або `record`.
    explanation_en: >
      `p.equals(cp)` checks only `x`, so it is `true`, while `cp.equals(p)` requires the argument to be a `CP`, so it is `false`. The `equals` contract requires symmetry: `a.equals(b)` if and only if `b.equals(a)`.
      When a subclass adds significant fields, symmetry is preserved through `getClass()`, composition instead of inheritance, or a `record`.
    sources:
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)
