    explanation: >
      Вхід іде в порядку глобальний, контролер, маршрут, а відповідь повертається у зворотному, бо Observable розв'язуються за принципом «перший увійшов, останній вийшов».
      Порядок підтверджено запуском застосунку з трьома interceptors.
    explanation_en: >
      Entry goes in the order global, controller, route, and the response comes back in reverse, because the Observables are resolved on a last-in, first-out basis. The order was confirmed by running an application with three interceptors.
