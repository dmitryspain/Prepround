# Render Free puts the API to sleep after 15 idle minutes and a wake-up costs the visitor ~25 s (ADR 005).
# Pinging /api/health every 10 minutes keeps it up: one service 24/7 is ~744 h of the 750 free hours a month.
# Health does not touch the database, so Neon still sleeps and its free compute hours are not spent.
# GitHub may delay scheduled runs; the web app also pings while a tab is open (PreproundWeb core/keep-alive.ts).
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/health
        run: >
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 -o /dev/null
          -w '%{http_code} in %{time_total}s\n'
          https://prepround-api.onrender.com/api/health
